<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>CPS Тест</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #12141c;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
  }
  h1 { margin-bottom: 20px; font-weight: 500; letter-spacing: 1px; }
  #wrap {
    position: relative;
    width: 600px;
    height: 400px;
    max-width: 95vw;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0, 200, 255, 0.15);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
    background: #1b1e2b;
  }
  #stats {
    margin-top: 20px;
    display: flex;
    gap: 40px;
    font-size: 22px;
  }
  #stats span { color: #00c8ff; font-weight: bold; }
  #hint { margin-top: 10px; color: #888; font-size: 14px; }
  button {
    margin-top: 20px;
    padding: 12px 30px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #00c8ff;
    color: #12141c;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { background: #33d6ff; }
  button:disabled { background: #444; color: #888; cursor: not-allowed; }
</style>
</head>
<body>

<h1>CPS Тест — 10 секунд</h1>

<div id="wrap">
  <canvas id="canvas" width="600" height="400"></canvas>
</div>

<div id="stats">
  <div>Время: <span id="timer">10.0</span>с</div>
  <div>CPS: <span id="cps">0.00</span></div>
  <div>Клики: <span id="clicks">0</span></div>
</div>

<div id="hint">Кликни по полю, чтобы начать. Отсчёт начнётся с первого клика.</div>
<button id="resetBtn" disabled>Заново</button>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const timerEl = document.getElementById('timer');
  const cpsEl = document.getElementById('cps');
  const clicksEl = document.getElementById('clicks');
  const resetBtn = document.getElementById('resetBtn');
  const hintEl = document.getElementById('hint');

  const DURATION = 10; // секунд

  let state = 'idle';   // idle | running | finished
  let clicks = 0;
  let startTime = 0;
  let rafId = null;

  // частицы для визуального отклика
  const particles = [];

  function drawBackground() {
    // градиентный фон
    const g = ctx.createRadialGradient(
      canvas.width / 2, canvas.height / 2, 50,
      canvas.width / 2, canvas.height / 2, 400
    );
    g.addColorStop(0, '#232838');
    g.addColorStop(1, '#12141c');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // сетка
    ctx.strokeStyle = 'rgba(0, 200, 255, 0.05)';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
      ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 40) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
      ctx.stroke();
    }
  }

  function drawCentralText() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (state === 'idle') {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = 'bold 32px Segoe UI, Arial';
      ctx.fillText('Кликни, чтобы начать', canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = 'rgba(0,200,255,0.7)';
      ctx.font = '18px Segoe UI, Arial';
      ctx.fillText('10 секунд на максимальный CPS', canvas.width / 2, canvas.height / 2 + 25);
    } else if (state === 'running') {
      const elapsed = (performance.now() - startTime) / 1000;
      const remaining = Math.max(0, DURATION - elapsed);
      ctx.fillStyle = 'rgba(0,200,255,0.9)';
      ctx.font = 'bold 90px Segoe UI, Arial';
      ctx.fillText(remaining.toFixed(1), canvas.width / 2, canvas.height / 2);
    } else if (state === 'finished') {
      ctx.fillStyle = '#00c8ff';
      ctx.font = 'bold 28px Segoe UI, Arial';
      ctx.fillText('Готово!', canvas.width / 2, canvas.height / 2 - 40);
      const cps = clicks / DURATION;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 72px Segoe UI, Arial';
      ctx.fillText(cps.toFixed(2), canvas.width / 2, canvas.height / 2 + 30);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '20px Segoe UI, Arial';
      ctx.fillText('CPS', canvas.width / 2, canvas.height / 2 + 90);
    }
  }

  function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.03;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = '#00c8ff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    drawBackground();
    drawParticles();
    drawCentralText();

    if (state === 'running') {
      rafId = requestAnimationFrame(render);
    } else {
      rafId = null;
    }
  }

  function updateUI() {
    const elapsed = state === 'idle' ? 0 : Math.min(DURATION, (performance.now() - startTime) / 1000);
    const remaining = Math.max(0, DURATION - elapsed);
    timerEl.textContent = remaining.toFixed(1);
    clicksEl.textContent = clicks;
    const cps = state === 'idle' ? 0 : clicks / Math.max(elapsed, 0.001);
    cpsEl.textContent = (state === 'finished' ? clicks / DURATION : cps).toFixed(2);
  }

  function startTest() {
    state = 'running';
    clicks = 0;
    startTime = performance.now();
    hintEl.textContent = 'Кликай как можно быстрее!';
    resetBtn.disabled = true;
    if (!rafId) render();
    updateUI();
  }

  function finishTest() {
    state = 'finished';
    clicksEl.textContent = clicks;
    cpsEl.textContent = (clicks / DURATION).toFixed(2);
    timerEl.textContent = '0.0';
    hintEl.textContent = 'Нажми «Заново», чтобы попробовать снова.';
    resetBtn.disabled = false;
    render();
  }

  canvas.addEventListener('mousedown', (e) => {
    if (state === 'finished') return;

    if (state === 'idle') {
      startTest();
      // первый клик тоже считается
    }

    if (state === 'running') {
      const elapsed = (performance.now() - startTime) / 1000;
      if (elapsed >= DURATION) return;
      clicks++;

      // частицы в точке клика
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      for (let i = 0; i < 8; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: 2 + Math.random() * 3,
          life: 1
        });
      }

      updateUI();
    }
  });

  // глобальный таймер для точного завершения
  function tick() {
    if (state === 'running') {
      const elapsed = (performance.now() - startTime) / 1000;
      if (elapsed >= DURATION) {
        finishTest();
        return;
      }
      updateUI();
      setTimeout(tick, 50);
    }
  }

  // переопределим startTest, чтобы запускать tick
  const originalStart = startTest;
  startTest = function() {
    originalStart();
    tick();
  };

  resetBtn.addEventListener('click', () => {
    state = 'idle';
    clicks = 0;
    particles.length = 0;
    timerEl.textContent = '10.0';
    cpsEl.textContent = '0.00';
    clicksEl.textContent = '0';
    hintEl.textContent = 'Кликни по полю, чтобы начать. Отсчёт начнётся с первого клика.';
    resetBtn.disabled = true;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    render();
  });

  // стартовый рендер
  render();
})();
</script>
</body>
</html>
