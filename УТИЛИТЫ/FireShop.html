<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FireLand — 2D + 3D редактор</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --accent: #ff6b35;
    --accent-2: #f7931e;
    --glass-bg: rgba(255,255,255,0.72);
    --glass-border: rgba(255,255,255,0.5);
    --text: #1c1c1e;
    --text-2: #6e6e73;
    --text-3: #8e8e93;
    --bg-page: #f2f2f7;
    --shadow-md: 0 4px 20px rgba(0,0,0,.08);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --glass-bg: rgba(28,28,30,0.72);
      --glass-border: rgba(255,255,255,0.08);
      --text: #f2f2f7;
      --text-2: #98989d;
      --text-3: #636366;
      --bg-page: #1c1c1e;
    }
  }
  html, body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI Variable', 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg-page); color: var(--text);
    height: 100vh; height: 100dvh; overflow: hidden;
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; }
  
  .bg-mesh { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg-mesh::before, .bg-mesh::after {
    content: ''; position: absolute;
    width: 70vmax; height: 70vmax; border-radius: 50%;
    filter: blur(90px); opacity: .3;
  }
  .bg-mesh::before {
    background: radial-gradient(circle, #ff6b35, transparent 70%);
    top: -30vmax; left: -20vmax;
    animation: float1 22s ease-in-out infinite;
  }
  .bg-mesh::after {
    background: radial-gradient(circle, #7c5cff, transparent 70%);
    bottom: -30vmax; right: -20vmax;
    animation: float2 26s ease-in-out infinite;
  }
  @keyframes float1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(8vmax,6vmax) scale(1.15)} }
  @keyframes float2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-10vmax,-8vmax) scale(1.2)} }
  
  .topbar {
    position: relative; z-index: 50;
    background: var(--glass-bg);
    backdrop-filter: saturate(180%) blur(30px);
    -webkit-backdrop-filter: saturate(180%) blur(30px);
    border-bottom: 1px solid var(--glass-border);
    display: flex; align-items: center;
    overflow-x: auto; scrollbar-width: none;
    flex-shrink: 0; min-height: 62px;
    padding: 0 6px;
  }
  .topbar::-webkit-scrollbar { display: none; }
  
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 0 18px 0 12px;
    font-weight: 800; font-size: 15px;
    background: linear-gradient(135deg, #ff6b35, #f7931e);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; white-space: nowrap;
    height: 100%;
  }
  .brand-icon {
    width: 30px; height: 30px; border-radius: 10px;
    background: linear-gradient(135deg, #ff6b35, #f7931e);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 16px;
    box-shadow: 0 4px 14px rgba(255,107,53,.4);
  }
  
  .mode-switch {
    display: flex; background: rgba(0,0,0,.06);
    border-radius: 12px; padding: 3px; margin: 0 8px;
    flex-shrink: 0;
  }
  @media (prefers-color-scheme: dark) {
    .mode-switch { background: rgba(255,255,255,.08); }
  }
  .mode-switch button {
    background: transparent; border: none;
    padding: 8px 16px; border-radius: 10px;
    font-size: 13px; font-weight: 600;
    color: var(--text-2); cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    font-family: inherit;
    transition: all .3s cubic-bezier(.34,1.56,.64,1);
  }
  .mode-switch button:hover { color: var(--text); }
  .mode-switch button.active {
    background: linear-gradient(135deg, #ff6b35, #f7931e);
    color: #fff;
    box-shadow: 0 4px 12px rgba(255,107,53,.4);
    transform: scale(1.03);
  }
  
  .tabs { display: flex; height: 100%; gap: 4px; padding: 8px 4px; }
  .tab {
    background: transparent; border: none;
    padding: 0 14px; height: 44px;
    font-size: 13px; font-weight: 500;
    color: var(--text-2); cursor: pointer; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
    border-radius: 12px;
    font-family: inherit;
    transition: all .25s cubic-bezier(.4,0,.2,1);
  }
  .tab:hover { background: rgba(255,107,53,.1); color: var(--text); }
  .tab.active {
    background: linear-gradient(135deg, #ff6b35, #f7931e);
    color: #fff;
    box-shadow: 0 4px 12px rgba(255,107,53,.35);
  }
  .tab .ico { font-size: 17px; }
  
  .topbar-right {
    margin-left: auto; display: flex; align-items: center;
    gap: 6px; padding-right: 12px;
    position: sticky; right: 0;
  }
  .topbar-right button, .topbar-right label {
    background: rgba(255,255,255,.5);
    border: 1px solid rgba(0,0,0,.06);
    color: var(--text);
    padding: 9px 13px; border-radius: 12px;
    cursor: pointer; font-size: 13px; font-weight: 500;
    white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
    font-family: inherit;
    backdrop-filter: blur(10px);
    transition: all .25s cubic-bezier(.4,0,.2,1);
  }
  @media (prefers-color-scheme: dark) {
    .topbar-right button, .topbar-right label {
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.1);
    }
  }
  .topbar-right button:hover, .topbar-right label:hover {
    background: linear-gradient(135deg, #ff6b35, #f7931e);
    color: #fff; border-color: transparent;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255,107,53,.4);
  }
  .topbar-right button.primary {
    background: linear-gradient(135deg, #ff6b35, #f7931e);
    color: #fff; border-color: transparent;
    box-shadow: 0 4px 14px rgba(255,107,53,.35);
  }
  input[type="file"] { display: none; }
  
  .workspace { flex: 1; display: flex; overflow: hidden; position: relative; min-height: 0; z-index: 1; }
  
  .stage-wrap {
    flex: 1; position: relative;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; padding: 20px;
    min-width: 0; min-height: 0;
  }
  
  .canvas-container {
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,.15), 0 4px 16px rgba(0,0,0,.08);
    border-radius: 4px;
    transition: transform .15s ease-out;
    transform-origin: center;
  }
  #canvas2d {
    display: block;
    background: #fff;
    border-radius: 4px;
    touch-action: none;
    cursor: crosshair;
  }
  .object-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  .object-item {
    position: absolute;
    pointer-events: auto;
    cursor: move;
    user-select: none;
    border: 2px solid transparent;
    border-radius: 6px;
    padding: 2px;
    white-space: nowrap;
  }
  .object-item.selected {
    border-color: #ff6b35;
    box-shadow: 0 0 0 3px rgba(255,107,53,.25);
  }
  .object-item.text-object { font-weight: 700; line-height: 1; }
  .object-item.sticker-object { font-size: 64px; line-height: 1; }
  
  #canvas3d3d {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    touch-action: none;
    cursor: grab;
  }
  
  .panel-right {
    width: 320px;
    background: var(--glass-bg);
    backdrop-filter: saturate(180%) blur(30px);
    -webkit-backdrop-filter: saturate(180%) blur(30px);
    border-left: 1px solid var(--glass-border);
    display: flex; flex-direction: column;
    flex-shrink: 0; overflow: hidden;
    z-index: 20;
    margin: 12px 12px 12px 0;
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
  }
  
  .panel-content {
    flex: 1; overflow-y: auto; padding: 16px;
    scrollbar-width: thin;
  }
  .panel-content::-webkit-scrollbar { width: 6px; }
  .panel-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 3px; }
  
  .section-title {
    font-size: 11px; color: var(--text-3);
    margin: 20px 0 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .8px;
  }
  .section-title:first-child { margin-top: 0; }
  
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  
  .tool-btn {
    background: rgba(255,255,255,.6);
    border: 1px solid rgba(0,0,0,.06);
    border-radius: 14px;
    padding: 12px 6px;
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    font-size: 10px; color: var(--text-2);
    font-family: inherit;
    transition: all .25s cubic-bezier(.34,1.56,.64,1);
    touch-action: manipulation;
  }
  @media (prefers-color-scheme: dark) {
    .tool-btn { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.1); }
  }
  .tool-btn:hover {
    background: rgba(255,107,53,.12);
    border-color: rgba(255,107,53,.4);
    color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(255,107,53,.2);
  }
  .tool-btn:active { transform: scale(.95); }
  .tool-btn.active {
    background: linear-gradient(135deg, #ff6b35, #f7931e);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 6px 18px rgba(255,107,53,.4);
  }
  .tool-btn .icon { font-size: 22px; line-height: 1; }
  .tool-btn span { font-size: 9px; text-align: center; line-height: 1.2; font-weight: 500; }
  
  .color-grid {
    display: grid; grid-template-columns: repeat(8, 1fr);
    gap: 5px; margin-top: 8px;
  }
  .color-swatch {
    aspect-ratio: 1;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all .2s cubic-bezier(.34,1.56,.64,1);
  }
  .color-swatch:hover { transform: scale(1.15) rotate(-3deg); }
  .color-swatch.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(255,107,53,.3);
    transform: scale(1.08);
  }
  .color-swatch.white { border: 1px solid rgba(0,0,0,.1); }
  
  .current-color {
    display: flex; gap: 12px; align-items: center;
    margin-bottom: 12px; padding: 10px;
    background: rgba(255,255,255,.4);
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    .current-color { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.08); }
  }
  .current-color .big {
    width: 48px; height: 48px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,.6);
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    flex-shrink: 0;
  }
  .current-color .info { flex: 1; min-width: 0; }
  .current-color .info label {
    font-size: 10px; color: var(--text-3);
    display: block; margin-bottom: 4px;
    font-weight: 500; text-transform: uppercase;
  }
  .current-color .info input {
    width: 100%;
    background: rgba(255,255,255,.6);
    border: 1px solid rgba(0,0,0,.06);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px; color: var(--text);
    font-family: monospace;
  }
  .current-color .info input:focus {
    outline: none; border-color: var(--accent);
  }
  
  .slider-row {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 10px; padding: 8px 10px;
    background: rgba(255,255,255,.4);
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    .slider-row { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.06); }
  }
  .slider-row label {
    font-size: 12px; color: var(--text-2);
    min-width: 70px; font-weight: 500;
  }
  .slider-row input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    background: rgba(0,0,0,.08);
    border-radius: 3px;
    outline: none;
  }
  @media (prefers-color-scheme: dark) {
    .slider-row input[type="range"] { background: rgba(255,255,255,.12); }
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b35, #f7931e);
    cursor: grab;
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,.4);
  }
  .slider-row .val {
    font-size: 12px; color: var(--accent);
    font-weight: 700; min-width: 42px; text-align: right;
  }
  
  .layers-list {
    display: flex; flex-direction: column;
    gap: 6px; max-height: 240px; overflow-y: auto;
  }
  .layer-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: rgba(255,255,255,.5);
    border-radius: 10px;
    border: 1px solid rgba(0,0,0,.05);
    cursor: pointer;
    transition: all .2s;
    font-size: 12px;
  }
  @media (prefers-color-scheme: dark) {
    .layer-item { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.06); }
  }
  .layer-item:hover { background: rgba(255,107,53,.1); }
  .layer-item.active {
    background: rgba(255,107,53,.15);
    border-color: rgba(255,107,53,.5);
  }
  .layer-item .eye {
    background: transparent; border: none;
    font-size: 14px; cursor: pointer;
    opacity: .6; padding: 0 2px;
  }
  .layer-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer-item .del {
    background: transparent; border: none;
    color: #ff3b30; cursor: pointer;
    font-size: 14px; padding: 0 4px;
    opacity: 0;
  }
  .layer-item:hover .del { opacity: 1; }
  
  .sticker-grid {
    display: grid; grid-template-columns: repeat(6, 1fr);
    gap: 5px;
  }
  .sticker-btn {
    aspect-ratio: 1;
    background: rgba(255,255,255,.6);
    border: 1px solid rgba(0,0,0,.06);
    border-radius: 10px;
    font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s cubic-bezier(.34,1.56,.64,1);
  }
  @media (prefers-color-scheme: dark) {
    .sticker-btn { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.1); }
  }
  .sticker-btn:hover { transform: scale(1.15) rotate(-5deg); background: rgba(255,107,53,.15); }
  
  .statusbar {
    position: relative; z-index: 5;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--glass-border);
    padding: 8px 18px; font-size: 11px;
    color: var(--text-3);
    display: flex; justify-content: space-between;
    flex-shrink: 0; min-height: 32px; align-items: center;
    font-weight: 500;
  }
  .statusbar .brand {
    background: linear-gradient(135deg, #ff6b35, #f7931e);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; font-weight: 700;
    padding: 0; font-size: 11px;
  }
  
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    backdrop-filter: blur(12px);
    display: none; align-items: center;
    justify-content: center;
    z-index: 1000; padding: 20px;
    opacity: 0; transition: opacity .3s;
  }
  .modal-bg.show { display: flex; opacity: 1; }
  .modal {
    background: var(--glass-bg);
    backdrop-filter: blur(30px);
    border-radius: 20px;
    padding: 26px;
    width: min(460px, 100%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 24px 80px rgba(0,0,0,.4);
    animation: modalPop .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes modalPop { from { transform: scale(.9) translateY(20px); opacity: 0 } to { transform: scale(1) translateY(0); opacity: 1 } }
  .modal h3 { font-size: 18px; margin-bottom: 16px; font-weight: 700; }
  .modal input[type="text"] {
    width: 100%;
    background: rgba(255,255,255,.6);
    border: 1px solid rgba(0,0,0,.08);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 16px; color: var(--text);
    margin-bottom: 16px;
    font-family: inherit;
  }
  @media (prefers-color-scheme: dark) {
    .modal input[type="text"] {
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.1);
    }
  }
  .modal input:focus { outline: none; border-color: var(--accent); }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-btns button {
    padding: 11px 22px; border-radius: 12px;
    border: 1px solid rgba(0,0,0,.08);
    background: rgba(255,255,255,.6);
    color: var(--text); cursor: pointer;
    font-size: 14px; font-weight: 500;
    font-family: inherit;
  }
  @media (prefers-color-scheme: dark) {
    .modal-btns button { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.12); }
  }
  .modal-btns button.primary {
    background: linear-gradient(135deg, #ff6b35, #f7931e);
    color: #fff; border-color: transparent;
    font-weight: 600;
  }
  
  .toast-container {
    position: fixed; bottom: 44px; left: 50%;
    transform: translateX(-50%);
    z-index: 2000;
    display: flex; flex-direction: column;
    gap: 8px; align-items: center;
    pointer-events: none;
  }
  .toast {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 12px 20px;
    font-size: 13px; color: var(--text);
    box-shadow: 0 12px 40px rgba(0,0,0,.15);
    font-weight: 500;
    display: flex; align-items: center; gap: 8px;
    animation: toastIn .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(20px) scale(.9) } to { opacity: 1; transform: translateY(0) scale(1) } }
  .toast.out { animation: toastOut .3s ease forwards; }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-10px) scale(.95) } }
  
  .panel-tab { display: none; }
  .panel-tab.active { display: block; animation: panelFade .3s ease; }
  @keyframes panelFade { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
  
  .mobile-toggle {
    position: absolute; top: 16px; right: 16px;
    width: 52px; height: 52px;
    background: linear-gradient(135deg, #ff6b35, #f7931e);
    border: none; border-radius: 16px;
    color: #fff; font-size: 24px;
    cursor: pointer; z-index: 30;
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(255,107,53,.5);
  }
  
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    backdrop-filter: blur(4px);
    z-index: 200; opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  
  @media (max-width: 900px) {
    .brand span { display: none; }
    .tab { padding: 0 10px; height: 42px; font-size: 11px; }
    .tab span:not(.ico) { display: none; }
    .mode-switch button { padding: 6px 10px; font-size: 11px; }
    .topbar-right button, .topbar-right label { padding: 7px 10px; font-size: 11px; }
    .topbar-right span:not(.ico) { display: none; }
    
    .panel-right {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: min(340px, 90vw);
      margin: 0;
      border-radius: 20px 0 0 20px;
      transform: translateX(100%);
      transition: transform .35s cubic-bezier(.32,.72,0,1);
      z-index: 300;
    }
    .panel-right.open { transform: translateX(0); }
    .mobile-toggle { display: flex; }
    
    .panel-close {
      position: absolute; top: 14px; right: 14px;
      width: 40px; height: 40px;
      background: rgba(0,0,0,.06); border: none;
      border-radius: 12px; font-size: 18px;
      cursor: pointer; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
    }
    .panel-content { padding-top: 60px; }
    .stage-wrap { padding: 8px; }
  }
  @media (min-width: 901px) {
    .panel-close { display: none; }
    .overlay { display: none; }
  }
</style>
</head>
<body>

<div class="bg-mesh"></div>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon">🔥</div>
    <span>FireLand</span>
  </div>
  
  <div class="mode-switch">
    <button class="active" data-mode="2d"><span>🎨</span> 2D</button>
    <button data-mode="3d"><span>🧊</span> 3D</button>
  </div>
  
  <!-- 2D вкладки -->
  <div class="tabs" id="tabs2d">
    <button class="tab active" data-tab="tools"><span class="ico">🖌️</span><span>Инструменты</span></button>
    <button class="tab" data-tab="shapes"><span class="ico">▭</span><span>Фигуры</span></button>

<script>
window.addEventListener('DOMContentLoaded', () => {
  if (typeof THREE === 'undefined') {
    document.getElementById('status').textContent = '❌ Three.js не загрузился';
    return;
  }
  try { initApp(); }
  catch (err) { console.error(err); document.getElementById('status').textContent = 'Ошибка: ' + err.message; }
});

function initApp() {
  const $ = id => document.getElementById(id);
  const status = $('status');
  const toastContainer = $('toastContainer');
  const panelRight = $('panelRight');
  const overlay = $('overlay');
  const stageWrap = $('stageWrap');
  const canvasContainer = $('canvasContainer');
  
  let currentMode = '2d';
  
  // ===== TOAST =====
  function toast(msg, icon = '✓') {
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
    toastContainer.appendChild(t);
    setTimeout(() => {
      t.classList.add('out');
      setTimeout(() => t.remove(), 300);
    }, 1800);
  }
  
  // =================================================================
  // ОБЩЕЕ СОСТОЯНИЕ
  // =================================================================
  const state = {
    color: '#ff6b35',
    // 2D
    logicalW: 1200, logicalH: 800,
    dpr: Math.max(window.devicePixelRatio || 1, 1),
    tool: 'brush',
    brushSize: 6, brushOpacity: 1,
    shapeSize: 4, shapeFilled: false,
    textSize: 64, textFont: 'bold',
    layers: [], activeLayerId: null, layerCounter: 0,
    objects: [], selectedObjectId: null,
    undoStack: [], redoStack: []
  };
  
  const PALETTE = [
    '#ffffff','#e5e5ea','#c7c7cc','#8e8e93','#48484a','#1c1c1e','#000000','#ff6b35',
    '#f7931e','#ffcc00','#34c759','#30d158','#00c7be','#32ade6','#007aff','#5856d6',
    '#af52de','#ff2d55','#ff3b30','#ff9500','#ffd60a','#a2845e','#8b5a2b','#654321',
    '#ffb6c1','#ff9fce','#e0b0ff','#b0c4ff','#b0e0ff','#b0ffe0','#d0ffb0','#ffe0b0'
  ];
  
  const STICKERS = ['😀','😍','😂','🥳','😎','🤔','😴','🤩','🥰','🤗','😇','🥺',
                    '❤️','⭐','✨','🔥','🌈','☀️','🌙','⚡','💎','🎉','🎨','🎯',
                    '🌸','🌺','🌻','🍀','🌹','🌴','🍁','🍄','🌷','💐','🌵','🍃',
                    '🐶','🐱','🐼','🦊','🐸','🐝','🦋','🐙','🦄','🐢','🐧','🐨'];
  
  // =================================================================
  // =================== 2D РЕДАКТОР =================================
  // =================================================================
  const canvas = $('canvas2d');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const objectLayer = $('objectLayer');
  const layersList = $('layersList');
  
  // Слои
  function createLayer(name = null) {
    state.layerCounter++;
    const lc = document.createElement('canvas');
    lc.width = Math.round(state.logicalW * state.dpr);
    lc.height = Math.round(state.logicalH * state.dpr);
    const lctx = lc.getContext('2d', { willReadFrequently: true });
    lctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    const layer = {
      id: 'layer_' + state.layerCounter,
      name: name || ('Слой ' + state.layerCounter),
      canvas: lc, ctx: lctx, visible: true
    };
    state.layers.push(layer);
    state.activeLayerId = layer.id;
    renderLayersList();
    composite();
    return layer;
  }
  
  function getActiveLayer() {
    return state.layers.find(l => l.id === state.activeLayerId);
  }
  
  function removeLayer(id) {
    if (state.layers.length <= 1) { toast('Нельзя удалить единственный слой', '⚠️'); return; }
    state.layers = state.layers.filter(l => l.id !== id);
    if (state.activeLayerId === id) state.activeLayerId = state.layers[state.layers.length - 1].id;
    renderLayersList();
    composite();
  }
  
  function renderLayersList() {
    layersList.innerHTML = '';
    [...state.layers].reverse().forEach(layer => {
      const div = document.createElement('div');
      div.className = 'layer-item' + (layer.id === state.activeLayerId ? ' active' : '');
      const eye = document.createElement('button');
      eye.className = 'eye';
      eye.textContent = layer.visible ? '👁' : '🚫';
      eye.addEventListener('click', (e) => {
        e.stopPropagation();
        layer.visible = !layer.visible;
        renderLayersList();
        composite();
      });
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = layer.name;
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        removeLayer(layer.id);
      });
      div.appendChild(eye); div.appendChild(name); div.appendChild(del);
      div.addEventListener('click', () => {
        state.activeLayerId = layer.id;
        renderLayersList();
      });
      layersList.appendChild(div);
    });
  }
  
  function composite() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    state.layers.forEach(layer => {
      if (!layer.visible) return;
      ctx.drawImage(layer.canvas, 0, 0);
    });
  }
  
  // Undo/Redo 2D
  function pushUndo2D() {
    const snapshot = {
      layers: state.layers.map(l => ({
        id: l.id, name: l.name, visible: l.visible, data: l.canvas.toDataURL()
      })),
      objects: JSON.parse(JSON.stringify(state.objects)),
      activeId: state.activeLayerId
    };
    state.undoStack.push(snapshot);
    if (state.undoStack.length > 20) state.undoStack.shift();
    state.redoStack = [];
  }
  
  function applySnapshot2D(snap) {
    state.layers.forEach((l, i) => {
      const s = snap.layers[i];
      if (!s) return;
      l.visible = s.visible;
      const img = new Image();
      img.onload = () => {
        l.ctx.setTransform(1, 0, 0, 1, 0, 0);
        l.ctx.clearRect(0, 0, l.canvas.width, l.canvas.height);
        l.ctx.drawImage(img, 0, 0);
        l.ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        composite();
      };
      img.src = s.data;
    });
    state.objects = JSON.parse(JSON.stringify(snap.objects));
    state.activeLayerId = snap.activeId;
    renderLayersList();
    renderObjects();
  }
  
  function undo() {
    if (currentMode === '2d') {
      if (!state.undoStack.length) { toast('Нечего отменять', '↶'); return; }
      const current = {
        layers: state.layers.map(l => ({
          id: l.id, name: l.name, visible: l.visible, data: l.canvas.toDataURL()
        })),
        objects: JSON.parse(JSON.stringify(state.objects)),
        activeId: state.activeLayerId
      };
      state.redoStack.push(current);
      const snap = state.undoStack.pop();
      applySnapshot2D(snap);
      toast('Отменено', '↶');
    } else {
      toast('Undo в 3D пока не поддерживается', '↶');
    }
  }
  
  function redo() {
    if (currentMode === '2d') {
      if (!state.redoStack.length) { toast('Нечего возвращать', '↷'); return; }
      const current = {
        layers: state.layers.map(l => ({
          id: l.id, name: l.name, visible: l.visible, data: l.canvas.toDataURL()
        })),
        objects: JSON.parse(JSON.stringify(state.objects)),
        activeId: state.activeLayerId
      };
      state.undoStack.push(current);
      const snap = state.redoStack.pop();
      applySnapshot2D(snap);
      toast('Возвращено', '↷');
    } else {
      toast('Redo в 3D пока не поддерживается', '↷');
    }
  }
  
  // Инициализация холста
  function initCanvas2D() {
    canvas.width = Math.round(state.logicalW * state.dpr);
    canvas.height = Math.round(state.logicalH * state.dpr);
    canvas.style.width = state.logicalW + 'px';
    canvas.style.height = state.logicalH + 'px';
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    
    createLayer('Фон');
    const active = getActiveLayer();
    active.ctx.fillStyle = '#fff';
    active.ctx.fillRect(0, 0, state.logicalW, state.logicalH);
    composite();
    fitToStage();
  }
  
  function fitToStage() {
    const rect = stageWrap.getBoundingClientRect();
    const pad = 40;
    const scale = Math.min(
      (rect.width - pad) / state.logicalW,
      (rect.height - pad) / state.logicalH,
      1
    );
    canvasContainer.style.transform = `scale(${scale})`;
    canvasContainer.dataset.scale = scale;
  }
  
  // Координаты
  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scale = parseFloat(canvasContainer.dataset.scale) || 1;
    const sx = state.logicalW / (state.logicalW * scale);
    const sy = state.logicalH / (state.logicalH * scale);
    return {
      x: (e.clientX - rect.left) * (1 / scale),
      y: (e.clientY - rect.top) * (1 / scale)
    };
  }
  
  // Рисование 2D
  let drawing2D = false;
  let last2D = { x: 0, y: 0 };
  let start2D = { x: 0, y: 0 };
  let savedSnap2D = null;
  
  canvas.addEventListener('pointerdown', e => {
    if (currentMode !== '2d') return;
    
    const tool = state.tool;
    
    if (tool === 'picker') {
      const p = getCanvasPos(e);
      const px = ctx.getImageData(Math.round(p.x * state.dpr), Math.round(p.y * state.dpr), 1, 1).data;
      const hex = '#' + [px[0], px[1], px[2]].map(v => v.toString(16).padStart(2, '0')).join('');
      setColor(hex);
      toast('Взято: ' + hex, '💧');
      return;
    }
    
    if (tool === 'fill') {
      const p = getCanvasPos(e);
      floodFill2D(p.x, p.y, state.color);
      pushUndo2D();
      return;
    }
    
    const isBrush = ['brush','pencil','marker','spray','eraser'].includes(tool);
    const isShape = tool.startsWith('shape_');
    if (!isBrush && !isShape) return;
    
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    drawing2D = true;
    const p = getCanvasPos(e);
    last2D = p; start2D = p;
    
    if (isShape) {
      const layer = getActiveLayer();
      savedSnap2D = layer.ctx.getImageData(0, 0, layer.canvas.width, layer.canvas.height);
    } else {
      drawLine2D(p, p, true);
    }
  });
  
  canvas.addEventListener('pointermove', e => {
    if (!drawing2D) return;
    e.preventDefault();
    const p = getCanvasPos(e);
    const tool = state.tool;
    const isShape = tool.startsWith('shape_');
    
    if (isShape) {
      const layer = getActiveLayer();
      if (!layer || !savedSnap2D) return;
      layer.ctx.putImageData(savedSnap2D, 0, 0);
      drawShape2D(layer.ctx, start2D, p, tool.replace('shape_', ''));
    } else {
      drawLine2D(last2D, p, false);
    }
    last2D = p;
  });
  
  canvas.addEventListener('pointerup', e => {
    if (!drawing2D) return;
    drawing2D = false;
    savedSnap2D = null;
    pushUndo2D();   // ← фикс бага! Undo работает и для фигур
    composite();
  });
  
  canvas.addEventListener('pointercancel', () => {
    drawing2D = false;
    savedSnap2D = null;
  });
  
  function drawLine2D(from, to, isDot) {
    const layer = getActiveLayer();
    if (!layer) return;
    const opacity = state.brushOpacity;
    const color = state.tool === 'eraser' ? '#ffffff' : state.color;
    const size = state.brushSize;
    const lc = layer.ctx;
    
    lc.save();
    lc.globalAlpha = opacity;
    lc.strokeStyle = color;
    lc.fillStyle = color;
    lc.lineWidth = size;
    lc.lineCap = 'round';
    lc.lineJoin = 'round';
    
    if (state.tool === 'spray') {
      for (let i = 0; i < 12; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = Math.random() * size;
        lc.fillRect(to.x + Math.cos(a) * r, to.y + Math.sin(a) * r, 1.5, 1.5);
      }
    } else if (state.tool === 'marker') {
      lc.globalAlpha = opacity * 0.5;
      lc.lineWidth = size * 2;
      lc.beginPath();
      lc.moveTo(from.x, from.y);
      lc.lineTo(to.x, to.y);
      lc.stroke();
    } else if (state.tool === 'pencil') {
      lc.lineWidth = Math.max(1, size * 0.5);
      lc.beginPath();
      lc.moveTo(from.x, from.y);
      lc.lineTo(to.x, to.y);
      lc.stroke();
    } else if (isDot) {
      lc.beginPath();
      lc.arc(to.x, to.y, size / 2, 0, Math.PI * 2);
      lc.fill();
    } else {
      lc.beginPath();
      lc.moveTo(from.x, from.y);
      lc.lineTo(to.x, to.y);
      lc.stroke();
    }
    lc.restore();
    composite();
  }
  
  function drawShape2D(lc, start, end, shape) {
    lc.save();
    lc.strokeStyle = state.color;
    lc.fillStyle = state.color;
    lc.lineWidth = state.shapeSize;
    lc.lineCap = 'round';
    lc.lineJoin = 'round';
    
    const x = Math.min(start.x, end.x), y = Math.min(start.y, end.y);
    const w = Math.abs(end.x - start.x), h = Math.abs(end.y - start.y);
    const cx = (start.x + end.x) / 2, cy = (start.y + end.y) / 2;
    
    lc.beginPath();
    
    switch (shape) {
      case 'line':
        lc.moveTo(start.x, start.y);
        lc.lineTo(end.x, end.y);
        lc.stroke();
        break;
      case 'rect':
        if (state.shapeFilled) lc.fillRect(x, y, w, h);
        else lc.strokeRect(x, y, w, h);
        break;
      case 'circle':
        const r = Math.min(w, h) / 2;
        lc.arc(cx, cy, r, 0, Math.PI * 2);
        if (state.shapeFilled) lc.fill(); else lc.stroke();
        break;
      case 'ellipse':
        lc.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
        if (state.shapeFilled) lc.fill(); else lc.stroke();
        break;
      case 'triangle':
        lc.moveTo(cx, y);
        lc.lineTo(x + w, y + h);
        lc.lineTo(x, y + h);
        lc.closePath();
        if (state.shapeFilled) lc.fill(); else lc.stroke();
        break;
      case 'star':
        drawStarPath(lc, cx, cy, Math.max(w, h) / 2, Math.max(w, h) / 5, 5);
        if (state.shapeFilled) lc.fill(); else lc.stroke();
        break;
      case 'arrow':
        const angle = Math.atan2(end.y - start.y, end.x - start.x);
        const len = Math.hypot(end.x - start.x, end.y - start.y);
        const headLen = Math.min(30, len * 0.3);
        lc.moveTo(start.x, start.y);
        lc.lineTo(end.x, end.y);
        lc.moveTo(end.x, end.y);
        lc.lineTo(end.x - headLen * Math.cos(angle - Math.PI / 7), end.y - headLen * Math.sin(angle - Math.PI / 7));
        lc.moveTo(end.x, end.y);
        lc.lineTo(end.x - headLen * Math.cos(angle + Math.PI / 7), end.y - headLen * Math.sin(angle + Math.PI / 7));
        lc.stroke();
        break;
      case 'heart':
        const sz = Math.max(w, h) / 2;
        lc.moveTo(cx, cy - sz * 0.3);
        lc.bezierCurveTo(cx, cy - sz * 0.7, cx - sz, cy - sz * 0.7, cx - sz, cy);
        lc.bezierCurveTo(cx - sz, cy + sz * 0.4, cx, cy + sz * 0.7, cx, cy + sz);
        lc.bezierCurveTo(cx, cy + sz * 0.7, cx + sz, cy + sz * 0.4, cx + sz, cy);
        lc.bezierCurveTo(cx + sz, cy - sz * 0.7, cx, cy - sz * 0.7, cx, cy - sz * 0.3);
        if (state.shapeFilled) lc.fill(); else lc.stroke();
        break;
      case 'pentagon':
        drawPolygonPath(lc, cx, cy, Math.min(w, h) / 2, 5);
        if (state.shapeFilled) lc.fill(); else lc.stroke();
        break;
    }
    lc.restore();
    composite();
  }
  
  function drawStarPath(c, cx, cy, outer, inner, points) {
    c.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const r = i % 2 === 0 ? outer : inner;
      const a = (i * Math.PI) / points - Math.PI / 2;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) c.moveTo(x, y);
      else c.lineTo(x, y);
    }
    c.closePath();
  }
  
  function drawPolygonPath(c, cx, cy, r, sides) {
    c.beginPath();
    for (let i = 0; i < sides; i++) {
      const a = (i * 2 * Math.PI) / sides - Math.PI / 2;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) c.moveTo(x, y);
      else c.lineTo(x, y);
    }
    c.closePath();
  }
  
  function floodFill2D(x, y, hexColor) {
    const layer = getActiveLayer();
    if (!layer) return;
    const px = Math.round(x * state.dpr);
    const py = Math.round(y * state.dpr);
    const imgData = layer.ctx.getImageData(0, 0, layer.canvas.width, layer.canvas.height);
    const data = imgData.data;
    const W = layer.canvas.width, H = layer.canvas.height;
    if (px < 0 || py < 0 || px >= W || py >= H) return;
    
    const ti = (py * W + px) * 4;
    const tr = data[ti], tg = data[ti + 1], tb = data[ti + 2], ta = data[ti + 3];
    const m = hexColor.replace('#', '').match(/.{2}/g);
    const nr = parseInt(m[0], 16), ng = parseInt(m[1], 16), nb = parseInt(m[2], 16);
    if (tr === nr && tg === ng && tb === nb && ta === 255) return;
    
    const tol = 30;
    const stack = [[px, py]];
    const visited = new Uint8Array(W * H);
    
    while (stack.length) {
      const [cx, cy] = stack.pop();
      if (cx < 0 || cy < 0 || cx >= W || cy >= H) continue;
      const idx = cy * W + cx;
      if (visited[idx]) continue;
      const i = idx * 4;
      if (Math.abs(data[i] - tr) > tol || Math.abs(data[i + 1] - tg) > tol ||
          Math.abs(data[i + 2] - tb) > tol || Math.abs(data[i + 3] - ta) > tol) continue;
      visited[idx] = 1;
      data[i] = nr; data[i + 1] = ng; data[i + 2] = nb; data[i + 3] = 255;
      stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
    }
    layer.ctx.setTransform(1, 0, 0, 1, 0, 0);
    layer.ctx.putImageData(imgData, 0, 0);
    layer.ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    composite();
  }

  function startObjectDrag(e, obj) {
    selectObject(obj.id);
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const origX = obj.x, origY = obj.y;
    const scale = parseFloat(canvasContainer.dataset.scale) || 1;
    function onMove(ev) {
      obj.x = origX + (ev.clientX - startX) / scale;
      obj.y = origY + (ev.clientY - startY) / scale;
      renderObjects();
    }
    function onUp() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      pushUndo2D();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  }

      layer.ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
      layer.ctx.drawImage(tmp, 0, 0);
      layer.ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
    });
    composite();
    toast('Отражено ⇄', '⇄');
  });
  
  $('btnFlipV').addEventListener('click', () => {
    pushUndo2D();
    state.layers.forEach(layer => {
      const tmp = document.createElement('canvas');
      tmp.width = layer.canvas.width; tmp.height = layer.canvas.height;
      const tc = tmp.getContext('2d');
      tc.translate(0, tmp.height); tc.scale(1, -1);
      tc.drawImage(layer.canvas, 0, 0);
      layer.ctx.setTransform(1,0,0,1,0,0);
      layer.ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
      layer.ctx.drawImage(tmp, 0, 0);
      layer.ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
    });
    composite();
    toast('Отражено ⇅', '⇅');
  });
  
  $('btnRotate90').addEventListener('click', () => {
    pushUndo2D();
    const w = state.logicalW, h = state.logicalH;
    state.layers.forEach(layer => {
      const tmp = document.createElement('canvas');
      tmp.width = layer.canvas.height; tmp.height = layer.canvas.width;
      const tc = tmp.getContext('2d');
      tc.translate(tmp.width, 0); tc.rotate(Math.PI / 2);
      tc.drawImage(layer.canvas, 0, 0);
      layer.canvas = tmp;
      layer.ctx = tmp.getContext('2d', { willReadFrequently: true });
      layer.ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    });
    state.logicalW = h; state.logicalH = w;
    canvas.width = Math.round(h * state.dpr);
    canvas.height = Math.round(w * state.dpr);
    canvas.style.width = h + 'px';
    canvas.style.height = w + 'px';
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    composite();
    fitToStage();
    toast('Повёрнуто на 90°', '↻');

  $('btnClearCanvas').addEventListener('click', () => {

      layer.ctx.setTransform(1,0,0,1,0,0);

      layer.ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
    });
    if (state.layers[0]) {
      state.layers[0].ctx.fillStyle = '#fff';
      state.layers[0].ctx.fillRect(0, 0, state.logicalW, state.logicalH);
    }

    state.selectedObjectId = null;
    renderObjects();
    composite();
    toast('Очищено', '🧹');
  });
  
  // =================================================================
  // =================== 3D РЕДАКТОР =================================
  // =================================================================
  const canvas3d = $('canvas3d3d');
  const S3D = {
    init: false, scene: null, camera: null, renderer: null, controls: null,
    objects: [], selected: [], grid: null, ground: null,
    raycaster: null,
    drag: { active: false, plane: null, lastPoint: null },
    snapEnabled: true, spawnAngle: 0
  };
  
  function init3DIfNeeded() {
    if (S3D.init) return true;
    if (typeof THREE === 'undefined') { toast('Three.js не загрузился', '⚠️'); return false; }
    
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas3d, antialias: true, preserveDrawingBuffer: true, alpha: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.NoToneMapping;
    
    const scene = new THREE.Scene();
    const rect = stageWrap.getBoundingClientRect();
    const camera = new THREE.PerspectiveCamera(45, (rect.width || 1) / (rect.height || 1), 0.1, 500);
    camera.position.set(0, 6, 11);
    
    const controls = new THREE.OrbitControls(camera, canvas3d);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0.5, 0);
    controls.minDistance = 3;
    controls.maxDistance = 40;
    controls.screenSpacePanning = true;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.minPolarAngle = 0.15;
    
    scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 0.85));
    const key = new THREE.DirectionalLight(0xffffff, 0.9);
    key.position.set(6, 12, 8);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.near = 0.5;
    key.shadow.camera.far = 40;
    key.shadow.camera.left = -15;
    key.shadow.camera.right = 15;
    key.shadow.camera.top = 15;
    key.shadow.camera.bottom = -15;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xb0c8ff, 0.4);
    fill.position.set(-8, 5, -6);
    scene.add(fill);
    
    const grid = new THREE.GridHelper(30, 30, 0xcccccc, 0xdddddd);
    grid.material.opacity = 0.4;
    grid.material.transparent = true;
    scene.add(grid);
    
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.ShadowMaterial({ opacity: 0.15 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    ground.userData.isGround = true;
    scene.add(ground);
    
    S3D.scene = scene;
    S3D.camera = camera;
    S3D.renderer = renderer;
    S3D.controls = controls;
    S3D.grid = grid;
    S3D.ground = ground;
    S3D.raycaster = new THREE.Raycaster();
    S3D.init = true;
    
    window.addEventListener('resize', resize3D);
    setup3DInput();
    animate3D();
    
    // Стартовые
    add3DPrimitive('box', { x: -2, y: 0.6, z: 1.5 });
    add3DPrimitive('torus', { x: 2, y: 0.6, z: 1.5 });
    add3DText('FireLand', { x: 0, y: 1.2, z: -1.5 });
    S3D.selected = [];
    render3DLayers();
    update3DPropsPanel();
    
    return true;
  }
  
  function resize3D() {
    if (!S3D.renderer) return;
    const rect = stageWrap.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    if (w < 2 || h < 2) return;
    S3D.renderer.setSize(w, h, false);
    canvas3d.width = Math.round(w * S3D.renderer.getPixelRatio());
    canvas3d.height = Math.round(h * S3D.renderer.getPixelRatio());
    S3D.camera.aspect = w / h;
    S3D.camera.updateProjectionMatrix();
  }
  
  function makeGeometry3D(type) {
    switch(type) {
      case 'box': return new THREE.BoxGeometry(1.2, 1.2, 1.2);
      case 'sphere': return new THREE.SphereGeometry(0.7, 32, 24);
      case 'cylinder': return new THREE.CylinderGeometry(0.55, 0.55, 1.3, 32);
      case 'cone': return new THREE.ConeGeometry(0.7, 1.4, 32);
      case 'torus': return new THREE.TorusGeometry(0.6, 0.24, 20, 40);
      case 'pyramid': return new THREE.ConeGeometry(0.85, 1.3, 4);
      case 'capsule': return new THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.45, 0.9, 8, 16) : new THREE.CylinderGeometry(0.45, 0.45, 1.5, 16);
      case 'hemisphere': return new THREE.SphereGeometry(0.75, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      case 'tetra': return new THREE.TetrahedronGeometry(0.85);
      default: return new THREE.BoxGeometry(1, 1, 1);
    }
  }
  
  function nextSpawn3D() {
    S3D.spawnAngle += 0.9;
    const r = 1.5 + (S3D.objects.length % 4) * 0.7;
    return { x: Math.cos(S3D.spawnAngle) * r, y: 0.6, z: Math.sin(S3D.spawnAngle) * r };
  }
  
  function labelPrim3D(t) {
    return {
      box:'Куб', sphere:'Сфера', cylinder:'Цилиндр', cone:'Конус',
      torus:'Тор', pyramid:'Пирамида', capsule:'Капсула',
      hemisphere:'Полусфера', tetra:'Тетраэдр'
    }[t] || 'Объект';
  }
  
  function add3DPrimitive(type, position) {
    const geo = makeGeometry3D(type);
    const mat = new THREE.MeshStandardMaterial({
      color: state.color, metalness: 0.15, roughness: 0.5
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    const pos = position || nextSpawn3D();
    mesh.position.set(pos.x, pos.y ?? 0.6, pos.z ?? 0);
    mesh.userData.type = 'prim';
    mesh.userData.name = labelPrim3D(type);
    mesh.userData.baseColor = state.color;
    S3D.scene.add(mesh);
    S3D.objects.push(mesh);
    select3D(mesh, false);
    render3DLayers();
    toast('Добавлено: ' + mesh.userData.name, '📦');
    return mesh;
  }
  
  // 3D-текст через спрайт с псевдо-объёмом
  function add3DText(text, position) {
    const fontSize = 80;
    const cv = document.createElement('canvas');
    const tmp = cv.getContext('2d');
    tmp.font = '700 ' + fontSize + 'px Arial, sans-serif';
    const metrics = tmp.measureText(text);
    cv.width = Math.ceil(metrics.width) + 40;
    cv.height = fontSize * 1.5;
    const c2 = cv.getContext('2d');
    c2.font = '700 ' + fontSize + 'px Arial, sans-serif';
    c2.fillStyle = state.color;
    c2.textBaseline = 'middle';
    c2.fillText(text, 20, cv.height / 2);
    
    const texture = new THREE.CanvasTexture(cv);
    texture.minFilter = THREE.LinearFilter;
    
    const group = new THREE.Group();
    const depthLayers = 8;
    const depthStep = 0.04;
    const baseColor = new THREE.Color(state.color);
    
    for (let i = depthLayers; i > 0; i--) {
      const matBack = new THREE.MeshBasicMaterial({
        map: texture, transparent: true,
        color: baseColor.clone().multiplyScalar(0.4)
      });
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(cv.width / 100, cv.height / 100),
        matBack
      );
      mesh.position.z = -i * depthStep;
      group.add(mesh);
    }
    const matFront = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
    const front = new THREE.Mesh(
      new THREE.PlaneGeometry(cv.width / 100, cv.height / 100),
      matFront
    );
    group.add(front);
    
    const pos = position || nextSpawn3D();
    group.position.set(pos.x, pos.y ?? 1, pos.z ?? 0);
    group.userData.type = 'text3d';
    group.userData.name = 'Текст: ' + text;
    group.userData.baseColor = state.color;
    
    S3D.scene.add(group);
    S3D.objects.push(group);
    select3D(group, false);
    render3DLayers();
    toast('3D-текст добавлен', 'T');
    return group;
  }
  
  // Мультивыделение
  function select3D(obj, add) {
    if (!obj) S3D.selected = [];
    else if (add) {
      const idx = S3D.selected.indexOf(obj);
      if (idx >= 0) S3D.selected.splice(idx, 1);
      else S3D.selected.push(obj);
    } else {
      S3D.selected = [obj];
    }
    render3DLayers();
    update3DPropsPanel();
  }
  
  function paint3DObject(obj, color) {
    obj.traverse(c => {
      if (c.isMesh && c.material && c.material.color) {
        c.material.color.set(color);
        if (c.material.map) { /* оставляем текстуру */ }
        c.material.needsUpdate = true;
      }
    });
    obj.userData.baseColor = color;
    toast('Покрашено', '🎨');
  }
  
  // Ввод 3D
  function setup3DInput() {
    canvas3d.addEventListener('pointerdown', e => {
      const hit = pick3D(e.clientX, e.clientY);
      if (hit) {
        const additive = e.shiftKey || e.ctrlKey || e.metaKey;
        if (!S3D.selected.includes(hit) || additive) {
          select3D(hit, additive);
        }
        startDrag3D(e);
      } else {
        if (!e.shiftKey) select3D(null);
      }
    });
    canvas3d.addEventListener('pointermove', e => {
      if (!S3D.drag.active) return;
      updateDrag3D(e);
    });
    canvas3d.addEventListener('pointerup', endDrag3D);
    canvas3d.addEventListener('pointercancel', endDrag3D);
  }
  
  function pick3D(clientX, clientY) {
    const rect = canvas3d.getBoundingClientRect();
    const ndc = {
      x: ((clientX - rect.left) / rect.width) * 2 - 1,
      y: -((clientY - rect.top) / rect.height) * 2 + 1
    };
    S3D.raycaster.setFromCamera(ndc, S3D.camera);
    const meshes = [];
    S3D.objects.forEach(o => {
      if (o.isMesh) meshes.push(o);
      else o.traverse(c => { if (c.isMesh) meshes.push(c); });
    });
    const hits = S3D.raycaster.intersectObjects(meshes, false);
    if (hits.length === 0) return null;
    let obj = hits[0].object;
    while (obj.parent && obj.parent !== S3D.scene && !S3D.objects.includes(obj)) obj = obj.parent;
    return S3D.objects.includes(obj) ? obj : hits[0].object;
  }
  
  function startDrag3D(e) {
    canvas3d.setPointerCapture(e.pointerId);
    S3D.controls.enabled = false;
    const y0 = S3D.selected[0]?.position.y ?? 0;
    S3D.drag.plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -y0);
    const rect = canvas3d.getBoundingClientRect();
    const ndc = {
      x: ((e.clientX - rect.left) / rect.width) * 2 - 1,
      y: -((e.clientY - rect.top) / rect.height) * 2 + 1
    };
    S3D.raycaster.setFromCamera(ndc, S3D.camera);
    const p = new THREE.Vector3();
    S3D.raycaster.ray.intersectPlane(S3D.drag.plane, p);
    S3D.drag.lastPoint = p;
    S3D.drag.active = true;
    canvas3d.style.cursor = 'grabbing';
  }
  
  function updateDrag3D(e) {
    const rect = canvas3d.getBoundingClientRect();
    const ndc = {
      x: ((e.clientX - rect.left) / rect.width) * 2 - 1,
      y: -((e.clientY - rect.top) / rect.height) * 2 + 1
    };
    S3D.raycaster.setFromCamera(ndc, S3D.camera);
    const p = new THREE.Vector3();
    if (!S3D.raycaster.ray.intersectPlane(S3D.drag.plane, p)) return;
    const delta = p.clone().sub(S3D.drag.lastPoint);
    S3D.selected.forEach(o => {
      o.position.add(delta);
      if (S3D.snapEnabled) {
        o.position.x = Math.round(o.position.x * 2) / 2;
        o.position.z = Math.round(o.position.z * 2) / 2;
      }
    });
    S3D.drag.lastPoint = p;
  }
  
  function endDrag3D() {
    if (!S3D.drag.active) return;
    S3D.drag.active = false;
    S3D.controls.enabled = true;
    canvas3d.style.cursor = 'grab';
  }
  
  function animate3D() {
    requestAnimationFrame(() => {
      if (currentMode === '3d' && S3D.renderer) {
        S3D.controls.update();
        S3D.renderer.render(S3D.scene, S3D.camera);
      }
      animate3D();
    });
  }
  
  function render3DLayers() {
    const list = $('layersList3d');
    if (!list) return;
    list.innerHTML = '';
    [...S3D.objects].reverse().forEach(obj => {
      const div = document.createElement('div');
      div.className = 'layer-item' + (S3D.selected.includes(obj) ? ' active' : '');
      const vis = document.createElement('button');
      vis.className = 'eye';
      vis.textContent = obj.visible ? '👁' : '🚫';
      vis.addEventListener('click', (e) => {
        e.stopPropagation();
        obj.visible = !obj.visible;
        render3DLayers();
      });
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = obj.userData.name;
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        remove3D(obj);
      });
      div.appendChild(vis); div.appendChild(name); div.appendChild(del);
      div.addEventListener('click', (e) => select3D(obj, e.shiftKey));
      list.appendChild(div);
    });
  }
  
  function remove3D(obj) {
    S3D.scene.remove(obj);
    obj.traverse(c => {
      if (c.geometry) c.geometry.dispose();
      if (c.material) Array.isArray(c.material) ? c.material.forEach(m => m.dispose()) : c.material.dispose();
    });
    S3D.objects = S3D.objects.filter(o => o !== obj);
    S3D.selected = S3D.selected.filter(o => o !== obj);
    render3DLayers();
    update3DPropsPanel();
    toast('Удалено', '🗑️');
  }
  
  function update3DPropsPanel() {
    const panel = $('objProps3d');
    const noSel = $('noSel3d');
    const count = $('sel3dCount');
    if (!panel) return;
    if (S3D.selected.length === 0) {
      panel.style.display = 'none';
      noSel.style.display = 'block';
      if (count) count.textContent = '';
      return;
    }
    panel.style.display = 'block';
    noSel.style.display = 'none';
    if (count) count.textContent = S3D.selected.length > 1 ? `(${S3D.selected.length})` : '';
    const o = S3D.selected[0];
    $('objRotY3d').value = Math.round(THREE.MathUtils.radToDeg(o.rotation.y));
    $('objRotY3dVal').textContent = Math.round(THREE.MathUtils.radToDeg(o.rotation.y)) + '°';
    $('objScale3d').value = Math.round(o.scale.x * 100);
    $('objScale3dVal').textContent = o.scale.x.toFixed(2) + '×';
    $('objY3d').value = Math.round(o.position.y * 10);
    $('objY3dVal').textContent = o.position.y.toFixed(1);
  }
  
  $('objRotY3d').addEventListener('input', e => {
    const deg = parseFloat(e.target.value);
    S3D.selected.forEach(o => o.rotation.y = THREE.MathUtils.degToRad(deg));
    $('objRotY3dVal').textContent = deg + '°';
  });
  $('objScale3d').addEventListener('input', e => {
    const s = parseFloat(e.target.value) / 100;
    S3D.selected.forEach(o => o.scale.setScalar(s));
    $('objScale3dVal').textContent = s.toFixed(2) + '×';
  });
  $('objY3d').addEventListener('input', e => {
    const y = parseFloat(e.target.value) / 10;
    S3D.selected.forEach(o => o.position.y = y);
    $('objY3dVal').textContent = y.toFixed(1);
  });
  $('btnDup3d').addEventListener('click', () => {
    S3D.selected.forEach(o => {
      const dup = o.clone(true);
      dup.position.x += 0.8;
      dup.position.z += 0.8;
      dup.userData.name = o.userData.name + ' (копия)';
      S3D.scene.add(dup);
      S3D.objects.push(dup);
    });
    render3DLayers();
    toast('Дублировано', '📋');
  });
  $('btnDel3d').addEventListener('click', () => {
    [...S3D.selected].forEach(o => remove3D(o));

    });
  });
  
  // =================================================================
  // СОХРАНЕНИЕ PNG
  // =================================================================
  function savePNG() {
    if (currentMode === '2d') {
      const out = document.createElement('canvas');
      out.width = Math.round(state.logicalW * state.dpr);
      out.height = Math.round(state.logicalH * state.dpr);
      const o = out.getContext('2d');
      state.layers.forEach(layer => {
        if (!layer.visible) return;
        o.drawImage(layer.canvas, 0, 0);
      });
      state.objects.forEach(obj => {
        o.save();
        o.translate(obj.x * state.dpr, obj.y * state.dpr);
        o.rotate(obj.rotation * Math.PI / 180);
        o.scale(obj.scale, obj.scale);
        o.font = (obj.font === 'bold' ? '700 ' : '') + obj.fontSize + 'px ' +
                 (obj.font === 'serif' ? 'Georgia' : obj.font === 'mono' ? 'monospace' : 'Arial');
        o.fillStyle = obj.color;
        o.textBaseline = 'top';
        o.fillText(obj.text, 0, 0);
        o.restore();
      });
      const link = document.createElement('a');
      link.download = 'fireland_' + Date.now() + '.png';
      link.href = out.toDataURL('image/png');
      link.click();
      toast('Сохранено в PNG', '💾');
    } else {
      const prevW = canvas3d.width, prevH = canvas3d.height;
      const prevPR = S3D.renderer.getPixelRatio();
      const prevAspect = S3D.camera.aspect;
      S3D.renderer.setPixelRatio(1);
      S3D.renderer.setSize(1920, 1080, false);
      S3D.camera.aspect = 1920 / 1080;
      S3D.camera.updateProjectionMatrix();
      S3D.renderer.render(S3D.scene, S3D.camera);
      const link = document.createElement('a');
      link.download = 'fireland_3d_' + Date.now() + '.png';
      link.href = S3D.renderer.domElement.toDataURL('image/png');
      link.click();
      S3D.renderer.setPixelRatio(prevPR);
      S3D.renderer.setSize(prevW / prevPR, prevH / prevPR, false);
      S3D.camera.aspect = prevAspect;
      S3D.camera.updateProjectionMatrix();
      setTimeout(resize3D, 50);
      toast('3D сохранено в PNG', '💾');
    }
  }
  
  // =================================================================
  // ОБРАБОТЧИКИ ОБЩИЕ
  // =================================================================
  $('btnUndo').addEventListener('click', undo);
  $('btnRedo').addEventListener('click', redo);
  $('btnSave').addEventListener('click', savePNG);
  
  // Мобильная панель
  $('btnMobilePanel').addEventListener('click', () => {
    panelRight.classList.add('open');
    overlay.classList.add('show');
  });
  $('btnPanelClose').addEventListener('click', () => {
    panelRight.classList.remove('open');
    overlay.classList.remove('show');
  });
  overlay.addEventListener('click', () => {
    panelRight.classList.remove('open');
    overlay.classList.remove('show');
  });
  
  // Ресайз
  window.addEventListener('resize', () => {
    fitToStage();
    if (currentMode === '3d') resize3D();
  });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      fitToStage();
      if (currentMode === '3d') resize3D();
    }, 300);
  });
  
  // Открытие картинки
  $('fileInput').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const maxDim = 3000;
        if (w > maxDim || h > maxDim) {
          const k = maxDim / Math.max(w, h);
          w = Math.round(w * k);
          h = Math.round(h * k);
        }
        // Переключимся в 2D и загрузим
        if (currentMode !== '2d') {
          document.querySelector('.mode-switch button[data-mode="2d"]').click();
        }
        pushUndo2D();
        state.logicalW = w; state.logicalH = h;
        canvas.width = Math.round(w * state.dpr);
        canvas.height = Math.round(h * state.dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        state.layers.forEach(layer => {
          const nc = document.createElement('canvas');
          nc.width = Math.round(w * state.dpr);
          nc.height = Math.round(h * state.dpr);
          const nctx = nc.getContext('2d', { willReadFrequently: true });
          nctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
          layer.canvas = nc;
          layer.ctx = nctx;
        });
        state.layers[0].ctx.fillStyle = '#fff';
        state.layers[0].ctx.fillRect(0, 0, w, h);
        state.layers[0].ctx.drawImage(img, 0, 0, w, h);
        composite();
        fitToStage();
        toast('Загружено', '📁');
      };
      img.src = ev.target.result;
    };
    r.readAsDataURL(f);
    e.target.value = '';
  });
  
  // =================================================================
  // СТАРТ
  // =================================================================
  initCanvas2D();
  status.textContent = '🔥 FireLand — 2D + 3D редактор';
  toast('Добро пожаловать в FireLand!', '🔥');
}
</script>
</body>
</html>
