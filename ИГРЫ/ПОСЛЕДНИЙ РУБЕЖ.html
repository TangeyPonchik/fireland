<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Последний Рубеж: Апокалипсис v8.1</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
    background: radial-gradient(ellipse at 50% 0%, #1a2e0a 0%, #0a1a0a 40%, #1a0505 75%, #0a0303 100%);
    color: #d8e8c8;
    font-family: 'Segoe UI', system-ui, sans-serif;
    user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 8px;
    min-height: 100vh;
    background-attachment: fixed;
}
.game {
    width: 100%;
    max-width: 1000px;
    background: linear-gradient(160deg, #1a2e0a 0%, #2a1a08 50%, #1a0505 100%);
    border: 2px solid #4a5a2a;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 90vh;
    max-height: 95vh;
    box-shadow: 0 0 40px rgba(100,200,50,0.12), 0 0 60px rgba(200,50,20,0.1), inset 0 0 60px rgba(0,0,0,0.5);
}
.header {
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #4a5a2a;
    flex-wrap: wrap;
    gap: 6px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #2a3e1a, #1a2e0a);
}
.title { font-size: 16px; font-weight: 900; color: #66ff66; letter-spacing: 1px; text-shadow: 0 0 12px rgba(100,255,80,0.5); }
.stats { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.stat {
    background: rgba(100,255,80,0.08);
    border: 1px solid rgba(100,255,80,0.2);
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
}
.stat.money { color: #d4a500; border-color: rgba(212,165,0,0.3); }
.stat.gems { color: #4dd0e1; border-color: rgba(77,208,225,0.3); }
.stat.reserve { color: #ff8c1a; border-color: rgba(255,140,26,0.3); }
.tabs { display: flex; gap: 2px; padding: 6px 8px 0; overflow-x: auto; flex-shrink: 0; }
.tab {
    padding: 7px 12px;
    border: none;
    background: rgba(100,255,80,0.05);
    color: #7a8a6a;
    border-radius: 10px 10px 0 0;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.15s;
}
.tab.active { background: #2a3e1a; color: #66ff66; border-top: 2px solid #66ff66; }
.content { padding: 10px; flex: 1; overflow-y: auto; }
.page { display: none; }
.page.active { display: block; }
.campaign-progress {
    background: rgba(0,0,0,0.4);
    border-radius: 8px;
    padding: 6px 10px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
}
.progress-bar { flex: 1; height: 6px; background: #1a2e0a; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #66ff66, #ff5533); transition: width 0.4s; }
.level-list { display: flex; flex-direction: column; gap: 5px; }
.level {
    display: flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(145deg, #2a3e1a, #1a2e0a);
    border: 2px solid #4a5a2a;
    border-radius: 8px;
    padding: 8px;
    cursor: pointer;
    transition: all 0.15s;
}
.level:hover:not(.locked) { border-color: #66ff66; transform: translateX(3px); box-shadow: 0 0 12px rgba(100,255,80,0.2); }
.level.locked { opacity: 0.35; cursor: not-allowed; }
.level.done { border-color: #88aa44; }
.level.boss { border-color: #cc0000; background: linear-gradient(145deg, #3a1a08, #1a0505); }
.level.boss.done { border-color: #d4a500; }
.level.current { box-shadow: 0 0 15px rgba(255,140,26,0.4); border-color: #ff8c1a; }
.level-num {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #0a1a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    color: #66ff66;
    border: 2px solid #4a5a2a;
    flex-shrink: 0;
    font-size: 12px;
}
.level.boss .level-num { color: #ff3333; border-color: #cc0000; }
.level.done .level-num { color: #d4a500; border-color: #d4a500; }
.level-info { flex: 1; min-width: 0; }
.level-name { font-size: 13px; font-weight: 800; color: #e8f0d8; }
.level-desc { font-size: 10px; color: #7a8a6a; font-style: italic; }
.level-reward { font-size: 10px; color: #d4a500; font-weight: 700; }
.deck-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
.deck-title { font-size: 13px; font-weight: 800; color: #88dd44; }
.deck-btn {
    padding: 5px 10px;
    border: 1px solid #88dd44;
    background: rgba(136,221,68,0.1);
    color: #88dd44;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
}
.deck-btn:hover { background: rgba(136,221,68,0.2); }
.slots { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
.slot {
    width: 62px; height: 84px;
    border: 2px dashed #4a5a2a;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.4);
    cursor: pointer;
    padding: 2px;
    text-align: center;
    transition: all 0.15s;
}
.slot.filled { border-style: solid; background: #2a3e1a; }
.slot.filled:hover { border-color: #ff5533; }
.slot-icon { font-size: 20px; }
.slot-name { font-size: 7px; font-weight: 700; color: #e8f0d8; line-height: 1.1; }
.slot-lvl { font-size: 7px; color: #d4a500; }
.pool {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(66px, 1fr));
    gap: 5px;
    max-height: 320px;
    overflow-y: auto;
    padding: 5px;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
}
.pcard {
    background: linear-gradient(145deg, #2a3e1a, #1a2e0a);
    border: 2px solid #4a5a2a;
    border-radius: 7px;
    padding: 3px;
    cursor: pointer;
    text-align: center;
    position: relative;
    min-height: 78px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
}
.pcard:hover { border-color: #88dd44; transform: translateY(-2px); }
.pcard.selected { border-color: #ff8c1a; background: #3a2a08; }
.pcard.reserved { border-color: #4dd0e1; }
.pcard-icon { font-size: 18px; }
.pcard-name { font-size: 7px; font-weight: 700; color: #e8f0d8; line-height: 1.1; }
.pcard-lvl {
    position: absolute;
    top: 2px; right: 2px;
    background: #d4a500;
    color: #0a1a0a;
    font-size: 7px;
    font-weight: 900;
    padding: 1px 4px;
    border-radius: 5px;
}
.rarity {
    font-size: 6px;
    font-weight: 800;
    text-transform: uppercase;
    padding: 1px 3px;
    border-radius: 3px;
    margin-top: 2px;
}
.r-common { background: #7a8a6a; color: #fff; }
.r-rare { background: #3b82f6; color: #fff; }
.r-epic { background: #a855f7; color: #fff; }
.r-legendary { background: #ff8c1a; color: #0a1a0a; }
.r-mythic { background: #ff3333; color: #fff; }
.r-exclusive { background: #ff00ff; color: #fff; }
.r-boss { background: #8b0000; color: #fff; }
.big-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 800;
    background: linear-gradient(135deg, #66ff66, #ff3333);
    color: #0a1a0a;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: 0 4px 15px rgba(100,255,80,0.3);
    transition: all 0.15s;
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
}
.big-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(100,255,80,0.4); }
.big-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.big-btn.orange { background: linear-gradient(135deg, #ff8c1a, #ff3333); color: #fff; }
.big-btn.blue { background: linear-gradient(135deg, #3b82f6, #1e40af); color: #fff; }
.big-btn.red { background: linear-gradient(135deg, #ff3333, #8b0000); color: #fff; }
.battle-view { padding: 5px; }
.battle-controls {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin-bottom: 8px;
    flex-wrap: wrap;
}
.speed-btn {
    padding: 6px 12px;
    border: 1px solid #4a5a2a;
    background: rgba(0,0,0,0.4);
    color: #7a8a6a;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s;
}
.speed-btn:hover { border-color: #88dd44; color: #88dd44; }
.speed-btn.active {
    background: linear-gradient(135deg, #66ff66, #ff3333);
    color: #0a1a0a;
    border-color: #66ff66;
}
.skip-btn {
    padding: 6px 14px;
    border: 1px solid #d4a500;
    background: rgba(212,165,0,0.15);
    color: #d4a500;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s;
}
.skip-btn:hover {
    background: linear-gradient(135deg, #d4a500, #ff8c1a);
    color: #0a1a0a;
}
.battle-section-title {
    font-size: 11px;
    font-weight: 800;
    color: #7a8a6a;
    text-transform: uppercase;
    margin: 6px 0 4px;
    text-align: center;
    letter-spacing: 1px;
}
.battle-line { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-bottom: 6px; min-height: 10px; }
.bcard {
    width: 92px;
    background: linear-gradient(145deg, #2a3e1a, #1a2e0a);
    border: 2px solid #4a5a2a;
    border-radius: 8px;
    padding: 5px;
    text-align: center;
    transition: all 0.15s;
    position: relative;
    min-height: 130px;
}
.bcard.enemy { background: linear-gradient(145deg, #3a1a08, #1a0505); border-color: #5a2a1a; }
.bcard.dead { opacity: 0.2; filter: grayscale(100%); }
.bcard.hit { animation: shake 0.25s; }
.bcard.attack { transform: translateY(-6px) scale(1.03); }
.bcard.critical { border-color: #ff3333; box-shadow: 0 0 12px rgba(255,51,51,0.5); }
@keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
.bcard-icon { font-size: 20px; }
.bcard-name { font-size: 8px; font-weight: 800; color: #e8f0d8; }
.bcard-stats { font-size: 8px; color: #7a8a6a; display: flex; justify-content: center; gap: 3px; }
.hp-bar { height: 6px; background: #2a0808; border-radius: 3px; overflow: hidden; margin-top: 3px; }
.hp-fill { height: 100%; background: linear-gradient(90deg, #88aa44, #66ff66); transition: width 0.3s; }
.bcard.enemy .hp-fill { background: linear-gradient(90deg, #cc0000, #ff5533); }
.hp-text { font-size: 7px; font-weight: 800; color: #e8f0d8; }
.battle-status {
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    padding: 6px;
    margin: 6px 0;
    border-radius: 8px;
    background: rgba(0,0,0,0.5);
    border: 1px solid #4a5a2a;
}
.battle-status.critical { border-color: #ff3333; color: #ff5555; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.6;} }
.battle-log {
    background: rgba(0,0,0,0.5);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 10px;
    color: #7a8a6a;
    max-height: 80px;
    overflow-y: auto;
    margin-bottom: 6px;
    border: 1px solid #2a3e1a;
}
.battle-log div { padding: 1px 0; }
.float {
    position: absolute;
    font-size: 14px;
    font-weight: 900;
    pointer-events: none;
    left: 50%;
    top: 30%;
    transform: translateX(-50%);
    animation: float-up 0.8s forwards;
    text-shadow: 0 0 8px currentColor;
}
.float.dmg { color: #ff3333; }
.float.heal { color: #66ff66; }
.float.crit { color: #ffaa00; font-size: 18px; }
@keyframes float-up { 0%{opacity:1;transform:translate(-50%,0);} 100%{opacity:0;transform:translate(-50%,-30px);} }
.replace-box {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 6px;
    max-height: 50vh;
    overflow-y: auto;
    padding: 4px;
    margin: 10px 0;
}
.shop-tabs { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
.shop-tab {
    padding: 6px 12px;
    border: 1px solid #4a5a2a;
    background: rgba(0,0,0,0.4);
    color: #7a8a6a;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
}
.shop-tab.active { background: #2a3e1a; color: #88dd44; border-color: #88dd44; }
.shop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 6px;
    max-height: 450px;
    overflow-y: auto;
    padding: 4px;
}
.scard {
    background: linear-gradient(145deg, #2a3e1a, #1a2e0a);
    border: 2px solid #4a5a2a;
    border-radius: 8px;
    padding: 6px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
}
.scard:hover:not(.owned) { border-color: #88dd44; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(100,255,80,0.2); }
.scard.owned { opacity: 0.4; cursor: default; }
.scard-icon { font-size: 24px; }
.scard-name { font-size: 9px; font-weight: 800; color: #e8f0d8; }
.scard-stats { font-size: 8px; color: #7a8a6a; }
.scard-price { font-size: 11px; font-weight: 800; color: #4dd0e1; margin-top: 3px; }
.scard-price.money { color: #d4a500; }
.collection-controls { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
.sort-btn, .col-search {
    padding: 4px 8px;
    border: 1px solid #4a5a2a;
    background: rgba(0,0,0,0.4);
    color: #7a8a6a;
    border-radius: 7px;
    font-size: 10px;
    cursor: pointer;
}
.sort-btn.active { background: #2a3e1a; color: #88dd44; border-color: #88dd44; }
.col-search { flex: 1; min-width: 100px; outline: none; cursor: text; }
.col-search:focus { border-color: #88dd44; }
.collection-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 6px;
    max-height: 450px;
    overflow-y: auto;
    padding: 4px;
}
.ccard {
    background: linear-gradient(145deg, #2a3e1a, #1a2e0a);
    border: 2px solid #4a5a2a;
    border-radius: 8px;
    padding: 6px;
    text-align: center;
    position: relative;
    cursor: pointer;
    transition: all 0.15s;
}
.ccard:hover { border-color: #88dd44; }
.ccard.locked { opacity: 0.3; cursor: default; }
.ccard-icon { font-size: 22px; }
.ccard-name { font-size: 9px; font-weight: 700; color: #e8f0d8; }
.ccard-stats { font-size: 8px; color: #7a8a6a; }
.ccard-lvl {
    position: absolute;
    top: 3px; right: 3px;
    background: #d4a500;
    color: #0a1a0a;
    font-size: 8px;
    font-weight: 900;
    padding: 1px 4px;
    border-radius: 5px;
}
.up-btn {
    margin-top: 4px;
    padding: 3px 8px;
    background: #2a3e1a;
    border: 1px solid #88dd44;
    color: #88dd44;
    border-radius: 6px;
    font-size: 8px;
    font-weight: 700;
    cursor: pointer;
}
.up-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.modal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 10px;
}
.modal.show { display: flex; }
.modal-box {
    background: linear-gradient(160deg, #2a3e1a, #2a1a08);
    border: 2px solid #66ff66;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    max-width: 520px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 0 30px rgba(100,255,80,0.3);
}
.modal-box h2 { color: #66ff66; margin-bottom: 8px; font-size: 16px; }
.modal-box p { font-size: 12px; line-height: 1.5; margin: 5px 0; }
.modal-box button {
    margin: 3px;
    padding: 9px 16px;
    border: none;
    border-radius: 9px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    background: linear-gradient(135deg, #66ff66, #ff3333);
    color: #0a1a0a;
}
.toast {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20,40,10,0.97);
    color: #e8f0d8;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    z-index: 2000;
    border: 2px solid #66ff66;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
.toast.hide { opacity: 0; transition: opacity 0.3s; }
.result { text-align: center; padding: 20px 10px; }
.result-icon { font-size: 50px; }
.result-title { font-size: 22px; font-weight: 900; margin: 8px 0; }
.result-title.win { color: #66ff66; text-shadow: 0 0 15px rgba(100,255,80,0.5); }
.result-title.lose { color: #ff3333; text-shadow: 0 0 15px rgba(255,51,51,0.5); }
.result-rewards { font-size: 14px; color: #d4a500; margin: 8px 0; }
.result-buttons { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.reserve-upgrade {
    background: rgba(0,0,0,0.4);
    border-radius: 8px;
    padding: 10px;
    margin: 10px 0;
    text-align: center;
    border: 1px solid #4a5a2a;
}
.reserve-upgrade h3 { color: #ff8c1a; font-size: 14px; margin-bottom: 6px; }
.reserve-upgrade .cost { color: #d4a500; font-size: 12px; margin: 4px 0; }
.loading {
    text-align: center;
    padding: 40px 20px;
    color: #66ff66;
    font-size: 14px;
    font-weight: 700;
}
.chapter-badge {
    display: inline-block;
    background: rgba(100,255,80,0.12);
    border: 1px solid #4a5a2a;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 10px;
    color: #88dd44;
    font-weight: 800;
    margin-right: 6px;
}
@media (max-width: 600px) {
    body { padding: 3px; }
    .title { font-size: 13px; }
    .stat { font-size: 9px; padding: 2px 6px; }
    .tab { padding: 6px 8px; font-size: 10px; }
    .content { padding: 6px; }
    .bcard { width: 76px; padding: 3px; min-height: 110px; }

    .bcard-name { font-size: 7px; }
    .slot { width: 52px; height: 72px; }
    .pool { grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); }
    .shop-grid, .collection-grid { grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); }
    .game { min-height: 95vh; max-height: 98vh; }
    .speed-btn, .skip-btn { padding: 5px 9px; font-size: 11px; }
}

<body>

<div class="game">
    <div class="header">
        <div class="title">💀 ПОСЛЕДНИЙ РУБЕЖ v8.1</div>
        <div class="stats">
            <div class="stat money">💰 <span id="uiMoney">0</span></div>
            <div class="stat gems">💎 <span id="uiGems">0</span></div>
            <div class="stat reserve">🎒 <span id="uiReserve">0</span></div>
            <button class="tab" style="padding:3px 7px;border-radius:50%;" onclick="openSettings()">⚙️</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" data-page="campaign">🗺️ Кампания</button>
        <button class="tab" data-page="battle">⚔️ Битва</button>
        <button class="tab" data-page="shop">💎 Магазин</button>
        <button class="tab" data-page="collection">📖 Коллекция</button>
    </div>

    <div class="content" id="content">
        <div class="loading">⏳ Загрузка сохранения...</div>
    </div>
</div>

<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>

<script>

        id: i + 1,
        chapter: chIdx + 1,
        chapterName: ch.name,
        name: isBoss ? ch.name + ': БОСС' : ch.name + ' ' + (inCh + 1),
        desc: isBoss ? ch.desc : '',

        bossId: isBoss ? ch.boss : null,
        enemyCount: Math.min(25, 3 + Math.floor(i * 0.42)),

    if ([1,2,4,8].includes(savedSpeed)) battleSpeed = savedSpeed;
} catch(e) {}

function validateState(s) {
    if (!s || typeof s !== 'object') return freshState();
    const d = freshState();
    s.money = Math.max(0, Math.floor(Number(s.money) || 0));
    s.gems = Math.max(0, Math.floor(Number(s.gems) || 0));
    s.reserveLevel = Math.max(0, Math.min(6, Math.floor(Number(s.reserveLevel) || 0)));
    s.campaignProgress = Math.max(0, Math.min(CAMPAIGN.length, Math.floor(Number(s.campaignProgress) || 0)));
    s.totalBattles = Math.max(0, Math.floor(Number(s.totalBattles) || 0));
    s.totalWins = Math.max(0, Math.floor(Number(s.totalWins) || 0));
    s.bossWins = Math.max(0, Math.floor(Number(s.bossWins) || 0));
    s.lastDaily = Math.max(0, Number(s.lastDaily) || 0);
    s.sound = s.sound !== false;
    if (!Array.isArray(s.achievements)) s.achievements = [];
    s.achievements = s.achievements.filter(id => ACHIEVEMENTS.some(a => a.id === id));

    if (!Array.isArray(s.ownedCards)) s.ownedCards = [];
    s.ownedCards = [...new Set(s.ownedCards)].filter(id => VALID_CARD_IDS.includes(id));
    d.ownedCards.forEach(id => { if (!s.ownedCards.includes(id)) s.ownedCards.push(id); });

    if (!s.cardLevels || typeof s.cardLevels !== 'object') s.cardLevels = {};
    const cleanLevels = {};
    for (const id of s.ownedCards) {
        const lvl = Math.max(1, Math.min(10, Math.floor(Number(s.cardLevels[id]) || 1)));
        if (lvl > 1) cleanLevels[id] = lvl;
    }
    s.cardLevels = cleanLevels;

    if (!Array.isArray(s.ownedArtifacts)) s.ownedArtifacts = [];
    s.ownedArtifacts = [...new Set(s.ownedArtifacts)].filter(id => VALID_ARTIFACT_IDS.includes(id));

    if (!Array.isArray(s.deck)) s.deck = [];
    const seen = new Set();
    s.deck = s.deck.slice(0, 5).map(id => {
        if (!id || !s.ownedCards.includes(id) || seen.has(id)) return '';
        seen.add(id);
        return id;
    });
    while (s.deck.length < 5) s.deck.push('');

    if (!Array.isArray(s.reserve)) s.reserve = [];
    s.reserve = s.reserve.filter(id => s.ownedCards.includes(id));
    if (s.reserve.length > s.reserveLevel) s.reserve = s.reserve.slice(0, s.reserveLevel);

    return s;
}

function loadState() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return freshState();
        return validateState(JSON.parse(raw));
    } catch(e) { return freshState(); }
}

function save() {
    if (!gameReady) return;
    try {
        state.deck = [...deck];
        state.reserve = [...reserve];
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    } catch(e) {}
}

function resetGame() {
    if (!confirm('⚠️ СБРОСИТЬ ВЕСЬ ПРОГРЕСС?\n\nЭто удалит ВСЁ — карты, уровни, артефакты, кампанию.')) return;
    if (!confirm('⚠️ ТОЧНО СБРОСИТЬ?\n\nЭто действие НЕЛЬЗЯ отменить!')) return;
    try {
        gameReady = false;
        if (battle) { if (battle.timer) clearInterval(battle.timer); battle = null; }
        localStorage.removeItem(SAVE_KEY);
        try { sessionStorage.clear(); } catch(e) {}
        state = freshState();
        deck = [...state.deck];
        reserve = [...state.reserve];
        gameReady = true;
        save();
        closeModal();
        renderHeader();
        switchPage('campaign');
        renderAll();
        toast('🗑️ Всё сброшено!');
    } catch(e) {
        toast('❌ Ошибка сброса');
        gameReady = true;
    }
}

/* ============================================================
   6. ЗВУК
   ============================================================ */
const Sound = {
    ctx: null,
    lastPlay: 0,
    play(type) {
        if (!state.sound) return;
        const now = Date.now();
        if (now - this.lastPlay < 25) return;
        this.lastPlay = now;
        try {
            if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (this.ctx.state === 'suspended') this.ctx.resume();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain); gain.connect(this.ctx.destination);
            const t = this.ctx.currentTime;
            const map = {
                hit:        [220, 80, 0.08, 'sawtooth'],
                crit:       [440, 110, 0.12, 'square'],
                heal:       [600, 900, 0.15, 'sine'],
                win:        [523, 1046, 0.35, 'sine'],
                bossWin:    [523, 1046, 0.3, 'sine'], // Дополнительный тон добавим ниже
                lose:       [300, 100, 0.4, 'sawtooth'],
                click:      [700, 700, 0.04, 'sine'],
                coin:       [1000, 1600, 0.12, 'sine'],
                upgrade:    [400, 800, 0.25, 'sine'],
                levelup:    [600, 1200, 0.4, 'sine'],
                spawn:      [300, 600, 0.15, 'triangle'],
                death:      [180, 60, 0.3, 'sawtooth'],
                buy:        [800, 1400, 0.2, 'sine'],
                error:      [200, 100, 0.15, 'square'],
                battleStart:[400, 200, 0.3, 'triangle']
            };
            const [f1, f2, dur, wave] = map[type] || map.click;
            osc.type = wave;
            osc.frequency.setValueAtTime(f1, t);
            osc.frequency.exponentialRampToValueAtTime(f2, t + dur);
            gain.gain.setValueAtTime(0.07, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
            osc.start(t); osc.stop(t + dur);
            
            // Если это победа над боссом, добавим второй тон
            if (type === 'bossWin') {
                const osc2 = this.ctx.createOscillator();
                const gain2 = this.ctx.createGain();
                osc2.connect(gain2); gain2.connect(this.ctx.destination);
                osc2.type = 'square';
                osc2.frequency.setValueAtTime(1046, t);
                osc2.frequency.exponentialRampToValueAtTime(2093, t + 0.5);
                gain2.gain.setValueAtTime(0.05, t);
                gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
                osc2.start(t); osc2.stop(t + 0.5);
            }
        } catch(e) {}
    }
};

/* ============================================================
   7. УТИЛИТЫ
   ============================================================ */
function num(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }

function getArtifactsBonus(key) {
    let sum = 0;
    state.ownedArtifacts.forEach(aid => {
        const a = ARTIFACTS.find(x => x.id === aid);
        if (a && a.effect[key]) sum += num(a.effect[key]);
    });
    return sum;
}

function makeCard(card, side, level, isBossLevel, bossHpMul) {
    if (!card || !card.id) return null;
    const lvlBonus = Math.max(0, (num(level) - 1) * 2);
    const atkMul = 1 + getArtifactsBonus('atk');
    const defMul = 1 + getArtifactsBonus('def');
    const hpMul  = 1 + getArtifactsBonus('hp');
    const spdAdd = getArtifactsBonus('spd');

    let atkBonus, defBonus, hpBonus;
    if (side === 'A') {
        atkBonus = Math.floor(lvlBonus / 2);
        defBonus = Math.floor(lvlBonus / 2);
        hpBonus  = lvlBonus;
    } else {
        atkBonus = Math.floor(lvlBonus * 0.3);
        defBonus = Math.floor(lvlBonus * 0.3);
        hpBonus  = Math.floor(lvlBonus * 1.2);
    }

    let atk = num(card.atk) + atkBonus;
    let def = num(card.def) + defBonus;
    let hp  = num(card.hp)  + hpBonus;
    let spd = num(card.spd);

    if (side === 'A') {
        atk = Math.floor(atk * atkMul);
        def = Math.floor(def * defMul);
        hp  = Math.floor(hp  * hpMul);
        spd = spd + spdAdd;
        if (atkMul > 1 && atk <= num(card.atk) + atkBonus) atk++;
        if (defMul > 1 && def <= num(card.def) + defBonus) def++;
        if (hpMul  > 1 && hp  <= num(card.hp)  + hpBonus)  hp++;
    }
    if (isBossLevel) hp = Math.floor(hp * num(bossHpMul || 1));

    atk = Math.max(1, atk);
    def = Math.max(0, def);
    hp  = Math.max(1, hp);
    spd = Math.max(1, spd);

    return {
        uid: card.id + '_' + side + '_' + Math.random().toString(36).slice(2,10),
        id: card.id, name: card.name, icon: card.icon, r: card.r,
        atk, def, hp, maxHp: hp, spd,
        ability: card.ab || null,
        side,
        poison: 0, shield: card.ab === 'shield', rageBonus: 0,
        alive: true, replaced: false, _deathLogged: false
    };
}

/* ============================================================
   8. КОМАНДЫ
   ============================================================ */
function playerTeam() {
    return deck.filter(id => id && id !== '').map(id => {
        const c = CARDS.find(x => x.id === id);
        if (!c) return null;
        return makeCard(c, 'A', state.cardLevels[id] || 1, false, 1);
    }).filter(Boolean);
}

function playerReserve() {
    return reserve.map(id => {
        const c = CARDS.find(x => x.id === id);
        if (!c) return null;
        return makeCard(c, 'A', state.cardLevels[id] || 1, false, 1);
    }).filter(Boolean);
}

function getEnemyPool(levelIdx) {
    const base = CARDS.filter(c => c.r !== 'boss' && c.r !== 'exclusive');
    if (levelIdx < 8)  return base.filter(c => c.r === 'common');
    if (levelIdx < 16) return base.filter(c => ['common','rare'].includes(c.r));
    if (levelIdx < 26) return base.filter(c => ['common','rare','epic'].includes(c.r));
    if (levelIdx < 40) return base.filter(c => ['common','rare','epic','legendary'].includes(c.r));
    return base.filter(c => ['rare','epic','legendary'].includes(c.r));
}

function enemyTeamForLevel(levelIdx) {
    const safeIdx = Math.max(0, Math.min(Math.floor(levelIdx), CAMPAIGN.length - 1));
    const lvl = CAMPAIGN[safeIdx];
    if (!lvl) return [];
    const team = [];
    const bossHpMult = 1.0 + safeIdx / 50;
    if (lvl.isBoss) {
        const boss = CARDS.find(c => c.id === lvl.bossId);
        if (boss) {
            team.push(makeCard(boss, 'B', lvl.enemyLevel, true, bossHpMult));
            const pool = getEnemyPool(safeIdx);
            const guards = Math.min(2 + Math.floor(safeIdx / 6), 4);
            for (let i = 0; i < guards; i++) {
                const c = pool[Math.floor(Math.random() * pool.length)];
                if (c) team.push(makeCard(c, 'B', lvl.enemyLevel, false, 1));
            }
        }
    } else {
        const pool = getEnemyPool(safeIdx);
        if (!pool.length) return [];
        const count = Math.min(num(lvl.enemyCount), 25);
        for (let i = 0; i < count; i++) {
            const c = pool[Math.floor(Math.random() * pool.length)];
            team.push(makeCard(c, 'B', lvl.enemyLevel, false, 1));
        }
    }
    return team.filter(Boolean);
}

function enemyReserveForLevel(levelIdx) {
    const safeIdx = Math.max(0, Math.min(Math.floor(levelIdx), CAMPAIGN.length - 1));
    const lvl = CAMPAIGN[safeIdx];
    if (!lvl) return [];
    const count = Math.min(num(lvl.enemyReserve), 6);
    if (count === 0) return [];
    const pool = getEnemyPool(safeIdx);
    if (!pool.length) return [];
    const arr = [];
    for (let i = 0; i < count; i++) {
        const c = pool[Math.floor(Math.random() * pool.length)];
        arr.push(makeCard(c, 'B', lvl.enemyLevel, false, 1));
    }
    return arr.filter(Boolean);
}

/* ============================================================
   9. БОЙ
   ============================================================ */
function isAlive(c) { return !!(c && c.alive && c.hp > 0); }

function startBattle(enemyTeam, enemyReserve, mode, levelIdx) {
    const pTeam = playerTeam();
    const pReserve = playerReserve();
    if (!pTeam.length) { toast('❌ Нет карт в колоде!'); return; }

    const eTeam = enemyTeam.slice(0, MAX_SLOTS);
    const eRes = [...enemyTeam.slice(MAX_SLOTS), ...enemyReserve];

    const toUI = (c, side) => ({
        uid: c.uid, id: c.id, name: c.name, icon: c.icon, r: c.r,
        atk: c.atk, def: c.def, hp: c.maxHp, maxHp: c.maxHp, spd: c.spd,
        ability: c.ability, side,
        poison: 0, shield: c.ability === 'shield', rageBonus: 0,
        alive: true, replaced: false, _deathLogged: false
    });

    battle = {
        mode,
        levelIdx: Number.isFinite(levelIdx) ? levelIdx : 0,
        playerTeam: pTeam.map(c => toUI(c, 'A')),
        playerReserve: pReserve.map(c => toUI(c, 'A')),
        enemyTeam: eTeam.map(c => toUI(c, 'B')),
        enemyReserve: eRes.map(c => toUI(c, 'B')),
        turn: 0,
        paused: false,
        ended: false,
        autoMode: false,
        log: [],
        timer: null,
        speed: battleSpeed,
        pendingDeath: null
    };

    Sound.play('battleStart');
    renderBattleUI();
    battle.timer = setInterval(battleTick, 400);
    switchPage('battle');
}

function battleTick() {
    if (!battle || battle.ended || battle.paused) return;
    for (let i = 0; i < battle.speed; i++) {
        if (battle.paused || battle.ended) break;
        try { doTurn(); } catch(e) { console.error('Turn error:', e); }
    }
}

function allCards() { return [...battle.playerTeam, ...battle.enemyTeam]; }

function addLog(msg) {
    battle.log.push(msg);
    if (battle.log.length > 50) battle.log.shift();
    const logBox = document.getElementById('battleLog');
    if (logBox) {
        logBox.innerHTML = battle.log.slice(-10).map(l => `<div>${l}</div>`).join('');
        logBox.scrollTop = logBox.scrollHeight;
    }
}

function cleanupField() {
    battle.playerTeam = battle.playerTeam.filter(isAlive);
    battle.enemyTeam = battle.enemyTeam.filter(isAlive);
}

function doTurn() {
    if (battle.ended) return;
    battle.turn++;
    if (battle.turn > MAX_TURNS_SAFE) {
        endBattle(false);
        return;
    }
    
    if (!battle.autoMode) addLog(`─ Ход ${battle.turn} ─`);

    // Яд
    for (const c of allCards().filter(isAlive)) {
        if (c.poison > 0) {
            c.hp -= c.poison;
            addLog(`☠️ ${c.name}: -${c.poison} яд`);
            animateHit(null, c.uid, c.poison, false);
            if (!isAlive(c)) handleDeath(c);
        }
    }
    updateBattleUI();
    if (checkBattleEnd()) return;

    // Атаки
    const order = allCards().filter(isAlive).sort((a, b) => b.spd - a.spd);
    for (const attacker of order) {
        if (!isAlive(attacker) || battle.ended) continue;
        const enemies = (attacker.side === 'A' ? battle.enemyTeam : battle.playerTeam).filter(isAlive);
        if (!enemies.length) break;
        const target = enemies.reduce((m, e) => e.hp < m.hp ? e : m, enemies[0]);
        performAttack(attacker, target);
        if (!isAlive(target)) handleDeath(target);
        updateBattleUI();
        if (checkBattleEnd()) return;
    }

    // Регенерация
    for (const c of allCards().filter(isAlive)) {
        if (c.ability === 'regen' && c.hp < c.maxHp) {
            const heal = Math.ceil(c.maxHp * 0.08);
            c.hp = Math.min(c.maxHp, c.hp + heal);
            addLog(`💚 ${c.name}: +${heal}`);
            animateHit(null, c.uid, heal, true);
        }
    }
    updateBattleUI();

    // Если вся команда пала, но есть резерв
    if (!battle.playerTeam.some(isAlive) && battle.playerReserve.length > 0 && !battle.ended) {
        if (battle.autoMode) {
            forceReplaceFromReserve();
        } else {
            battle.paused = true;
            showForceReplaceModal();
            return;
        }
    }

    const deadPlayer = battle.playerTeam.find(c => !isAlive(c) && !c.replaced);
    if (deadPlayer && battle.playerReserve.length > 0 && !battle.autoMode) {
        deadPlayer.replaced = true;
        battle.paused = true;
        battle.pendingDeath = deadPlayer;
        showReplaceModal(deadPlayer);
        return;
    }
    if (deadPlayer && battle.playerReserve.length > 0 && battle.autoMode) {
        deadPlayer.replaced = true;
        autoReplace(deadPlayer);
    }

    cleanupField();
    updateBattleUI();
    checkBattleEnd();
}

function performAttack(attacker, target) {
    if (!isAlive(attacker) || !isAlive(target)) return;

    let dmg = attacker.atk + Math.floor(Math.random() * 3);
    if (attacker.rageBonus) dmg += attacker.rageBonus;
    if (attacker.ability === 'berserk' && isAlive(attacker) && attacker.hp < attacker.maxHp * 0.3) {
        dmg = Math.floor(dmg * 1.5);
    }
    const crit = Math.random() < getArtifactsBonus('crit');
    if (crit) dmg = Math.floor(dmg * 2);

    if (target.shield) {
        target.shield = false;
        addLog(`🛡️ ${target.name} блокирует`);
        animateHit(attacker.uid, target.uid, 0, false);
        return;
    }

    if (attacker.ability !== 'pierce') {
        dmg = Math.max(1, dmg - Math.floor(target.def / 2));
    }

    target.hp -= dmg;
    addLog(`⚔️ ${attacker.name} → ${target.name}: ${dmg}${crit ? ' КРИТ!' : ''}`);
    Sound.play(crit ? 'crit' : 'hit');
    animateHit(attacker.uid, target.uid, dmg, false, crit);

    if (attacker.ability === 'lifesteal' && isAlive(attacker) && attacker.hp < attacker.maxHp) {
        const heal = Math.ceil(dmg * 0.3);
        attacker.hp = Math.min(attacker.maxHp, attacker.hp + heal);
        addLog(`🩸 ${attacker.name}: +${heal}`);
        animateHit(null, attacker.uid, heal, true);
    }

    if (attacker.ability === 'double' && isAlive(target) && isAlive(attacker)) {
        let d2 = Math.max(1, Math.floor(attacker.atk * 0.6));
        if (attacker.rageBonus) d2 += Math.floor(attacker.rageBonus * 0.6);
        if (attacker.ability !== 'pierce') d2 = Math.max(1, d2 - Math.floor(target.def / 2));
        target.hp -= d2;
        addLog(`⚡ ${attacker.name}: +${d2}`);
        if (!isAlive(target)) handleDeath(target);
    }

    if (attacker.ability === 'splash') {
        const others = (attacker.side === 'A' ? battle.enemyTeam : battle.playerTeam)
            .filter(c => isAlive(c) && c.uid !== target.uid);
        if (others.length) {
            const splash = Math.max(1, Math.floor(dmg * 0.4));
            others.forEach(o => {
                if (!isAlive(o)) return;
                o.hp -= splash;
                if (!isAlive(o)) handleDeath(o);
            });
            addLog(`💥 Сплеш ${splash} по ${others.length}`);
        }
    }

    if (target.ability === 'reflect' && isAlive(target) && isAlive(attacker)) {
        const ref = Math.max(1, Math.floor(dmg * 0.25));
        attacker.hp -= ref;
        addLog(`🪞 ${target.name} отражает ${ref}`);
        if (!isAlive(attacker)) handleDeath(attacker);
    }

    if (attacker.ability === 'poison' && isAlive(target)) {
        target.poison = (target.poison || 0) + 2;
        addLog(`☠️ ${target.name} отравлен`);
    }

    if (attacker.ability === 'rage' && isAlive(attacker)) {
        attacker.rageBonus = (attacker.rageBonus || 0) + 1;
        addLog(`😡 ${attacker.name}: +1 ярость`);
    }

    if (!isAlive(target)) handleDeath(target);
}

function handleDeath(card) {
    if (isAlive(card)) return;
    if (card._deathLogged) return;
    card._deathLogged = true;
    addLog(`💀 ${card.name} погиб`);
    Sound.play('death');
    if (card.side === 'B' && battle.enemyReserve.length > 0) {
        const replacement = battle.enemyReserve.shift();
        replacement.alive = true;
        replacement.hp = replacement.maxHp;
        replacement.poison = 0;
        replacement.shield = replacement.ability === 'shield';
        replacement.rageBonus = 0;
        replacement._deathLogged = false;
        battle.enemyTeam.push(replacement);
        addLog(`➕ ${replacement.name} вступает`);
        Sound.play('spawn');
    }
}

function checkBattleEnd() {
    if (!battle || battle.ended) return true;
    const playerAlive = battle.playerTeam.some(isAlive);
    const enemyAlive = battle.enemyTeam.some(isAlive);
    if (!playerAlive && battle.playerReserve.length === 0) {
        endBattle(false);
        return true;
    }
    if (!enemyAlive && battle.enemyReserve.length === 0) {
        endBattle(true);
        return true;
    }
    return false;
}

function forceReplaceFromReserve() {
    if (!battle.playerReserve.length) return;
    const card = battle.playerReserve.shift();
    card.alive = true;
    card.hp = card.maxHp;
    card.poison = 0;
    card.shield = card.ability === 'shield';
    card.rageBonus = 0;
    card._deathLogged = false;
    battle.playerTeam = [card];
    addLog(`➕ ${card.name} вступает (авто)`);
    Sound.play('spawn');
    renderBattleUI();
}

function showForceReplaceModal() {
    if (!battle || !battle.playerReserve.length) {
        battle.paused = false;
        return;
    }
    let html = `<h2>💀 Вся команда пала!</h2><p>Выбери карту из резерва:</p><div class="replace-box">`;
    battle.playerReserve.forEach(c => {
        const lvl = state.cardLevels[c.id] || 1;
        html += `
            <div class="pcard" onclick="pickReplacement('${c.uid}', true)">
                <div class="pcard-lvl">${lvl}</div>
                <div class="pcard-icon">${c.icon}</div>
                <div class="pcard-name">${c.name}</div>
                <div class="rarity r-${c.r}">${c.r}</div>
            </div>
        `;
    });
    html += `</div>`;
    html += `<button onclick="surrender()" style="background:linear-gradient(135deg,#666,#333);color:#fff;">⏭️ Сдаться</button>`;
    openModal(html);
}

function showReplaceModal(deadCard) {
    if (!battle || !battle.playerReserve.length) { battle.paused = false; return; }
    let html = `<h2>💀 ${deadCard.name} пал</h2><p>Выбери замену из резерва:</p><div class="replace-box">`;
    battle.playerReserve.forEach(c => {
        const lvl = state.cardLevels[c.id] || 1;
        html += `
            <div class="pcard" onclick="pickReplacement('${c.uid}')">
                <div class="pcard-lvl">${lvl}</div>
                <div class="pcard-icon">${c.icon}</div>
                <div class="pcard-name">${c.name}</div>
                <div class="rarity r-${c.r}">${c.r}</div>
            </div>
        `;
    });
    html += `</div>`;
    html += `<button onclick="skipReplacement()" style="background:linear-gradient(135deg,#666,#333);color:#fff;">⏭️ Пропустить</button>`;
    openModal(html);
}

function pickReplacement(uid, isForce) {
    closeModal();
    if (!battle) return;
    const idx = battle.playerReserve.findIndex(c => c.uid === uid);
    if (idx === -1) return;
    const card = battle.playerReserve.splice(idx, 1)[0];
    card.alive = true;
    card.hp = card.maxHp;
    card.poison = 0;
    card.shield = card.ability === 'shield';
    card.rageBonus = 0;
    card._deathLogged = false;
    card.replaced = false;
    battle.playerTeam.push(card);
    if (isForce) {
        battle.playerTeam = [card];
    } else {
        battle.playerTeam = battle.playerTeam.filter(isAlive);
    }
    addLog(`➕ ${card.name} вступает`);
    Sound.play('spawn');
    battle.paused = false;
    battle.pendingDeath = null;
    renderBattleUI();
    checkBattleEnd();
}

function skipReplacement() {
    closeModal();
    if (!battle) return;
    battle.playerTeam = battle.playerTeam.filter(isAlive);
    battle.paused = false;
    battle.pendingDeath = null;
    addLog(`⏭️ Пропуск`);
    renderBattleUI();
    checkBattleEnd();
}

function surrender() {
    closeModal();
    if (!battle) return;
    battle.paused = false;
    endBattle(false);
}

function autoReplace(deadCard) {
    if (!battle || !battle.playerReserve.length) return;
    let best = battle.playerReserve.reduce((a, b) => {
        const pa = a.atk * 2 + a.def + a.hp / 2;
        const pb = b.atk * 2 + b.def + b.hp / 2;
        return pb > pa ? b : a;
    });
    battle.playerReserve = battle.playerReserve.filter(c => c.uid !== best.uid);
    best.alive = true;
    best.hp = best.maxHp;
    best.poison = 0;
    best.shield = best.ability === 'shield';
    best.rageBonus = 0;
    best._deathLogged = false;
    best.replaced = false;
    battle.playerTeam.push(best);
    battle.playerTeam = battle.playerTeam.filter(isAlive);
    addLog(`➕ ${best.name} (авто)`);
}

function skipBattle() {
    if (!battle || battle.ended) return;
    battle.autoMode = true;
    if (battle.paused) { battle.paused = false; closeModal(); }
    Sound.play('click');
    toast('⏭️ Автобой');
}

/* ============================================================
   10. КОНЕЦ БОЯ
   ============================================================ */
function endBattle(playerWon) {
    if (!battle || battle.ended) return;
    battle.ended = true;
    if (battle.timer) clearInterval(battle.timer);
    battle.timer = null;

    const mode = battle.mode;
    const levelIdx = battle.levelIdx;
    let money = 0, gems = 0, nextLevel = false;
    let isBossWin = false;

    if (mode === 'campaign' && Number.isFinite(levelIdx) && levelIdx < CAMPAIGN.length) {
        const lvl = CAMPAIGN[levelIdx];
        if (lvl) {
            const isFirstClear = playerWon && levelIdx === state.campaignProgress;
            if (isFirstClear) {
                money = lvl.rewardMoney;
                gems = lvl.rewardGems;
                state.campaignProgress = Math.min(state.campaignProgress + 1, CAMPAIGN.length);
                nextLevel = true;
                if (lvl.isBoss) {
                    state.bossWins++;
                    isBossWin = true;
                }
            } else if (playerWon) {
                money = Math.floor(lvl.rewardMoney * 0.45);
                gems  = Math.floor(lvl.rewardGems * 0.45);
            }
        }
    }

    money = Math.floor(money * (1 + getArtifactsBonus('gold')));
    gems  = Math.floor(gems  * (1 + getArtifactsBonus('gem')));

    if (playerWon) {
        state.money += money;
        state.gems += gems;
        state.totalWins++;
        if (isBossWin) Sound.play('bossWin');
        else Sound.play('win');
    } else {
        state.money += 10;
        money = 10; gems = 0;
        Sound.play('lose');
    }
    state.totalBattles++;

    let dropped = null;
    if (playerWon && mode === 'campaign' && levelIdx < CAMPAIGN.length) {
        const lvl = CAMPAIGN[levelIdx];
        const r = rollDropRarity(levelIdx, lvl && lvl.isBoss);
        const pool = CARDS.filter(c =>
            c.r === r &&
            !state.ownedCards.includes(c.id) &&
            c.r !== 'boss' &&
            c.r !== 'exclusive'
        );
        if (pool.length) {
            dropped = pool[Math.floor(Math.random() * pool.length)];
            state.ownedCards.push(dropped.id);
        }
    }

    checkAchievements();
    save();
    renderHeader();

    const page = document.getElementById('page-battle');
    if (page) {
        page.innerHTML = `
            <div class="result">
                <div class="result-icon">${playerWon ? '🏆' : '💀'}</div>
                <div class="result-title ${playerWon ? 'win' : 'lose'}">${playerWon ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ'}</div>
                <div class="result-rewards">${playerWon ? `+${money}💰 +${gems}💎` : `+10💰`}</div>
                ${dropped ? `<div style="color:#d4a500;margin:6px 0;">🎁 ${dropped.icon} ${dropped.name} (${dropped.r})!</div>` : ''}
                <div class="result-buttons">
                    ${playerWon && nextLevel ? `<button class="big-btn" onclick="continueCampaign()">➡️ Дальше</button>` : ''}
                    <button class="big-btn blue" onclick="switchPage('campaign')">🗺️ Кампания</button>
                    <button class="big-btn orange" onclick="renderBattle()">🔄 Ещё бой</button>
                </div>
            </div>
        `;
    }
    battle = null;
}

function continueCampaign() {
    const next = state.campaignProgress;
    if (next >= CAMPAIGN.length) {
        toast('🏆 Кампания пройдена!');
        switchPage('campaign');
        return;
    }
    startCampaign(next);
}

function rollDropRarity(levelIdx, isBoss) {
    const idx = isBoss ? Math.min(levelIdx + 5, 49) : levelIdx;
    const roll = Math.random() * 100;
    if (idx < 4)  { if (roll < 90) return 'common'; return 'rare'; }
    if (idx < 9)  { if (roll < 75) return 'common'; if (roll < 97) return 'rare'; return 'epic'; }
    if (idx < 14) { if (roll < 60) return 'common'; if (roll < 93) return 'rare'; return 'epic'; }
    if (idx < 19) { if (roll < 45) return 'common'; if (roll < 85) return 'rare'; return 'epic'; }
    if (idx < 24) { if (roll < 35) return 'common'; if (roll < 77) return 'rare'; if (roll < 97) return 'epic'; return 'legendary'; }
    if (idx < 29) { if (roll < 25) return 'common'; if (roll < 67) return 'rare'; if (roll < 95) return 'epic'; return 'legendary'; }
    if (idx < 34) { if (roll < 18) return 'common'; if (roll < 58) return 'rare'; if (roll < 93) return 'epic'; return 'legendary'; }
    if (roll < 12) return 'common';
    if (roll < 47) return 'rare';
    if (roll < 89) return 'epic';
    return 'legendary';
}

}

function renderCampaign() {
    const page = document.getElementById('page-campaign');
    if (!page) return;
    const progress = Math.round((state.campaignProgress / CAMPAIGN.length) * 100);
    let html = `
        <div class="campaign-progress">
            <span>🗺️</span>
            <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
            <span>${state.campaignProgress}/${CAMPAIGN.length}</span>
        </div>
        <div class="level-list">
    `;
    CAMPAIGN.forEach((lvl, idx) => {
        const done = idx < state.campaignProgress;
        const unlocked = idx <= state.campaignProgress;
        const current = idx === state.campaignProgress;
        const cls = ['level'];
        if (done) cls.push('done');
        if (!unlocked) cls.push('locked');
        if (lvl.isBoss) cls.push('boss');
        if (current) cls.push('current');
        const canStart = unlocked && idx <= state.campaignProgress;
        const clickAction = canStart ? `startCampaign(${idx})` : `toast('🔒 Закрыт')`;
        html += `
            <div class="${cls.join(' ')}" onclick="${clickAction}">
                <div class="level-num">${done ? '✓' : (lvl.isBoss ? '👹' : (idx + 1))}</div>
                <div class="level-info">
                    <div class="level-name"><span class="chapter-badge">Гл.${lvl.chapter}</span>${lvl.name}</div>
                    <div class="level-desc">${lvl.desc || `Врагов: ${lvl.enemyCount} | Резерв: ${lvl.enemyReserve} | Ур.: ${lvl.enemyLevel}`}</div>
                    <div class="level-reward">+${lvl.rewardMoney}💰 +${lvl.rewardGems}💎</div>
                </div>
            </div>
        `;
    });
    html += '</div>';
    page.innerHTML = html;
}

function startCampaign(idx) {
    if (!gameReady || battle) return;
    Sound.play('click');
    if (!Number.isFinite(idx) || idx < 0 || idx >= CAMPAIGN.length) {
        toast('🏆 Кампания пройдена!');
        return;
    }
    if (idx > state.campaignProgress) { toast('🔒 Уровень закрыт'); return; }
    const enemy = enemyTeamForLevel(idx);
    const eReserve = enemyReserveForLevel(idx);
    if (!enemy.length) { toast('❌ Ошибка генерации'); return; }
    startBattle(enemy, eReserve, 'campaign', idx);
}

function renderBattle() {
    const page = document.getElementById('page-battle');

    if (battle) return;

    const filled = deck.filter(x => x).length;
    let html = `
        <div class="deck-header">

            <button class="deck-btn" onclick="autoDeck()">🎲 Авто</button>
        </div>
        <div class="slots" id="deckSlots"></div>
        <div class="deck-header">
            <div class="deck-title">🎒 РЕЗЕРВ (${reserve.length}/${state.reserveLevel})</div>
            ${state.reserveLevel < 6 ? `<button class="deck-btn" onclick="openReserveUpgrade()">⬆️ Улучшить</button>` : ''}
        </div>
        <div class="slots" id="reserveSlots"></div>

        <div class="pool" id="cardPool"></div>

    const slots = document.getElementById('deckSlots');

        const s = document.createElement('div');
        s.className = 'slot' + (deck[i] ? ' filled' : '');
        if (deck[i]) {
            const c = CARDS.find(x => x.id === deck[i]);
            if (c) {
                s.innerHTML = `<div class="slot-icon">${c.icon}</div><div class="slot-name">${c.name}</div><div class="slot-lvl">Ур.${state.cardLevels[c.id] || 1}</div>`;
                s.onclick = () => { deck[i] = ''; save(); Sound.play('click'); renderBattle(); };
            }
        } else {
            s.innerHTML = `<div style="font-size:14px;color:#7a8a6a;">+</div>`;
        }
        slots.appendChild(s);
    }

    const rSlots = document.getElementById('reserveSlots');
    if (state.reserveLevel === 0) {
        rSlots.innerHTML = '<div style="color:#7a8a6a;font-size:11px;padding:10px;">Резерв не открыт. Улучши →</div>';
    } else {
        for (let i = 0; i < state.reserveLevel; i++) {
            const s = document.createElement('div');
            s.className = 'slot' + (reserve[i] ? ' filled' : '');
            if (reserve[i]) {
                const c = CARDS.find(x => x.id === reserve[i]);
                if (c) {
                    s.innerHTML = `<div class="slot-icon">${c.icon}</div><div class="slot-name">${c.name}</div><div class="slot-lvl">Ур.${state.cardLevels[c.id] || 1}</div>`;
                    s.onclick = () => { reserve.splice(i, 1); save(); Sound.play('click'); renderBattle(); };
                }
            } else {
                s.innerHTML = `<div style="font-size:14px;color:#7a8a6a;">+</div>`;
            }
            rSlots.appendChild(s);
        }
    }

    const pool = document.getElementById('cardPool');
    const owned = CARDS.filter(c => state.ownedCards.includes(c.id) && c.r !== 'boss');
    owned.forEach(c => {
        const el = document.createElement('div');
        el.className = 'pcard';
        if (deck.includes(c.id)) el.classList.add('selected');
        if (reserve.includes(c.id)) el.classList.add('reserved');
        el.innerHTML = `
            <div class="pcard-lvl">${state.cardLevels[c.id] || 1}</div>
            <div class="pcard-icon">${c.icon}</div>
            <div class="pcard-name">${c.name}</div>
            <div class="rarity r-${c.r}">${c.r}</div>
        `;
        el.onclick = () => toggleCardForDeck(c.id);
        pool.appendChild(el);
    });
}

function toggleCardForDeck(id) {
    if (deck.includes(id)) {
        deck[deck.indexOf(id)] = '';
        save(); Sound.play('click'); renderBattle();
        return;
    }
    if (reserve.includes(id)) {
        reserve.splice(reserve.indexOf(id), 1);
        save(); Sound.play('click'); renderBattle();
        return;
    }
    const c = CARDS.find(x => x.id === id);
    if (!c) return;
    const emptySlot = deck.indexOf('');
    if (emptySlot !== -1) {
        if (c.r === 'mythic' || c.r === 'exclusive') {
            const has = deck.some(d => { if (!d) return false; const x = CARDS.find(y => y.id === d); return x && (x.r === 'mythic' || x.r === 'exclusive'); });
            if (has) { toast('⚠️ Макс 1 мифическая/эксклюзив'); Sound.play('error'); return; }
        }
        if (c.r === 'legendary') {
            const has = deck.some(d => { if (!d) return false; const x = CARDS.find(y => y.id === d); return x && x.r === 'legendary'; });
            if (has) { toast('⚠️ Макс 1 легендарная'); Sound.play('error'); return; }
        }
        deck[emptySlot] = id;
    } else if (reserve.length < state.reserveLevel) {
        reserve.push(id);
    } else {
        toast('⚠️ Все слоты заняты'); Sound.play('error');
        return;
    }
    save(); Sound.play('click'); renderBattle();
}

function autoDeck() {
    const owned = CARDS.filter(c => state.ownedCards.includes(c.id) && c.r !== 'boss');
    const scored = owned.map(c => {
        const lvl = state.cardLevels[c.id] || 1;
        const basePriority = CARD_PRIORITY[c.id] || 1;
        return { card: c, priority: basePriority + (lvl - 1) * 8 };
    }).sort((a, b) => b.priority - a.priority);

    deck = ['','','','',''];
    reserve = [];
    let hasM = false, hasL = false;
    let slot = 0;
    for (const s of scored) {
        const c = s.card;
        if (slot < 5) {
            if ((c.r === 'mythic' || c.r === 'exclusive') && hasM) continue;
            if (c.r === 'legendary' && hasL) continue;
            deck[slot] = c.id;
            slot++;
            if (c.r === 'mythic' || c.r === 'exclusive') hasM = true;
            if (c.r === 'legendary') hasL = true;
        } else if (reserve.length < state.reserveLevel) {
            reserve.push(c.id);
        }
    }
    save();
    Sound.play('upgrade');
    renderBattle();
    toast('🎲 Собрано по приоритетам');
}

function battleFromMenu() {
    const filled = deck.filter(x => x).length;
    if (filled < 1) { toast('❌ Нужна хотя бы 1 карта'); return; }
    save();
    const idx = state.campaignProgress;
    if (idx >= CAMPAIGN.length) {
        toast('🏆 Кампания пройдена!');
        switchPage('campaign');
        return;
    }
    startCampaign(idx);
}

function makeBattleCard(card) {
    const div = document.createElement('div');
    div.className = 'bcard' + (card.side === 'B' ? ' enemy' : '');
    div.id = 'bc-' + card.uid;
    const ab = card.ability ? ABILITIES[card.ability] : null;
    const hpPct = Math.max(0, (card.hp / card.maxHp) * 100);
    div.innerHTML = `
        <div class="bcard-icon">${card.icon}</div>
        <div class="bcard-name">${card.name}</div>
        <div class="bcard-stats">⚔️${card.atk} 🛡️${card.def}</div>
        ${ab ? `<div style="font-size:8px;color:#ff8c1a;" title="${ab.desc}">${ab.icon}</div>` : ''}
        <div class="hp-bar"><div class="hp-fill" style="width:${hpPct}%"></div></div>
        <div class="hp-text">${Math.max(0, Math.floor(card.hp))}/${card.maxHp}</div>
    `;
    if (card.hp <= 0) div.classList.add('dead');
    return div;
}

function updateCardEl(div, card) {
    if (!div) return;
    const hpPct = Math.max(0, (card.hp / card.maxHp) * 100);
    const hpFill = div.querySelector('.hp-fill');
    const hpText = div.querySelector('.hp-text');
    if (hpFill) hpFill.style.width = hpPct + '%';
    if (hpText) hpText.textContent = `${Math.max(0, Math.floor(card.hp))}/${card.maxHp}`;
    if (card.hp <= 0) div.classList.add('dead');
    else div.classList.remove('dead');
}

function updateBattleUI() {
    if (!battle) return;
    const enemyBox = document.getElementById('battleEnemy');
    const playerBox = document.getElementById('battlePlayer');
    if (enemyBox && enemyBox.children.length !== battle.enemyTeam.length) {
        enemyBox.innerHTML = '';
        battle.enemyTeam.forEach(c => enemyBox.appendChild(makeBattleCard(c)));
    }
    if (playerBox && playerBox.children.length !== battle.playerTeam.length) {
        playerBox.innerHTML = '';
        battle.playerTeam.forEach(c => playerBox.appendChild(makeBattleCard(c)));
    }
    battle.playerTeam.forEach(c => updateCardEl(document.getElementById('bc-' + c.uid), c));
    battle.enemyTeam.forEach(c => updateCardEl(document.getElementById('bc-' + c.uid), c));
    const status = document.getElementById('battleStatus');
    if (status) {
        const aliveA = battle.playerTeam.filter(isAlive).length;
        const aliveB = battle.enemyTeam.filter(isAlive).length;
        const totalPlayerHp = battle.playerTeam.filter(isAlive).reduce((s, c) => s + c.hp, 0);
        const totalPlayerMax = battle.playerTeam.filter(isAlive).reduce((s, c) => s + c.maxHp, 0);
        const hpPct = totalPlayerMax > 0 ? (totalPlayerHp / totalPlayerMax) : 0;
        status.textContent = `Ты: ${aliveA} | Враг: ${aliveB} | Резерв: ${battle.playerReserve.length} | Ход: ${battle.turn}`;
        if (hpPct < 0.25 && aliveA > 0) {
            status.classList.add('critical');
            status.textContent = `⚠️ КРИТИЧНО | ${aliveA} живых | Резерв: ${battle.playerReserve.length}`;
        } else {
            status.classList.remove('critical');
        }
    }
}

function setBattleSpeed(speed) {
    if (![1, 2, 4, 8].includes(speed)) return;
    battleSpeed = speed;
    if (battle) battle.speed = speed;
    try { localStorage.setItem(SPEED_KEY, speed); } catch(e) {}
    Sound.play('click');
    document.querySelectorAll('.speed-btn').forEach(b => {
        const s = Number(b.textContent.replace('×','').trim());
        b.classList.toggle('active', s === battleSpeed);
    });
}

function animateHit(attackerUid, targetUid, amount, heal, crit) {
    const t = document.getElementById('bc-' + targetUid);
    if (t) {
        t.classList.add('hit');
        setTimeout(() => t.classList.remove('hit'), 250);
        if (amount > 0 || heal) {
            const f = document.createElement('div');
            f.className = 'float ' + (heal ? 'heal' : (crit ? 'crit' : 'dmg'));
            f.textContent = (heal ? '+' : '-') + amount;
            t.appendChild(f);
            setTimeout(() => f.remove(), 800);
        }
    }
    if (attackerUid) {
        const a = document.getElementById('bc-' + attackerUid);
        if (a) {
            a.classList.add('attack');
            setTimeout(() => a.classList.remove('attack'), 250);
        }
    }
}

/* ============================================================
   16. РЕЗЕРВ
   ============================================================ */
function openReserveUpgrade() {
    const next = state.reserveLevel + 1;
    if (next > 6) { toast('⚠️ Максимум'); return; }
    const cost = RESERVE_COSTS[next];
    if (!cost) { toast('⚠️ Максимум'); return; }
    const canBuy = state.gems >= cost.gems && state.money >= cost.money;
    openModal(`
        <h2>🎒 Улучшение резерва</h2>
        <p>Уровень ${state.reserveLevel} → ${next}</p>
        <div class="reserve-upgrade">
            <h3>Стоимость</h3>
            <div class="cost">💎 ${cost.gems} гемов</div>
            <div class="cost">💰 ${cost.money} монет</div>
        </div>
        <p style="font-size:11px;color:#7a8a6a;">У тебя: 💎${state.gems} 💰${state.money}</p>
        <button ${canBuy ? '' : 'disabled'} onclick="upgradeReserve(${next})">⬆️ Купить</button>
        <button onclick="closeModal()" style="background:linear-gradient(135deg,#666,#333);color:#fff;">Отмена</button>
    `);
}

function upgradeReserve(next) {
    if (next > 6) return;
    const cost = RESERVE_COSTS[next];
    if (!cost) return;
    if (state.gems < cost.gems || state.money < cost.money) { toast('❌ Не хватает'); Sound.play('error'); return; }
    state.gems -= cost.gems;
    state.money -= cost.money;
    state.reserveLevel = next;
    save();
    Sound.play('upgrade');
    closeModal();
    renderAll();
    toast(`✅ Резерв → ур. ${next}`);
}

/* ============================================================
   17. МАГАЗИН
   ============================================================ */
let shopTab = 'gems';

function renderShop() {
    const page = document.getElementById('page-shop');
    if (!page) return;
    page.innerHTML = `
        <div class="shop-tabs">
            <button class="shop-tab ${shopTab==='gems'?'active':''}" onclick="setShopTab('gems')">💎 Гемы</button>
            <button class="shop-tab ${shopTab==='money'?'active':''}" onclick="setShopTab('money')">💰 Монеты</button>
            <button class="shop-tab ${shopTab==='artifacts'?'active':''}" onclick="setShopTab('artifacts')">🏆 Артефакты</button>
        </div>
        <div class="shop-grid" id="shopGrid"></div>
    `;
    const grid = document.getElementById('shopGrid');

    if (shopTab === 'artifacts') {
        ARTIFACTS.forEach(a => {
            const owned = state.ownedArtifacts.includes(a.id);
            const el = document.createElement('div');
            el.className = 'scard' + (owned ? ' owned' : '');
            el.innerHTML = `
                <div class="scard-icon">${a.icon}</div>
                <div class="scard-name">${a.name}</div>
                <div class="scard-stats">${a.desc}</div>
                <div class="scard-price money">${owned ? '✅' : '💰 ' + a.price}</div>
            `;
            if (!owned && state.money >= a.price) {
                el.onclick = () => {
                    state.money -= a.price;
                    state.ownedArtifacts.push(a.id);
                    Sound.play('buy');
                    save(); renderAll(); toast('✅ ' + a.name);
                };
            } else if (!owned) el.style.opacity = '0.5';
            grid.appendChild(el);
        });
        return;
    }

    const cards = shopTab === 'gems'
        ? CARDS.filter(c => ['legendary','mythic','exclusive'].includes(c.r))
        : CARDS.filter(c => ['common','rare','epic'].includes(c.r));

    cards.forEach(c => {
        const owned = state.ownedCards.includes(c.id);
        const price = shopTab === 'gems' ? c.price : Math.floor(c.price * 3);
        const cur = shopTab === 'gems' ? state.gems : state.money;
        const canBuy = !owned && cur >= price;
        const ab = c.ab ? ABILITIES[c.ab] : null;
        const el = document.createElement('div');
        el.className = 'scard' + (owned ? ' owned' : '');
        el.innerHTML = `
            <div class="scard-icon">${c.icon}</div>
            <div class="scard-name">${c.name}</div>
            <div class="scard-stats">⚔️${c.atk} 🛡️${c.def} ❤️${c.hp}</div>
            ${ab ? `<div style="font-size:9px;color:#ff8c1a;" title="${ab.desc}">${ab.icon}</div>` : ''}
            <div class="scard-price ${shopTab==='money'?'money':''}">${owned ? '✅' : (shopTab==='gems'?'💎':'💰') + ' ' + price}</div>
        `;
        if (canBuy) {
            el.onclick = () => {
                if (shopTab === 'gems') state.gems -= price;
                else state.money -= price;
                state.ownedCards.push(c.id);
                Sound.play('buy');
                save(); renderAll(); toast('✅ ' + c.name);
            };
        } else if (!owned) el.style.opacity = '0.5';
        grid.appendChild(el);
    });
}

function setShopTab(t) { shopTab = t; renderShop(); }

/* ============================================================
   18. КОЛЛЕКЦИЯ
   ============================================================ */
let sortMode = 'rarity';
let searchQuery = '';
let filterRarity = 'all';

function renderCollection() {
    const page = document.getElementById('page-collection');
    if (!page) return;
    
    // Сохраняем состояние инпута
    const oldSearch = document.getElementById('colSearchInput');
    if (oldSearch) searchQuery = oldSearch.value;

    page.innerHTML = `
        <div class="collection-controls">
            <input type="text" id="colSearchInput" class="col-search" placeholder="🔍 Поиск по имени..." value="${searchQuery}" oninput="updateSearch(this.value)">
            <select class="sort-btn" style="flex:1;" onchange="filterRarity=this.value; renderCollection()">
                <option value="all" ${filterRarity==='all'?'selected':''}>Все редкости</option>
                <option value="common" ${filterRarity==='common'?'selected':''}>Common</option>
                <option value="rare" ${filterRarity==='rare'?'selected':''}>Rare</option>
                <option value="epic" ${filterRarity==='epic'?'selected':''}>Epic</option>
                <option value="legendary" ${filterRarity==='legendary'?'selected':''}>Legendary</option>
                <option value="mythic" ${filterRarity==='mythic'?'selected':''}>Mythic</option>
            </select>
            <button class="sort-btn ${sortMode==='rarity'?'active':''}" onclick="setSort('rarity')">Редкость</button>
            <button class="sort-btn ${sortMode==='level'?'active':''}" onclick="setSort('level')">Уровень</button>
            <button class="sort-btn ${sortMode==='name'?'active':''}" onclick="setSort('name')">Имя</button>
        </div>
        <div class="collection-grid" id="colGrid"></div>
    `;
    
    const rank = { common:0, rare:1, epic:2, legendary:3, mythic:4, exclusive:5, boss:6 };
    let cards = CARDS.filter(c => c.r !== 'boss');
    
    // Фильтр по редкости
    if (filterRarity !== 'all') cards = cards.filter(c => c.r === filterRarity);
    // Фильтр по поиску
    if (searchQuery.trim()) {
        const q = searchQuery.trim().toLowerCase();
        cards = cards.filter(c => c.name.toLowerCase().includes(q));
    }

    if (sortMode === 'rarity') cards.sort((a,b) => rank[a.r] - rank[b.r]);
    else if (sortMode === 'level') cards.sort((a,b) => (state.cardLevels[b.id]||1) - (state.cardLevels[a.id]||1));
    else cards.sort((a,b) => a.name.localeCompare(b.name));

    const grid = document.getElementById('colGrid');
    cards.forEach(c => {
        const owned = state.ownedCards.includes(c.id);
        const lvl = state.cardLevels[c.id] || 1;
        const lvlBonus = (lvl - 1) * 2;
        const realAtk = c.atk + Math.floor(lvlBonus / 2);
        const realDef = c.def + Math.floor(lvlBonus / 2);
        const realHp = c.hp + lvlBonus;
        const cost = UPGRADE_COSTS[lvl + 1];
        const canUp = owned && lvl < 10 && state.money >= cost;
        const ab = c.ab ? ABILITIES[c.ab] : null;
        const el = document.createElement('div');
        el.className = 'ccard' + (owned ? '' : ' locked');
        el.innerHTML = `
            ${owned ? `<div class="ccard-lvl">${lvl}</div>` : ''}
            <div class="ccard-icon">${c.icon}</div>
            <div class="ccard-name">${c.name}</div>
            <div class="ccard-stats">⚔️${realAtk} 🛡️${realDef} ❤️${realHp}</div>
            ${ab ? `<div style="font-size:9px;color:#ff8c1a;" title="${ab.desc}">${ab.icon}</div>` : ''}
            <div style="font-size:8px;color:#7a8a6a;">${owned ? '✅' : '🔒'} ${c.r}</div>
            ${owned && lvl < 10 ? `<button class="up-btn" ${canUp?'':'disabled'} onclick="event.stopPropagation();upgradeCard('${c.id}')">⬆️ ${cost}💰</button>` : ''}
            ${owned && lvl >= 10 ? '<div style="font-size:8px;color:#d4a500;">⭐ МАКС</div>' : ''}
        `;
        if (owned) el.onclick = () => openLore(c);
        grid.appendChild(el);
    });
}

function updateSearch(val) {
    searchQuery = val;
    renderCollection();
    // Возвращаем фокус в инпут после перерисовки
    const inp = document.getElementById('colSearchInput');
    if (inp) {
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
    }
}

function setSort(m) { sortMode = m; renderCollection(); }

function upgradeCard(id) {
    const lvl = state.cardLevels[id] || 1;
    if (lvl >= 10) { toast('⚠️ Максимум'); return; }
    const cost = UPGRADE_COSTS[lvl + 1];
    if (state.money < cost) { toast(`❌ Нужно ${cost}💰`); Sound.play('error'); return; }
    state.money -= cost;
    state.cardLevels[id] = lvl + 1;
    Sound.play('levelup');
    save(); renderAll();
    toast(`✅ ${CARDS.find(c=>c.id===id).name} → ур. ${lvl + 1}`);
}

/* ============================================================
   19. МОДАЛКИ / ЛОР
   ============================================================ */
function openLore(c) {
    const lvl = state.cardLevels[c.id] || 1;
    const ab = c.ab ? ABILITIES[c.ab] : null;
    const lvlBonus = (lvl - 1) * 2;
    const baseP = CARD_PRIORITY[c.id] || 0;
    const effP = baseP + (lvl - 1) * 8;
    openModal(`
        <h2>${c.icon} ${c.name}</h2>
        <div style="margin:6px 0;">
            <span class="rarity r-${c.r}" style="font-size:10px;padding:2px 8px;border-radius:6px;">${c.r}</span>
            <span style="background:#d4a500;color:#0a1a0a;font-size:10px;font-weight:900;padding:2px 8px;border-radius:6px;margin-left:6px;">Ур. ${lvl}</span>
            <span style="background:#3b82f6;color:#fff;font-size:10px;font-weight:900;padding:2px 8px;border-radius:6px;margin-left:6px;">Приоритет: ${baseP} → ${effP}</span>
        </div>
        ${ab ? `<p>${ab.icon} <strong>${ab.name}</strong> — ${ab.desc}</p>` : ''}
        <div style="display:flex;justify-content:center;gap:6px;margin:10px 0;flex-wrap:wrap;">
            <div style="background:rgba(0,0,0,0.4);padding:4px 8px;border-radius:6px;font-size:11px;">⚔️ ${c.atk + Math.floor(lvlBonus/2)}</div>
            <div style="background:rgba(0,0,0,0.4);padding:4px 8px;border-radius:6px;font-size:11px;">🛡️ ${c.def + Math.floor(lvlBonus/2)}</div>
            <div style="background:rgba(0,0,0,0.4);padding:4px 8px;border-radius:6px;font-size:11px;">❤️ ${c.hp + lvlBonus}</div>
            <div style="background:rgba(0,0,0,0.4);padding:4px 8px;border-radius:6px;font-size:11px;">⚡ ${c.spd}</div>
        </div>
        <button onclick="closeModal()">✅ Закрыть</button>
    `);
}

function openModal(html) {
    document.getElementById('modalBox').innerHTML = html;
    document.getElementById('modal').classList.add('show');
}
function closeModal() {
    document.getElementById('modal').classList.remove('show');
}

let toastTimer = null;
function toast(msg) {
    const old = document.querySelector('.toast');
    if (old) old.remove();
    if (toastTimer) clearTimeout(toastTimer);
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    toastTimer = setTimeout(() => {
        t.classList.add('hide');
        setTimeout(() => t.remove(), 300);
    }, 2000);
}

function openSettings() {
    const winrate = state.totalBattles > 0 ? Math.round((state.totalWins / state.totalBattles) * 100) : 0;
    openModal(`
        <h2>⚙️ Настройки</h2>
        <div style="text-align:left;font-size:12px;background:rgba(0,0,0,0.4);border-radius:8px;padding:10px;margin:8px 0;">
            <div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Боёв:</span><span style="color:#88dd44;">${state.totalBattles}</span></div>
            <div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Побед:</span><span style="color:#88dd44;">${state.totalWins}</span></div>
            <div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Боссов:</span><span style="color:#88dd44;">${state.bossWins}</span></div>
            <div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Winrate:</span><span style="color:#88dd44;">${winrate}%</span></div>
            <div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Кампания:</span><span style="color:#88dd44;">${state.campaignProgress}/${CAMPAIGN.length}</span></div>
            <div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Карт:</span><span style="color:#88dd44;">${state.ownedCards.length}/${CARDS.length}</span></div>
            <div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Артефактов:</span><span style="color:#88dd44;">${state.ownedArtifacts.length}/${ARTIFACTS.length}</span></div>
            <div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Достижений:</span><span style="color:#88dd44;">${state.achievements.length}/${ACHIEVEMENTS.length}</span></div>
            <div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Скорость:</span><span style="color:#88dd44;">×${battleSpeed}</span></div>
        </div>
        <button onclick="openAchievements()">🏆 Достижения</button>
        <button onclick="toggleSound()">${state.sound ? '🔊 Звук ВКЛ' : '🔇 Звук ВЫКЛ'}</button>
        <button onclick="exportSave()" style="background:linear-gradient(135deg,#3b82f6,#1e40af);color:#fff;">📤 Экспорт</button>
        <button onclick="importSave()" style="background:linear-gradient(135deg,#3b82f6,#1e40af);color:#fff;">📥 Импорт</button>
        <button onclick="resetGame()" style="background:linear-gradient(135deg,#cc3333,#8b0000);color:#fff;">🗑️ Сброс</button>
        <button onclick="closeModal()">✅ Закрыть</button>
    `);
}

function openAchievements() {
    let html = '<h2>🏆 Достижения</h2><div style="text-align:left;max-height:50vh;overflow-y:auto;">';
    ACHIEVEMENTS.forEach(a => {
        const done = state.achievements.includes(a.id);
        html += `
            <div style="background:rgba(0,0,0,0.4);border:1px solid ${done ? '#d4a500' : '#4a5a2a'};border-radius:8px;padding:8px;margin:4px 0;">
                <div style="font-weight:800;color:${done ? '#d4a500' : '#7a8a6a'};">${a.name} ${done ? '✅' : ''}</div>
                <div style="font-size:11px;color:#7a8a6a;">${a.desc}</div>
                <div style="font-size:10px;color:#88dd44;">Награда: ${a.reward.money ? a.reward.money + '💰 ' : ''}${a.reward.gems ? a.reward.gems + '💎' : ''}</div>
            </div>
        `;
    });
    html += '</div><button onclick="openSettings()">← Назад</button><button onclick="closeModal()">✅ Закрыть</button>';
    openModal(html);
}

function toggleSound() {
    state.sound = !state.sound;
    save();
    toast(state.sound ? '🔊 Вкл' : '🔇 Выкл');
    openSettings();
}

function exportSave() {
    try {
        const data = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
        if (navigator.clipboard) {
            navigator.clipboard.writeText(data).then(
                () => toast('📤 Скопировано'),
                () => prompt('Скопируй код:', data)
            );
        } else {
            prompt('Скопируй код:', data);
        }
    } catch(e) { toast('❌ Ошибка'); }
}

function importSave() {
    const data = prompt('Вставь код:');
    if (!data) return;
    try {
        const parsed = JSON.parse(decodeURIComponent(escape(atob(data))));
        state = validateState(parsed);
        deck = [...state.deck];
        reserve = [...state.reserve];
        save(); renderAll(); toast('✅ Импортировано');
        closeModal();
    } catch(e) { toast('❌ Неверный код'); }
}

function checkDaily() {
    const now = Date.now();
    const day = 24 * 60 * 60 * 1000;
    if (now - (state.lastDaily || 0) > day) {
        state.gems += 25;
        state.money += 100;
        state.lastDaily = now;
        save();
        setTimeout(() => toast('🎁 Ежедневно: +25💎 +100💰'), 800);
    }
}

/* ============================================================
   20. ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
        const p = t.dataset.page;
        if (p && gameReady) { Sound.play('click'); switchPage(p); }
    });
});

document.getElementById('modal').addEventListener('click', e => {
    if (e.target.id === 'modal') {
        if (battle && battle.paused) return;
        closeModal();
    }
});

document.addEventListener('keydown', e => {
    if (e.target.closest('input') || e.target.closest('textarea')) return;
    if (e.key === 'Escape') {
        if (battle && battle.paused) return;
        closeModal();
    }
    if (battle && !battle.paused && !battle.ended) {
        if (e.key === '1') { setBattleSpeed(1); return; }
        if (e.key === '2') { setBattleSpeed(2); return; }
        if (e.key === '4') { setBattleSpeed(4); return; }
        if (e.key === '8') { setBattleSpeed(8); return; }
        if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); skipBattle(); return; }
    }
});

window.addEventListener('beforeunload', () => { save(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
setInterval(() => { if (gameReady) save(); }, 10000);

function init() {
    state = loadState();
    state = validateState(state);
    deck = [...state.deck];
    reserve = [...state.reserve];
    gameReady = true;

    const content = document.getElementById('content');
    content.innerHTML = `
        <div id="page-campaign" class="page active"></div>
        <div id="page-battle" class="page"></div>
        <div id="page-shop" class="page"></div>
        <div id="page-collection" class="page"></div>
    `;

    checkDaily();
    renderAll();
    switchPage('campaign');

    console.log('💀 ПОСЛЕДНИЙ РУБЕЖ v8.1');
    console.log('📊 Карт:', CARDS.length, '| Уровней:', CAMPAIGN.length, '| Артефактов:', ARTIFACTS.length);
    console.log('🏆 Достижений:', ACHIEVEMENTS.length);
    console.log('⚡ Скорость: ×' + battleSpeed);
}

init();
</script>
</body>
