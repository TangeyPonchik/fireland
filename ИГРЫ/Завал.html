<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Завал — сортировка обломков</title>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:#080b0f; color:#e6edf3;
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    overflow:hidden; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    height:100%; display:flex; flex-direction:column;
    max-width:1180px; margin:0 auto; padding:10px 12px 12px; gap:10px;
  }
  /* ---------- HUD ---------- */
  .hud{display:flex; gap:10px; align-items:stretch; flex-wrap:wrap;}
  .stat{
    background:linear-gradient(180deg,#1a222c,#131a22);
    border:1px solid #263140; border-radius:12px;
    padding:6px 14px; display:flex; flex-direction:column;
    justify-content:center; min-width:96px;
  }
  .stat.wide{flex:1; min-width:190px;}
  .lbl{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#7d8b9c;}
  .lbl b{color:#c7d6e6;}
  .val{font-size:20px; font-weight:700; color:#e6edf3; line-height:1.15;}
  .bar{margin-top:5px; height:8px; border-radius:5px; background:#0c1116; overflow:hidden; border:1px solid #222c38;}
  .bar i{display:block; height:100%; width:0; border-radius:4px;
    background:linear-gradient(90deg,#2ea043,#7ee787); transition:width .18s ease;}
  .bar.danger i{background:linear-gradient(90deg,#d29922,#f85149);}
  /* ---------- Сцена ---------- */
  .stage{
    position:relative; flex:1; min-height:0; border-radius:16px; overflow:hidden;
    background:#0b0f14; border:1px solid #1e2733;
    box-shadow:0 20px 50px rgba(0,0,0,.65);
  }
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}
  /* ---------- Оверлей ---------- */
  .overlay{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(6,9,13,.78); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    z-index:5; padding:20px;
  }
  .overlay.show{display:flex;}
  .card{
    width:min(470px,100%);
    background:linear-gradient(180deg,#18212b,#111821);
    border:1px solid #2a3646; border-radius:20px; padding:28px 26px;
    text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.75);
    animation:pop .28s ease;
  }
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .card h1{margin:0 0 10px; font-size:30px; letter-spacing:.05em;}
  .card p{margin:0 0 18px; color:#9fb0c3; font-size:15px; line-height:1.55;}
  .card p.small{font-size:13px; margin-bottom:14px;}
  .legend{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:20px;}
  .legend span{
    font-size:12px; padding:4px 11px; border-radius:20px;
    background:#0e151c; border:1px solid #253141; color:#a9b8c9;
  }
  .card-btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .btn{
    font:inherit; font-weight:700; font-size:15px; letter-spacing:.04em;
    padding:12px 26px; border-radius:12px; cursor:pointer;
    border:1px solid #33445a; background:#1d2733; color:#cfdcea; transition:.15s;
  }
  .btn:hover{background:#26333f; border-color:#465c78;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{
    background:linear-gradient(180deg,#f0a422,#d9821a);
    border-color:#ffc45c; color:#2a1a02;
    box-shadow:0 6px 18px rgba(240,164,34,.35);
  }
  .btn.primary:hover{background:linear-gradient(180deg,#ffb733,#e8921f);}
  @media (max-width:560px){
    .stat{min-width:74px; padding:5px 10px;}
    .val{font-size:16px;}
    .card h1{font-size:24px;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="stat"><span class="lbl">Уровень</span><span class="val" id="hudLevel">1</span></div>
    <div class="stat"><span class="lbl">Очки</span><span class="val" id="hudScore">0</span></div>
    <div class="stat wide">
      <span class="lbl">Разобрано <b id="hudSorted">0</b> / <b id="hudTarget">0</b></span>
      <div class="bar"><i id="barProg"></i></div>
    </div>
    <div class="stat wide">
      <span class="lbl">Завал</span>
      <div class="bar danger"><i id="barZav"></i></div>
    </div>
  </header>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   КОНСТАНТЫ И ЛОГИЧЕСКИЙ РАЗМЕР СЦЕНЫ
   ============================================================ */
const W = 960, H = 470;
const RAIL_TOP   = 140;   // верх рельса
const BLOCK      = 50;    // размер блока на ленте
const WAGON_TOP  = 235;
const WAGON_H    = 145;
const DUMP_TIME  = 0.45;
const CAPACITY   = 6;
const GRAVITY    = 2200;

/* ============================================================
   SVG-ТЕКСТУРЫ
   ============================================================ */
function svgURI(s){ return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); }

const SVG = {
  stone: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2cbd4"/><stop offset="1" stop-color="#79828c"/></linearGradient></defs>
    <path d="M14 52 L5 30 L18 11 L43 7 L59 24 L52 49 L30 57 Z" fill="url(#a)" stroke="#565e67" stroke-width="3" stroke-linejoin="round"/>
    <path d="M18 11 L43 7 L39 27 L20 31 Z" fill="#ffffff" opacity="0.22"/>
    <path d="M14 52 L20 31 L39 27 L52 49 L30 57 Z" fill="#000000" opacity="0.14"/>
  </svg>`,

  brick: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <rect x="6" y="17" width="52" height="30" rx="3" fill="#c25a34" stroke="#7d3520" stroke-width="3"/>
    <path d="M8 27 H56 M8 37 H56" stroke="#7d3520" stroke-width="3"/>
    <path d="M22 17 V27 M38 17 V27 M15 27 V37 M30 27 V37 M46 27 V37 M22 37 V47 M38 37 V47" stroke="#7d3520" stroke-width="3"/>
    <rect x="9" y="19" width="46" height="5" rx="2" fill="#e08a63" opacity="0.4"/>
  </svg>`,

  metal: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2edf7"/><stop offset=".5" stop-color="#9fb3c8"/>
      <stop offset="1" stop-color="#66798f"/></linearGradient></defs>
    <rect x="6" y="14" width="52" height="36" rx="4" fill="url(#a)" stroke="#4e637a" stroke-width="3"/>
    <circle cx="14" cy="22" r="2.6" fill="#4e637a"/><circle cx="50" cy="22" r="2.6" fill="#4e637a"/>
    <circle cx="14" cy="42" r="2.6" fill="#4e637a"/><circle cx="50" cy="42" r="2.6" fill="#4e637a"/>
    <path d="M14 32 H50" stroke="#ffffff" stroke-width="2" opacity=".45"/>
  </svg>`,

  coal: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <path d="M10 45 L4 28 L16 13 L35 9 L53 18 L59 35 L48 51 L26 55 Z" fill="#2f343a" stroke="#14171a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M16 13 L35 9 L31 26 L18 29 Z" fill="#505861" opacity=".85"/>
    <path d="M37 30 L53 26 L48 43 L35 45 Z" fill="#414850" opacity=".85"/>
    <path d="M10 45 L18 29 L31 26 L26 55 Z" fill="#1b1f23" opacity=".7"/>
  </svg>`,

  wood: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfae6c"/><stop offset="1" stop-color="#a9773c"/></linearGradient></defs>
    <rect x="5" y="16" width="54" height="32" rx="4" fill="url(#a)" stroke="#7a5326" stroke-width="3"/>
    <path d="M6 26 H58 M6 38 H58" stroke="#7a5326" stroke-width="2" opacity=".65"/>
    <path d="M14 21 q7 3 0 6 M36 21 q7 3 0 6 M50 33 q7 3 0 6 M20 33 q7 3 0 6"
          stroke="#8a5f2c" stroke-width="2" fill="none" opacity=".55" stroke-linecap="round"/>
  </svg>`
};

const IMG = {};
for (const k in SVG){
  const im = new Image();
  im.src = svgURI(SVG[k]);
  IMG[k] = im;
}

/* ============================================================
   ТИПЫ ОБЛОМКОВ
   ============================================================ */
const TYPES = [
  { id:'stone', name:'Камень', color:'#98a2ad' },
  { id:'brick', name:'Кирпич', color:'#c25a34' },
  { id:'metal', name:'Металл', color:'#9fb3c8' },
  { id:'coal',  name:'Уголь',  color:'#4a5058' },
  { id:'wood',  name:'Доски',  color:'#b98a4b' }
];
const TYPE_MAP = {};
TYPES.forEach(t => TYPE_MAP[t.id] = t);

/* ============================================================
   СОСТОЯНИЕ ИГРЫ
   ============================================================ */
const game = {
  state: 'menu',        // menu | playing | levelcomplete | gameover
  level: 1,
  score: 0,
  sorted: 0,
  target: 1,
  zaval: 0,
  combo: 0,
  time: 0,
  speed: 120,
  spawnInterval: 1.2,
  spawnTimer: 0,
  flash: 0,
  types: [],
  wagons: [],
  blocks: [],
  particles: [],
  floats: []
};

/* ============================================================
   CANVAS / VIEWPORT
   ============================================================ */
const canvas  = document.getElementById('cv');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');

const view = { dpr:1, cw:W, ch:H, scale:1, ox:0, oy:0 };

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  const cw = Math.max(1, rect.width), ch = Math.max(1, rect.height);
  canvas.width  = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  const s = Math.min(cw / W, ch / H);
  view.dpr = dpr; view.cw = cw; view.ch = ch;
  view.scale = s;
  view.ox = (cw - W * s) / 2;
  view.oy = (ch - H * s) / 2;
}
window.addEventListener('resize', resize);

/* ============================================================
   ГЕНЕРАТОР УРОВНЕЙ
   ============================================================ */
function generateLevel(n){
  const all = TYPES.map(t => t.id);
  const typeCount = Math.min(2 + Math.floor((n - 1) / 2), 5);
  const shuffled = all.slice().sort(() => Math.random() - 0.5);
  const types = shuffled.slice(0, typeCount);

  const speed        = Math.min(110 + (n - 1) * 18, 285);
  const spawnInterval= Math.max(1.20 - (n - 1) * 0.08, 0.40);
  const target       = 14 + (n - 1) * 3;

  return { types, speed, spawnInterval, target };
}

/* ============================================================
   РАСКЛАДКА ВАГОНЕТОК
   ============================================================ */
function layoutWagons(wagons){
  const n = wagons.length;
  if (!n) return;
  const margin = 70;
  const avail  = W - margin * 2;
  const slot   = avail / n;
  wagons.forEach((w, i) => {
    w.x = margin + slot * (i + 0.5);
    w.w = Math.min(158, slot - 22);
    w.y = WAGON_TOP;
    w.h = WAGON_H;
  });
}

/* ============================================================
   ЗАПУСК УРОВНЯ
   ============================================================ */
function startLevel(n){
  const cfg = generateLevel(n);
  game.level         = n;
  game.types         = cfg.types;
  game.speed         = cfg.speed;
  game.spawnInterval = cfg.spawnInterval;
  game.target        = cfg.target;
  game.sorted        = 0;
  game.zaval         = 0;
  game.combo         = 0;
  game.spawnTimer    = 0.7;
  game.time          = 0;
  game.flash         = 0;
  game.blocks        = [];
  game.particles     = [];
  game.floats        = [];

  game.wagons = cfg.types.map(id => ({
    typeId: id,
    color: TYPE_MAP[id].color,
    count: 0,
    capacity: CAPACITY,
    state: 'idle',
    dumpT: 0
  }));
  layoutWagons(game.wagons);

  game.state = 'playing';
  hideOverlay();
  updateHUD();
}

/* ============================================================
   HUD
   ============================================================ */
const elLevel  = document.getElementById('hudLevel');
const elScore  = document.getElementById('hudScore');
const elSorted = document.getElementById('hudSorted');
const elTarget = document.getElementById('hudTarget');
const barProg  = document.getElementById('barProg');
const barZav   = document.getElementById('barZav');

function updateHUD(){
  elLevel.textContent  = game.level;
  elScore.textContent  = game.score;
  elSorted.textContent = game.sorted;
  elTarget.textContent = game.target;
  barProg.style.width = Math.min(100, (game.sorted / Math.max(1, game.target)) * 100) + '%';
  barZav.style.width  = Math.min(100, game.zaval) + '%';
}

/* ============================================================
   ОВЕРЛЕЙ
   ============================================================ */
function showOverlay(opts){
  const btns = opts.buttons.map(b =>
    `<button class="btn ${b.primary ? 'primary' : ''}" data-action="${b.action}">${b.label}</button>`
  ).join('');
  overlay.innerHTML = `
    <div class="card">
      <h1 style="color:${opts.accent || '#e6edf3'}">${opts.title}</h1>
      <p>${opts.text}</p>
      ${opts.legend ? `<div class="legend">${opts.legend}</div>` : ''}
      <div class="card-btns">${btns}</div>
    </div>`;
  overlay.classList.add('show');
}
function hideOverlay(){ overlay.classList.remove('show'); }

overlay.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const a = btn.dataset.action;
  if (a === 'start'){ game.score = 0; startLevel(1); }
  else if (a === 'next'){ startLevel(game.level + 1); }
  else if (a === 'retry'){ startLevel(game.level); }
});

function showMenu(){
  game.state = 'menu';
  game.wagons = [];
  game.blocks = [];
  game.particles = [];
  game.floats = [];
  showOverlay({
    title: 'ЗАВАЛ',
    accent: '#ffc45c',
    text: 'Авария на стройке! По рельсам едут вагонетки с обломками.<br>' +
          'Обломки сами падают в подходящий контейнер — но он быстро заполняется.<br>' +
          '<b>Клик по вагонетке</b> — разгрузить её и получить очки.',
    legend: TYPES.map(t => `<span>${t.name}</span>`).join(''),
    buttons: [{ label: 'НАЧАТЬ СМЕНУ', action: 'start', primary: true }]
  });
}

function levelComplete(){
  game.state = 'levelcomplete';
  const bonus = 200 + game.level * 60;
  game.score += bonus;
  updateHUD();
  showOverlay({
    title: 'УРОВЕНЬ ПРОЙДЕН',
    accent: '#7ee787',
    text: `Разобрано обломков: <b>${game.sorted}</b><br>Бонус за смену: <b>+${bonus}</b><br>Всего очков: <b>${game.score}</b>`,
    buttons: [{ label: 'СЛЕДУЮЩИЙ УРОВЕНЬ', action: 'next', primary: true }]
  });
}

function gameOver(){
  game.state = 'gameover';
  showOverlay({
    title: 'ЗАВАЛ!',
    accent: '#f85149',
    text: `Путь завален обломками.<br>Уровень: <b>${game.level}</b> · Очки: <b>${game.score}</b>`,
    buttons: [{ label: 'ПОПРОБОВАТЬ СНОВА', action: 'retry', primary: true }]
  });
}

/* ============================================================
   ИГРОВАЯ ЛОГИКА
   ============================================================ */
function wagonFor(typeId){
  for (const w of game.wagons) if (w.typeId === typeId) return w;
  return null;
}

function pickType(){
  const types = game.types;
  // «милосердие»: чаще выбираем тип, чья вагонетка ещё не забита
  for (let i = 0; i < 8; i++){
    const t = types[(Math.random() * types.length) | 0];
    const w = wagonFor(t);
    if (w && w.count < w.capacity) return t;
  }
  return types[(Math.random() * types.length) | 0];
}

function spawnBlock(){
  const typeId = pickType();
  game.blocks.push({
    typeId,
    x: -BLOCK,
    y: RAIL_TOP - BLOCK / 2,
    vy: 0,
    rot: 0,
    wob: Math.random() * Math.PI * 2,
    state: 'belt',
    tx: 0
  });
}

function addFloat(x, y, text, color){
  game.floats.push({ x, y, text, color, life: 1.0, max: 1.0 });
}

function puff(x, y, typeId){
  for (let i = 0; i < 5; i++){
    game.particles.push({
      typeId,
      x: x + (Math.random() - 0.5) * 26,
      y: y + (Math.random() - 0.5) * 16,
      vx: (Math.random() - 0.5) * 140,
      vy: -90 - Math.random() * 130,
      rot: Math.random() * 6.28,
      vr: (Math.random() - 0.5) * 10,
      life: 0.35 + Math.random() * 0.2,
      size: 16
    });
  }
}

function onMiss(b){
  game.zaval += 17;
  game.combo = 0;
  game.flash = 0.35;
  addFloat(W - 70, b.y, '✗', '#f85149');
  if (game.zaval >= 100){
    game.zaval = 100;
    updateHUD();
    gameOver();
  }
  updateHUD();
}

/* ---------- Разгрузка вагонетки ---------- */
function dumpWagon(w){
  if (game.state !== 'playing') return;
  if (!w || w.state !== 'idle' || w.count === 0) return;

  const n = w.count;
  const perfect = n >= w.capacity;

  w.count = 0;
  w.state = 'dumping';
  w.dumpT = DUMP_TIME;

  game.combo++;
  const mult = 1 + Math.min(game.combo, 12) * 0.15;
  let pts = Math.round(n * 10 * mult);
  if (perfect) pts *= 2;

  game.score += pts;
  game.zaval = Math.max(0, game.zaval - 2);

  addFloat(w.x, w.y - 26, '+' + pts, perfect ? '#ffc45c' : '#7ee787');
  if (perfect) addFloat(w.x, w.y - 58, 'ЧИСТО!', '#ffc45c');

  for (let i = 0; i < n; i++){
    game.particles.push({
      typeId: w.typeId,
      x: w.x + (Math.random() - 0.5) * 76,
      y: w.y + 60 + Math.random() * 50,
      vx: (Math.random() - 0.5) * 340,
      vy: -300 - Math.random() * 270,
      rot: Math.random() * 6.28,
      vr: (Math.random() - 0.5) * 12,
      life: 0.9 + Math.random() * 0.4,
      size: 26
    });
  }
  updateHUD();
}

/* ---------- Обновление ---------- */
function update(dt){
  const g = game;
  g.time += dt;
  if (g.flash > 0) g.flash = Math.max(0, g.flash - dt * 1.6);

  /* спавн */
  if (g.sorted < g.target){
    g.spawnTimer -= dt;
    if (g.spawnTimer <= 0){
      spawnBlock();
      g.spawnTimer = g.spawnInterval * (0.7 + Math.random() * 0.6);
    }
  }

  /* блоки */
  for (let i = g.blocks.length - 1; i >= 0; i--){
    const b = g.blocks[i];

    if (b.state === 'belt'){
      b.x += g.speed * dt;

      const w = wagonFor(b.typeId);
      if (w && w.state === 'idle' && w.count < w.capacity && Math.abs(b.x - w.x) < 30){
        /* загрузка в вагонетку */
        w.count++;
        g.sorted++;
        b.state = 'falling';
        b.vy = 60;
        b.tx = w.x;
        b.rot = (Math.random() - 0.5) * 0.35;
        updateHUD();
      } else if (b.x > W + 40){
        g.blocks.splice(i, 1);
        onMiss(b);
        continue;
      }
    }
    else if (b.state === 'falling'){
      b.vy += GRAVITY * dt;
      b.y += b.vy * dt;
      b.x += (b.tx - b.x) * Math.min(1, dt * 14);
      b.rot += dt * 2.2;
      if (b.y >= WAGON_TOP - 26){
        puff(b.x, WAGON_TOP - 26, b.typeId);
        g.blocks.splice(i, 1);
        continue;
      }
    }
  }

  /* вагонетки */
  for (const w of g.wagons){
    if (w.state === 'dumping'){
      w.dumpT -= dt;
      if (w.dumpT <= 0){ w.state = 'idle'; w.dumpT = 0; }
    }
  }

  /* частицы */
  for (let i = g.particles.length - 1; i >= 0; i--){
    const p = g.particles[i];
    p.vy += 1500 * dt;
    p.x  += p.vx * dt;
    p.y  += p.vy * dt;
    p.rot+= p.vr * dt;
    p.life -= dt;
    if (p.life <= 0 || p.y > H + 60) g.particles.splice(i, 1);
  }

  /* всплывающий текст */
  for (let i = g.floats.length - 1; i >= 0; i--){
    const f = g.floats[i];
    f.y -= 42 * dt;
    f.life -= dt;
    if (f.life <= 0) g.floats.splice(i, 1);
  }

  /* победа */
  if (g.sorted >= g.target && g.state === 'playing'){
    levelComplete();
  }
}

/* ============================================================
   РИСОВАНИЕ — ХЕЛПЕРЫ
   ============================================================ */
function roundRect(x, y, w, h, r){
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function drawImg(id, cx, cy, size, alpha){
  const img = IMG[id];
  ctx.save();
  if (alpha != null) ctx.globalAlpha *= alpha;
  if (img && img.complete && img.naturalWidth){
    ctx.drawImage(img, cx - size / 2, cy - size / 2, size, size);
  } else {
    ctx.fillStyle = TYPE_MAP[id] ? TYPE_MAP[id].color : '#888';
    roundRect(cx - size / 2, cy - size / 2, size, size, size * 0.18);
    ctx.fill();
  }
  ctx.restore();
}

/* ============================================================
   РИСОВАНИЕ — ФОН, РЕЛЬСЫ, ПОДСКАЗКИ
   ============================================================ */
function drawBackground(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,    '#151c24');
  g.addColorStop(0.55, '#0f141a');
  g.addColorStop(1,    '#080b0f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const rg = ctx.createRadialGradient(W / 2, 80, 30, W / 2, 80, 640);
  rg.addColorStop(0, 'rgba(120,170,220,0.10)');
  rg.addColorStop(1, 'rgba(120,170,220,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  /* земля */
  ctx.fillStyle = '#0a0e12';
  ctx.fillRect(0, 405, W, H - 405);
  ctx.fillStyle = 'rgba(255,255,255,0.045)';
  ctx.fillRect(0, 405, W, 2);
}

function drawRail(){
  /* гравийная подушка */
  ctx.fillStyle = '#232a33';
  ctx.fillRect(0, RAIL_TOP + 4, W, 42);

  /* шпалы */
  ctx.fillStyle = '#3d3126';
  for (let x = 8; x < W; x += 46){
    roundRect(x, RAIL_TOP + 12, 17, 26, 3);
    ctx.fill();
  }

  /* рельс */
  ctx.fillStyle = '#8d99a6';
  ctx.fillRect(0, RAIL_TOP, W, 8);
  ctx.fillStyle = '#d3dde7';
  ctx.fillRect(0, RAIL_TOP, W, 2);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(0, RAIL_TOP + 7, W, 2);

  /* бегущие блики */
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.strokeStyle = '#e8f2ff';
  ctx.lineWidth = 2;
  const off = (game.time * Math.max(40, game.speed) * 0.5) % 60;
  for (let x = -off; x < W; x += 60){
    ctx.beginPath();
    ctx.moveTo(x, RAIL_TOP + 3.5);
    ctx.lineTo(x + 20, RAIL_TOP + 3.5);
    ctx.stroke();
  }
  ctx.restore();
}

function drawGuides(){
  for (const w of game.wagons){
    ctx.save();
    ctx.globalAlpha = 0.20;
    ctx.strokeStyle = w.color;
    ctx.lineWidth = 3;
    ctx.setLineDash([9, 11]);
    ctx.beginPath();
    ctx.moveTo(w.x, RAIL_TOP + 16);
    ctx.lineTo(w.x, w.y - 12);
    ctx.stroke();
    ctx.restore();
  }
}

/* ============================================================
   РИСОВАНИЕ — ВАГОНЕТКА
   ============================================================ */
function drawWheel(cx, cy){
  ctx.beginPath();
  ctx.arc(cx, cy, 12, 0, Math.PI * 2);
  ctx.fillStyle = '#1b222a';
  ctx.fill();
  ctx.strokeStyle = '#4d5a68';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
  ctx.fillStyle = '#6b7a89';
  ctx.fill();
}

function drawWagon(w, t){
  const cx = w.x, y = w.y, wd = w.w, ht = w.h;
  const baseY = y + ht;
  const botIn = 14;

  /* тень */
  ctx.save();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx, baseY + 16, wd * 0.46, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  /* наклон при разгрузке */
  let tilt = 0;
  if (w.state === 'dumping'){
    const p = 1 - w.dumpT / DUMP_TIME;
    tilt = Math.sin(p * Math.PI) * 0.17;
  }

  ctx.save();
  ctx.translate(cx, baseY);
  ctx.rotate(tilt);
  ctx.translate(-cx, -baseY);

  /* колёса */
  drawWheel(cx - wd * 0.28, baseY + 5);
  drawWheel(cx + wd * 0.28, baseY + 5);

  /* корпус */
  ctx.beginPath();
  ctx.moveTo(cx - wd / 2, y);
  ctx.lineTo(cx + wd / 2, y);
  ctx.lineTo(cx + wd / 2 - botIn, baseY);
  ctx.lineTo(cx - wd / 2 + botIn, baseY);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, y, 0, baseY);
  g.addColorStop(0,    '#4d5a68');
  g.addColorStop(0.45, '#333d48');
  g.addColorStop(1,    '#1f262e');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#5f6d7c';
  ctx.stroke();

  /* цветной оттенок типа */
  ctx.save();
  ctx.clip();
  ctx.globalAlpha = 0.10;
  ctx.fillStyle = w.color;
  ctx.fillRect(cx - wd / 2, y, wd, ht);
  ctx.restore();

  /* содержимое */
  const COLS = 3, CELL = 32, CGAP = 4;
  const innerW = COLS * CELL + (COLS - 1) * CGAP;
  const startX = cx - innerW / 2 + CELL / 2;
  const baseRowY = baseY - 36;
  for (let i = 0; i < w.count; i++){
    const col = i % COLS;
    const row = Math.floor(i / COLS);
    drawImg(
      w.typeId,
      startX + col * (CELL + CGAP),
      baseRowY - row * (CELL + CGAP),
      CELL
    );
  }

  /* пустая вагонетка — призрачная иконка типа */
  if (w.count === 0){
    drawImg(w.typeId, cx, y + ht / 2 + 6, 66, 0.22);
  }

  /* ободок */
  roundRect(cx - wd / 2 - 3, y - 9, wd + 6, 15, 7);
  ctx.fillStyle = w.color;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.4)';
  ctx.lineWidth = 2;
  ctx.stroke();

  /* пульсация при переполнении */
  if (w.count >= w.capacity){
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * 9));
    ctx.strokeStyle = '#f85149';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx - wd / 2 - 5, y - 12);
    ctx.lineTo(cx + wd / 2 + 5, y - 12);
    ctx.lineTo(cx + wd / 2 - botIn + 5, baseY + 5);
    ctx.lineTo(cx - wd / 2 + botIn - 5, baseY + 5);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}

/* ============================================================
   ГЛАВНЫЙ DRAW
   ============================================================ */
function draw(){
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.clearRect(0, 0, view.cw, view.ch);

  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);

  const t = game.time;

  drawBackground();
  drawRail();
  drawGuides();

  for (const w of game.wagons) drawWagon(w, t);

  /* блоки на ленте и в падении */
  for (const b of game.blocks){
    const bob = b.state === 'belt' ? Math.sin(t * 7 + b.wob) * 1.5 : 0;
    ctx.save();
    ctx.translate(b.x, b.y + bob);
    ctx.rotate(b.rot);
    const img = IMG[b.typeId];
    if (img && img.complete && img.naturalWidth){
      ctx.drawImage(img, -BLOCK / 2, -BLOCK / 2, BLOCK, BLOCK);
    } else {
      ctx.fillStyle = TYPE_MAP[b.typeId].color;
      roundRect(-BLOCK / 2, -BLOCK / 2, BLOCK, BLOCK, 9);
      ctx.fill();
    }
    ctx.restore();
  }

  /* частицы */
  for (const p of game.particles){
    ctx.save();
    ctx.globalAlpha = Math.min(1, p.life * 1.8);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    const img = IMG[p.typeId];
    if (img && img.complete && img.naturalWidth){
      ctx.drawImage(img, -p.size / 2, -p.size / 2, p.size, p.size);
    }
    ctx.restore();
  }

  /* всплывающий текст */
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 26px "Segoe UI", system-ui, sans-serif';
  for (const f of game.floats){
    ctx.save();
    ctx.globalAlpha = Math.min(1, (f.life / f.max) * 1.7);
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(0,0,0,.65)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }

  /* красная вспышка при промахе */
  if (game.flash > 0){
    ctx.save();
    ctx.globalAlpha = game.flash * 0.55;
    const fg = ctx.createRadialGradient(W / 2, H / 2, 90, W / 2, H / 2, 700);
    fg.addColorStop(0, 'rgba(255,60,60,0)');
    fg.addColorStop(1, 'rgba(255,40,40,1)');
    ctx.fillStyle = fg;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  ctx.restore();
}

/* ============================================================
   ИГРОВОЙ ЦИКЛ
   ============================================================ */
let last = 0;
function loop(ts){
  if (!last) last = ts;
  const dt = Math.min((ts - last) / 1000, 0.05);
  last = ts;

  if (game.state === 'playing'){
    update(dt);
  } else {
    /* анимации фона продолжаем */
    game.time += dt;
    if (game.flash > 0) game.flash = Math.max(0, game.flash - dt * 1.6);
    for (let i = game.particles.length - 1; i >= 0; i--){
      const p = game.particles[i];
      p.vy += 1500 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt; p.life -= dt;
      if (p.life <= 0 || p.y > H + 60) game.particles.splice(i, 1);
    }
    for (let i = game.floats.length - 1; i >= 0; i--){
      const f = game.floats[i];
      f.y -= 42 * dt; f.life -= dt;
      if (f.life <= 0) game.floats.splice(i, 1);
    }
  }

  draw();
  requestAnimationFrame(loop);
}

/* ============================================================
   УПРАВЛЕНИЕ
   ============================================================ */
canvas.addEventListener('pointerdown', e => {
  if (game.state !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left - view.ox) / view.scale;
  const py = (e.clientY - rect.top  - view.oy) / view.scale;

  for (const w of game.wagons){
    if (px > w.x - w.w / 2 - 14 && px < w.x + w.w / 2 + 14 &&
        py > w.y - 46 && py < w.y + w.h + 22){
      dumpWagon(w);
      break;
    }
  }
});

window.addEventListener('keydown', e => {
  if (game.state !== 'playing') return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= game.wagons.length){
    dumpWagon(game.wagons[n - 1]);
  }
  if (e.key === ' ' || e.key === 'Enter'){
    /* разгрузить самую полную вагонетку */
    let best = null;
    for (const w of game.wagons){
      if (w.state === 'idle' && w.count > 0 && (!best || w.count > best.count)) best = w;
    }
    if (best) dumpWagon(best);
  }
});

/* ============================================================
   СТАРТ
   ============================================================ */
resize();
requestAnimationFrame(loop);
showMenu();

})();
</script>
</body>
