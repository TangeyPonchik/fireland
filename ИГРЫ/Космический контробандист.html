<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🚀 Космический контрабандист</title>
<style>
    :root {
        --bg-deep: #03060d;
        --panel: rgba(12, 22, 42, 0.8);
        --border: rgba(80, 140, 200, 0.2);
        --border-hi: rgba(0, 212, 255, 0.55);
        --text: #e2eeff;
        --text-dim: #8aa6c8;
        --accent: #00d4ff;
        --accent-2: #7c5cff;
        --gold: #ffc857;
        --green: #4ade80;
        --red: #ff5470;
        --pink: #ff88cc;
        --shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
        --glow: 0 0 24px rgba(0, 212, 255, 0.4);
        --r: 20px;
        --r-sm: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: var(--bg-deep); color: var(--text);
        -webkit-font-smoothing: antialiased; }
    body { user-select: none; }

    #space { position: fixed; inset: 0; z-index: 0; overflow: hidden;
        background: radial-gradient(ellipse at 30% 20%, #0f1e3d 0%, #060b1a 45%, #02030a 100%); }
    .stars, .stars2 { position: absolute; inset: -50%; background-repeat: repeat; }
    .stars { background-image:
        radial-gradient(1.2px 1.2px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 120px 80px, #aaddff, transparent),
        radial-gradient(1.5px 1.5px at 250px 160px, #fff, transparent),
        radial-gradient(1px 1px at 330px 60px, #88bbff, transparent),
        radial-gradient(2px 2px at 400px 220px, #fff, transparent);
        background-size: 500px 300px; animation: drift 240s linear infinite; opacity: .9; }
    .stars2 { background-image:
        radial-gradient(1px 1px at 80px 40px, #fff, transparent),
        radial-gradient(1.2px 1.2px at 200px 140px, #99ccff, transparent),
        radial-gradient(2px 2px at 300px 200px, #fff, transparent);
        background-size: 600px 400px; animation: drift 160s linear infinite; opacity: .5; }
    @keyframes drift { to { transform: translate3d(-500px, -300px, 0); } }
    .nebula { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .25;
        animation: pulse 20s ease-in-out infinite alternate; }
    .nebula.n1 { width: 65vw; height: 65vw; left: -18vw; top: -15vh;
        background: radial-gradient(circle, #7c3aed, transparent 70%); }
    .nebula.n2 { width: 55vw; height: 55vw; right: -15vw; bottom: -18vh;
        background: radial-gradient(circle, #0ea5e9, transparent 70%); animation-delay: -7s; }
    @keyframes pulse { to { transform: scale(1.18); opacity: .38; } }

    .app {
        position: relative; z-index: 5;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 14px;
        width: 100vw; height: 100vh;
        padding: 14px; max-width: 1400px; margin: 0 auto;
    }

    .topbar {
        display: flex; align-items: center; justify-content: space-between;
        background: var(--panel); border: 1px solid var(--border);
        border-radius: var(--r); padding: 10px 16px;
        backdrop-filter: blur(14px); box-shadow: var(--shadow); gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-logo { width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: flex; align-items: center; justify-content: center; font-size: 19px;
        box-shadow: var(--glow); }
    .brand-title { font-size: 15px; font-weight: 800;
        background: linear-gradient(90deg, #fff, #7dd3fc);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; flex: 1; }
    .chip { display: flex; align-items: center; gap: 6px;
        background: rgba(15,30,55,.7); border: 1px solid var(--border);
        border-radius: 11px; padding: 7px 12px; font-size: 13px; transition: .2s; }
    .chip.pulse { animation: chipPulse 1.2s ease-out; }
    @keyframes chipPulse {
        0% { box-shadow: 0 0 0 0 rgba(74,222,128,.8); }
        100% { box-shadow: 0 0 0 12px rgba(74,222,128,0); }
    }
    .chip .ico { font-size: 14px; }
    .chip .val { font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
    .chip.cargo .val { color: #c084fc; }
    .chip.fuel .val { color: var(--accent); }
    .chip.rep .val { color: var(--green); }
    .chip.crew .val { color: var(--pink); }
    .chip.day .val { color: #7dd3fc; }
    .chip.income .val { color: var(--green); }

    .top-actions { display: flex; gap: 7px; }
    .icon-btn { width: 42px; height: 42px; border-radius: 12px;
        background: rgba(15,30,55,.7); border: 1px solid var(--border);
        color: var(--text); cursor: pointer; font-size: 18px;
        display: flex; align-items: center; justify-content: center;
        transition: .2s; position: relative; }
    .icon-btn:hover { border-color: var(--border-hi); background: rgba(20,40,70,.95); transform: translateY(-2px); }
    .icon-btn:active { transform: scale(.94); }
    .icon-btn .badge-dot { position: absolute; top: 6px; right: 6px;
        width: 9px; height: 9px; border-radius: 50%; background: var(--gold);
        box-shadow: 0 0 8px var(--gold); animation: badgePulse 1.6s ease-in-out infinite; }
    @keyframes badgePulse { 50% { transform: scale(1.25); } }

    .hint-banner {
        display: flex; align-items: center; gap: 12px;
        background: linear-gradient(135deg, rgba(255,200,87,.16), rgba(255,200,87,.04));
        border: 1px solid rgba(255,200,87,.45); border-radius: var(--r-sm);
        padding: 12px 18px; font-size: 14px; color: #ffddaa;
        animation: hintGlow 3s ease-in-out infinite;
    }
    .hint-banner:empty { display: none; }
    .hint-banner .hint-ico { font-size: 22px; flex-shrink: 0; }
    @keyframes hintGlow {
        0%,100% { border-color: rgba(255,200,87,.45); }
        50% { border-color: rgba(255,200,87,.9); }
    }

    .main { display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; min-height: 0; }

    .planet-card {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: var(--r); padding: 24px;
        backdrop-filter: blur(14px); box-shadow: var(--shadow);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; position: relative; overflow: hidden;
    }
    .planet-card::before {
        content: ''; position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 30%, rgba(0,212,255,.15), transparent 60%);
        opacity: .6; pointer-events: none;
    }
    .planet-card .p-icon { font-size: 88px; line-height: 1;
        filter: drop-shadow(0 0 30px rgba(0,212,255,.5));
        animation: float 5s ease-in-out infinite alternate; position: relative; z-index: 1; }
    @keyframes float { to { transform: translateY(-8px); } }
    .planet-card .p-name { font-size: 26px; font-weight: 800; margin-top: 14px;
        background: linear-gradient(90deg, #fff, #7dd3fc);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        position: relative; z-index: 1; }
    .planet-card .p-desc { font-size: 13px; color: var(--text-dim);
        margin-top: 8px; max-width: 320px; line-height: 1.5;
        position: relative; z-index: 1; }
    .planet-card .p-stats { display: flex; gap: 14px; margin-top: 18px;
        font-size: 13px; position: relative; z-index: 1; }
    .planet-card .p-stats span {
        background: rgba(15,30,55,.7); border: 1px solid var(--border);
        padding: 6px 14px; border-radius: 10px; font-weight: 700; }
    .planet-card .p-stats .risk { color: var(--red); }
    .planet-card .p-stats .fuel { color: var(--accent); }

    .action-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .tile {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: var(--r); padding: 22px 16px;
        backdrop-filter: blur(14px); box-shadow: var(--shadow);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; cursor: pointer; transition: .22s; font-family: inherit;
        color: var(--text); position: relative; overflow: hidden;
    }
    .tile::before { content: ''; position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 0%, rgba(0,212,255,.2), transparent 70%);
        opacity: 0; transition: .3s; }
    .tile:hover { border-color: var(--border-hi); transform: translateY(-4px);
        box-shadow: 0 16px 40px rgba(0,212,255,.2), var(--shadow); }
    .tile:hover::before { opacity: 1; }
    .tile:active { transform: translateY(-1px) scale(.98); }
    .tile .tile-ico { font-size: 44px; line-height: 1; position: relative; z-index: 1;
        filter: drop-shadow(0 0 12px rgba(0,212,255,.35)); }
    .tile .tile-name { font-size: 15px; font-weight: 700; position: relative; z-index: 1; letter-spacing: .3px; }
    .tile .tile-sub { font-size: 11px; color: var(--text-dim); position: relative; z-index: 1; margin-top: -6px; }
    .tile .tile-badge { position: absolute; top: 10px; right: 10px;
        background: var(--gold); color: #05080f;
        font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 8px;
        box-shadow: 0 0 12px var(--gold);
        animation: badgePulse 1.6s ease-in-out infinite; }
    .tile.story-active { border-color: rgba(255,200,87,.6);
        background: linear-gradient(135deg, rgba(255,200,87,.12), var(--panel)); }
    .tile.story-active .tile-ico { filter: drop-shadow(0 0 14px var(--gold)); }

    .map-bar {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: var(--r); padding: 12px 14px;
        backdrop-filter: blur(14px); box-shadow: var(--shadow); overflow: hidden;
    }
    .map-head { display: flex; align-items: center; gap: 8px;
        font-size: 11px; font-weight: 800; letter-spacing: .8px;
        text-transform: uppercase; color: #bfe0ff; margin-bottom: 10px; }
    .map-head .ico { font-size: 15px; }
    .map-head .sub { color: var(--text-dim); font-weight: 500;
        text-transform: none; letter-spacing: 0; font-size: 11px; margin-left: 6px; }
    .map-scroll { display: flex; gap: 10px; overflow-x: auto;
        padding-bottom: 6px; scroll-behavior: smooth; }
    .map-scroll::-webkit-scrollbar { height: 6px; }
    .map-scroll::-webkit-scrollbar-thumb { background: rgba(80,140,200,.3); border-radius: 3px; }

    .planet-mini { flex: 0 0 130px; background: rgba(15,30,55,.6);
        border: 1px solid var(--border); border-radius: 14px;
        padding: 12px 8px; cursor: pointer; text-align: center;
        transition: .22s; position: relative; overflow: hidden; }
    .planet-mini:hover { border-color: var(--border-hi); transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(0,212,255,.25); }
    .planet-mini.current { border-color: var(--green);
        background: linear-gradient(135deg, rgba(74,222,128,.14), rgba(15,30,55,.6)); }
    .planet-mini.current::after { content: 'ВЫ ЗДЕСЬ'; position: absolute;
        top: 3px; left: 50%; transform: translateX(-50%);
        font-size: 7.5px; letter-spacing: .8px; color: var(--green); font-weight: 900; }
    .planet-mini.locked { opacity: .4; cursor: not-allowed; }
    .planet-mini.locked:hover { transform: none; border-color: var(--border); box-shadow: none; }
    .planet-mini .pm-icon { font-size: 28px; line-height: 1; display: block;
        filter: drop-shadow(0 0 6px rgba(0,212,255,.35)); }
    .planet-mini .pm-name { font-size: 12px; font-weight: 700; color: #cfe8ff; margin-top: 6px; }
    .planet-mini .pm-info { display: flex; justify-content: center; gap: 6px;
        margin-top: 4px; font-size: 10px; font-weight: 700; }
    .planet-mini .pm-fuel { color: var(--accent); }
    .planet-mini .pm-risk { color: var(--red); }
    .planet-mini .pm-visit { position: absolute; top: 5px; right: 6px;
        font-size: 10px; color: var(--gold); }

    .modal-overlay { position: fixed; inset: 0; z-index: 100;
        background: rgba(2,6,15,.88); backdrop-filter: blur(10px);
        display: flex; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none; transition: .28s; padding: 16px; }
    .modal-overlay.show { opacity: 1; pointer-events: all; }
    .modal { background: linear-gradient(160deg, #0e1c36, #081020);
        border: 1px solid var(--border-hi); border-radius: 24px;
        padding: 24px; max-width: 560px; width: 100%;
        box-shadow: 0 0 80px rgba(0,180,255,.3), var(--shadow);
        transform: translateY(24px) scale(.95);
        transition: .35s cubic-bezier(.34,1.56,.64,1);
        max-height: 90vh; display: flex; flex-direction: column; }
    .modal-overlay.show .modal { transform: translateY(0) scale(1); }
    .modal.wide { max-width: 720px; }

    .modal-head { display: flex; align-items: center; gap: 14px;
        margin-bottom: 18px; flex-shrink: 0; }
    .modal-ico { width: 52px; height: 52px; border-radius: 15px; font-size: 26px;
        display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        background: linear-gradient(135deg, rgba(0,212,255,.2), rgba(124,92,255,.2));
        border: 1px solid var(--border-hi); box-shadow: var(--glow); }
    .modal-title { font-size: 20px; font-weight: 800; color: #fff; line-height: 1.2; }
    .modal-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

    .modal-body { overflow-y: auto; flex: 1; margin: 0 -4px; padding: 0 4px; }
    .modal-body::-webkit-scrollbar { width: 7px; }
    .modal-body::-webkit-scrollbar-thumb { background: rgba(80,140,200,.3); border-radius: 4px; }

    .modal-close { margin-left: auto; width: 36px; height: 36px; border-radius: 10px;
        background: rgba(15,30,55,.7); border: 1px solid var(--border);
        color: var(--text-dim); cursor: pointer; font-size: 16px;
        display: flex; align-items: center; justify-content: center;
        transition: .2s; flex-shrink: 0; }
    .modal-close:hover { background: rgba(255,84,112,.2); border-color: var(--red); color: var(--red); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        background: rgba(15,30,55,.7); border: 1px solid var(--border);
        color: var(--text); padding: 11px 16px; border-radius: 12px;
        cursor: pointer; font-size: 14px; font-weight: 700; transition: .18s;
        font-family: inherit; white-space: nowrap; }
    .btn:hover { border-color: var(--border-hi); background: rgba(20,40,70,.95);
        transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
    .btn:active { transform: translateY(0) scale(.97); }
    .btn:disabled { opacity: .3; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
    .btn .cost { color: var(--gold); font-weight: 800; font-size: 12.5px; }
    .btn-buy { border-color: rgba(74,222,128,.45); }
    .btn-buy:hover { background: rgba(74,222,128,.18); border-color: var(--green); }
    .btn-sell { border-color: rgba(255,200,87,.45); }
    .btn-sell:hover { background: rgba(255,200,87,.18); border-color: var(--gold); }
    .btn-fly { border-color: rgba(124,92,255,.5); }
    .btn-fly:hover { background: rgba(124,92,255,.2); border-color: var(--accent-2); }
    .btn-warn { border-color: rgba(255,84,112,.5); }
    .btn-warn:hover { background: rgba(255,84,112,.18); border-color: var(--red); }
    .btn-ok { border-color: rgba(74,222,128,.5); }
    .btn-ok:hover { background: rgba(74,222,128,.18); border-color: var(--green); }
    .btn-gold { border-color: rgba(255,200,87,.6); background: rgba(255,200,87,.1); }
    .btn-gold:hover { background: rgba(255,200,87,.24); border-color: var(--gold); }
    .btn-pulse { animation: pulseGlow 2s ease-in-out infinite; }
    @keyframes pulseGlow {
        0%,100% { box-shadow: 0 0 0 0 rgba(255,200,87,.5); }
        50% { box-shadow: 0 0 0 12px rgba(255,200,87,0); }
    }

    .trade-list { display: flex; flex-direction: column; gap: 8px; }
    .trade-row { display: grid; grid-template-columns: auto 1fr auto auto;
        align-items: center; gap: 10px;
        background: rgba(15,30,55,.5); border: 1px solid var(--border);
        border-radius: 14px; padding: 10px 12px; transition: .18s; }
    .trade-row:hover { border-color: var(--border-hi); background: rgba(20,40,70,.7); }
    .trade-row.illegal { border-left: 3px solid var(--red); }
    .trade-row .tr-ico { font-size: 22px; }
    .trade-row .tr-info { min-width: 0; }
    .trade-row .tr-name { font-size: 14px; font-weight: 700; color: #cfe8ff; }
    .trade-row .tr-price { font-size: 12px; color: var(--gold); font-weight: 800; }
    .trade-row .tr-price .badge { font-size: 10px; color: var(--red); margin-left: 6px; }
    .trade-row .tr-have { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .trade-row .tr-btns { display: flex; gap: 6px; }
    .trade-row .tr-btns .btn { padding: 8px 12px; font-size: 12.5px; }

    .card-list { display: flex; flex-direction: column; gap: 10px; }
    .upgrade-card, .crew-card, .story-card {
        display: flex; align-items: center; gap: 14px;
        background: rgba(15,30,55,.5); border: 1px solid var(--border);
        border-radius: 14px; padding: 14px 16px; transition: .18s; }
    .upgrade-card:hover, .crew-card:hover { border-color: var(--border-hi); }
    .upgrade-card .uc-ico, .crew-card .cc-ico, .story-card .sc-ico {
        font-size: 28px; width: 44px; height: 44px;
        background: rgba(0,212,255,.1); border-radius: 12px;
        display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .upgrade-card .uc-info, .crew-card .cc-info, .story-card .sc-info { flex: 1; min-width: 0; }
    .upgrade-card .uc-name, .crew-card .cc-name, .story-card .sc-name { font-size: 14px; font-weight: 700; }
    .upgrade-card .uc-desc, .crew-card .cc-desc, .story-card .sc-desc {
        font-size: 11.5px; color: var(--text-dim); margin-top: 3px; line-height: 1.45; }
    .upgrade-card .uc-pips { display: flex; gap: 3px; margin-top: 6px; }
    .upgrade-card .pip { width: 11px; height: 11px; border-radius: 3px;
        background: rgba(80,140,200,.2); }
    .upgrade-card .pip.on { background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 6px rgba(0,212,255,.6); }
    .crew-card.hired { background: linear-gradient(135deg, rgba(74,222,128,.08), rgba(15,30,55,.5));
        border-color: rgba(74,222,128,.35); }
    .crew-card.hired .cc-action { color: var(--green); font-weight: 700; font-size: 13px; }
    .crew-card.income-card { border-color: rgba(74,222,128,.55);
        background: linear-gradient(135deg, rgba(74,222,128,.12), rgba(15,30,55,.5)); }
    .story-card { flex-direction: column; align-items: stretch; gap: 10px; }
    .story-card .sc-head { display: flex; align-items: center; gap: 12px; }
    .story-card .sc-text { font-size: 12.5px; color: #b8d4ee; line-height: 1.6; }
    .story-card .sc-choices { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .story-card .sc-choices .btn { width: 100%; text-align: left; justify-content: flex-start;
        padding: 11px 14px; font-size: 13px; }

    .stat-block { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .stat-item { background: rgba(15,30,55,.5); border: 1px solid var(--border);
        border-radius: 12px; padding: 11px 14px;
        display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .stat-item .si-ico { font-size: 18px; }
    .stat-item .si-lbl { color: var(--text-dim); font-size: 11px; }
    .stat-item .si-val { font-weight: 800; color: var(--gold); font-size: 14px; margin-left: auto; }

    .faction-card { display: flex; flex-direction: column; gap: 6px;
        padding: 11px 14px; border-radius: 12px;
        background: rgba(15,30,55,.5); border: 1px solid var(--border);
        margin-bottom: 8px; }
    .faction-card .fc-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
    .faction-card .fc-bar { height: 8px; border-radius: 5px; background: rgba(5,12,25,.9); overflow: hidden; }
    .faction-card .fc-bar i { display: block; height: 100%; transition: width .5s; }
    .f-merch i { background: linear-gradient(90deg, #14b8a6, #5eead4); }
    .f-pirate i { background: linear-gradient(90deg, #be123c, #fb7185); }
    .f-explorer i { background: linear-gradient(90deg, #7c3aed, #c084fc); }

    .modal-choices { display: flex; flex-direction: column; gap: 10px; }
    .modal-choices .btn { width: 100%; padding: 15px 18px; text-align: left;
        font-size: 14px; justify-content: flex-start; }

    .empty-state { font-size: 13px; color: var(--text-dim); text-align: center; padding: 26px 16px; }

    .setting-row { display: flex; justify-content: space-between; align-items: center;
        padding: 14px 0; border-bottom: 1px solid var(--border); }
    .setting-row:last-child { border-bottom: none; }
    .setting-row .s-lbl { font-size: 14px; font-weight: 700; }
    .setting-row .s-desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .switch { width: 52px; height: 28px; border-radius: 14px; background: rgba(5,12,25,.9);
        border: 1px solid var(--border); cursor: pointer; position: relative;
        transition: .25s; flex-shrink: 0; }
    .switch.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: var(--accent); }
    .switch::after { content: ''; position: absolute; top: 2px; left: 2px;
        width: 22px; height: 22px; border-radius: 50%; background: #fff;
        transition: .25s; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
    .switch.on::after { transform: translateX(24px); }

/* ============================================================

============================================================ */
function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function $(id){ return document.getElementById(id); }
function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function log(msg, type=''){
    logHistory.unshift({msg, type, t:Date.now()});
    if(logHistory.length > 80) logHistory.pop();
}

/* ============================================================
   ЗВУК
============================================================ */
let audioCtx = null;
function beep(freq, dur, type){
    if(!settings.sound) return;
    try {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type || 'sine';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
    } catch(e){}
}
function sndClick(){ beep(600, 0.06, 'square'); }
function sndGood(){ beep(880, 0.12); setTimeout(()=>beep(1100, 0.1), 70); }
function sndBad(){ beep(220, 0.18, 'sawtooth'); }
function sndGold(){ beep(660, 0.1); setTimeout(()=>beep(990, 0.15), 90); }

/* ============================================================
   ТОСТЫ
============================================================ */
function toast(msg, type=''){
    const wrap = $('toastWrap');
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = msg;
    wrap.appendChild(t);
    if(type === 'success') sndGood();
    else if(type === 'danger') sndBad();
    else if(type === 'gold') sndGold();
    setTimeout(()=>{ if(t.parentNode) t.remove(); }, 3200);
}

function saveGame(){
    if(!settings.autosave && !window.__forceSave) return;
    try {
        const data = {
            money, cargo, maxCargo, reputation,
            armor, engine, weapon, scanner,
            fuel, maxFuel, day,
            crew, inventory, factionMerch, factionPirate, factionExplorer,
            currentPlanet, visitedPlanets, storyChapter, storyFlags, gameOver,
            incomePerMinute, lastIncomeTick,
            logHistory: logHistory.slice(0,30),
            savedAt: Date.now()
        };
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    } catch(e){ console.warn('Save failed', e); }
}

function loadGame(){
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if(!raw) return false;
        const d = JSON.parse(raw);
        if(typeof d.money !== 'number') return false;
        money = d.money; cargo = d.cargo||0; maxCargo = d.maxCargo||50;
        reputation = d.reputation||0;
        armor = d.armor||1; engine = d.engine||1; weapon = d.weapon||1; scanner = d.scanner||1;
        fuel = d.fuel||100; maxFuel = d.maxFuel||100;
        day = d.day||1;
        crew = Array.isArray(d.crew) ? d.crew : [];
        inventory = Array.isArray(d.inventory) ? d.inventory : [];
        factionMerch = d.factionMerch||0; factionPirate = d.factionPirate||0; factionExplorer = d.factionExplorer||0;
        currentPlanet = clamp(d.currentPlanet||0, 0, PLANETS.length-1);
        visitedPlanets = d.visitedPlanets || {0:true};
        storyChapter = clamp(d.storyChapter||0, 0, STORY.length-1);
        storyFlags = d.storyFlags || {};
        gameOver = !!d.gameOver;
        incomePerMinute = d.incomePerMinute||0;
        lastIncomeTick = d.lastIncomeTick || Date.now();
        if(Array.isArray(d.logHistory)) logHistory = d.logHistory;
        return true;
    } catch(e){ console.warn('Load failed', e); return false; }
}

function resetGame(){
    try { localStorage.removeItem(SAVE_KEY); } catch(e){}
    location.reload();
}

function loadSettings(){
    try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        if(raw){
            const s = JSON.parse(raw);
            settings.sound = s.sound !== false;
            settings.autosave = s.autosave !== false;
            settings.anim = s.anim !== false;
        }
    } catch(e){}
}
function saveSettings(){
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch(e){}
    applySettings();
}
function applySettings(){
    $('setSound').classList.toggle('on', settings.sound);
    $('setAutosave').classList.toggle('on', settings.autosave);
    $('setAnim').classList.toggle('on', settings.anim);
    $('soundBtn').textContent = settings.sound ? '🔊' : '🔇';
    const bg = $('space');
    if(bg) bg.style.display = settings.anim ? '' : 'none';
}

/* ============================================================
   ПАССИВНЫЙ ДОХОД (Коллега)
============================================================ */
function recalcIncome(){
    incomePerMinute = 0;
    crew.forEach(c=>{
        const m = CREW_MEMBERS.find(x=>x.id === c.id);
        if(m && m.income) incomePerMinute += m.income;
    });
    $('chipIncome').style.display = incomePerMinute > 0 ? '' : 'none';
    $('incomeDisplay').textContent = incomePerMinute + '/мин';
}

function tickIncome(){
    if(gameOver) return;
    if(incomePerMinute <= 0){ lastIncomeTick = Date.now(); return; }
    const now = Date.now();
    const elapsed = (now - lastIncomeTick) / 60000; // в минутах
    const earned = Math.floor(elapsed * incomePerMinute);
    if(earned > 0){
        money += earned;
        lastIncomeTick = now;
        // Пульс на чипе денег
        const chip = $('chipMoney');
        chip.classList.remove('pulse');
        void chip.offsetWidth;
        chip.classList.add('pulse');
        updateUI();
    }
}

/* ============================================================
   ЦЕНЫ
============================================================ */
function generatePrices(){
    const p = PLANETS[currentPlanet];
    const prices = {};
    GOODS.forEach(g=>{
        let base = p.goods[g.id] || 100;
        let fluct = rand(-20, 20);
        if(factionMerch > 3) fluct -= 10;
        if(factionPirate > 3 && g.illegal) fluct -= 15;
        if(factionExplorer > 3) fluct += 5;
        prices[g.id] = Math.max(10, base + fluct);
    });
    return prices;
}

/* ============================================================
   ГЛАВНЫЙ UI
============================================================ */
function updateUI(){
    if(gameOver) return;

    $('moneyDisplay').textContent = money;
    $('cargoDisplay').textContent = cargo + '/' + maxCargo;
    $('fuelDisplay').textContent = fuel;
    $('repDisplay').textContent = reputation;
    $('crewDisplay').textContent = crew.length;
    $('dayDisplay').textContent = day;

    const p = PLANETS[currentPlanet];
    $('planetIconBig').textContent = p.icon;
    $('planetNameBig').textContent = p.name;
    $('planetDescBig').textContent = p.desc;
    $('planetFuelCost').textContent = p.fuelCost;
    $('planetRisk').textContent = Math.round(p.risk*100) + '%';

    renderHint();
    renderBadges();
    renderMap();
    recalcIncome();
    marketPrices = generatePrices();
}

function renderHint(){
    const hint = $('nextStepHint');
    const ch = STORY[storyChapter];
    if(!ch){ hint.innerHTML = ''; return; }
    let text = '';
    let ico = '📖';
    if(ch.canAdvance && ch.canAdvance(getState())){
        text = ch.chapter + ': ' + ch.title + ' — доступно новое действие в «Истории»';
        ico = '⭐';
    } else {
        text = ch.chapter + ': ' + ch.title;
    }
    hint.innerHTML = '<span class="hint-ico">'+ico+'</span><span><b>Сюжет:</b> '+text+'</span>';
}

function renderBadges(){
    const ch = STORY[storyChapter];
    const canStory = ch && ch.canAdvance && ch.canAdvance(getState());
    $('storyBadge').style.display = canStory ? '' : 'none';
    $('tileStory').classList.toggle('story-active', canStory);

    // Бейдж на экипаже: есть ли Коллега и доступные для найма
    const hasColleague = crew.some(c=>c.id === 'colleague');
    const canHireColleague = !hasColleague && money >= 10;
    $('crewBadge').style.display = (canHireColleague || crew.length === 0) ? '' : 'none';
}

function getState(){
    return { money, cargo, maxCargo, fuel, maxFuel, day, crew, inventory,
             factionMerch, factionPirate, factionExplorer, currentPlanet,
             visitedPlanets, storyFlags, armor, engine, weapon, scanner, reputation };
}

function renderMap(){
    const mapDiv = $('mapDisplay');
    mapDiv.innerHTML = '';
    PLANETS.forEach(p=>{
        const isCurrent = p.id === currentPlanet;
        const canFly = !isCurrent && fuel >= p.fuelCost;
        const div = document.createElement('div');
        div.className = 'planet-mini' + (isCurrent ? ' current' : '') + (!canFly && !isCurrent ? ' locked' : '');
        div.title = p.desc;
        div.innerHTML = `
            ${visitedPlanets[p.id] && !isCurrent ? '<span class="pm-visit">✓</span>' : ''}
            <span class="pm-icon">${p.icon}</span>
            <span class="pm-name">${p.name}</span>
            <div class="pm-info">
                <span class="pm-fuel">⛽${p.fuelCost}</span>
                <span class="pm-risk">⚠${Math.round(p.risk*100)}%</span>
            </div>
        `;
        div.onclick = ()=>tryFly(p);
        mapDiv.appendChild(div);
    });
}

/* ============================================================
   ПОЛЁТ
============================================================ */
function tryFly(p){
    if(gameOver) return;
    if(p.id === currentPlanet){ toast('📍 Ты уже здесь', 'gold'); return; }
    let cost = p.fuelCost;
    // Штурман уменьшает расход
    if(crew.some(c=>c.id === 'navigator')) cost = Math.max(1, Math.round(cost * 0.8));
    if(fuel < cost){ toast('❌ Нужно ' + cost + ' топлива. Есть: ' + fuel, 'danger'); return; }

    openChoiceModal(
        p.icon,
        'Летим на ' + p.name + '?',
        p.desc + '\n\n' +
        '⛽ Топливо: −' + cost + '\n' +
        '⚠ Риск события: ' + Math.round(p.risk*100) + '%\n' +
        '📅 Пройдёт 1 день',
        [
            {text: '🚀 Лететь!', cls: 'btn-fly', effect: ()=>doFly(p, cost)},
            {text: '↩️ Остаться', cls: 'btn', effect: ()=>{}}
        ]
    );
}

function doFly(p, cost){
    fuel = Math.max(0, fuel - cost);
    currentPlanet = p.id;
    day++;
    visitedPlanets[p.id] = true;
    log('🛸 Прибыл на ' + p.icon + ' ' + p.name, 'event');
    toast('🛸 ' + p.icon + ' ' + p.name, 'success');
    updateUI();
    saveGame();
    // Автосюжет: если глава требует посещения планеты — напомним
    const ch = STORY[storyChapter];
    if(ch && ch.canAdvance && ch.canAdvance(getState())){
        setTimeout(()=>toast('⭐ Доступно новое сюжетное действие!','gold'), 800);
    }
    if(Math.random() < p.risk + 0.15){
        setTimeout(()=>randomEvent(), 450);
    }
}

/* ============================================================
   ПЛИТКА: УЛУЧШЕНИЯ
============================================================ */
function openUpgradeModal(){
    sndClick();
    const upgrades = [
        {key:'engine', ico:'⚡', name:'Двигатель', val:engine, max:5, base:100, step:30, desc:'Шанс сбежать от пиратов', apply:()=>engine++},
        {key:'armor', ico:'🛡️', name:'Броня', val:armor, max:5, base:150, step:30, desc:'Защита в бою', apply:()=>armor++},
        {key:'weapon', ico:'🔫', name:'Оружие', val:weapon, max:5, base:200, step:30, desc:'Сила в бою с пиратами', apply:()=>weapon++},
        {key:'scanner', ico:'📡', name:'Сканер', val:scanner, max:5, base:120, step:30, desc:'Поиск аномалий', apply:()=>scanner++}
    ];

    let html = '<div class="card-list">';
    upgrades.forEach(u=>{
        if(u.val >= u.max){
            html += `<div class="upgrade-card">
                <div class="uc-ico">${u.ico}</div>
                <div class="uc-info">
                    <div class="uc-name">${u.name}</div>
                    <div class="uc-desc">Максимальный уровень</div>
                    <div class="uc-pips">${Array.from({length:u.max},()=>'<span class="pip on"></span>').join('')}</div>
                </div>
                <div style="color:var(--green);font-weight:800">MAX</div>
            </div>`;
            return;
        }
        const c = u.base + u.val*u.step;
        const canBuy = money >= c;
        const pips = Array.from({length:u.max}, (_,i)=>
            '<span class="pip'+(i<u.val?' on':'')+'"></span>').join('');
        html += `<div class="upgrade-card">
            <div class="uc-ico">${u.ico}</div>
            <div class="uc-info">
                <div class="uc-name">${u.name} <span style="color:var(--text-dim);font-weight:500">ур. ${u.val}/${u.max}</span></div>
                <div class="uc-desc">${u.desc}</div>
                <div class="uc-pips">${pips}</div>
            </div>
            <button class="btn btn-fly" data-upg="${u.key}" ${canBuy?'':'disabled'}>
                Улучшить <span class="cost">${c} кр</span>
            </button>
        </div>`;
    });

    // Груз
    if(maxCargo < 200){
        const c = 150 + maxCargo;
        const canBuy = money >= c;
        html += `<div class="upgrade-card">
            <div class="uc-ico">📦</div>
            <div class="uc-info">
                <div class="uc-name">Грузовой отсек</div>
                <div class="uc-desc">Текущий: ${maxCargo} т</div>
            </div>
            <button class="btn btn-fly" data-upg="cargo" ${canBuy?'':'disabled'}>
                +20 т <span class="cost">${c} кр</span>
            </button>
        </div>`;
    }

    // Заправка
    if(fuel < maxFuel){
        let cost = 30;
        if(crew.some(c=>c.id === 'mechanic')) cost = Math.round(cost * 0.8);
        const canBuy = money >= cost;
        html += `<div class="upgrade-card">
            <div class="uc-ico">⛽</div>
            <div class="uc-info">
                <div class="uc-name">Заправка</div>
                <div class="uc-desc">Топливо: ${fuel}/${maxFuel}${crew.some(c=>c.id==='mechanic')?' <span style="color:var(--green)">−20% (механик)</span>':''}</div>
            </div>
            <button class="btn btn-warn" data-upg="fuel" ${canBuy?'':'disabled'}>
                +30 <span class="cost">${cost} кр</span>
            </button>
        </div>`;
    }

    html += '</div>';
    openContentModal('⚙️', 'Улучшения', 'Деньги: ' + money + ' кр', html);

    $('contentBody').querySelectorAll('[data-upg]').forEach(btn=>{
        btn.onclick = ()=>{
            const key = btn.dataset.upg;
            if(key === 'cargo'){
                const c = 150 + maxCargo;
                if(money < c) return;
                money -= c; maxCargo += 20;
                log('📦 Грузовой отсек увеличен!','success');
                toast('📦 Груз +20 т','success');
            } else if(key === 'fuel'){
                let cost = 30;
                if(crew.some(c=>c.id === 'mechanic')) cost = Math.round(cost * 0.8);
                if(money < cost) return;
                money -= cost; fuel = Math.min(maxFuel, fuel + 30);
                log('⛽ Топливо +30.','success');
                toast('⛽ Топливо +30','success');
            } else {
                const u = upgrades.find(x=>x.key === key);
                if(!u || u.val >= u.max) return;
                const c = u.base + u.val*u.step;
                if(money < c) return;
                money -= c; u.apply();
                log(u.ico + ' ' + u.name + ' улучшен!','success');
                toast(u.ico + ' ' + u.name + ' +1','success');
            }
            updateUI();
            saveGame();
            openUpgradeModal();
        };
    });
}

   ПЛИТКА: ЭКИПАЖ
============================================================ */
function openCrewModal(){
    sndClick();
    let html = '';

    // Особый блок для Коллеги, если ещё не нанят
    const hasColleague = crew.some(c=>c.id === 'colleague');
    if(!hasColleague){
        const c = CREW_MEMBERS.find(m=>m.id === 'colleague');
        const canBuy = money >= c.cost;
        html += `<div class="crew-card income-card">
            <div class="cc-ico">🤝</div>
            <div class="cc-info">
                <div class="cc-name">${c.name} <span style="color:var(--green);font-size:11px">★ особый</span></div>
                <div class="cc-desc">${c.desc}. Даёт <b style="color:var(--green)">+${c.income} кр/мин</b> — даже когда ты не играешь!</div>
            </div>
            <button class="btn btn-ok btn-pulse" data-hire="colleague" ${canBuy?'':'disabled'}>
                Нанять <span class="cost">${c.cost} кр</span>
            </button>
        </div>`;
    }

    if(crew.length > 0){
        html += '<div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin:18px 0 8px">В команде (' + crew.length + ')</div>';
        html += '<div class="card-list" style="margin-bottom:18px">';
        crew.forEach(c=>{
            const m = CREW_MEMBERS.find(x=>x.id === c.id);
            const isIncome = m && m.income;
            html += `<div class="crew-card hired${isIncome?' income-card':''}">
                <div class="cc-ico">${c.icon}</div>
                <div class="cc-info">
                    <div class="cc-name">${escapeHtml(c.name)}${isIncome?' <span style="color:var(--green);font-size:11px">+'+m.income+' кр/мин</span>':''}</div>
                    <div class="cc-desc">${escapeHtml(c.desc||'')}</div>
                </div>
                <div class="cc-action">✓</div>
            </div>`;
        });
        html += '</div>';
    }

    // Доступные для найма
    const available = CREW_MEMBERS.filter(m => !crew.some(c=>c.id === m.id) && m.id !== 'colleague');
    if(available.length > 0){
        html += '<div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px">Доступны для найма</div>';
        html += '<div class="card-list">';
        available.forEach(m=>{
            const canBuy = money >= m.cost;
            html += `<div class="crew-card">
                <div class="cc-ico">${m.icon}</div>
                <div class="cc-info">
                    <div class="cc-name">${m.name}</div>
                    <div class="cc-desc">${m.desc}</div>
                </div>
                <button class="btn btn-buy" data-hire="${m.id}" ${canBuy?'':'disabled'}>
                    Нанять <span class="cost">${m.cost}</span>
                </button>
            </div>`;
        });
        html += '</div>';
    }

    if(!html){
        html = '<div class="empty-state">Экипаж полностью укомплектован!</div>';
    }
    openContentModal('👥', 'Экипаж', crew.length + ' человек · Деньги: ' + money + ' кр', html);

    $('contentBody').querySelectorAll('[data-hire]').forEach(btn=>{
        btn.onclick = ()=>{
            const m = CREW_MEMBERS.find(x=>x.id === btn.dataset.hire);
            if(!m || money < m.cost) return;
            if(crew.some(c=>c.id === m.id)) return;
            money -= m.cost;
            crew.push({id:m.id, name:m.name, icon:m.icon, desc:m.desc});
            log('👤 ' + m.name + ' присоединился! (' + m.desc + ')','success');
            toast('👤 ' + m.name + ' в экипаже','success');
            recalcIncome();
            updateUI();
            saveGame();
            openCrewModal();
        };
    });
}

   ПЛИТКА: ИСТОРИЯ (12 глав)
============================================================ */
function openStoryModal(){
    sndClick();
    const ch = STORY[storyChapter];
    if(!ch){
        openContentModal('📖', 'История', 'Финал', '<div class="empty-state">История завершена. Ты прошёл свой путь.</div>');
        return;
    }

    let html = '';
    html += `<div class="chapter-badge">${ch.chapter}</div>`;
    html += `<div style="font-size:20px;font-weight:800;color:#fff;margin-bottom:12px">${ch.title}</div>`;
    html += `<div style="font-size:13.5px;color:#b8d4ee;line-height:1.7;margin-bottom:20px;padding:14px 16px;background:rgba(124,92,255,.08);border-left:3px solid var(--accent-2);border-radius:10px">${ch.text}</div>`;

    // Прогресс глав
    html += '<div style="display:flex;gap:4px;margin-bottom:18px">';
    STORY.forEach((_, i)=>{
        const active = i === storyChapter;
        const done = i < storyChapter;
        const color = done ? 'var(--green)' : active ? 'var(--gold)' : 'rgba(80,140,200,.3)';
        html += `<div style="flex:1;height:5px;border-radius:3px;background:${color};transition:.3s"></div>`;
    });
    html += '</div>';

    // Действие
    const canAct = ch.canAdvance ? ch.canAdvance(getState()) : true;
    if(ch.actionLabel){
        if(canAct){
            html += `<button class="btn btn-gold btn-pulse" style="width:100%;padding:16px;font-size:15px" id="storyActionBtn">✨ ${ch.actionLabel}</button>`;
        } else {
            html += `<div style="padding:14px 16px;background:rgba(255,84,112,.08);border:1px solid rgba(255,84,112,.3);border-radius:12px;font-size:13px;color:#ffb8c4;text-align:center">
                🔒 Условие не выполнено: <b>${ch.actionLabel}</b><br>
                <span style="font-size:11.5px;color:var(--text-dim);margin-top:6px;display:inline-block">Продолжай играть — торгуй, летай, нанимай экипаж.</span>
            </div>`;
        }
    }

    openContentModal('📖', 'История', 'Путь к брату', html);

    const actionBtn = $('storyActionBtn');
    if(actionBtn){
        actionBtn.onclick = ()=>{
            sndClick();
            const result = ch.action(getState());
            if(!result || !result.success){
                if(result && result.openEnding){
                    closeContentModal();
                    openEndingModal();
                }
                return;
            }
            // Применяем изменения (action уже изменил state)
            if(result.log) log(result.log, 'story');
            if(result.nextChapter !== undefined && result.nextChapter < STORY.length){
                storyChapter = result.nextChapter;
            } else if(result.nextChapter >= STORY.length){
                storyChapter = STORY.length - 1;
                // Финал
                closeContentModal();
                openEndingModal();
                return;
            }
            // Показываем результат
            openContentModal('📜', result.success ? 'Успех!' : 'Результат',
                ch.chapter + ' · ' + ch.title,
                `<div style="font-size:14px;color:#b8d4ee;line-height:1.7;padding:14px 16px;background:rgba(74,222,128,.08);border-left:3px solid var(--green);border-radius:10px">${result.text}</div>
                 <button class="btn btn-fly" style="width:100%;margin-top:16px;padding:14px" id="storyContinueBtn">Продолжить →</button>`
            );
            $('storyContinueBtn').onclick = ()=>{
                closeContentModal();
                updateUI();
                saveGame();
            };
            toast('📖 ' + ch.chapter + ' пройдена!', 'gold');
            updateUI();
            saveGame();
        };
    }
}

    html += statItem('🛡️', 'Броня', armor + '/5');
    html += statItem('⚡', 'Двигатель', engine + '/5');
    html += statItem('🔫', 'Оружие', weapon + '/5');
    html += statItem('📡', 'Сканер', scanner + '/5');
    html += '</div>';

    if(incomePerMinute > 0){
        html += `<div style="padding:12px 16px;background:linear-gradient(135deg,rgba(74,222,128,.15),rgba(15,30,55,.5));border:1px solid rgba(74,222,128,.5);border-radius:12px;margin-bottom:16px;display:flex;align-items:center;gap:10px">
            <span style="font-size:22px">📈</span>
            <div><div style="font-weight:800;color:var(--green)">+${incomePerMinute} кр/мин</div><div style="font-size:11px;color:var(--text-dim)">Пассивный доход от Коллеги</div></div>
        </div>`;
    }

    html += '<div class="bar-block" style="margin-bottom:16px">';
    html += `<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-bottom:5px;font-weight:700"><span>⛽ ТОПЛИВО</span><span>${fuel}/${maxFuel}</span></div>`;
    html += `<div style="height:10px;border-radius:6px;background:rgba(5,12,25,.9);overflow:hidden"><i style="display:block;height:100%;width:${(fuel/maxFuel*100)}%;background:linear-gradient(90deg,#0284c7,#22d3ee);box-shadow:0 0 10px rgba(34,211,238,.6)"></i></div>`;
    html += '</div>';

    html += '<div class="bar-block" style="margin-bottom:16px">';
    html += `<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-bottom:5px;font-weight:700"><span>📦 ГРУЗ</span><span>${cargo}/${maxCargo}</span></div>`;
    html += `<div style="height:10px;border-radius:6px;background:rgba(5,12,25,.9);overflow:hidden"><i style="display:block;height:100%;width:${(cargo/maxCargo*100)}%;background:linear-gradient(90deg,#7c3aed,#c084fc);box-shadow:0 0 10px rgba(192,132,252,.6)"></i></div>`;
    html += '</div>';

    html += '<div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin:18px 0 8px">Фракции</div>';
    html += factionCard('🛒 Торговцы', 'merch', factionMerch);
    html += factionCard('🏴‍☠️ Пираты', 'pirate', factionPirate);
    html += factionCard('🔭 Исследователи', 'explorer', factionExplorer);

    html += '<div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin:18px 0 8px">Инвентарь</div>';
    if(inventory.length === 0){
        html += '<div style="font-size:12px;color:var(--text-dim);text-align:center;padding:14px">Пусто</div>';
    } else {
        inventory.forEach(i=>{
            html += `<div style="padding:8px 12px;background:rgba(15,30,55,.5);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;font-size:12px"><b>${escapeHtml(i.name)}</b><br><span style="color:var(--text-dim);font-size:11px">${escapeHtml(i.desc||'')}</span></div>`;
        });
    }

    openContentModal('🚢', 'Корабль', 'Брат ждёт · День ' + day, html);
}

function statItem(ico, lbl, val){
    return `<div class="stat-item"><span class="si-ico">${ico}</span><span class="si-lbl">${lbl}</span><span class="si-val">${val}</span></div>`;
}
function factionCard(name, key, val){
    const w = clamp(50 + val*5, 0, 100);
    return `<div class="faction-card">
        <div class="fc-top"><span>${name}</span><span style="color:var(--gold)">${val}</span></div>
        <div class="fc-bar f-${key}"><i style="width:${w}%"></i></div>
    </div>`;
}

/* ============================================================
   ТОРГОВЛЯ (логика)
============================================================ */
function trade(goodId, price, action){
    if(gameOver) return;
    const good = GOODS.find(g=>g.id===goodId);
    if(!good) return;
    if(action === 'buy'){
        if(money < price){ toast('❌ Недостаточно кредитов','danger'); return; }
        if(cargo + 1 > maxCargo){ toast('❌ Перегруз!','danger'); return; }
        money -= price; cargo += 1;
        log('🛒 Куплено 1 т ' + good.icon + ' ' + good.name + ' за ' + price + ' кр.','success');
        if(good.illegal) factionPirate += 1;
    } else {
        if(cargo < 1){ toast('❌ Нет ' + good.name,'danger'); return; }
        const bonus = crew.some(c=>c.id === 'trader') ? Math.floor(price*0.15) : 0;
        money += price + bonus; cargo -= 1;
        log('💰 Продано 1 т ' + good.icon + ' ' + good.name + ' за ' + (price+bonus) + ' кр.','success');
        if(good.illegal) factionPirate += 1; else factionMerch += 1;
    }
    if(cargo === 0 && Math.random() < 0.15){ reputation += 1; toast('⭐ +1 репутация','gold'); }
    updateUI();
    saveGame();
}

/* ============================================================
   СОБЫТИЯ
============================================================ */
function randomEvent(){
    if(gameOver) return;
    const ev = EVENTS[rand(0, EVENTS.length-1)];
    openChoiceModal(ev.icon, ev.title, ev.text, ev.choices);
}

/* ============================================================
   ФИНАЛ
============================================================ */
function showEnd(icon, title, text){
    $('endIco').textContent = icon;
    $('endTitle').textContent = title;
    $('endText').textContent = text;
    $('endScreen').classList.add('show');
    gameOver = true;
    try { localStorage.removeItem(SAVE_KEY); } catch(e){}
}

/* ============================================================
   НАСТРОЙКИ
============================================================ */
function openSettings(){ $('settingsModal').classList.add('show'); }
function closeSettings(){ $('settingsModal').classList.remove('show'); }

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
============================================================ */
function init(){
    loadSettings();
    applySettings();

    if(!loadGame()){
        log('🛸 Ты начинаешь путь. 300 кредитов. Брат ждёт.','story');
        log('💡 Совет: найми Коллегу за 10 кр — он даёт 20 кр/мин!','story');
    } else if(logHistory.length === 0){
        log('🛸 Продолжаем путь. День ' + day + '.','story');
    }

    // Применяем накопленный доход за время отсутствия
    if(incomePerMinute > 0){
        const elapsed = (Date.now() - lastIncomeTick) / 60000;
        const earned = Math.floor(elapsed * incomePerMinute);
        if(earned > 0){
            money += earned;
            toast('📈 Коллега заработал ' + earned + ' кр, пока тебя не было!', 'success');
            log('📈 Коллега заработал ' + earned + ' кр.','income');
        }
    }
    lastIncomeTick = Date.now();

    if(gameOver){
        showEnd('🏆','Финал','Ты завершил историю. Начни заново, чтобы пройти другим путём.');
    }

    $('shipBtn').onclick = openShipModal;
    $('logBtn').onclick = openLogModal;
    $('soundBtn').onclick = ()=>{ settings.sound = !settings.sound; saveSettings(); sndClick(); };
    $('settingsBtn').onclick = ()=>{ sndClick(); openSettings(); };

    $('tileTrade').onclick = openTradeModal;
    $('tileUpgrade').onclick = openUpgradeModal;
    $('tileCrew').onclick = openCrewModal;
    $('tileStory').onclick = openStoryModal;

    $('contentClose').onclick = ()=>{ sndClick(); closeContentModal(); };
    $('settingsClose').onclick = ()=>{ sndClick(); closeSettings(); };
    $('saveBtn').onclick = ()=>{ window.__forceSave = true; saveGame(); window.__forceSave = false; toast('💾 Сохранено!','success'); };
    $('resetBtn').onclick = ()=>{
        if(confirm('Точно сбросить весь прогресс? Это нельзя отменить.')) resetGame();
    };
    $('setSound').onclick = ()=>{ settings.sound = !settings.sound; saveSettings(); if(settings.sound) sndClick(); };
    $('setAutosave').onclick = ()=>{ settings.autosave = !settings.autosave; saveSettings(); toast(settings.autosave?'💾 Автосохранение вкл':'💾 Автосохранение выкл','gold'); };
    $('setAnim').onclick = ()=>{ settings.anim = !settings.anim; saveSettings(); };
    $('restartBtn').onclick = ()=>{ resetGame(); };

    $('contentModal').addEventListener('click', e=>{ if(e.target.id === 'contentModal') closeContentModal(); });
    $('choiceModal').addEventListener('click', e=>{ if(e.target.id === 'choiceModal') closeChoiceModal(); });
    $('settingsModal').addEventListener('click', e=>{ if(e.target.id === 'settingsModal') closeSettings(); });

    document.addEventListener('keydown', e=>{
        if(e.key === 'Escape'){ closeContentModal(); closeChoiceModal(); closeSettings(); }
    });

    // Тик пассивного дохода — каждую секунду проверяем
    setInterval(tickIncome, 1000);
    // Автосохранение
    setInterval(()=>{ if(!gameOver) saveGame(); }, 20000);
    window.addEventListener('beforeunload', ()=>{ if(!gameOver) saveGame(); });

    updateUI();
    setTimeout(()=>{
        if(!loadGame()){
            toast('💡 Совет: найми Коллегу — пассивный доход!','gold');
        } else {
            toast('👋 С возвращением!','gold');
        }
    }, 600);
}

if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>
</body>
</html>
