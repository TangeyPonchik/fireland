function App() {
  const [started, setStarted] = useState(false);
  const [numBars, setNumBars] = useState(2);
  const [bonus, setBonus] = useState(null);
  const [toast, setToast] = useState(null);
  const [showGuide, setShowGuide] = useState(false);
  const [showSeq, setShowSeq] = useState(false);
  const [tooltip, setTooltip] = useState(null);
  const [settingsTrack, setSettingsTrack] = useState(null);
  const [settingsPos, setSettingsPos] = useState({ x: 0, y: 0 });
  const bonusTimerRef = useRef(null);
  const toastTimerRef = useRef(null);
  const importFileRef = useRef(null);
  const shownBonusesRef = useRef(new Set());
  const [selectedModes, setSelectedModes] = useState(new Set(['all']));
  const [multiMode, setMultiMode] = useState(false);
  const [searchQuery, setSearchQuery] = useState('');
  const [favOnly, setFavOnly] = useState(false);

  const { favorites, toggleFav } = useFavorites();
  const deviceType = useDeviceType();
  const audio = useAudioManager(numBars);
  const {
    isPlaying, trackModes, volumes, cutoffs, pendingTracks, pendingProgress, previewProgress,
    start, stop, cycleTrack, reset, changeVolume, changeCutoff, setTrackSet,
    setVolumesAll, setCutoffsAll,
    mutedTracks, soloedTracks, toggleMute, toggleSolo,
    setMutedAll, setSoloedAll,
    patterns, setPatternFor, setPatternsAll,
    grid, currentStep, toggleStep, clearGrid, setGridBulk, setGridAll,
    isRecording, recordedUrl, startRecording, stopRecording,
    reverbOn, setReverbOn, delayOn, setDelayOn, masterVol, setMasterVol,
    rebuildBuffers,
  } = audio;

  const showToast = useCallback((text) => {
    setToast(text);
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(() => setToast(null), 2500);
  }, []);

  const totalTracks = Object.keys(TRACKS).length;
  const activeCount = useMemo(() => Object.keys(trackModes).length, [trackModes]);
  const hasGrid = useMemo(() => Object.keys(grid).length > 0, [grid]);

  const favoriteCounts = useMemo(() => {
    const counts = {};
    favorites.forEach(id => {
      const mode = TRACKS[id]?.mode;
      if (mode) counts[mode] = (counts[mode] || 0) + 1;
      counts.all = (counts.all || 0) + 1;
    });
    return counts;
  }, [favorites]);

  const visibleTracks = useMemo(() => {
    let ids;
    if (favOnly) ids = [...favorites];
    else if (selectedModes.has('all')) ids = Object.keys(TRACKS);
    else {
      const set = new Set();
      selectedModes.forEach(id => {
        Object.keys(TRACKS).forEach(tid => { if (TRACKS[tid].mode === id) set.add(tid); });
      });
      ids = Object.keys(TRACKS).filter(k => set.has(k));
    }
    if (searchQuery.trim()) {
      const q = searchQuery.trim().toLowerCase();
      ids = ids.filter(id => {
        const t = TRACKS[id];
        return t && (t.label.toLowerCase().includes(q) || (t.desc || '').toLowerCase().includes(q));
      });
    }
    const favArr = [], nonFavArr = [];
    ids.forEach(id => { if (favorites.has(id)) favArr.push(id); else nonFavArr.push(id); });
    return [...favArr, ...nonFavArr];
  }, [selectedModes, favOnly, favorites, searchQuery]);

  const groupedTracks = useMemo(() => {
    if (favOnly || searchQuery.trim() || !selectedModes.has('all')) return null;
    const groups = {};
    visibleTracks.forEach(id => {
      const m = TRACKS[id].mode;
      if (!groups[m]) groups[m] = [];
      groups[m].push(id);
    });
    return groups;
  }, [visibleTracks, favOnly, searchQuery, selectedModes]);

  const handleToggleMode = useCallback((modeId, kind) => {
    if (favOnly) setFavOnly(false);
    setSelectedModes(prev => {
      const next = new Set(prev);
      if (kind === 'single') {
        if (next.has(modeId) && next.size === 1) return next;
        return new Set([modeId]);
      } else {
        if (next.has(modeId)) {
          if (next.size === 1) return next;
          next.delete(modeId);
        } else next.add(modeId);
        return next;
      }
    });
  }, [favOnly]);

  useEffect(() => {
    if (!multiMode && selectedModes.size > 1) {
      const first = [...selectedModes][0];
      setSelectedModes(new Set([first]));
    }
  }, [multiMode, selectedModes]);

  useEffect(() => {
    for (const b of BONUSES) {
      const match = b.combo.every(k => trackModes[k]);
      if (match && !shownBonusesRef.current.has(b.id)) {
        shownBonusesRef.current.add(b.id);
        setBonus(b);
        if (bonusTimerRef.current) clearTimeout(bonusTimerRef.current);
        bonusTimerRef.current = setTimeout(() => setBonus(null), 3200);
        break;
      }
    }
  }, [trackModes]);

  useEffect(() => {
    if (activeCount === 0) shownBonusesRef.current = new Set();
  }, [activeCount]);

  const handleCharacterClick = async (id) => {
    if (!isPlaying) await start();
    cycleTrack(id);
  };

  const handleOpenSettings = useCallback((id, e) => {
    const rect = e.currentTarget ? e.currentTarget.getBoundingClientRect() : { left: e.clientX, top: e.clientY };
    setSettingsTrack(id);
    setSettingsPos({
      x: rect.left + (rect.width || 0) + 10,
      y: rect.top,
    });
  }, []);

  const handleCloseSettings = useCallback(() => setSettingsTrack(null), []);

  const handleRecToggle = () => { if (isRecording) stopRecording(); else startRecording(); };

  const handleHover = useCallback((id, el) => {
    const rect = el.getBoundingClientRect();
    setTooltip({ track: { ...TRACKS[id], id }, position: { x: rect.left + rect.width/2 - 100, y: rect.bottom } });
  }, []);

  const handleLeave = useCallback(() => setTooltip(null), []);
  const handleTapInfo = useCallback((id, e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    setTooltip({ track: { ...TRACKS[id], id }, position: { x: Math.max(10, rect.left + rect.width/2 - 100), y: rect.bottom } });
    setTimeout(() => setTooltip(null), 3000);
  }, []);

  const exportJSON = () => {
    const data = {
      format: 'musibox-mix', version: 11, date: new Date().toISOString(),
      numBars,
      trackModes: { ...trackModes },
      volumes: { ...volumes }, cutoffs: { ...cutoffs },
      masterVol, reverbOn, delayOn,
      muted: [...mutedTracks], soloed: [...soloedTracks],
      patterns: { ...patterns }, grid: { ...grid },
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'musibox-mix-' + Date.now() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('📤 Микс экспортирован в JSON');
  };

  const importJSON = () => { if (importFileRef.current) importFileRef.current.click(); };

  const handleImportFile = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (data.format !== 'musibox-mix') throw new Error('Не формат Musibox');

      stop();
      if (typeof data.numBars === 'number' && [1,2,4,8].includes(data.numBars)) {
        setNumBars(data.numBars);
      }
      const modes = data.trackModes || data.activeTracks;
      if (modes && typeof modes === 'object') setTrackSet(modes);
      if (data.volumes) setVolumesAll(data.volumes);
      if (data.cutoffs) setCutoffsAll(data.cutoffs);
      if (typeof data.masterVol === 'number') setMasterVol(data.masterVol);
      if (typeof data.reverbOn === 'boolean') setReverbOn(data.reverbOn);
      if (typeof data.delayOn === 'boolean') setDelayOn(data.delayOn);
      if (data.patterns && typeof data.patterns === 'object') setPatternsAll(data.patterns);
      if (data.grid && typeof data.grid === 'object') setGridAll(data.grid);
      if (Array.isArray(data.muted)) setMutedAll(data.muted);
      if (Array.isArray(data.soloed)) setSoloedAll(data.soloed);
      if (rebuildBuffers) rebuildBuffers();

      setTimeout(async () => { await start(); }, 120);
      showToast('📥 Микс загружен!');
    } catch(err) { showToast('❌ Ошибка: ' + err.message); }
    e.target.value = '';
  };

  useEffect(() => {
    if (!started) document.body.classList.add('no-scroll');
    else document.body.classList.remove('no-scroll');
    return () => document.body.classList.remove('no-scroll');
  }, [started]);

  useEffect(() => {
    if (!started) return;
    const handler = (e) => {
      if (e.key === ' ' && !e.target.closest('input')) {
        e.preventDefault();
        if (isPlaying) stop(); else start();
      }
      if ((e.key === 'r' || e.key === 'R') && !e.target.closest('input')) handleRecToggle();
      if (e.key === 'Escape') {
        if (settingsTrack) setSettingsTrack(null);
        else if (searchQuery) setSearchQuery('');
        else if (showGuide) setShowGuide(false);
        else if (showSeq) setShowSeq(false);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [started, isPlaying, searchQuery, showGuide, showSeq, settingsTrack]);

  const renderCharacters = (ids) => ids.map(id => html`<${Character} key=${id} id=${id}
      label=${TRACKS[id].label} color=${TRACKS[id].color} emoji=${TRACKS[id].emoji} mode=${TRACKS[id].mode} desc=${TRACKS[id].desc}
      active=${trackModes[id] === 'loop'}
      previewing=${trackModes[id] === 'preview'}
      pending=${!!pendingTracks[id]} pendingProgress=${pendingProgress[id] || 0}
      previewProgress=${previewProgress[id] || 0}
      isFav=${favorites.has(id)}
      isMuted=${mutedTracks.has(id)}
      isSoloed=${soloedTracks.has(id)}
      onClick=${handleCharacterClick}
      onOpenSettings=${handleOpenSettings}
      onHover=${handleHover} onLeave=${handleLeave} onTapInfo=${handleTapInfo} />`);

  return html`<div class="app" data-device=${deviceType}>
    <header class="app__header">
      <h1 class="app__title">🎧 Musibox Pro</h1>
      <p class="app__subtitle">${totalTracks} треков · 14 режимов · ★ избранное · 🔍 поиск · 🎓 гид · 🎬 секвенсор</p>
    </header>
    <div class="topbar">
      <div class="search-wrap">
        <input class="search-input" type="text" placeholder="Поиск звука или описания..." value=${searchQuery}
          onChange=${(e) => setSearchQuery(e.target.value)} aria-label="Поиск" />
        ${searchQuery && html`<button class="search-clear" onClick=${() => setSearchQuery('')} aria-label="Очистить">×</button>`}
      </div>
      <button class=${'fav-filter-btn' + (favOnly ? ' active' : '')} onClick=${() => setFavOnly(v => !v)}>
        ★ Только избранные <span class="count">${favorites.size}</span>
      </button>
      <button class="guide-btn" onClick=${() => setShowGuide(true)}>🎓 Гид</button>
    </div>
    ${!favOnly && html`<${ModeSelector} selectedModes=${selectedModes} onToggleMode=${handleToggleMode}
      multiMode=${multiMode} setMultiMode=${setMultiMode} favoriteCounts=${favoriteCounts} />`}
    <${MasterBar} masterVol=${masterVol} setMasterVol=${setMasterVol}
      reverbOn=${reverbOn} setReverbOn=${setReverbOn}
      delayOn=${delayOn} setDelayOn=${setDelayOn} />
    <main class="app__stage">
      ${visibleTracks.length === 0
        ? html`<div class="no-results">
            ${favOnly ? 'У тебя пока нет избранных треков.' : searchQuery ? `Ничего не найдено по запросу "${searchQuery}"` : 'Нет треков'}
          </div>`
        : groupedTracks
          ? html`${MODES.filter(m => !m.isAll && groupedTracks[m.id]).map(m => html`
              <section class="mode-section" key=${m.id}>
                <h3 class="mode-section__title" style=${{color:m.color}}>
                  <span>${m.icon} ${m.name}</span>
                  <span class="line"></span>
                </h3>
                <div class="app__characters">${renderCharacters(groupedTracks[m.id])}</div>
              </section>`)}`
          : html`<div class="app__characters">${renderCharacters(visibleTracks)}</div>`
      }
      <${Presets}
        trackModes=${trackModes} applyTracks=${setTrackSet} showToast=${showToast}
        volumes=${volumes} cutoffs=${cutoffs}
        patterns=${patterns} grid=${grid}
        muted=${mutedTracks} soloed=${soloedTracks}
        numBars=${numBars} masterVol=${masterVol} reverbOn=${reverbOn} delayOn=${delayOn}
        onLoadVolumes=${setVolumesAll} onLoadCutoffs=${setCutoffsAll}
        onLoadPatterns=${setPatternsAll} onLoadGrid=${setGridAll}
        onLoadMuted=${setMutedAll} onLoadSoloed=${setSoloedAll}
        onLoadNumBars=${setNumBars} onLoadMasterVol=${setMasterVol}
        onLoadReverbOn=${setReverbOn} onLoadDelayOn=${setDelayOn}
        onBeforeLoad=${stop}
        onAfterLoad=${start} />
    </main>
    <footer style=${{display:'flex', justifyContent:'center'}}>
      <${ControlBar} isPlaying=${isPlaying} onPlay=${start} onStop=${stop}
        onReset=${() => { reset(); shownBonusesRef.current = new Set(); }}
        count=${activeCount} total=${totalTracks}
        numBars=${numBars} setNumBars=${setNumBars}
        isRecording=${isRecording} onRecToggle=${handleRecToggle}
        recordedUrl=${recordedUrl} onExportJSON=${exportJSON} onImportJSON=${importJSON}
        onOpenSeq=${() => setShowSeq(true)}
        hasGrid=${hasGrid} />
    </footer>
    <input ref=${importFileRef} type="file" accept="application/json,.json" style=${{display:'none'}} onChange=${handleImportFile} />
    ${bonus && html`<${BonusPopup} bonus=${bonus} />`}
    ${toast && html`<div class="save-toast">${toast}</div>`}
    ${tooltip && html`<${Tooltip} track=${tooltip.track} position=${tooltip.position} />`}
    ${settingsTrack && html`<${SettingsPopup}
      track=${{...TRACKS[settingsTrack], id: settingsTrack}}
      position=${settingsPos}
      volume=${volumes[settingsTrack] ?? DEFAULT_VOL}
      cutoff=${cutoffs[settingsTrack] ?? DEFAULT_CUTOFF}
      pattern=${patterns[settingsTrack] || 'inf'}
      isFav=${favorites.has(settingsTrack)}
      isMuted=${mutedTracks.has(settingsTrack)}
      isSoloed=${soloedTracks.has(settingsTrack)}
      onClose=${handleCloseSettings}
      onVolumeChange=${changeVolume}
      onCutoffChange=${changeCutoff}
      onPatternChange=${setPatternFor}
      onToggleFav=${toggleFav}
      onToggleMute=${toggleMute}
      onToggleSolo=${toggleSolo} />`}
    ${showGuide && html`<${GuideModal} onClose=${() => setShowGuide(false)} />`}
    ${showSeq && html`<${SequencerModal}
      grid=${grid}
      currentStep=${currentStep}
      onToggle=${toggleStep}
      onClear=${clearGrid}
      onBulkSet=${setGridBulk}
      onClose=${() => setShowSeq(false)}
      trackModes=${trackModes} />`}
    ${!started && html`<${Welcome} onStart=${async () => { setStarted(true); await start(); }} />`}
  </div>`;
}

/* Запуск с миграцией старых данных */
migrateOldData().finally(() => {
  render(html`<${App} />`, document.getElementById('root'));
});
</script>
</body>
</html>
