<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
<meta name="theme-color" content="#0d0d1f" />
<title>🎧 Musibox Pro</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:radial-gradient(circle at 20% 0%,#1a1a3e 0%,transparent 60%),radial-gradient(circle at 80% 100%,#3e1a3a 0%,transparent 60%),linear-gradient(160deg,#0d0d1f,#16162e);min-height:100vh;color:#fff;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body.no-scroll{overflow:hidden}
  .app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:12px;padding:16px 12px 24px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-bottom:max(24px,env(safe-area-inset-bottom))}
  .app__header{text-align:center}
  .app__title{font-size:32px;margin:0 0 4px;font-weight:900;letter-spacing:1.5px;background:linear-gradient(90deg,#4dabf7,#9775fa,#f783ac,#ffd43b,#4dabf7);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:title-shine 8s ease-in-out infinite,title-float 4s ease-in-out infinite}
  @keyframes title-shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  @keyframes title-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  .app__subtitle{margin:0;opacity:.6;font-size:12px}
  .topbar{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;justify-content:center;max-width:1200px;width:100%;margin:0 auto;padding:10px;background:#ffffff08;border-radius:14px;border:1px solid #ffffff15;box-shadow:0 8px 24px #0004,0 0 0 1px #ffffff08 inset}
  .search-wrap{position:relative;flex:1;min-width:180px;max-width:500px;display:flex}
  .search-input{flex:1;width:100%;padding:12px 40px 12px 40px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff0d url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='m21 21-4.35-4.35'/></svg>") no-repeat 14px center;color:#fff;font-size:15px;outline:none;font-family:inherit;min-height:46px}
  .search-input:focus{border-color:#4dabf7}
  .search-input::placeholder{color:#8899bb}
  .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:#ffffff11;border:none;color:#fff;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .search-clear:hover{background:#ffffff22}
  .fav-filter-btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:12px 18px;border-radius:12px;min-height:46px;background:#ffffff0d;border:1px solid #ffffff1a;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap}
  .fav-filter-btn:hover,.fav-filter-btn:focus-visible{background:#ffffff1a;outline:none}
  .fav-filter-btn.active{background:linear-gradient(180deg,#fbbf24,#f59e0b);border-color:#fbbf24;color:#1a1a00;box-shadow:0 0 18px #fbbf2480}
  .fav-filter-btn .count{background:#00000044;padding:2px 8px;border-radius:8px;font-size:12px;opacity:.85}
  .guide-btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:12px 18px;border-radius:12px;min-height:46px;background:linear-gradient(180deg,#a855f7,#7c3aed);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px #7c3aed80;transition:transform .15s}
  .guide-btn:hover{transform:translateY(-2px)}
  .modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:1200px;width:100%;margin:0 auto;padding:10px;background:#ffffff08;border-radius:14px;border:1px solid #ffffff15;box-shadow:0 6px 20px #0004,0 0 0 1px #ffffff08 inset}
  .mode-btn{background:#ffffff0d;border:1px solid #ffffff1a;color:#fff;padding:12px 16px;font-size:14px;font-weight:700;border-radius:12px;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;gap:8px;transition:all .25s cubic-bezier(.34,1.2,.64,1);font-family:inherit;position:relative;overflow:hidden;box-shadow:0 2px 6px #0004}
  .mode-btn:hover,.mode-btn:focus-visible{background:#ffffff1a;outline:none}
  .mode-btn.active{background:linear-gradient(180deg,#4dabf7,#1c7ed6);border-color:#4dabf7;box-shadow:0 0 18px #4dabf780}
  .mode-btn:focus-visible{outline:3px solid #4dabf7;outline-offset:3px}
  .mode-btn.multi{border-color:#9775fa}
  .mode-btn.multi.active{background:linear-gradient(180deg,#9775fa,#6741d9);border-color:#9775fa;box-shadow:0 0 18px #9775fa80}
  .mode-btn .badge{background:#00000044;padding:2px 8px;border-radius:8px;font-size:12px;opacity:.85}
  .mode-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,#ffffff22 50%,transparent 70%);transform:translateX(-100%);transition:transform .5s ease;pointer-events:none}
  .mode-btn:hover::after{transform:translateX(100%)}
  .app__stage{flex:1;display:flex;flex-direction:column;align-items:center;gap:16px}
  .mode-section{width:100%;max-width:1200px;display:flex;flex-direction:column;gap:8px;animation:section-appear .5s ease-out both}
  @keyframes section-appear{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
  .mode-section__title{font-size:14px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;opacity:.7;margin:0;padding:0 4px;display:flex;align-items:center;gap:8px}
  .mode-section__title .line{flex:1;height:1px;background:linear-gradient(90deg,#ffffff22,transparent)}
  .app__characters{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px 8px;max-width:1200px;width:100%;padding:0 4px}
  .character-wrap{position:relative;display:flex;justify-content:center;animation:char-appear .4s cubic-bezier(.2,.9,.3,1.3) both}
  .character-wrap:nth-child(1){animation-delay:0ms}
  .character-wrap:nth-child(2){animation-delay:20ms}
  .character-wrap:nth-child(3){animation-delay:40ms}
  .character-wrap:nth-child(4){animation-delay:60ms}
  .character-wrap:nth-child(5){animation-delay:80ms}
  .character-wrap:nth-child(6){animation-delay:100ms}
  .character-wrap:nth-child(7){animation-delay:120ms}
  .character-wrap:nth-child(8){animation-delay:140ms}
  .character-wrap:nth-child(9){animation-delay:160ms}
  .character-wrap:nth-child(10){animation-delay:180ms}
  .character-wrap:nth-child(11){animation-delay:200ms}
  .character-wrap:nth-child(12){animation-delay:220ms}
  .character-wrap:nth-child(n+13){animation-delay:240ms}
  @keyframes char-appear{0%{opacity:0;transform:translateY(12px) scale(.85)}100%{opacity:1;transform:translateY(0) scale(1)}}
  .character{background:none;border:none;cursor:pointer;padding:6px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s ease;width:100%;font-family:inherit;color:inherit;border-radius:14px;position:relative;overflow:hidden}
  .character:hover,.character:focus-visible{transform:translateY(-3px);outline:none}
  .character:focus-visible{box-shadow:0 0 0 3px #4dabf7,0 0 0 6px #4dabf755}
  .circle{width:56px;height:56px;border-radius:50%;position:relative;transition:all .25s cubic-bezier(.34,1.2,.64,1);display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--char-color);opacity:.55;box-shadow:0 4px 10px #0008;border:2px solid transparent}
  .character:hover .circle{opacity:.8;transform:scale(1.06);box-shadow:0 6px 16px #000a,0 0 0 1px #ffffff22 inset}
  .character--active .circle{opacity:1;box-shadow:0 6px 16px #000a,0 0 20px var(--char-color),0 0 0 1px #ffffff44 inset;animation:circle-breathe 1.6s ease-in-out infinite}
  @keyframes circle-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .character--preview .circle{opacity:1;box-shadow:0 6px 16px #000a,0 0 20px #fbbf24,0 0 0 2px #fbbf24 inset;animation:circle-breathe 1.2s ease-in-out infinite}
  .character--pending .circle{opacity:.85;box-shadow:0 6px 16px #000a,0 0 20px #22d3ee,0 0 0 2px #22d3ee inset;animation:circle-breathe 1s ease-in-out infinite}
  .character--pending .character__label{color:#22d3ee;opacity:1}
  .character--preview .character__label{color:#fbbf24;opacity:1}
  .character--active .character__label{color:var(--char-color);opacity:1}
  .character--muted .circle{opacity:.2;filter:grayscale(.6)}
  .character--muted .character__label{opacity:.3}
  .character--fav .circle{border-color:#fbbf24;border-width:2px}
  .character--soloed .circle{border-color:#22c55e;border-width:2px;box-shadow:0 6px 16px #000a,0 0 14px #22c55e80}
  .character__label{font-size:10px;font-weight:700;letter-spacing:.5px;color:#fff;opacity:.6;text-transform:uppercase;text-align:center;word-break:break-word;line-height:1.1;max-width:100%}
  .pending-bar{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);width:70%;height:3px;background:#00000066;border-radius:2px;overflow:hidden;pointer-events:none}
  .pending-bar__fill{height:100%;width:0%;transition:width .1s linear;animation:bar-glow .9s ease-in-out infinite}
  @keyframes bar-glow{0%,100%{box-shadow:0 0 4px currentColor}50%{box-shadow:0 0 12px currentColor}}
  .badges{position:absolute;top:-4px;right:-2px;display:flex;gap:2px;pointer-events:none}
  .badge-mini{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;border:1.5px solid #0d0d1f}
  .badge-mini.fav{background:#fbbf24;color:#1a1a00}
  .badge-mini.solo{background:#22c55e;color:#fff}
  .badge-mini.mute{background:#ef4444;color:#fff}
  .character .ripple{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--char-color),transparent 70%);pointer-events:none;animation:ripple-out .6s ease-out forwards;z-index:0}
  @keyframes ripple-out{0%{transform:scale(.3);opacity:.7}100%{transform:scale(2.4);opacity:0}}
  .no-results{grid-column:1/-1;text-align:center;padding:60px 20px;opacity:.6;font-size:15px;line-height:1.6}
  .control-bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:14px 16px;background:#ffffff0d;border-radius:16px;border:1px solid #ffffff1a;max-width:1200px;width:100%;box-shadow:0 8px 24px #0004,0 0 0 1px #ffffff08 inset}
  .btn{background:linear-gradient(180deg,#4dabf7,#1c7ed6);color:#fff;border:none;padding:12px 20px;font-size:15px;font-weight:700;border-radius:12px;cursor:pointer;transition:transform .15s,box-shadow .15s,background .2s;box-shadow:0 4px 12px #1c7ed680;display:inline-flex;align-items:center;gap:8px;font-family:inherit;min-height:46px;text-decoration:none;position:relative;overflow:hidden}
  .btn::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 20%,#ffffff33 50%,transparent 80%);transform:translateX(-150%);transition:transform .6s ease;pointer-events:none}
  .btn:hover::before{transform:translateX(150%)}
  .btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 6px 16px #1c7ed6b0;outline:none}
  .btn:focus-visible{outline:3px solid #4dabf7;outline-offset:3px}
  .btn:active{transform:translateY(0)}
  .btn--stop{background:linear-gradient(180deg,#ff6b6b,#e03131);box-shadow:0 4px 12px #e0313180}
  .btn--ghost{background:#ffffff11;box-shadow:none;border:1px solid #ffffff22}
  .btn--ghost::before{display:none}
  .btn--ghost:hover,.btn--ghost:focus-visible{background:#ffffff22;box-shadow:none}
  .btn--green{background:linear-gradient(180deg,#22c55e,#16a34a);box-shadow:0 4px 12px #22c55e80}
  .btn--blue{background:linear-gradient(180deg,#3b82f6,#2563eb);box-shadow:0 4px 12px #3b82f680}
  .btn--rec.active{background:linear-gradient(180deg,#fa5252,#c92a2a);animation:rec-glow 1.2s infinite}
  @keyframes rec-glow{0%,100%{box-shadow:0 0 0 0 #fa5252aa,0 4px 12px #e0313180}50%{box-shadow:0 0 0 14px #fa525200,0 4px 12px #e0313180}}
  .counter{color:#fff;font-size:14px;opacity:.75}
  .counter b{color:#4dabf7}
  .bars-selector{display:inline-flex;background:#ffffff0d;border-radius:12px;border:1px solid #ffffff1a;overflow:hidden;box-shadow:0 2px 6px #0004}
  .bars-selector button{background:transparent;border:none;color:#fff;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;opacity:.6;transition:all .2s;font-family:inherit;min-height:46px}
  .bars-selector button:hover,.bars-selector button:focus-visible{opacity:1;background:#ffffff11;outline:none}
  .bars-selector button.active{background:#4dabf7;opacity:1}
  .bonus-popup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:100;animation:bonus-bounce 3.2s ease-out forwards;padding:20px}
  @keyframes bonus-bounce{0%{opacity:0;transform:scale(.5) rotate(-6deg)}20%{opacity:1;transform:scale(1.08) rotate(2deg)}35%{transform:scale(.98) rotate(-1deg)}50%{transform:scale(1.02) rotate(1deg)}70%{transform:scale(1) rotate(0)}85%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
  .bonus-popup__inner{background:linear-gradient(135deg,#1a1a3e,#3e1a3a);padding:24px 36px;border-radius:20px;text-align:center;border:2px solid #9775fa;box-shadow:0 0 60px #9775fa88,0 0 120px #9775fa44;max-width:90vw}
  .bonus-popup__emoji{font-size:52px;margin-bottom:6px}
  .bonus-popup__title{font-size:22px;font-weight:800;background:linear-gradient(90deg,#4dabf7,#f783ac,#ffd43b);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
  .bonus-popup__desc{font-size:13px;opacity:.85}
  .presets-wrap{display:flex;flex-direction:column;gap:10px;align-items:center;max-width:1200px;width:100%}
  .presets-row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;justify-content:center;width:100%}
  .presets-list{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .presets-list .preset{display:flex;border-radius:12px;overflow:hidden;border:1px solid #ffffff22}
  .presets-list .preset .btn{border-radius:0}
  .preset-input{padding:12px 14px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff0d;color:#fff;font-size:15px;min-width:180px;outline:none;font-family:inherit;min-height:46px}
  .preset-input:focus{border-color:#4dabf7}
  .preset-input::placeholder{color:#8899bb}
  .welcome{position:fixed;inset:0;z-index:500;background:rgba(13,13,31,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:24px;animation:fade-in .3s ease}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  .welcome h2{font-size:28px;margin:0;background:linear-gradient(90deg,#4dabf7,#f783ac);-webkit-background-clip:text;background-clip:text;color:transparent}
  .welcome p{opacity:.75;max-width:560px;margin:0;line-height:1.6;font-size:15px}
  .welcome .btn{font-size:17px;padding:16px 40px;animation:welcome-btn-glow 2s ease-in-out infinite}
  @keyframes welcome-btn-glow{0%,100%{box-shadow:0 4px 12px #1c7ed680,0 0 0 0 #4dabf7aa}50%{box-shadow:0 6px 20px #1c7ed6c0,0 0 0 14px #4dabf700}}
  .save-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;padding:12px 24px;border-radius:12px;font-weight:700;z-index:9999;box-shadow:0 8px 24px #22c55e66;animation:toast-pop .35s cubic-bezier(.34,1.4,.64,1) both}
  @keyframes toast-pop{0%{opacity:0;transform:translate(-50%,-20px) scale(.9)}60%{opacity:1;transform:translate(-50%,4px) scale(1.02)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
  .tooltip{position:fixed;background:#1a1a2e;border:1px solid #4dabf7;color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:500;line-height:1.4;max-width:280px;z-index:1000;box-shadow:0 8px 24px #000a;pointer-events:none;opacity:0;transition:opacity .15s}
  .tooltip.visible{opacity:1;animation:tooltip-in .18s ease-out both}
  @keyframes tooltip-in{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}
  .tooltip__title{font-weight:800;color:#4dabf7;margin-bottom:2px;font-size:14px}
  .tooltip__desc{opacity:.85}
  .guide-modal{position:fixed;inset:0;z-index:2000;background:rgba(13,13,31,.94);display:none;align-items:center;justify-content:center;padding:20px}
  .guide-modal.show{display:flex}
  .guide-modal__content{background:#0d0d1f;border:1px solid #ffffff22;border-radius:20px;max-width:900px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;position:relative;box-shadow:0 20px 60px #000c;scroll-behavior:smooth}
  .guide-modal__close{position:absolute;top:12px;right:16px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;opacity:.7;transition:opacity .2s}
  .guide-modal__close:hover{opacity:1}
  .guide-modal__title{font-size:28px;font-weight:800;margin:0 0 8px;background:linear-gradient(90deg,#4dabf7,#f783ac);-webkit-background-clip:text;background-clip:text;color:transparent}
  .guide-modal__subtitle{opacity:.7;font-size:14px;margin:0 0 24px}
  .guide-modal__section{margin-bottom:24px}
  .guide-modal__section h3{font-size:18px;font-weight:800;margin:0 0 12px;color:#4dabf7;border-bottom:1px solid #ffffff15;padding-bottom:6px}
  .guide-modal__list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
  .guide-modal__item{background:#ffffff08;border:1px solid #ffffff15;border-radius:10px;padding:8px 12px;font-size:13px}
  .guide-modal__item b{color:#4dabf7}
  .guide-modal__tips{background:linear-gradient(135deg,#22c55e15,#16a34a08);border:1px solid #22c55e44;border-radius:12px;padding:16px;margin-top:16px}
  .guide-modal__tips h4{margin:0 0 8px;color:#22c55e;font-size:15px}
  .guide-modal__tips ul{margin:0;padding-left:20px;line-height:1.8;font-size:14px;opacity:.9}
  .guide-modal__tips li{margin-bottom:4px}
  .master-bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 16px;background:#ffffff0d;border-radius:12px;border:1px solid #ffffff1a;max-width:1200px;width:100%;box-shadow:0 6px 20px #0004,0 0 0 1px #ffffff08 inset}
  .master-bar label{font-size:12px;opacity:.75;display:flex;align-items:center;gap:6px}
  .master-bar input[type="range"]{width:110px;accent-color:#4dabf7}
  .fx-toggle{padding:8px 12px;border-radius:10px;background:#ffffff0d;border:1px solid #ffffff1a;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .fx-toggle.active{background:linear-gradient(180deg,#22d3ee,#0891b2);border-color:#22d3ee;color:#001a1f}
  .settings-popup{position:fixed;background:linear-gradient(180deg,#1e1e33,#15152a);border:1px solid #ffffff22;border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;gap:10px;z-index:1500;box-shadow:0 12px 40px #000d,0 0 0 1px #ffffff10 inset;min-width:230px;animation:popup-in .22s cubic-bezier(.34,1.3,.64,1) both}
  @keyframes popup-in{0%{opacity:0;transform:translateY(6px) scale(.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
  .settings-popup__title{font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--char-color);text-transform:uppercase;text-align:center;padding-bottom:6px;border-bottom:1px solid #ffffff15;margin-bottom:2px}
  .settings-popup__row{display:flex;align-items:center;gap:8px}
  .settings-popup__row label{font-size:11px;opacity:.7;min-width:56px}
  .settings-popup__row input[type="range"]{flex:1;accent-color:var(--char-color)}
  .settings-popup__val{font-family:'Consolas',monospace;font-size:11px;color:#fff;opacity:.85;min-width:42px;text-align:right}
  .settings-popup__section{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;opacity:.5;margin-top:4px;margin-bottom:-2px}
  .settings-popup__pattern-row{display:flex;gap:4px;flex-wrap:wrap}
  .settings-popup__pattern-btn{padding:4px 8px;border-radius:6px;background:#ffffff11;border:1px solid #ffffff22;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;min-width:30px;transition:all .15s;flex:1}
  .settings-popup__pattern-btn:hover{background:#ffffff22}
  .settings-popup__pattern-btn.active{background:linear-gradient(180deg,#a855f7,#7c3aed);border-color:#a855f7;box-shadow:0 0 8px #a855f780}
  .settings-popup__actions{display:flex;gap:6px;margin-top:4px}
  .settings-popup__action{flex:1;padding:8px;border-radius:8px;background:#ffffff11;border:1px solid #ffffff22;color:#fff;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px}
  .settings-popup__action:hover{background:#ffffff22}
  .settings-popup__action.fav-active{background:linear-gradient(180deg,#fbbf24,#f59e0b);border-color:#fbbf24;color:#1a1a00}
  .settings-popup__action.solo-active{background:linear-gradient(180deg,#22c55e,#15803d);border-color:#22c55e;color:#fff}

<script>
const { h, render } = preact;
const { useState, useEffect, useRef, useCallback, useMemo } = preactHooks;
const html = htm.bind(h);

const BPM = 120;
const BEAT = 60 / BPM;
const ONE_BAR = BEAT * 4;
const DEFAULT_VOL = 0.65;
const DEFAULT_CUTOFF = 20000;
const PREVIEW_SECONDS = 4;
const SEQ_STEPS = 16;
const TAU = Math.PI * 2;

/* ============================================================
   ДЕТЕРМИНИРОВАННЫЙ PRNG

let __prngState = 0x9E3779B9 >>> 0;

  A2: 110.00, C3: 130.81, D3: 146.83, E3: 164.81, G3: 196.00,
  A3: 220.00, C4: 261.63, D4: 293.66, E4: 329.63, G4: 392.00,
  A4: 440.00, C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99,
  A5: 880.00, C6: 1046.50, E6: 1318.51,
};

const DB_NAME = 'musibox_db_pro';
const DB_VERSION = 1;
const STORE = 'kv';
let dbInstance = null;
function openDB() {
  return new Promise((resolve, reject) => {
    if (dbInstance) return resolve(dbInstance);
    try {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = (e) => { dbInstance = e.target.result; resolve(dbInstance); };
      req.onerror = () => reject(req.error);
    } catch(err) { reject(err); }
  });
}
async function idbGet(key) {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(undefined);
    });
  } catch(e) { return undefined; }
}
async function idbSet(key, value) {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE, 'readwrite');
      const req = tx.objectStore(STORE).put(value, key);
      req.onsuccess = () => resolve(true);
      req.onerror = () => resolve(false);
    });
  } catch(e) { return false; }
}

/* ============================================================
   МИГРАЦИЯ СТАРЫХ ВЕРСИЙ БД
   Переносит данные из musibox-*-v1..v8 в текущий v8.
   Запускается ОДИН РАЗ при загрузке страницы.
   ============================================================ */
const CURRENT_VER = 8;
async function migrateOldData() {
  const VERSIONS = [1,2,3,4,5,6,7,8];
  const KEYS = [
    { name: 'presets',   old: v => `musibox-presets-v${v}`,   cur: `musibox-presets-v${CURRENT_VER}` },
    { name: 'favorites', old: v => `musibox-favorites-v${v}`, cur: `musibox-favorites-v${CURRENT_VER}` },
    { name: 'volumes',   old: v => `musibox-volumes-v${v}`,   cur: `musibox-volumes-v${CURRENT_VER}` },
    { name: 'cutoffs',   old: v => `musibox-cutoffs-v${v}`,   cur: `musibox-cutoffs-v${CURRENT_VER}` },
    { name: 'master',    old: v => `musibox-master-v${v}`,    cur: `musibox-master-v${CURRENT_VER}` },
    { name: 'muted',     old: v => `musibox-muted-v${v}`,     cur: `musibox-muted-v${CURRENT_VER}` },
    { name: 'soloed',    old: v => `musibox-soloed-v${v}`,    cur: `musibox-soloed-v${CURRENT_VER}` },
    { name: 'patterns',  old: v => `musibox-patterns-v${v}`,  cur: `musibox-patterns-v${CURRENT_VER}` },
    { name: 'grid',      old: v => `musibox-grid-v${v}`,      cur: `musibox-grid-v${CURRENT_VER}` },
  ];
  for (const entry of KEYS) {
    const existing = await idbGet(entry.cur);
    if (existing !== undefined && existing !== null) continue;
    for (let i = VERSIONS.length - 1; i >= 0; i--) {
      const v = VERSIONS[i];
      if (v === CURRENT_VER) continue;
      const data = await idbGet(entry.old(v));
      if (data !== undefined && data !== null) {
        await idbSet(entry.cur, data);
        console.log(`[Musibox] Миграция ${entry.name}: v${v} → v${CURRENT_VER}`);
        break;
      }
    }
  }
}

function adsr(i, n, attack, decay, sustain, release) {
  const t = i / n;
  if (t < attack) return t / attack;
  if (t < attack + decay) return 1 - (1 - sustain) * ((t - attack) / decay);
  if (t < 1 - release) return sustain;
  return sustain * Math.max(0, (1 - t) / release);
}
function softClip(x, drive = 1.5) {
  const d = Math.tanh(drive);
  return Math.tanh(x * drive) / (d || 1);
}
function hann(n, i) { return 0.5 - 0.5 * Math.cos(TAU * i / n); }
function applyFade(d, sr, ms = 8) {
  const n = d.length;
  let f = Math.floor(sr * ms / 1000); f = Math.min(f, Math.floor(n / 2));
  if (f <= 0) return;
  for (let i = 0; i < f; i++) { const k = i / f; d[i] *= k; d[n - 1 - i] *= k; }
}
function normalize(d, peak = 0.7) {
  let p = 0;
  for (let i = 0; i < d.length; i++) { const a = d[i] < 0 ? -d[i] : d[i]; if (a > p) p = a; }
  if (p > 1e-6) { const g = peak / p; for (let i = 0; i < d.length; i++) d[i] *= g; }
}
function dcBlock(d) {
  let pIn = 0, pOut = 0; const R = 0.995;
  for (let i = 0; i < d.length; i++) {
    const x = d[i]; const y = x - pIn + R * pOut; pIn = x; pOut = y; d[i] = y;
  }
}
function lp1(d, sr, cut) {
  const dt = 1 / sr, rc = 1 / (TAU * cut), a = dt / (rc + dt); let y = 0;
  for (let i = 0; i < d.length; i++) { y += a * (d[i] - y); d[i] = y; }
}
function hp1(d, sr, cut) {
  const dt = 1 / sr, rc = 1 / (TAU * cut), a = rc / (rc + dt);
  let pIn = 0, pOut = 0;
  for (let i = 0; i < d.length; i++) {
    const x = d[i]; const y = a * (pOut + x - pIn); pIn = x; pOut = y; d[i] = y;
  }
}
function comb(d, sr, delayMs, fb) {
  const delay = Math.floor(sr * delayMs / 1000); const buf = new Float32Array(delay); let idx = 0;
  for (let i = 0; i < d.length; i++) {
    const out = buf[idx]; buf[idx] = d[i] + out * fb; d[i] = d[i] + out * 0.5; idx = (idx + 1) % delay;

}
function allpass(d, sr, delayMs, fb) {
  const delay = Math.floor(sr * delayMs / 1000); const buf = new Float32Array(delay); let idx = 0;
  for (let i = 0; i < d.length; i++) {
    const bOut = buf[idx]; const out = -d[i] + bOut; buf[idx] = d[i] + bOut * fb; d[i] = out; idx = (idx + 1) % delay;

}
function schroederReverb(d, sr, mix = 0.22) {
  const dry = new Float32Array(d);

function makeStereo(ctx, mono, pan = 0) {
  const sr = ctx.sampleRate;
  const L = new Float32Array(mono.length), R = new Float32Array(mono.length);

    R[i] = (i >= haas ? mono[i - haas] : 0) * gR;

}
function toBuf(ctx, len) {
  const b = ctx.createBuffer(1, len, ctx.sampleRate);

function bars(len, sr) {

  const fbg = ctx.createGain(); fbg.gain.value = fb;

function genMelody(ctx, len, opts) {
  const { notes, beats, wave = 'saw', env = [0.02, 0.15, 0.65, 0.15], detune = 0, filter = 0, drive = 1.4, pan = 0, reverb = 0, sub = 0, gliss = 0, vibrato = 0 } = opts;
  const sr = ctx.sampleRate;
  const mono = new Float32Array(len);

  for (let bar = 0; bar < totalBars; bar++) {
    for (const b of beats) {
      const beatPos = typeof b === 'number' ? b : b.t;
      const fTarget = typeof b === 'number' ? notes[noteIdx++ % notes.length] : b.f;
      const off = Math.floor(bar * barS + beatPos * BEAT * sr);
      const noteLen = (typeof b === 'object' && b.d) ? b.d : 0.9;
      const n = Math.floor(sr * BEAT * noteLen);
      let p1 = 0, p2 = 0, p3 = 0, lp = 0, vibPhase = 0, f = fTarget * 0.85;
      for (let i = 0; i < n && off + i < len; i++) {

        const envV = adsr(i, n, env[0], env[1], env[2], env[3]);
        if (gliss > 0 && t < gliss) {
          f += (fTarget - f) * (1 / sr / gliss) * 2;
        } else {
          f = fTarget;
        }
        let vib = 1;
        if (vibrato > 0) {
          vibPhase += TAU * 5.5 / sr;
          vib = 1 + Math.sin(vibPhase) * vibrato;
        }
        let s = 0;

          p1 += TAU * f * vib / sr; p2 += TAU * f * vib * (1 + detune) / sr; p3 += TAU * f * vib * (1 - detune) / sr;

        } else if (wave === 'sine') {
          p1 += TAU * f * vib / sr; s = Math.sin(p1) + (sub ? Math.sin(p1 * 0.5) * sub : 0);
        } else if (wave === 'tri') {
          p1 += TAU * f * vib / sr; s = Math.sin(p1) * 0.7 + Math.sin(p1 * 3) * 0.15 + Math.sin(p1 * 5) * 0.08;

          p1 += TAU * f * vib / sr; s = Math.sign(Math.sin(p1)) * 0.6 + Math.sin(p1) * 0.4;
        } else if (wave === 'bell') {
          p1 += TAU * f * vib / sr; p2 += TAU * f * vib * 2.76 / sr;

        } else if (wave === 'reed') {
          p1 += TAU * f * vib / sr;
          const saw = sawBl(f * vib, sr, p1);

function genDrum(ctx, len, opts) {
  const { hits, kind = 'kick', pan = 0, reverb = 0 } = opts;
  const sr = ctx.sampleRate;
  const mono = new Float32Array(len);
  const { barS, totalBars } = bars(len, sr);

          p += TAU * 185 / sr;

function genChordPad(ctx, len, opts) {
  const { notes, attack = 0.25, reverb = 0, pan = 0, detune = 0.003, lp = 0 } = opts;
  const sr = ctx.sampleRate;
  const voices = [];
  notes.forEach(f => {
    if (detune > 0) {
      voices.push({ f: f * (1 - detune), p: rnd() * TAU, g: 0.4, ch: 0 });
      voices.push({ f: f * (1 + detune), p: rnd() * TAU, g: 0.4, ch: 1 });
    } else {
      voices.push({ f, p: rnd() * TAU, g: 0.5, ch: 0 });
      voices.push({ f, p: rnd() * TAU, g: 0.5, ch: 1 });
    }
  });
  const L = new Float32Array(len), R = new Float32Array(len);
  let lpL = 0, lpR = 0;
  for (let i = 0; i < len; i++) {
    const env = adsr(i, len, attack, 0.2, 0.8, 0.25);
    let l = 0, r = 0;
    voices.forEach(v => {
      v.p += TAU * v.f / sr;
      const s = Math.sin(v.p) * v.g;
      if (v.ch === 0) l += s; else r += s;
    });
    if (lp > 0) {
      const a = (TAU * lp / sr) / (1 + TAU * lp / sr);
      lpL += a * (l - lpL); lpR += a * (r - lpR);
      l = lpL; r = lpR;
    }
    L[i] = l * env; R[i] = r * env;
  }
  dcBlock(L); dcBlock(R);
  if (reverb > 0) { schroederReverb(L, sr, reverb); schroederReverb(R, sr, reverb); }
  normalize(L, 0.6); normalize(R, 0.6);
  const buf = ctx.createBuffer(2, len, sr);
  buf.copyToChannel(L, 0); buf.copyToChannel(R, 1);
  return buf;
}

function Tooltip({ track, position }) {
  if (!track || !position) return null;
  return html`<div class="tooltip visible" style=${{
    left: position.x + 'px',
    top: (position.y + 20) + 'px',
    transform: position.x > window.innerWidth - 300 ? 'translateX(-100%)' : 'none'
  }}>
    <div class="tooltip__title">${track.label}</div>
    <div class="tooltip__desc">${track.desc || 'Описание недоступно'}</div>
  </div>`;
}

function Character({ id, label, color, emoji, active, previewing, pending, pendingProgress, previewProgress, isFav, isMuted, isSoloed, desc, onClick, onOpenSettings, onHover, onLeave, onTapInfo }) {
  const clickTimeout = useRef(null);
  const pressTimer = useRef(null);
  const isTouch = useRef(typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(hover: none)').matches);

  const handleClick = (e) => {
    try {
      const btn = e.currentTarget;
      const rect = btn.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
      ripple.style.position = 'absolute';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 650);
    } catch(_) {}
    if (!isTouch.current) { onClick(id); return; }
    if (clickTimeout.current) {
      clearTimeout(clickTimeout.current);
      clickTimeout.current = null;
      if (onTapInfo) onTapInfo(id, e);
      return;
    }
    clickTimeout.current = setTimeout(() => {
      clickTimeout.current = null;
      onClick(id);
    }, 220);
  };

  const handleContextMenu = (e) => {
    e.preventDefault();
    onOpenSettings(id, e);
  };

  const handleTouchStart = (e) => {
    if (!isTouch.current) return;
    pressTimer.current = setTimeout(() => {
      pressTimer.current = null;
      onOpenSettings(id, e);
    }, 600);
  };
  const handleTouchEnd = () => {
    if (pressTimer.current) { clearTimeout(pressTimer.current); pressTimer.current = null; }
  };

  const stateClass = (active ? ' character--active'
    : previewing ? ' character--preview'
    : pending ? ' character--pending' : '')
    + (isMuted ? ' character--muted' : '')
    + (isSoloed ? ' character--soloed' : '')
    + (isFav ? ' character--fav' : '');

  return html`<div class="character-wrap">
    <button class=${'character' + stateClass}
      style=${{ '--char-color': color }}
      onClick=${handleClick}
      onContextMenu=${handleContextMenu}
      onTouchStart=${handleTouchStart}
      onTouchEnd=${handleTouchEnd}
      onTouchCancel=${handleTouchEnd}
      onMouseEnter=${(e) => !isTouch.current && onHover && onHover(id, e.currentTarget)}
      onMouseLeave=${() => !isTouch.current && onLeave && onLeave()}
      aria-pressed=${active || previewing || pending}
      aria-label=${`${label}: ${desc}. Правый клик — настройки`}>
      <div class="circle">
        <span style=${{fontSize:'22px'}}>${emoji || '●'}</span>
        ${(isFav || isMuted || isSoloed) && html`<div class="badges">
          ${isFav && html`<div class="badge-mini fav">★</div>`}
          ${isSoloed && html`<div class="badge-mini solo">S</div>`}
          ${isMuted && html`<div class="badge-mini mute">M</div>`}
        </div>`}
      </div>
      <span class="character__label">${label}</span>
      ${(pending || previewing) && html`<div class="pending-bar">
        <div class="pending-bar__fill" style=${{
          width: ((pending ? pendingProgress : previewProgress) * 100) + '%',
          background: pending
            ? 'linear-gradient(90deg,#22d3ee,#0891b2)'
            : 'linear-gradient(90deg,#fbbf24,#f59e0b)',
          color: pending ? '#22d3ee' : '#fbbf24'
        }}></div>
      </div>`}
    </button>
  </div>`;
}

function SettingsPopup({ track, position, volume, cutoff, pattern, isFav, isMuted, isSoloed, onClose, onVolumeChange, onCutoffChange, onPatternChange, onToggleFav, onToggleMute, onToggleSolo }) {
  const ref = useRef(null);
  const fmtHz = (hz) => hz >= 1000 ? (hz/1000).toFixed(hz >= 10000 ? 0 : 1) + 'k' : Math.round(hz) + '';

  useEffect(() => {
    const handler = (e) => {
      if (ref.current && !ref.current.contains(e.target)) onClose();
    };
    setTimeout(() => document.addEventListener('mousedown', handler), 50);
    return () => document.removeEventListener('mousedown', handler);
  }, [onClose]);

  useEffect(() => {
    const handleEsc = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', handleEsc);
    return () => document.removeEventListener('keydown', handleEsc);
  }, [onClose]);

  const style = {
    left: Math.max(10, Math.min(position.x, window.innerWidth - 250)) + 'px',
    top: Math.max(10, Math.min(position.y, window.innerHeight - 400)) + 'px',
    '--char-color': track.color
  };

  return html`<div ref=${ref} class="settings-popup" style=${style}>
    <div class="settings-popup__title">${track.label}</div>

    <div class="settings-popup__row">
      <label>🔊 Звук</label>
      <input type="range" min="0" max="100" value=${Math.round(volume*100)}
        onChange=${(e) => onVolumeChange(track.id, Number(e.target.value)/100)} />
      <span class="settings-popup__val">${Math.round(volume*100)}%</span>
    </div>

    <div class="settings-popup__row">
      <label>🎚️ Частота</label>
      <input type="range" min="200" max="20000" step="100" value=${cutoff}
        onChange=${(e) => onCutoffChange(track.id, Number(e.target.value))} />
      <span class="settings-popup__val">${fmtHz(cutoff)}</span>
    </div>

    <div class="settings-popup__section">Ритм</div>
    <div class="settings-popup__pattern-row">
      ${[
        {v:'inf', l:'∞', t:'Играет всегда'},
        {v:'2-2', l:'2·2', t:'2 лупа играет, 2 молчит'},
        {v:'4-4', l:'4·4', t:'4 лупа играет, 4 молчит'},
        {v:'1-1', l:'1·1', t:'1 луп играет, 1 молчит'},
        {v:'1-3', l:'1·3', t:'1 луп играет, 3 молчит'},
      ].map(p => html`<button key=${p.v}
        class=${'settings-popup__pattern-btn' + ((pattern || 'inf') === p.v ? ' active' : '')}
        onClick=${() => onPatternChange(track.id, p.v)}
        title=${p.t}>${p.l}</button>`)}
    </div>

    <div class="settings-popup__section">Управление</div>
    <div class="settings-popup__actions">
      <button class=${'settings-popup__action' + (isSoloed ? ' solo-active' : '')}
        onClick=${() => onToggleSolo(track.id)}
        title="Solo — слышно только этот трек">🎯 Solo</button>
      <button class=${'settings-popup__action' + (isMuted ? ' mute-active' : '')}
        onClick=${() => onToggleMute(track.id)}
        title="Mute — заглушить">🔇 Mute</button>
    </div>
    <div class="settings-popup__actions">
      <button class=${'settings-popup__action' + (isFav ? ' fav-active' : '')}
        onClick=${() => onToggleFav(track.id)}
        style=${{width:'100%'}}
        title="Избранное">${isFav ? '★ В избранном' : '☆ В избранное'}</button>
    </div>
  </div>`;
}

function SequencerModal({ grid, currentStep, onToggle, onClear, onBulkSet, onClose, trackModes }) {
  const [selectedMode, setSelectedMode] = useState('active');

  const rows = useMemo(() => {
    if (selectedMode === 'active') {
      return Object.keys(trackModes).filter(k => trackModes[k]);
    }
    if (selectedMode === 'all') {
      return Object.keys(TRACKS);
    }
    return Object.keys(TRACKS).filter(k => TRACKS[k].mode === selectedMode);
  }, [selectedMode, trackModes]);

  const steps = Array.from({ length: SEQ_STEPS }, (_, i) => i);

  const applyPattern = (type) => {
    const newGrid = {};
    const rowIds = rows.filter(id => TRACKS[id]);

    const modeOrder = {
      drums: 0, perc: 1, low: 2, brass: 3, synth: 4, lead: 5,
      phonk: 2, memphis: 2, samba: 1, voices: 4, china: 3, romance: 4, beatbox: 1,
    };
    const sorted = [...rowIds].sort((a, b) => {
      const oa = modeOrder[TRACKS[a].mode] ?? 5;
      const ob = modeOrder[TRACKS[b].mode] ?? 5;
      return oa - ob;
    });

    if (type === 'classic') {
      sorted.forEach((id, i) => {
        const row = new Array(SEQ_STEPS).fill(false);
        let start = 0;
        if (i < 4) start = 0;
        else if (i < 8) start = 2;
        else if (i < 12) start = 5;
        else start = 9;
        for (let s = start; s < SEQ_STEPS; s++) row[s] = true;
        newGrid[id] = row;
      });
    } else if (type === 'crescendo') {
      sorted.forEach((id, i) => {
        const row = new Array(SEQ_STEPS).fill(false);
        const step = Math.floor((i / Math.max(1, sorted.length - 1)) * (SEQ_STEPS - 1));
        for (let s = step; s < SEQ_STEPS; s++) row[s] = true;
        newGrid[id] = row;
      });
    } else if (type === 'decrescendo') {
      sorted.forEach((id, i) => {
        const row = new Array(SEQ_STEPS).fill(false);
        const stopAt = SEQ_STEPS - Math.floor((i / Math.max(1, sorted.length - 1)) * (SEQ_STEPS - 2));
        for (let s = 0; s < stopAt; s++) row[s] = true;
        newGrid[id] = row;
      });
    } else if (type === 'wave') {
      sorted.forEach((id, i) => {
        const row = new Array(SEQ_STEPS).fill(false);
        const period = 6 + (i % 4);
        const phase = i * 0.7;
        for (let s = 0; s < SEQ_STEPS; s++) {
          const v = Math.sin((s / period) * TAU + phase);
          if (v > 0) row[s] = true;
        }
        if (!row.some(Boolean)) row[0] = true;
        newGrid[id] = row;
      });
    } else if (type === 'all1') {
      sorted.forEach(id => {
        const row = new Array(SEQ_STEPS).fill(false);
        row[0] = true;
        newGrid[id] = row;
      });
    } else if (type === 'random') {
      sorted.forEach(id => {
        const row = new Array(SEQ_STEPS).fill(false);
        const fill = 0.4 + rnd() * 0.4;
        for (let s = 0; s < SEQ_STEPS; s++) {
          if (rnd() < fill) row[s] = true;
        }
        row[0] = true;
        newGrid[id] = row;
      });
    }

    if (onBulkSet) onBulkSet(newGrid);
  };

  return html`<div class="seq-modal show" onClick=${(e) => { if (e.target.classList.contains('seq-modal')) onClose(); }}>
    <div class="seq-modal__content">
      <div class="seq-modal__header">
        <div>
          <h2 class="seq-modal__title">🎬 Секвенсор</h2>
          <div style=${{fontSize:'12px',opacity:.6,marginTop:'4px'}}>
            Клик по клетке — вкл/выкл трек на этом такте. Сейчас играет: <b style=${{color:'#fbbf24'}}>такт ${currentStep + 1}</b>
          </div>
        </div>
        <div class="seq-controls">
          <select value=${selectedMode} onChange=${(e) => setSelectedMode(e.target.value)}
            style=${{padding:'8px 12px',borderRadius:'8px',background:'#ffffff11',border:'1px solid #ffffff22',color:'#fff',fontFamily:'inherit',fontSize:'13px',cursor:'pointer'}}>
            <option value="active">Только активные (${Object.keys(trackModes).filter(k=>trackModes[k]).length})</option>
            <option value="all">Все треки (${Object.keys(TRACKS).length})</option>
            ${MODES.filter(m => !m.isAll).map(m => html`<option key=${m.id} value=${m.id}>${m.icon} ${m.name}</option>`)}
          </select>
          <button class="seq-modal__close" onClick=${onClose} aria-label="Закрыть">×</button>
        </div>
      </div>

      <div class="seq-presets">
        <span class="seq-presets__label">✨ Шаблоны:</span>
        <button class="seq-preset-btn" onClick=${() => applyPattern('classic')} title="Барабаны → мелодия → всё вместе → финал">🎬 Интро→Финал</button>
        <button class="seq-preset-btn" onClick=${() => applyPattern('crescendo')} title="Постепенно нарастает">📈 Crescendo</button>
        <button class="seq-preset-btn" onClick=${() => applyPattern('decrescendo')} title="Постепенно уходит">📉 Decrescendo</button>
        <button class="seq-preset-btn" onClick=${() => applyPattern('wave')} title="Волнами то вкл, то выкл">🌊 Волна</button>
        <button class="seq-preset-btn" onClick=${() => applyPattern('all1')} title="Все треки только на 1-м такте">🎯 Все на 1</button>
        <button class="seq-preset-btn" onClick=${() => applyPattern('random')} title="Случайный рисунок">🎲 Случайно</button>
        <span style=${{flex:1}}></span>
        <button class="seq-preset-btn seq-preset-btn--danger" onClick=${onClear} title="Очистить всю сетку">🗑️ Очистить</button>
      </div>

      <div class="seq-legend">
        <span><span class="dot on"></span> играет</span>
        <span><span class="dot off"></span> молчит</span>
        <span>🟡 = текущий такт</span>
        <span>Голубые столбцы = начало фразы (1, 5, 9, 13)</span>
      </div>

      <div class="seq-grid-wrap">
        ${rows.length === 0
          ? html`<div style=${{padding:'30px',textAlign:'center',opacity:.6}}>
              Нет активных треков. Включи хоть один в основном окне.
            </div>`
          : html`<table class="seq-grid">
              <thead>
                <tr>
                  <th class="label-col">Трек</th>
                  ${steps.map(s => html`<th key=${s}
                    class=${(s % 4 === 0 ? 'beat-mark ' : '') + (s === currentStep ? 'now-mark' : '')}>
                    ${s + 1}
                  </th>`)}
                </tr>
              </thead>
              <tbody>
                ${rows.map(id => {
                  const tr = TRACKS[id];
                  if (!tr) return null;
                  const row = grid[id] || new Array(SEQ_STEPS).fill(false);
                  return html`<tr key=${id}>
                    <td class="label-col" style=${{color:tr.color}}>${tr.label}</td>
                    ${steps.map(s => html`<td key=${s}>
                      <div class=${'seq-cell' + (row[s] ? ' on' : '') + (s === currentStep ? ' now' : '') + (s % 4 === 0 ? ' beat' : '')}
                        onClick=${() => onToggle(id, s)}
                        title=${`${tr.label} — такт ${s + 1}`}></div>
                    </td>`)}
                  </tr>`;
                })}
              </tbody>
            </table>`}
      </div>

      <div style=${{fontSize:'12px',opacity:.6,textAlign:'center',paddingTop:'4px'}}>
        Секвенсор работает поверх паттернов. Шаблоны заполняют сетку по драматургии.
      </div>
    </div>
  </div>`;
}

function useAudioManager(numBars) {
  const ctxRef = useRef(null);
  const buffersRef = useRef({});
  const sourcesRef = useRef({});
  const gainsRef = useRef({});
  const filtersRef = useRef({});
  const pannersRef = useRef({});
  const masterRef = useRef(null);
  const reverbRef = useRef(null);
  const delayRef = useRef(null);
  const recDestRef = useRef(null);
  const trackModesRef = useRef({});
  const volumesRef = useRef({});
  const cutoffsRef = useRef({});
  const loopStartTimeRef = useRef(0);
  const pendingRef = useRef({});
  const pendingStartRef = useRef({});
  const previewTimersRef = useRef({});
  const previewStartRef = useRef({});
  const lastProgressRef = useRef({});
  const lastPreviewRef = useRef({});
  const mutedRef = useRef(new Set());
  const soloedRef = useRef(new Set());
  const patternsRef = useRef({});
  const gridRef = useRef({});
  const lastLoopIdxRef = useRef(-1);

  const [isPlaying, setIsPlaying] = useState(false);
  const [trackModes, setTrackModes] = useState({});
  const [pendingTracks, setPendingTracks] = useState({});
  const [pendingProgress, setPendingProgress] = useState({});
  const [previewProgress, setPreviewProgress] = useState({});
  const [volumes, setVolumes] = useState(() => Object.fromEntries(Object.keys(TRACKS).map(k => [k, DEFAULT_VOL])));
  const [cutoffs, setCutoffs] = useState(() => Object.fromEntries(Object.keys(TRACKS).map(k => [k, DEFAULT_CUTOFF])));
  const [isRecording, setIsRecording] = useState(false);
  const [recordedUrl, setRecordedUrl] = useState(null);
  const [reverbOn, setReverbOn] = useState(true);
  const [delayOn, setDelayOn] = useState(true);
  const [masterVol, setMasterVol] = useState(0.55);
  const [mutedTracks, setMutedTracks] = useState(new Set());
  const [soloedTracks, setSoloedTracks] = useState(new Set());
  const [patterns, setPatterns] = useState({});
  const [grid, setGrid] = useState({});
  const [currentStep, setCurrentStep] = useState(0);
  const mediaRecRef = useRef(null);
  const chunksRef = useRef([]);

  useEffect(() => {
    (async () => {
      const v = await idbGet('musibox-volumes-v8');
      if (v && typeof v === 'object') {
        const merged = {}; Object.keys(TRACKS).forEach(k => { merged[k] = typeof v[k] === 'number' ? v[k] : DEFAULT_VOL; });
        setVolumes(merged);
      }
      const c = await idbGet('musibox-cutoffs-v8');
      if (c && typeof c === 'object') {
        const merged = {}; Object.keys(TRACKS).forEach(k => { merged[k] = typeof c[k] === 'number' ? c[k] : DEFAULT_CUTOFF; });
        setCutoffs(merged);
      }
      const mv = await idbGet('musibox-master-v8');
      if (typeof mv === 'number') setMasterVol(mv);
      const mt = await idbGet('musibox-muted-v8');
      if (Array.isArray(mt)) setMutedTracks(new Set(mt));
      const st = await idbGet('musibox-soloed-v8');
      if (Array.isArray(st)) setSoloedTracks(new Set(st));
      const pt = await idbGet('musibox-patterns-v8');
      if (pt && typeof pt === 'object') setPatterns(pt);
      const gr = await idbGet('musibox-grid-v8');
      if (gr && typeof gr === 'object') setGrid(gr);
    })();
  }, []);

  useEffect(() => { trackModesRef.current = trackModes; }, [trackModes]);
  useEffect(() => { mutedRef.current = mutedTracks; }, [mutedTracks]);
  useEffect(() => { soloedRef.current = soloedTracks; }, [soloedTracks]);
  useEffect(() => {
    patternsRef.current = patterns;
    const t = setTimeout(() => idbSet('musibox-patterns-v8', patterns), 300);
    return () => clearTimeout(t);
  }, [patterns]);
  useEffect(() => {
    gridRef.current = grid;
    const t = setTimeout(() => idbSet('musibox-grid-v8', grid), 300);
    return () => clearTimeout(t);
  }, [grid]);

  useEffect(() => {
    volumesRef.current = volumes;
    const t = setTimeout(() => idbSet('musibox-volumes-v8', volumes), 300);
    return () => clearTimeout(t);
  }, [volumes]);
  useEffect(() => {
    cutoffsRef.current = cutoffs;
    const t = setTimeout(() => idbSet('musibox-cutoffs-v8', cutoffs), 300);
    return () => clearTimeout(t);
  }, [cutoffs]);
  useEffect(() => {
    const t = setTimeout(() => idbSet('musibox-master-v8', masterVol), 300);
    return () => clearTimeout(t);
  }, [masterVol]);

  const getBuffer = useCallback((key) => {
    if (buffersRef.current[key]) return buffersRef.current[key];
    const ctx = ctxRef.current; if (!ctx || !GENERATORS[key]) return null;
    const len = Math.floor(ONE_BAR * numBars * ctx.sampleRate);
    resetSeed(seedFromString(key + '|' + numBars));
    try { buffersRef.current[key] = GENERATORS[key](ctx, len); }
    catch(e) { console.warn('Gen failed:', key, e); return null; }
    return buffersRef.current[key];
  }, [numBars]);

  const rebuildBuffers = useCallback(() => { buffersRef.current = {}; }, []);

  const init = useCallback(async () => {
    if (ctxRef.current) return;
    const ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    ctxRef.current = ctx;

    const master = ctx.createGain(); master.gain.value = 0.55;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 22; comp.ratio.value = 4;
    comp.attack.value = 0.005; comp.release.value = 0.25;
    const shaper = ctx.createWaveShaper();
    const N = 2048; const curve = new Float32Array(N);
    for (let i = 0; i < N; i++) { const x = (i / (N - 1)) * 2 - 1; curve[i] = Math.tanh(x * 1.15); }
    shaper.curve = curve; shaper.oversample = '4x';
    const tone = ctx.createBiquadFilter();
    tone.type = 'lowpass'; tone.frequency.value = 14000; tone.Q.value = 0.5;
    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -1.5; limiter.knee.value = 0;
    limiter.ratio.value = 20; limiter.attack.value = 0.002; limiter.release.value = 0.08;

    const reverb = ctx.createConvolver();
    resetSeed(seedFromString('reverb-ir-v1'));
    reverb.buffer = makeReverbIR(ctx, 3.2, 2.2);
    const reverbWet = ctx.createGain(); reverbWet.gain.value = 0.45;
    const reverbPre = ctx.createBiquadFilter();
    reverbPre.type = 'highpass'; reverbPre.frequency.value = 150;
    const reverbPost = ctx.createBiquadFilter();
    reverbPost.type = 'lowpass'; reverbPost.frequency.value = 11000;

    const delay = makeDelay(ctx, 0.32, 0.42, 0.4);

    master.connect(comp); comp.connect(shaper); shaper.connect(tone); tone.connect(limiter); limiter.connect(ctx.destination);
    master.connect(reverbPre); reverbPre.connect(reverb); reverb.connect(reverbPost); reverbPost.connect(reverbWet); reverbWet.connect(comp);
    master.connect(delay.input); delay.output.connect(comp);

    const recDest = ctx.createMediaStreamDestination();
    limiter.connect(recDest);

    masterRef.current = master;
    reverbRef.current = { node: reverb, wet: reverbWet };
    delayRef.current = delay;
    recDestRef.current = recDest;
  }, []);

  useEffect(() => {
    if (!masterRef.current) return;
    masterRef.current.gain.setTargetAtTime(masterVol, ctxRef.current.currentTime, 0.05);
  }, [masterVol]);
  useEffect(() => {
    if (reverbRef.current) reverbRef.current.wet.gain.setTargetAtTime(reverbOn ? 0.45 : 0, ctxRef.current.currentTime, 0.1);
  }, [reverbOn]);
  useEffect(() => {
    if (delayRef.current) delayRef.current.output.gain.setTargetAtTime(delayOn ? 0.4 : 0, ctxRef.current.currentTime, 0.1);
  }, [delayOn]);

  const clearPreviewState = useCallback((key) => {
    if (previewTimersRef.current[key]) {
      clearTimeout(previewTimersRef.current[key]);
      delete previewTimersRef.current[key];
    }
    delete previewStartRef.current[key];
    setPreviewProgress(prev => {
      if (!(key in prev)) return prev;
      const n = { ...prev }; delete n[key]; return n;
    });
  }, []);

  const stopAllSources = useCallback(() => {
    Object.values(sourcesRef.current).forEach(s => { try { s.stop(); } catch(e) {} try { s.disconnect(); } catch(e) {} });
    Object.values(gainsRef.current).forEach(g => { try { g.disconnect(); } catch(e) {} });
    Object.values(filtersRef.current).forEach(f => { try { f.disconnect(); } catch(e) {} });
    Object.values(pannersRef.current).forEach(p => { try { p.disconnect(); } catch(e) {} });
    Object.values(previewTimersRef.current).forEach(t => clearTimeout(t));
    sourcesRef.current = {}; gainsRef.current = {}; filtersRef.current = {}; pannersRef.current = {};
    pendingRef.current = {}; pendingStartRef.current = {};
    previewTimersRef.current = {}; previewStartRef.current = {};
    lastProgressRef.current = {}; lastPreviewRef.current = {};
    lastLoopIdxRef.current = -1;
    setPendingTracks({}); setPendingProgress({}); setPreviewProgress({});
  }, []);

  const stopTrack = useCallback((key) => {
    clearPreviewState(key);
    const src = sourcesRef.current[key]; const g = gainsRef.current[key];
    const filt = filtersRef.current[key]; const panner = pannersRef.current[key];
    if (src && g) {
      try {
        const now = ctxRef.current.currentTime;
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 0.035);
        setTimeout(() => {
          try { src.stop(); } catch(e) {}
          try { src.disconnect(); } catch(e) {}
          try { g.disconnect(); } catch(e) {}
          if (filt) { try { filt.disconnect(); } catch(e) {} }
          if (panner) { try { panner.disconnect(); } catch(e) {} }
        }, 50);
      } catch(e) {}
    }
    delete sourcesRef.current[key]; delete gainsRef.current[key];
    delete filtersRef.current[key]; delete pannersRef.current[key];
    pendingRef.current[key] = false; pendingStartRef.current[key] = 0;
    setPendingTracks(prev => { const n = { ...prev }; delete n[key]; return n; });
  }, [clearPreviewState]);

  const attachSource = useCallback((key, whenTime) => {
    const ctx = ctxRef.current; if (!ctx) return;
    const buf = getBuffer(key); if (!buf) return;
    if (sourcesRef.current[key]) return;

    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const filt = ctx.createBiquadFilter(); filt.type = 'lowpass';
    filt.frequency.value = cutoffsRef.current[key] ?? DEFAULT_CUTOFF; filt.Q.value = 0.7;
    const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    const g = ctx.createGain();
    const baseVol = volumesRef.current[key] ?? DEFAULT_VOL;
    const soloed = soloedRef.current;
    const targetVol = soloed.size > 0
      ? (soloed.has(key) ? baseVol : 0)
      : (mutedRef.current.has(key) ? 0 : baseVol);
    g.gain.value = 0; g.gain.linearRampToValueAtTime(targetVol, whenTime + 0.03);
    if (panner) src.connect(filt).connect(panner).connect(g).connect(masterRef.current);
    else src.connect(filt).connect(g).connect(masterRef.current);
    src.start(whenTime);
    sourcesRef.current[key] = src;
    gainsRef.current[key] = g;
    filtersRef.current[key] = filt;
    if (panner) pannersRef.current[key] = panner;

    if (trackModesRef.current[key] === 'preview') {
      if (previewTimersRef.current[key]) clearTimeout(previewTimersRef.current[key]);
      previewStartRef.current[key] = whenTime;
      const delayMs = Math.max(0, (whenTime - ctx.currentTime) * 1000) + PREVIEW_SECONDS * 1000;
      previewTimersRef.current[key] = setTimeout(() => {
        if (trackModesRef.current[key] === 'preview') {
          stopTrack(key);
          setTrackModes(prev => {
            if (!(key in prev)) return prev;
            const n = { ...prev }; delete n[key]; return n;
          });
        }
        delete previewTimersRef.current[key];
        delete previewStartRef.current[key];
        setPreviewProgress(prev => {
          if (!(key in prev)) return prev;
          const n = { ...prev }; delete n[key]; return n;
        });
      }, delayMs);
    }
  }, [getBuffer, stopTrack]);

  const startTrackQuantized = useCallback((key) => {
    const ctx = ctxRef.current;
    const buf = getBuffer(key);
    if (!ctx || !buf) return;
    if (sourcesRef.current[key] || pendingRef.current[key]) return;

    const loopSec = ONE_BAR * numBars;
    const elapsed = ctx.currentTime - loopStartTimeRef.current;
    const posInLoop = elapsed >= 0 ? (elapsed % loopSec) : 0;
    const timeToNextLoop = loopSec - posInLoop;
    const isAlmostNow = timeToNextLoop < 0.1;
    const whenTime = isAlmostNow ? ctx.currentTime + 0.02 : ctx.currentTime + timeToNextLoop + 0.02;

    pendingRef.current[key] = true; pendingStartRef.current[key] = whenTime;
    setPendingTracks(prev => ({ ...prev, [key]: true }));

    attachSource(key, whenTime);

    const delayMs = Math.max(0, (whenTime - ctx.currentTime) * 1000);
    setTimeout(() => {
      if (pendingRef.current[key]) {
        pendingRef.current[key] = false; pendingStartRef.current[key] = 0;
        setPendingTracks(prev => { const n = { ...prev }; delete n[key]; return n; });
        setPendingProgress(prev => { const n = { ...prev }; delete n[key]; return n; });
      }
    }, delayMs + 30);
  }, [numBars, getBuffer, attachSource]);

  const start = useCallback(async () => {
    await init();
    const ctx = ctxRef.current;
    if (ctx.state === 'suspended') await ctx.resume();
    setIsPlaying(true);
    const t0 = ctx.currentTime + 0.05;
    loopStartTimeRef.current = t0;
    lastLoopIdxRef.current = -1;
    Object.keys(trackModesRef.current).forEach(key => {
      if (trackModesRef.current[key]) attachSource(key, t0);
    });
  }, [init, attachSource]);

  const stop = useCallback(() => {
    setIsPlaying(false);
    setTrackModes(prev => {
      const n = { ...prev };
      Object.keys(n).forEach(k => { if (n[k] === 'preview') delete n[k]; });
      return n;
    });
    stopAllSources();
    setCurrentStep(0);
  }, [stopAllSources]);

  const cycleTrack = useCallback((key) => {
    const cur = trackModesRef.current[key];
    const next = !cur ? 'preview' : cur === 'preview' ? 'loop' : null;
    if (next === null) delete trackModesRef.current[key];
    else trackModesRef.current[key] = next;
    setTrackModes(prev => {
      const n = { ...prev };
      if (next === null) delete n[key];
      else n[key] = next;
      return n;
    });
  }, []);

  const setTrackSet = useCallback((tracksObj) => {
    const normalized = {};
    Object.keys(tracksObj).forEach(k => {
      const v = tracksObj[k];
      if (v === true) normalized[k] = 'loop';
      else if (v === 'preview' || v === 'loop') normalized[k] = v;
    });
    trackModesRef.current = normalized;
    setTrackModes(normalized);
  }, []);

  const reset = useCallback(() => {
    stop();
    setTrackModes({});
    trackModesRef.current = {};
    setPatterns({}); patternsRef.current = {};
    setGrid({}); gridRef.current = {};
    setMutedTracks(new Set()); mutedRef.current = new Set();
    setSoloedTracks(new Set()); soloedRef.current = new Set();
    lastLoopIdxRef.current = -1;
    const dVol = Object.fromEntries(Object.keys(TRACKS).map(k => [k, DEFAULT_VOL]));
    const dCut = Object.fromEntries(Object.keys(TRACKS).map(k => [k, DEFAULT_CUTOFF]));
    setVolumes(dVol); setCutoffs(dCut);
    idbSet('musibox-volumes-v8', dVol); idbSet('musibox-cutoffs-v8', dCut);
    idbSet('musibox-patterns-v8', {}); idbSet('musibox-grid-v8', {});
    idbSet('musibox-muted-v8', []); idbSet('musibox-soloed-v8', []);
  }, [stop]);

  const changeVolume = useCallback((key, val) => {
    setVolumes(prev => ({ ...prev, [key]: val }));
    const g = gainsRef.current[key]; const ctx = ctxRef.current;
    if (g && ctx) {
      const now = ctx.currentTime;
      const soloed = soloedRef.current;
      const target = soloed.size > 0 ? (soloed.has(key) ? val : 0) : (mutedRef.current.has(key) ? 0 : val);
      g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
      g.gain.linearRampToValueAtTime(target, now + 0.08);
    }
  }, []);

  const changeCutoff = useCallback((key, val) => {
    setCutoffs(prev => ({ ...prev, [key]: val }));
    const filt = filtersRef.current[key]; const ctx = ctxRef.current;
    if (filt && ctx) {
      const now = ctx.currentTime;
      filt.frequency.cancelScheduledValues(now); filt.frequency.setValueAtTime(filt.frequency.value, now);
      filt.frequency.linearRampToValueAtTime(val, now + 0.05);
    }
  }, []);

  const setVolumesAll = useCallback((v) => {
    setVolumes(prev => {
      const merged = { ...prev, ...v };
      volumesRef.current = merged;
      const ctx = ctxRef.current;
      if (ctx) {
        const now = ctx.currentTime;
        const soloed = soloedRef.current;
        Object.keys(v).forEach(key => {
          const g = gainsRef.current[key];
          if (g) {
            const baseVol = merged[key] ?? DEFAULT_VOL;
            const target = soloed.size > 0
              ? (soloed.has(key) ? baseVol : 0)
              : (mutedRef.current.has(key) ? 0 : baseVol);
            g.gain.cancelScheduledValues(now);
            g.gain.setValueAtTime(g.gain.value, now);
            g.gain.linearRampToValueAtTime(target, now + 0.08);
          }
        });
      }
      return merged;
    });
  }, []);

  const setCutoffsAll = useCallback((c) => {
    setCutoffs(prev => {
      const merged = { ...prev, ...c };
      cutoffsRef.current = merged;
      const ctx = ctxRef.current;
      if (ctx) {
        const now = ctx.currentTime;
        Object.keys(c).forEach(key => {
          const filt = filtersRef.current[key];
          if (filt) {
            filt.frequency.cancelScheduledValues(now);
            filt.frequency.setValueAtTime(filt.frequency.value, now);
            filt.frequency.linearRampToValueAtTime(merged[key] ?? DEFAULT_CUTOFF, now + 0.05);
          }
        });
      }
      return merged;
    });
  }, []);

  const setPatternsAll = useCallback((p) => {
    const obj = (p && typeof p === 'object') ? p : {};
    setPatterns(obj);
    patternsRef.current = obj;
    idbSet('musibox-patterns-v8', obj);
  }, []);

  const setGridAll = useCallback((g) => {
    const obj = (g && typeof g === 'object') ? g : {};
    setGrid(obj);
    gridRef.current = obj;
    idbSet('musibox-grid-v8', obj);
  }, []);

  const setMutedAll = useCallback((arr) => {
    const s = new Set(Array.isArray(arr) ? arr : []);
    setMutedTracks(s);
    mutedRef.current = s;
    idbSet('musibox-muted-v8', [...s]);
  }, []);

  const setSoloedAll = useCallback((arr) => {
    const s = new Set(Array.isArray(arr) ? arr : []);
    setSoloedTracks(s);
    soloedRef.current = s;
    idbSet('musibox-soloed-v8', [...s]);
  }, []);

  const toggleMute = useCallback((key) => {
    setMutedTracks(prev => {
      const n = new Set(prev);
      if (n.has(key)) n.delete(key); else n.add(key);
      mutedRef.current = n;
      idbSet('musibox-muted-v8', [...n]);
      return n;
    });
  }, []);

  const toggleSolo = useCallback((key) => {
    setSoloedTracks(prev => {
      const n = new Set(prev);
      if (n.has(key)) n.delete(key); else n.add(key);
      soloedRef.current = n;
      idbSet('musibox-soloed-v8', [...n]);
      return n;
    });
  }, []);

  const setPatternFor = useCallback((key, value) => {
    setPatterns(prev => {
      const n = { ...prev };
      if (!value || value === 'inf') delete n[key];
      else n[key] = value;
      patternsRef.current = n;
      return n;
    });
  }, []);

  const toggleStep = useCallback((trackId, step) => {
    setGrid(prev => {
      const row = prev[trackId] ? [...prev[trackId]] : new Array(SEQ_STEPS).fill(false);
      row[step] = !row[step];
      const n = { ...prev, [trackId]: row };
      if (!row.some(Boolean)) delete n[trackId];
      gridRef.current = n;
      return n;
    });
  }, []);

  const setGridBulk = useCallback((newGrid) => {
    setGrid(newGrid);
    gridRef.current = newGrid;
    idbSet('musibox-grid-v8', newGrid);
  }, []);

  const clearGrid = useCallback(() => { setGrid({}); gridRef.current = {}; idbSet('musibox-grid-v8', {}); }, []);

  useEffect(() => {
    if (!isPlaying) return;
    const ctx = ctxRef.current; if (!ctx) return;
    const now = ctx.currentTime;
    Object.keys(TRACKS).forEach(key => {
      const g = gainsRef.current[key];
      if (!g) return;
      const baseVol = volumesRef.current[key] ?? DEFAULT_VOL;
      const soloed = soloedRef.current;
      const target = soloed.size > 0
        ? (soloed.has(key) ? baseVol : 0)
        : (mutedRef.current.has(key) ? 0 : baseVol);
      g.gain.cancelScheduledValues(now);
      g.gain.setValueAtTime(g.gain.value, now);
      g.gain.linearRampToValueAtTime(target, now + 0.06);
    });
  }, [mutedTracks, soloedTracks, isPlaying]);

  useEffect(() => {
    if (!isPlaying) return;
    Object.keys(TRACKS).forEach(key => {
      const mode = trackModes[key];
      const want = !!mode;
      const existing = sourcesRef.current[key];
      if (want && !existing && !pendingRef.current[key]) startTrackQuantized(key);
      else if (!want && existing) stopTrack(key);
    });
  }, [trackModes, isPlaying, startTrackQuantized, stopTrack]);

  useEffect(() => {
    if (!ctxRef.current) return;
    const wasPlaying = isPlaying;
    stopAllSources();
    rebuildBuffers();
    if (wasPlaying) {
      const ctx = ctxRef.current; const t0 = ctx.currentTime + 0.05;
      loopStartTimeRef.current = t0;
      Object.keys(trackModesRef.current).forEach(key => {
        if (trackModesRef.current[key]) attachSource(key, t0);
      });
    }
    // eslint-disable-next-line
  }, [numBars]);

  useEffect(() => {
    if (!isPlaying) return;
    const loopSec = ONE_BAR * numBars;
    let raf;
    const tick = () => {
      const ctx = ctxRef.current;
      if (!ctx) { raf = requestAnimationFrame(tick); return; }
      const now = ctx.currentTime;

      const hasPending = Object.keys(pendingRef.current).some(k => pendingRef.current[k]);
      if (hasPending) {
        const elapsed = now - loopStartTimeRef.current;
        const posInLoop = elapsed >= 0 ? (elapsed % loopSec) : 0;
        const remaining = 1 - (posInLoop / loopSec);
        const p = {}; let changed = false;
        Object.keys(pendingRef.current).forEach(k => {
          if (pendingRef.current[k]) {
            p[k] = remaining;
            if (Math.abs((lastProgressRef.current[k] ?? -1) - remaining) > 0.01) changed = true;
          }
        });
        if (changed) { lastProgressRef.current = p; setPendingProgress(p); }
      }

      const pKeys = Object.keys(previewStartRef.current);
      if (pKeys.length > 0) {
        const pp = {}; let changed = false;
        pKeys.forEach(k => {
          if (trackModesRef.current[k] === 'preview') {
            const elapsed = now - previewStartRef.current[k];
            if (elapsed > 0) {
              const remaining = Math.max(0, 1 - elapsed / PREVIEW_SECONDS);
              pp[k] = remaining;
              if (Math.abs((lastPreviewRef.current[k] ?? -1) - remaining) > 0.01) changed = true;
            }
          }
        });
        if (changed || Object.keys(pp).length !== Object.keys(lastPreviewRef.current).length) {
          lastPreviewRef.current = pp;
          setPreviewProgress(pp);
        }
      }

      const curLoopFloat = (now - loopStartTimeRef.current) / loopSec;
      if (curLoopFloat >= 0) {
        const curLoopIdx = Math.floor(curLoopFloat);
        const curStep = ((curLoopIdx % SEQ_STEPS) + SEQ_STEPS) % SEQ_STEPS;

        if (curLoopIdx !== lastLoopIdxRef.current) {
          lastLoopIdxRef.current = curLoopIdx;
          setCurrentStep(curStep);

          const grid = gridRef.current;
          const patterns = patternsRef.current;
          const cycles = { '2-2': [2,2], '4-4': [4,4], '1-1': [1,1], '1-3': [1,3] };
          const hasAnyGrid = Object.keys(grid).length > 0;

          Object.keys(sourcesRef.current).forEach(key => {
            const g = gainsRef.current[key];
            if (!g) return;

            let shouldPlay = true;

            const pat = patterns[key];
            if (pat && pat !== 'inf') {
              const cyc = cycles[pat] || [1, 0];
              const [on, off] = cyc;
              if (off > 0) {
                const total = on + off;
                const p = ((curLoopIdx % total) + total) % total;
                shouldPlay = p < on;
              }
            }

            if (hasAnyGrid) {
              const row = grid[key];
              if (row) {
                shouldPlay = shouldPlay && !!row[curStep];
              }
            }

            const baseVol = volumesRef.current[key] ?? DEFAULT_VOL;
            const soloed = soloedRef.current;
            const target = soloed.size > 0
              ? (soloed.has(key) ? (shouldPlay ? baseVol : 0) : 0)
              : (mutedRef.current.has(key) ? 0 : (shouldPlay ? baseVol : 0));

            g.gain.cancelScheduledValues(now);
            g.gain.setValueAtTime(g.gain.value, now);
            g.gain.linearRampToValueAtTime(target, now + 0.06);
          });
        }
      }

      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [isPlaying, numBars]);

  const startRecording = useCallback(async () => {
    await init();
    if (!isPlaying) await start();
    if (ctxRef.current.state === 'suspended') await ctxRef.current.resume();
    await new Promise(r => setTimeout(r, 150));
    const stream = recDestRef.current.stream;
    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
               : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
    const rec = new MediaRecorder(stream, { mimeType: mime });
    chunksRef.current = [];
    rec.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunksRef.current, { type: mime });
      const newUrl = URL.createObjectURL(blob);
      setRecordedUrl(prev => { if (prev) { try { URL.revokeObjectURL(prev); } catch(e) {} } return newUrl; });
    };
    rec.start(); mediaRecRef.current = rec; setIsRecording(true);
  }, [init, isPlaying, start]);

  const stopRecording = useCallback(() => {
    if (mediaRecRef.current && mediaRecRef.current.state !== 'inactive') mediaRecRef.current.stop();
    setIsRecording(false);
  }, []);

  useEffect(() => () => {
    stop();
    if (ctxRef.current) { try { ctxRef.current.close(); } catch(e) {} }
  }, [stop]);

  return {
    isPlaying, trackModes, volumes, cutoffs, pendingTracks, pendingProgress, previewProgress,
    start, stop, cycleTrack, reset, changeVolume, changeCutoff, setTrackSet,
    setVolumesAll, setCutoffsAll,
    mutedTracks, soloedTracks, toggleMute, toggleSolo,
    setMutedAll, setSoloedAll,
    patterns, setPatternFor, setPatternsAll,
    grid, currentStep, toggleStep, clearGrid, setGridBulk, setGridAll,
    isRecording, recordedUrl, startRecording, stopRecording,
    reverbOn, setReverbOn, delayOn, setDelayOn, masterVol, setMasterVol,
    rebuildBuffers,
  };
}

function useFavorites() {
  const [favorites, setFavorites] = useState(new Set());
  useEffect(() => {
    (async () => {
      const stored = await idbGet('musibox-favorites-v8');
      if (stored && Array.isArray(stored)) setFavorites(new Set(stored));
    })();
  }, []);
  const toggleFav = useCallback((id) => {
    setFavorites(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      idbSet('musibox-favorites-v8', [...next]);
      return next;
    });
  }, []);
  return { favorites, toggleFav };
}

function useDeviceType() {
  const calc = () => {
    if (typeof window === 'undefined') return 'desktop';
    const w = window.innerWidth;
    if (w >= 1400) return 'tv';
    if (w <= 640) return 'phone';
    if (w <= 1024) return 'tablet';
    return 'desktop';
  };
  const [type, setType] = useState(calc);
  useEffect(() => {
    const handler = () => setType(calc());
    window.addEventListener('resize', handler);
    window.addEventListener('orientationchange', handler);
    return () => {
      window.removeEventListener('resize', handler);
      window.removeEventListener('orientationchange', handler);
    };
  }, []);
  return type;
}

function Presets({ trackModes, applyTracks, showToast, volumes, cutoffs, patterns, grid, muted, soloed, numBars, masterVol, reverbOn, delayOn, onLoadVolumes, onLoadCutoffs, onLoadPatterns, onLoadGrid, onLoadMuted, onLoadSoloed, onLoadNumBars, onLoadMasterVol, onLoadReverbOn, onLoadDelayOn, onBeforeLoad, onAfterLoad }) {
  const [presets, setPresets] = useState([]);
  const nameRef = useRef(null);

  useEffect(() => {
    (async () => {
      const stored = await idbGet('musibox-presets-v8');
      if (stored && Array.isArray(stored)) setPresets(stored);
    })();
  }, []);

  const save = async () => {
    const nameVal = nameRef.current ? nameRef.current.value.trim() : '';
    const n = (nameVal || ('Микс ' + (presets.length + 1)));
    const next = [...presets, {
      name: n,
      tracks: { ...trackModes },
      volumes: { ...volumes },
      cutoffs: { ...cutoffs },
      patterns: { ...patterns },
      grid: { ...grid },
      muted: [...muted],
      soloed: [...soloed],
      numBars,
      masterVol,
      reverbOn,
      delayOn,
      date: Date.now()
    }];
    setPresets(next);
    await idbSet('musibox-presets-v8', next);
    if (nameRef.current) nameRef.current.value = '';
    if (showToast) showToast('💾 Микс «' + n + '» сохранён!');
  };
  const load = (p) => {
    if (onBeforeLoad) onBeforeLoad();
    if (typeof p.numBars === 'number' && [1,2,4,8].includes(p.numBars) && onLoadNumBars) {
      onLoadNumBars(p.numBars);
    }
    if (p.tracks) applyTracks(p.tracks);
    if (p.volumes && onLoadVolumes) onLoadVolumes(p.volumes);
    if (p.cutoffs && onLoadCutoffs) onLoadCutoffs(p.cutoffs);
    if (p.patterns && onLoadPatterns) onLoadPatterns(p.patterns);
    if (p.grid && onLoadGrid) onLoadGrid(p.grid);
    if (Array.isArray(p.muted) && onLoadMuted) onLoadMuted(p.muted);
    if (Array.isArray(p.soloed) && onLoadSoloed) onLoadSoloed(p.soloed);
    if (typeof p.masterVol === 'number' && onLoadMasterVol) onLoadMasterVol(p.masterVol);
    if (typeof p.reverbOn === 'boolean' && onLoadReverbOn) onLoadReverbOn(p.reverbOn);
    if (typeof p.delayOn === 'boolean' && onLoadDelayOn) onLoadDelayOn(p.delayOn);
    if (onAfterLoad) setTimeout(onAfterLoad, 100);
  };
  const del = async (i) => {
    const next = presets.filter((_, idx) => idx !== i);
    setPresets(next);
    await idbSet('musibox-presets-v8', next);
    if (showToast) showToast('🗑️ Микс удалён');
  };

  return html`<div class="presets-wrap">
    <div class="presets-row">
      <input class="preset-input" placeholder="Название микса…" ref=${nameRef} defaultValue="" />
      <button class="btn btn--ghost" onClick=${save}>💾 Сохранить микс</button>
    </div>
    ${presets.length > 0 && html`<div class="presets-list">
      ${presets.map((p, i) => html`<div key=${i} class="preset">
        <button class="btn btn--ghost" onClick=${() => load(p)}>▶ ${p.name}</button>
        <button class="btn btn--ghost" style=${{padding:'12px 14px'}} onClick=${() => del(i)} aria-label="Удалить">✕</button>
      </div>`)}
    </div>`}
  </div>`;
}
