<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Великая кулинария</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root {
    --bg-0: #100a06;
    --bg-1: #1a120b;
    --bg-2: #2b1e16;
    --bg-3: #3d2b20;
    --bg-4: #4d3628;
    --line: #5a4231;
    --accent: #a67b5b;
    --accent-light: #d4a080;
    --gold: #f0d5b0;
    --text: #d4c0a8;
    --text-dim: #b2957a;
    --success: #27ae60;
    --warning: #f39c12;
    --danger: #e74c3c;
    --info: #5b9bd5;
    --purple: #9b59b6;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 40px),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0 1px, transparent 1px 40px),
        radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg-0) 100%);
    color: var(--text);
    font-family: 'Luckiest Guy', cursive;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
    user-select: none;
    touch-action: manipulation;
}
.app {
    width: 100%; max-width: 540px; height: 100%; max-height: 880px;
    display: flex; flex-direction: column; position: relative;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,0.7));
}
.app-frame {
    background: linear-gradient(180deg, rgba(240,213,176,0.06) 0%, transparent 30%),
        linear-gradient(180deg, #4a3628 0%, #2b1e16 100%);
    border: 3px solid var(--accent); border-bottom-width: 7px; border-radius: 18px;
    width: 100%; height: 100%; display: flex; flex-direction: column;
    box-shadow: 0 0 60px rgba(166,123,91,0.5), inset 0 0 80px rgba(0,0,0,0.4),
        inset 0 2px 0 rgba(240,213,176,0.15);
    overflow: hidden; position: relative;
}
.header { padding: 10px 14px 8px; border-bottom: 2px solid rgba(90,66,49,0.5); position: relative; }
.header-title {
    font-size: 20px; color: var(--gold); text-align: center;
    text-shadow: 2px 2px 0 var(--bg-1), 0 0 20px rgba(240,213,176,0.5);
    letter-spacing: 1.5px; padding-right: 44px;
}
.header-sub {
    text-align: center; font-size: 9px; color: var(--text-dim);
    letter-spacing: 2px; text-transform: uppercase; padding-right: 44px; margin-top: 1px;
}
.icon-btn {
    position: absolute; top: 10px; right: 12px;
    background: linear-gradient(180deg, var(--bg-4), var(--bg-2));
    border: 2px solid var(--accent); border-radius: 50%;
    width: 34px; height: 34px; color: var(--gold); font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: 0.25s; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.icon-btn:hover { transform: rotate(45deg) scale(1.1); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 8px 14px 4px; }
.stat {
    display: flex; align-items: center; gap: 6px;
    background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
    border: 2px solid var(--line); border-radius: 8px;
    padding: 4px 10px; font-size: 11px; color: var(--text-dim);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
}
.stat b { color: var(--gold); font-weight: normal; }
.sub-tabs {
    display: flex; gap: 4px; margin: 6px 14px 4px;
    background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
    padding: 3px; border-radius: 10px; border: 2px solid var(--line);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
}
.sub-tab {
    flex: 1; padding: 6px 4px; border-radius: 7px; border: none;
    background: transparent; color: var(--text-dim); cursor: pointer;
    font-size: 11px; font-family: inherit; transition: 0.2s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sub-tab:hover { color: var(--text); }
.sub-tab.active {
    background: linear-gradient(180deg, var(--bg-4), var(--bg-3));
    color: var(--gold);
    box-shadow: 0 0 12px rgba(240,213,176,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
}
.content {
    flex: 1; overflow: hidden; padding: 0 10px 8px;
    position: relative; display: flex; flex-direction: column;
}
.panel { display: none; flex: 1; overflow: hidden; position: relative; }
.panel.active { display: flex; flex-direction: column; animation: panelIn 0.25s ease; }
@keyframes panelIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.scroll-area {
    flex: 1; overflow-y: auto; overflow-x: hidden; padding-right: 6px;
    scrollbar-width: thin; scrollbar-color: var(--accent) transparent;
}
.scroll-area::-webkit-scrollbar { width: 6px; }
.scroll-area::-webkit-scrollbar-track { background: transparent; }
.scroll-area::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
.scroll-area::-webkit-scrollbar-thumb:hover { background: var(--accent-light); }
.btn {
    display: block; width: 100%; padding: 10px 12px; margin: 5px 0;
    border-radius: 10px; border: 2px solid var(--accent); border-bottom-width: 4px;
    background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
    color: var(--gold); cursor: pointer; font-size: 13px;
    font-family: inherit; text-align: center; transition: 0.15s;
    box-shadow: 0 2px 0 rgba(0,0,0,0.4); letter-spacing: 0.3px;
}
.btn:hover:not(:disabled) { background: linear-gradient(180deg, var(--bg-4), var(--bg-3)); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 2px; box-shadow: none; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-primary { border-color: var(--gold); background: linear-gradient(180deg, var(--bg-4), var(--bg-3)); text-shadow: 0 0 8px rgba(240,213,176,0.4); }
.btn-secondary { border-color: var(--accent); color: var(--accent); }
.btn-gold { border-color: var(--gold); background: linear-gradient(180deg, #7a5a40, #5a4231); text-shadow: 0 0 8px rgba(240,213,176,0.6); }
.kitchen {
    position: relative; height: 90px; margin: 6px 0;
    display: flex; justify-content: center; align-items: flex-end;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.3));
    border-radius: 12px; overflow: hidden;
}
.pot {
    width: 80px; height: 50px;
    background: linear-gradient(180deg, #8a8a8a, #3d3d3d);
    border-radius: 0 0 40px 40px; border: 3px solid #1a1a1a; border-top: none;
    position: relative; box-shadow: 0 8px 16px rgba(0,0,0,0.6);
}
.pot::before {
    content: ''; position: absolute; top: -5px; left: -8px; right: -8px; height: 10px;
    background: linear-gradient(180deg, #a0a0a0, #6a6a6a);
    border-radius: 50%; border: 2px solid #1a1a1a;
}
.pot::after {
    content: ''; position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    width: 26px; height: 14px; border: 3px solid #1a1a1a; border-bottom: none;
    border-radius: 13px 13px 0 0; background: linear-gradient(180deg, #8a8a8a, #5a5a5a);
}
.steam {
    position: absolute; bottom: 55px; width: 7px; height: 7px;
    background: rgba(255,255,255,0.4); border-radius: 50%;
    animation: steam 2.5s infinite; filter: blur(1.5px);
}
.steam:nth-child(1) { left: 30%; }
.steam:nth-child(2) { left: 45%; animation-delay: 0.6s; }
.steam:nth-child(3) { left: 60%; animation-delay: 1.2s; }
.steam:nth-child(4) { left: 70%; animation-delay: 1.8s; }
@keyframes steam {
    0% { transform: translateY(0) scale(1); opacity: 0.6; }
    100% { transform: translateY(-55px) scale(2.5); opacity: 0; }
}
.ingredient-category {
    color: var(--gold); margin: 10px 0 5px 0; font-size: 11px;
    padding-left: 8px; border-left: 3px solid var(--accent); letter-spacing: 0.5px;
}
.ingredient-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 4px; }
.ing-btn {
    padding: 8px 4px; border-radius: 8px; border: 2px solid var(--line);
    border-bottom-width: 4px; background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
    color: var(--text); font-size: 10px; cursor: pointer; font-family: inherit;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: 0.15s; box-shadow: 0 2px 0 rgba(0,0,0,0.4);
}
.ing-btn:hover { background: linear-gradient(180deg, var(--bg-4), var(--bg-3)); transform: translateY(-1px); }
.ing-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
.ing-btn.selected {
    border-color: var(--gold); color: var(--bg-2);
    background: linear-gradient(180deg, var(--gold), #d4b59a);
    box-shadow: 0 0 16px rgba(240,213,176,0.5), 0 2px 0 #8a6a4a;
    font-weight: bold;
}
.selected-row {
    text-align: center; font-size: 12px; color: var(--text-dim);
    margin: 6px 0; padding: 6px; background: rgba(0,0,0,0.2);
    border-radius: 8px; min-height: 26px;
}
.selected-row b { color: var(--gold); }
.result-box {
    background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
    padding: 14px; border-radius: 12px; border: 2px solid var(--gold);
    margin: 6px 0; text-align: center; color: var(--gold);
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 30px rgba(240,213,176,0.4);
}
@keyframes popIn {
    0% { transform: scale(0.7); opacity: 0; }
    60% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
}
.result-name { font-size: 17px; margin-bottom: 4px; }
.result-stars { font-size: 26px; letter-spacing: 4px; margin: 6px 0; text-shadow: 0 0 12px rgba(240,213,176,0.6); }
.result-info { font-size: 13px; }
.result-rewards { font-size: 12px; color: var(--accent); margin-top: 4px; }
.result-feedback { font-size: 12px; color: var(--text-dim); font-style: italic; margin-top: 4px; }
.customer {
    display: flex; align-items: center; gap: 10px; padding: 10px;
    background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
    border-radius: 12px; border: 2px solid var(--line); border-left-width: 4px;
    margin-bottom: 6px; animation: customerIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
}
.customer.no-anim { animation: none; }
@keyframes customerIn {
    from { transform: translateX(-30px) scale(0.95); opacity: 0; }
    to { transform: translateX(0) scale(1); opacity: 1; }
}
.customer.type-regular { border-left-color: var(--accent); }
.customer.type-gourmet { border-left-color: var(--purple); }
.customer.type-rich { border-left-color: #f1c40f; }
.customer.type-hurried { border-left-color: var(--danger); }
.customer.type-child { border-left-color: #3498db; }
.customer.type-elder { border-left-color: #95a5a6; }
.customer.type-critic { border-left-color: #c0392b; }
.customer.type-tourist { border-left-color: #1abc9c; }
.customer.type-vegan { border-left-color: var(--success); }
.customer.type-blogger { border-left-color: #e91e63; }
.cust-avatar { font-size: 32px; flex-shrink: 0; }
.cust-info { flex: 1; min-width: 0; }
.cust-name {
    color: var(--gold); font-size: 13px; display: flex;
    align-items: center; gap: 6px; flex-wrap: wrap;
}
.cust-type {
    font-size: 9px; padding: 1px 6px; border-radius: 8px;
    background: rgba(166,123,91,0.3); color: var(--gold);
    border: 1px solid rgba(240,213,176,0.3);
}
.cust-special {
    font-size: 9px; padding: 1px 6px; border-radius: 8px;
    background: linear-gradient(180deg, #ff6b6b, #c0392b);
    color: #fff; animation: specialPulse 0.8s infinite;
    box-shadow: 0 0 8px rgba(255,107,107,0.6);
}
@keyframes specialPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}
.cust-time { font-size: 11px; margin-left: auto; }
.cust-order {
    color: var(--text-dim); font-size: 11px; margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.patience-bar {
    height: 6px; background: var(--bg-1); border-radius: 3px;
    overflow: hidden; margin-top: 5px; border: 1px solid var(--bg-3);
}
.patience-fill { height: 100%; border-radius: 3px; transition: width 1s linear, background 0.3s; }
.cust-right { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; flex-shrink: 0; }
.cust-reward { color: var(--gold); font-size: 13px; font-weight: bold; }
.serve-btn {
    background: linear-gradient(180deg, #c49070, var(--accent));
    border: none; border-bottom: 3px solid #7a5a40;
    padding: 5px 12px; border-radius: 9px; color: var(--bg-2);
    font-size: 10px; cursor: pointer; font-family: inherit; font-weight: bold;
    white-space: nowrap; transition: 0.15s; box-shadow: 0 2px 0 #4a3628;
}
.serve-btn:hover { background: linear-gradient(180deg, var(--accent-light), #b88a6a); }
.serve-btn:active { transform: translateY(2px); border-bottom-width: 1px; }
.serve-btn.disabled {
    background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
    color: var(--text-dim); border-bottom-color: var(--line);
    cursor: not-allowed; pointer-events: none; font-weight: normal;
}
.empty-state {
    text-align: center; color: var(--text-dim);
    font-size: 12px; padding: 30px 20px;
}
.empty-icon { font-size: 40px; display: block; margin-bottom: 8px; opacity: 0.5; }
.shop-header {
    color: var(--gold); font-size: 12px; padding: 6px 8px;
    border-left: 3px solid var(--accent); margin-bottom: 5px;
    background: rgba(0,0,0,0.2); border-radius: 0 6px 6px 0;
}
.shop-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border: 2px solid var(--line); border-bottom-width: 3px;
    border-radius: 9px; margin-bottom: 4px; font-size: 11px; transition: 0.15s;
}
.shop-item:hover { border-color: var(--accent); }
.shop-item.owned { opacity: 0.6; }
.buy-btn {
    background: linear-gradient(180deg, var(--accent-light), var(--accent));
    border: none; border-bottom: 3px solid #7a5a40;
    padding: 5px 14px; border-radius: 8px; color: var(--bg-2);
    font-size: 10px; cursor: pointer; font-family: inherit; font-weight: bold;
    transition: 0.15s;
}
.buy-btn:hover:not(:disabled) { background: linear-gradient(180deg, var(--accent-light), #b88a6a); }
.buy-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 1px; }
.buy-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.book-item {
    padding: 7px 10px; border-radius: 8px; margin-bottom: 4px;
    font-size: 11px; color: var(--text);
    background: linear-gradient(90deg, var(--bg-3), var(--bg-2));
    border-left: 4px solid var(--accent); cursor: pointer;
    transition: 0.15s; display: flex; justify-content: space-between; align-items: center;
}
.book-item:hover { background: linear-gradient(90deg, var(--bg-4), var(--bg-3)); transform: translateX(3px); }
.book-item.rarity-rare { border-left-color: var(--info); }
.book-item.rarity-epic { border-left-color: var(--purple); }
.book-item.rarity-legendary {
    border-left-color: var(--gold);
    background: linear-gradient(90deg, rgba(240,213,176,0.15), var(--bg-2));
    box-shadow: 0 0 10px rgba(240,213,176,0.15);
}
.rename-btn {
    color: var(--text-dim); font-size: 10px; padding: 2px 6px;
    cursor: pointer; border-radius: 6px; transition: 0.15s;
}
.rename-btn:hover { color: var(--gold); background: rgba(240,213,176,0.1); }
.detail-box {
    background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
    border: 2px solid rgba(166,123,91,0.3); border-radius: 10px;
    padding: 10px; font-size: 11px; color: var(--text-dim); margin-top: 6px;
}
.card {
    padding: 10px; background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border: 2px solid var(--line); border-radius: 10px; margin-bottom: 6px;
    display: flex; gap: 10px; align-items: center; transition: 0.15s;
}
.card.unlocked {
    border-color: var(--accent);
    background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
}
.card-icon { font-size: 24px; flex-shrink: 0; }
.card-body { flex: 1; min-width: 0; }
.card-title { color: var(--gold); font-size: 12px; }
.card-title.locked { color: var(--text-dim); }
.card-desc { color: var(--text-dim); font-size: 10px; margin-top: 1px; }
.card-action {
    background: linear-gradient(180deg, var(--accent-light), var(--accent));
    border: none; border-bottom: 3px solid #7a5a40;
    padding: 5px 12px; border-radius: 8px; color: var(--bg-2);
    font-size: 10px; cursor: pointer; font-family: inherit;
    font-weight: bold; flex-shrink: 0;
}
.card-action:active { transform: translateY(2px); border-bottom-width: 1px; }
.card-action:disabled { opacity: 0.3; cursor: not-allowed; }
.restaurant-scene {
    background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
    border: 2px solid var(--accent); border-radius: 12px;
    padding: 12px; margin-bottom: 8px; min-height: 80px;
    display: flex; flex-wrap: wrap; gap: 6px;
    align-items: center; justify-content: center;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
}
.table-item {
    background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
    border: 2px solid var(--accent); border-radius: 10px;
    padding: 6px 10px; font-size: 20px;
    box-shadow: 0 0 12px rgba(240,213,176,0.2);
}
.restaurant-info {
    text-align: center; color: var(--text-dim);
    font-size: 11px; margin-bottom: 8px;
}
.restaurant-info b { color: var(--gold); }
.event-card {
    background: linear-gradient(135deg, var(--bg-3), var(--bg-2));
    border: 2px solid var(--accent); border-radius: 14px;
    padding: 14px; margin-bottom: 8px; text-align: center;
}
.event-icon { font-size: 48px; animation: float 3s ease-in-out infinite; }
@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}
.event-title { color: var(--gold); font-size: 17px; margin: 6px 0; }
.event-desc { color: var(--text-dim); font-size: 11px; }
.event-timer { color: var(--danger); font-size: 13px; margin-top: 6px; font-weight: bold; }
.task-card {
    background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border: 2px solid var(--accent); border-radius: 12px;
    padding: 12px; margin-bottom: 8px;
}
.task-title { color: var(--gold); font-size: 13px; margin-bottom: 6px; }
.task-progress {
    height: 12px; background: var(--bg-1); border-radius: 6px;
    overflow: hidden; border: 1px solid var(--line); margin: 6px 0;
}
.task-progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold));
    transition: width 0.4s; border-radius: 6px;
}
.task-row { display: flex; justify-content: space-between; align-items: center; }
.task-row span { color: var(--text-dim); font-size: 11px; }
.contest-card {
    background: linear-gradient(135deg, var(--bg-4), var(--bg-3));
    border: 3px solid var(--gold); border-radius: 14px;
    padding: 14px; margin-bottom: 8px; text-align: center;
    box-shadow: 0 0 30px rgba(240,213,176,0.2);
}
.contest-title { color: var(--gold); font-size: 17px; text-shadow: 2px 2px 0 var(--bg-1); }
.contest-prize { color: var(--gold); font-size: 15px; margin: 8px 0; }
.bottom-nav {
    display: flex; gap: 4px; padding: 8px 10px 10px;
    border-top: 2px solid rgba(90,66,49,0.6);
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.2));
}
.nav-btn {
    flex: 1; padding: 8px 2px; border-radius: 10px;
    border: 2px solid var(--line); border-bottom-width: 4px;
    background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
    color: var(--text-dim); cursor: pointer; font-family: inherit;
    font-size: 9px; display: flex; flex-direction: column; align-items: center;
    gap: 1px; transition: 0.2s; box-shadow: 0 3px 0 rgba(0,0,0,0.4);
}
.nav-btn-icon { font-size: 20px; transition: 0.2s; }
.nav-btn:hover { color: var(--text); }
.nav-btn.active {
    border-color: var(--gold); color: var(--gold);
    background: linear-gradient(180deg, #6d5040, var(--bg-4));
    transform: translateY(-3px);
    box-shadow: 0 6px 0 var(--bg-2), 0 0 20px rgba(240,213,176,0.4);
}
.nav-btn.active .nav-btn-icon { transform: scale(1.15); }
.nav-btn:active { transform: translateY(1px); }
.nav-btn.active:active { transform: translateY(-1px); }
.modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
    justify-content: center; align-items: center;
    z-index: 100; padding: 20px;
}
.modal.active { display: flex; animation: fadeIn 0.2s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-panel {
    background: linear-gradient(180deg, #4a3628, var(--bg-2));
    border: 3px solid var(--accent); border-bottom-width: 6px;
    border-radius: 16px; padding: 20px; max-width: 440px;
    width: 100%; max-height: 85vh; overflow-y: auto;
    box-shadow: 0 0 80px rgba(166,123,91,0.6);
}
.modal-panel::-webkit-scrollbar { width: 6px; }
.modal-panel::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
.modal-title {
    color: var(--gold); text-align: center;
    font-size: 20px; margin-bottom: 16px;
    text-shadow: 2px 2px 0 var(--bg-1);
}
.setting-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line);
    font-size: 13px; color: var(--text);
}
.setting-row:last-child { border-bottom: none; }
.toggle {
    position: relative; width: 48px; height: 26px;
    background: var(--bg-1); border-radius: 13px;
    cursor: pointer; border: 2px solid var(--bg-3);
    transition: 0.3s; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    flex-shrink: 0;
}
.toggle.on {
    background: linear-gradient(180deg, var(--accent-light), var(--accent));
    box-shadow: 0 0 12px rgba(240,213,176,0.4), inset 0 2px 4px rgba(0,0,0,0.3);
}
.toggle::after {
    content: ''; position: absolute; top: 1px; left: 1px;
    width: 20px; height: 20px;
    background: linear-gradient(180deg, var(--gold), #d4b59a);
    border-radius: 50%; transition: 0.3s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
}
.toggle.on::after { left: 23px; }
.save-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.save-slot {
    padding: 10px; background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
    border: 2px solid var(--line); border-bottom-width: 4px;
    border-radius: 10px; text-align: center;
    font-size: 11px; color: var(--text-dim);
    cursor: pointer; transition: 0.15s; position: relative;
}
.save-slot:hover { border-color: var(--gold); }
.save-slot.current {
    border-color: var(--success);
    box-shadow: 0 0 15px rgba(39,174,96,0.3);
}
.save-slot.current::before {
    content: '●'; position: absolute; top: 4px; right: 6px;
    color: var(--success); font-size: 10px;
    animation: dotPulse 1.5s infinite;
}
@keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.save-slot-title { color: var(--gold); font-size: 12px; }
.save-slot-time { font-size: 9px; margin-top: 3px; }
.save-actions { display: flex; gap: 4px; justify-content: center; margin-top: 6px; }
.save-actions button {
    padding: 3px 10px; border-radius: 6px;
    border: 1px solid rgba(166,123,91,0.4);
    background: transparent; color: var(--text-dim);
    cursor: pointer; font-size: 10px; font-family: inherit;
}
.save-actions button:hover { color: var(--gold); border-color: var(--gold); }
.toasts {
    position: fixed; top: 20px; right: 20px;
    z-index: 300; display: flex; flex-direction: column;
    gap: 8px; pointer-events: none; max-width: 320px;
}
.toast {
    background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
    border: 2px solid var(--accent); border-left-width: 5px;
    border-radius: 10px; padding: 10px 14px;
    color: var(--text); font-size: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: auto;
}
.toast.info { border-left-color: var(--info); }
.toast.success { border-left-color: var(--success); }
.toast.warning { border-left-color: var(--warning); }
.toast.danger { border-left-color: var(--danger); }
.toast.gold { border-left-color: var(--gold); }
@keyframes toastIn {
    from { transform: translateX(120%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
.toast.out { animation: toastOut 0.3s forwards; }
@keyframes toastOut { to { transform: translateX(120%); opacity: 0; } }
.cook-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    z-index: 150;
}
.cook-overlay.active { display: flex; }
.cook-content { text-align: center; }
.cook-pot {
    font-size: 90px; display: inline-block;
    animation: potShake 0.6s infinite; position: relative;
}
.cook-flame {
    position: absolute; bottom: -10px; left: 50%;
    transform: translateX(-50%); font-size: 40px;
    animation: flamePulse 0.3s infinite alternate;
}
@keyframes potShake {
    0%, 100% { transform: rotate(-6deg) translateY(0); }
    50% { transform: rotate(6deg) translateY(-4px); }
}
@keyframes flamePulse {
    from { transform: translateX(-50%) scale(0.9); opacity: 0.8; }
    to { transform: translateX(-50%) scale(1.1); opacity: 1; }
}
.cook-text {
    color: var(--gold); font-size: 22px; margin-top: 30px;
    text-shadow: 0 0 20px rgba(240,213,176,0.6); letter-spacing: 2px;
}
.cook-timer {
    color: #ffd700; font-size: 30px;
    display: inline-block; min-width: 40px;
    animation: countPulse 1s infinite;
}
@keyframes countPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}
.confetti {
    position: fixed; width: 10px; height: 10px;
    pointer-events: none; z-index: 200;
    animation: confettiFall 2s linear forwards;
}
@keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
</style>
</head>

function getDishIngredients(recipe) {

}

var Audio = {
    ctx: null,
    init: function() { if (this.ctx) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} },
    play: function(freq, dur, type, vol) {
        if (!state.soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        try {
            var osc = this.ctx.createOscillator();
            var gain = this.ctx.createGain();
            osc.type = type || 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(vol || 0.1, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime);
            osc.stop(this.ctx.currentTime + dur);
        } catch(e) {}
    },
    click: function() { this.play(880, 0.08, 'sine', 0.08); },
    coin: function() { var self = this; this.play(1000, 0.08, 'sine', 0.12); setTimeout(function(){ self.play(1400, 0.12, 'sine', 0.1); }, 60); },
    ding: function() { var self = this; this.play(1200, 0.15, 'sine', 0.15); setTimeout(function(){ self.play(1600, 0.2, 'sine', 0.12); }, 100); },
    error: function() { this.play(200, 0.2, 'square', 0.1); },
    sizzle: function() { if (!state.soundEnabled) return; var self = this; for (var i = 0; i < 5; i++) setTimeout(function(){ self.play(200 + Math.random() * 400, 0.05, 'sawtooth', 0.03); }, i * 60); },
    arrive: function() { var self = this; this.play(880, 0.1, 'sine', 0.13); setTimeout(function(){ self.play(1320, 0.15, 'sine', 0.11); }, 90); },
    leave: function() { var self = this; this.play(440, 0.15, 'triangle', 0.1); setTimeout(function(){ self.play(280, 0.22, 'triangle', 0.1); }, 130); }
};

function calcRating(ids) {
    var items = ids.map(getIng).filter(Boolean);
    var score = 0, bonus = 0;
    var cats = {
        meat: ['meat','chicken','pork','beef','lamb','turkey','sausage','bacon','ham','chorizo','duck','rabbit','venison','wagyu','kobe'],
        fish: ['fish','salmon','tuna','cod','shrimp','lobster','oyster','mussels','squid','octopus','crab','scallop','eel'],
        veggie: ['tomato','onion','carrot','mushroom','garlic','cabbage','potato','cucumber','beet','pumpkin','pepper','basil','broccoli','spinach','zucchini','eggplant','corn','peas','asparagus','artichoke','celery','leek','truffle'],
        fruit: ['apple','orange','berry','lemon','fig','pomegranate','banana','peach','pear','grape','watermelon','melon','kiwi','mango','pineapple','coconut','cherry','blueberry','raspberry','avocado','lime','apricot','plum'],
        dairy: ['cheese','milk','butter','egg','cream','yogurt','quail_egg','sour_cream','cottage','mozzarella','parmesan','feta','blue_cheese','brie'],
        grain: ['flour','bread','rice','noodles','pasta','buckwheat','oats','quinoa','couscous'],
        spice: ['salt','pepper','basil','mint','ginger','garlic','honey','sauce','soy_sauce','vinegar','mayo','ketchup','mustard','cinnamon','vanilla','nutmeg','oregano','thyme','rosemary','curry','paprika','turmeric','chili','wasabi','chocolate','cocoa'],
        luxury: ['caviar','truffle','foie_gras','saffron','gold_leaf','wagyu','kobe','lobster','oyster']
    };
    var has = function(cat) { return items.some(function(i){ return cats[cat].indexOf(i.id) !== -1; }); };
    if (has('meat')) score += 3;
    if (has('fish')) score += 3;
    if (has('veggie')) score += 2;
    if (has('fruit')) score += 2;
    if (has('dairy')) score += 2;
    if (has('grain')) score += 1;
    if (has('spice')) score += 1;
    if (has('luxury')) score += 5;
    getActiveEvents().forEach(function(ev) {
        if (ev.bonus === 'pumpkin' && items.some(function(i){ return i.id === 'pumpkin'; })) score += 2;
        if (ev.bonus === 'meat' && has('meat')) score += 2;
    });
    if (has('meat') && has('veggie')) bonus += 1;
    if (has('fish') && items.some(function(i){ return i.id === 'lemon'; })) bonus += 1;
    if (has('dairy') && has('grain')) bonus += 1;
    if (has('fruit') && has('spice')) bonus += 1;
    if (has('luxury') && has('meat')) bonus += 2;
    if (has('luxury') && has('fish')) bonus += 2;
    if (has('luxury') && has('fruit')) bonus += 2;
    return Math.min(10, Math.max(1, Math.round(score + bonus)));
}

function getAvailableDishes() {
    var dishes = [];
    for (var key in RECIPES) {
        var ings = key.split(',');
        var ok = ings.every(function(i){ return state.unlocked.indexOf(i) !== -1; });
        if (ok) {
            RECIPES[key].forEach(function(r) {
                if (dishes.indexOf(r) === -1) dishes.push(r);
            });
        }
    }
    state.discovered.forEach(function(r) {
        if (r.indexOf('✏️') === 0 && dishes.indexOf(r) === -1) dishes.push(r);
    });
    return dishes;
}

    var navBtns = document.querySelectorAll('.nav-btn');
    for (var i = 0; i < navBtns.length; i++) {
        navBtns[i].classList.toggle('active', navBtns[i].dataset.tab === tab);
    }
    renderSubTabs();
    renderContent();
}

    Audio.click();
    state.activeSub[state.activeMain] = sub;
    renderSubTabs();
    renderContent();

function renderSubTabs() {
    var subs = TABS[state.activeMain];
    var el = $id('subTabs');
    if (subs.length === 0) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = 'flex';
    var current = state.activeSub[state.activeMain];
    el.innerHTML = subs.map(function(s) {
        return '<button class="sub-tab ' + (s.id === current ? 'active' : '') + '" onclick="switchSub(\'' + s.id + '\')">' + s.name + '</button>';
    }).join('');
}

    $id('s-level').textContent = state.level;
    $id('s-coins').textContent = state.coins;
    $id('s-rep').textContent = state.reputation;
    $id('s-xp').textContent = Math.max(0, getRequiredXP(state.level) - state.xp);
}

function renderContent() {
    var main = state.activeMain;
    var sub = state.activeSub[main];
    var content = $id('content');
    var html = '';
    if (main === 'cook') html = sub === 'cook' ? renderCookingPanel() : renderBookQuickPanel();
    else if (main === 'restaurant') {
        if (sub === 'customers') html = renderCustomersPanel();
        else if (sub === 'upgrades') html = renderUpgradesPanel();
        else if (sub === 'events') html = renderEventsPanel();
    }
    else if (main === 'shop') html = renderShopPanel();
    else if (main === 'progress') {
        if (sub === 'collection') html = renderCollectionPanel();
        else if (sub === 'achievements') html = renderAchievementsPanel();
        else if (sub === 'skills') html = renderSkillsPanel();
    }
    content.innerHTML = html;
    updateStats();
    if (main === 'restaurant' && sub === 'customers') syncCustomerTimers();
}

function renderCookingPanel() {
    var unlockedByCat = {};
    INGREDIENTS.forEach(function(ing) {
        if (state.unlocked.indexOf(ing.id) === -1) return;
        if (!unlockedByCat[ing.cat]) unlockedByCat[ing.cat] = [];
        unlockedByCat[ing.cat].push(ing);
    });
    var grid = '';
    for (var cat in CATEGORY_NAMES) {
        var items = unlockedByCat[cat];
        if (!items || items.length === 0) continue;
        grid += '<div class="ingredient-category">' + CATEGORY_NAMES[cat] + '</div><div class="ingredient-grid">';
        items.forEach(function(ing) {
            var sel = state.selected.indexOf(ing.id) !== -1 ? ' selected' : '';
            grid += '<button class="ing-btn' + sel + '" data-ing="' + ing.id + '" onclick="toggleIng(\'' + ing.id + '\')">' + ing.name + '</button>';
        });
        grid += '</div>';
    }
    var selectedNames = state.selected.map(function(id){ return (getIng(id) || {}).name || id; }).join(', ') || '—';
    return '<div class="panel active">' +
        '<div class="kitchen">' +

        '<div class="pot"></div></div>' +

function toggleIng(id) {
    if (state.isCooking) return;
    Audio.click();
    if (state.selected.indexOf(id) !== -1) {
        state.selected = state.selected.filter(function(i){ return i !== id; });
    } else {
        if (state.selected.length >= 3) { toast('Максимум 3 ингредиента!', 'warning'); return; }
        state.selected.push(id);
    }
    var btn = document.querySelector('[data-ing="' + id + '"]');
    if (btn) btn.classList.toggle('selected', state.selected.indexOf(id) !== -1);
    var selText = document.querySelector('.selected-row b');
    if (selText) {
        selText.textContent = state.selected.map(function(i){ return (getIng(i) || {}).name || i; }).join(', ') || '—';
    }
    var cookBtn = $id('cookBtn');
    if (cookBtn) cookBtn.disabled = state.selected.length !== 3 || state.isCooking;
}

function clearSelection() {
    Audio.click();
    state.selected = [];
    var selBtns = document.querySelectorAll('.ing-btn.selected');
    for (var i = 0; i < selBtns.length; i++) selBtns[i].classList.remove('selected');
    var selText = document.querySelector('.selected-row b');
    if (selText) selText.textContent = '—';
    var cookBtn = $id('cookBtn');
    if (cookBtn) cookBtn.disabled = true;
}

function renderCustomersPanel() {
    if (state.customers.length === 0) {
        return '<div class="panel active"><div class="empty-state"><span class="empty-icon">😴</span>Ресторан пуст<br><span style="font-size:10px;">Клиенты приходят сами</span></div></div>';
    }
    var html = state.customers.map(function(c) {
        var percent = (c.patienceLeft / c.maxPatience) * 100;
        var color = percent > 60 ? '#27ae60' : percent > 30 ? '#f39c12' : '#e74c3c';
        var hasReady = (state.readyDishes[c.order] || 0) > 0;
        var isKnown = state.discovered.indexOf(c.order) !== -1;
        var btn;
        if (hasReady) {
            var count = state.readyDishes[c.order];
            btn = '<button class="serve-btn" onclick="serveCustomer(\'' + c.uid + '\')">🍽️ Отдать' + (count > 1 ? ' ×' + count : '') + '</button>';
        } else if (isKnown) {
            btn = '<button class="serve-btn disabled">⏳ Приготовь</button>';

            btn = '<button class="serve-btn disabled">❌ Готовь блюдо</button>';
        }

            '<div class="cust-avatar">' + c.avatar + '</div>' +
            '<div class="cust-info">' +
            '<div class="cust-name"><span>' + c.name + '</span>' +
            '<span class="cust-type">' + c.type.badge + ' ' + c.type.name + '</span>' +
            (c.isSpecial ? '<span class="cust-special">🔥 ×2</span>' : '') +
            '<span class="cust-time" style="color:' + color + '">⏱️ ' + Math.ceil(c.patienceLeft) + 'с</span></div>' +
            '<div class="cust-order">Хочет: ' + escapeHtml(c.order) + '</div>' +
            '<div class="patience-bar"><div class="patience-fill" style="width:' + percent + '%;background:' + color + '"></div></div>' +
            '</div>' +
            '<div class="cust-right"><div class="cust-reward">' + c.reward + '🪙</div>' + btn + '</div>' +
            '</div>';
    }).join('');
    return '<div class="panel active"><div class="scroll-area">' + html +
        '<div class="empty-state" style="font-size:10px;padding:8px;">🚪 Макс 3 · Репа влияет на частоту</div>' +
        '</div></div>';
}

function syncCustomerTimers() {
    state.customers.forEach(function(c) {
        var el = document.querySelector('[data-cid="' + c.uid + '"]');
        if (!el) return;
        var timeEl = el.querySelector('.cust-time');
        var barEl = el.querySelector('.patience-fill');
        var percent = (c.patienceLeft / c.maxPatience) * 100;
        var color = percent > 60 ? '#27ae60' : percent > 30 ? '#f39c12' : '#e74c3c';
        if (timeEl) { timeEl.textContent = '⏱️ ' + Math.ceil(c.patienceLeft) + 'с'; timeEl.style.color = color; }
        if (barEl) { barEl.style.width = percent + '%'; barEl.style.background = color; }
    });
}

    }).join('');
    var tasksHtml = state.dailyOrders.length === 0 ? '' : state.dailyOrders.map(function(o, i) {
        var p = Math.min(100, (o.progress / o.target) * 100);

        return '<div class="task-card"><div class="task-title">' + o.desc + '</div>' +
            '<div class="task-progress"><div class="task-progress-fill" style="width:' + p + '%"></div></div>' +
            '<div class="task-row"><span>' + o.progress + '/' + o.target + '</span>' +
            (o.claimed ? '<span style="color:var(--success);">✓ Получено</span>' :
                canClaim ? '<button class="card-action" onclick="claimDaily(' + i + ')">Получить ' + o.reward + '🪙</button>' :
                '<span>' + o.reward + '🪙</span>') +
            '</div></div>';
    }).join('');
    var contestHtml = !state.contest ? '' : (function() {
        var c = state.contest;
        var p = Math.min(100, (c.progress / c.target) * 100);

            '<div style="color:var(--text-dim);font-size:11px;">' + c.desc + '</div>' +
            '<div class="contest-prize">🎁 ' + c.reward + '🪙</div>' +
            '<div class="task-progress" style="background:var(--bg-1);"><div class="task-progress-fill" style="width:' + p + '%"></div></div>' +
            '<div style="color:var(--text-dim);font-size:11px;margin-top:4px;">' + c.progress + '/' + c.target + '</div>' +

        (contestHtml ? '<div style="color:var(--gold);text-align:center;font-size:13px;margin:10px 0 6px;">🏆 Конкурс недели</div>' + contestHtml : '') +

function renderShopPanel() {

function showRecipeDetail(recipe) {
    var el = $id('recipeDetail');
    if (!el) return;

    el.dataset.active = recipe;

        getRarityName(state.discoveredRarity[recipe]) + '<br>🧂 ' + names + '<br>💰 Стоимость: ' + value + '🪙</div>';

function renameRecipe(oldName) {
    var newName = prompt('Новое название:', oldName);
    if (!newName || !newName.trim()) return;
    var trimmed = newName.trim();
    if (state.discovered.indexOf(trimmed) !== -1 && trimmed !== oldName) { toast('Такое блюдо уже есть!', 'warning'); return; }
    var idx = state.discovered.indexOf(oldName);
    if (idx === -1) return;
    state.discovered[idx] = trimmed;
    state.discoveredIngredients[trimmed] = state.discoveredIngredients[oldName];
    state.discoveredRatings[trimmed] = state.discoveredRatings[oldName];
    state.discoveredRarity[trimmed] = state.discoveredRarity[oldName];
    delete state.discoveredIngredients[oldName];
    delete state.discoveredRatings[oldName];
    delete state.discoveredRarity[oldName];
    renderContent();
}

function startCooking() {
    if (state.selected.length !== 3 || state.isCooking) return;
    state.isCooking = true;
    var ings = state.selected.slice();
    var key = ings.slice().sort().join(',');
    var recipes = RECIPES[key];
    if (recipes && recipes.length > 0) {
        var available = recipes.filter(function(r){ return state.discovered.indexOf(r) === -1; });
        if (available.length === 0) {
            cookAnimation(function(){ finishCooking(recipes[0], ings, true); });
            return;
        }
        if (available.length === 1) {
            cookAnimation(function(){ finishCooking(available[0], ings, false); });
            return;
        }
        state.isCooking = false;
        var area = $id('choiceArea');
        if (area) {
            area.innerHTML = '<div style="color:var(--gold);text-align:center;font-size:12px;margin:8px 0;">📋 Выбери блюдо:</div>' +
                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;">' +
                available.map(function(r, i) {
                    return '<button class="btn" onclick="chooseRecipe(' + i + ', \'' + escapeJs(r) + '\')">' + escapeHtml(r) + '</button>';
                }).join('') + '</div>';
            window._availableIngredients = ings;
        }
        return;
    }
    for (var i = 0; i < state.discovered.length; i++) {
        var r = state.discovered[i];
        var isStd = false;
        for (var k in RECIPES) { if (RECIPES[k].indexOf(r) !== -1) { isStd = true; break; } }
        if (isStd) continue;
        var ing = state.discoveredIngredients[r];
        if (ing && ing.slice().sort().join(',') === key) {
            cookAnimation(function(){ finishCooking(r, ings, true); });
            return;
        }
    }
    var auto = generateDish(ings);
    if (auto) cookAnimation(function(){ finishCooking(auto, ings, false); });
    else { state.isCooking = false; showCustomInput(ings); }
}

function chooseRecipe(idx, recipe) {
    var area = $id('choiceArea');
    if (area) area.innerHTML = '';
    state.isCooking = true;
    cookAnimation(function(){ finishCooking(recipe, window._availableIngredients, false); });
}

function cookAnimation(cb) {
    var overlay = $id('cookOverlay');
    var timer = $id('cookTimer');
    overlay.classList.add('active');
    Audio.sizzle();
    var steps = ['2.5', '2', '1.5', '1', '0.5'];
    var i = 0;
    timer.textContent = steps[0];
    var step = function() {
        i++;
        if (i >= steps.length) {
            overlay.classList.remove('active');
            cb();
            return;
        }
        timer.textContent = steps[i];
        Audio.click();
        setTimeout(step, 500);
    };
    setTimeout(step, 500);
}

function finishCooking(recipeName, ings, isRepeat) {
    state.readyDishes[recipeName] = (state.readyDishes[recipeName] || 0) + 1;
    if (!isRepeat && state.discovered.indexOf(recipeName) === -1) {
        var rating = calcRating(ings);
        var rarity = rating >= 10 ? 'legendary' : rating >= 8 ? 'epic' : rating >= 6 ? 'rare' : 'common';
        state.discovered.push(recipeName);
        state.discoveredIngredients[recipeName] = ings.slice();
        state.discoveredRatings[recipeName] = rating;
        state.discoveredRarity[recipeName] = rarity;
        state.cookedCount++;
        var xpGain = Math.round(rating * 1.5 + (rarity === 'legendary' ? 10 : rarity === 'epic' ? 5 : 0));
        addXP(xpGain);
        var coinBonus = 1 + (state.skills.coin10 || 0) * 0.1 + (state.artifacts.indexOf('golden_ladle') !== -1 ? 0.2 : 0);
        var coinGain = Math.round((rating * 2 + (rarity === 'legendary' ? 20 : rarity === 'epic' ? 10 : 0)) * coinBonus);
        state.coins += coinGain;
        checkAchievements();
        checkDailyOrders(recipeName, ings);
        checkContest(recipeName);
        Audio.ding();
        confetti();
        toast('🎉 ' + recipeName + ' — ⭐' + rating + '/10 (+' + coinGain + '🪙)', 'gold');
        showResultBox(recipeName, rating, rarity, coinGain, xpGain, false);
    } else {
        Audio.ding();
        toast('✅ ' + recipeName + ' готово! (порций: ' + state.readyDishes[recipeName] + ')', 'success');
        showResultBox(recipeName, state.discoveredRatings[recipeName] || 5, state.discoveredRarity[recipeName] || 'common', 0, 0, true);
    }
    state.selected = [];
    state.isCooking = false;
    updateStats();
    if (state.activeMain === 'cook') renderContent();
}

function showResultBox(recipeName, rating, rarity, coinGain, xpGain, isRepeat) {
    var area = $id('resultArea');
    if (!area) return;
    var stars = '⭐'.repeat(Math.round(rating / 2)) + '☆'.repeat(5 - Math.round(rating / 2));
    var feedbacks = ['Ммм, пальчики оближешь!', 'Это просто шедевр!', 'Божественно!', 'Лучшее, что я пробовал!', 'Вкуснотища!', 'Объедение!'];
    var fb = pick(feedbacks);
    if (isRepeat) {
        area.innerHTML = '<div class="result-box">' +
            '<div class="result-name">' + escapeHtml(recipeName) + '</div>' +
            '<div class="result-info" style="color:var(--accent);">✅ Готово для клиента!</div>' +
            '<div style="font-size:11px;color:var(--text-dim);margin-top:4px;">Порций: ' + state.readyDishes[recipeName] + '</div>' +
            '</div>';
    } else {
        area.innerHTML = '<div class="result-box">' +
            '<div class="result-name">' + escapeHtml(recipeName) + '</div>' +
            '<div class="result-stars">' + stars + '</div>' +
            '<div class="result-info">⭐' + rating + '/10 · ' + getRarityName(rarity) + '</div>' +
            '<div class="result-rewards">+' + coinGain + '🪙 +' + xpGain + '⭐</div>' +
            '<div class="result-feedback">«' + fb + '»</div>' +
            '</div>';
    }
    setTimeout(function(){ area.innerHTML = ''; }, 3500);
}

function showCustomInput(ings) {
    var area = $id('resultArea');
    if (!area) return;
    area.innerHTML = '<div class="result-box">' +
        '<div style="color:var(--text-dim);font-size:12px;margin-bottom:6px;">🤔 Придумай название</div>' +
        '<input type="text" id="customName" placeholder="Название" style="width:90%;padding:8px;border-radius:8px;border:2px solid var(--accent);background:var(--bg-1);color:var(--gold);text-align:center;font-family:inherit;margin-bottom:6px;">' +
        '<button class="btn btn-gold" onclick="saveCustom()">✅ Сохранить</button>' +
        '</div>';
    window._customIngs = ings;
    setTimeout(function(){ var c = $id('customName'); if (c) c.focus(); }, 100);
}

function saveCustom() {
    var inp = $id('customName');
    if (!inp) return;
    var name = inp.value.trim();
    if (!name) { toast('Введи название!', 'warning'); return; }
    var recipe = '✏️ ' + name;
    if (state.discovered.indexOf(recipe) !== -1) { toast('Такое блюдо уже есть!', 'warning'); return; }
    var ings = window._customIngs || state.selected;
    var rating = calcRating(ings);
    var rarity = rating >= 10 ? 'legendary' : rating >= 8 ? 'epic' : rating >= 6 ? 'rare' : 'common';
    state.discovered.push(recipe);
    state.discoveredIngredients[recipe] = ings.slice();
    state.discoveredRatings[recipe] = rating;
    state.discoveredRarity[recipe] = rarity;
    state.readyDishes[recipe] = (state.readyDishes[recipe] || 0) + 1;
    state.cookedCount++;
    addXP(Math.round(rating * 1.5));
    state.coins += Math.round(rating * 2);
    checkAchievements();
    toast('✏️ ' + recipe + ' ⭐' + rating + '/10', 'gold');
    state.selected = [];
    window._customIngs = null;
    renderContent();
}

function addXP(amount) {
    var bonus = 1 + (state.skills.xp10 || 0) * 0.1 + (state.artifacts.indexOf('magic_pan') !== -1 ? 0.15 : 0);
    amount = Math.round(amount * bonus);
    state.xp += amount;
    var need = getRequiredXP(state.level);
    while (state.xp >= need) {
        state.xp -= need;
        state.level++;
        state.coins += 10 + state.level * 2;
        need = getRequiredXP(state.level);
        toast('🎉 Уровень ' + state.level + '! +' + (10 + state.level * 2) + '🪙', 'gold');
        Audio.ding();
    }
    updateStats();
}

function confetti() {
    var colors = ['#f0d5b0','#a67b5b','#e8dccc','#d4b59a','#c49070'];
    for (var i = 0; i < 30; i++) {
        (function(i) {
            setTimeout(function() {
                var c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.top = '-20px';
                c.style.background = pick(colors);
                c.style.animationDelay = Math.random() * 0.5 + 's';
                c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                document.body.appendChild(c);
                setTimeout(function(){ c.remove(); }, 2500);
            }, i * 30);
        })(i);
    }
}

function buyIngredient(id) {
    var ing = getIng(id);
    if (!ing || state.unlocked.indexOf(id) !== -1) return;
    if (state.coins < ing.price) { toast('Недостаточно монет!', 'danger'); return; }
    state.coins -= ing.price;
    state.unlocked.push(id);
    Audio.coin();
    toast('🛒 Куплено: ' + ing.name, 'success');
    updateStats();
    renderContent();
}

function buySkill(id) {
    var skill = null;
    for (var i = 0; i < SKILLS.length; i++) if (SKILLS[i].id === id) skill = SKILLS[i];
    if (!skill) return;
    var owned = state.skills[id] || 0;
    if (owned >= skill.max || state.coins < skill.price) return;
    state.coins -= skill.price;
    state.skills[id] = owned + 1;
    Audio.ding();
    toast('📈 ' + skill.name, 'success');
    updateStats();
    renderContent();
}

function buyArtifact(id) {
    var art = null;
    for (var i = 0; i < ARTIFACTS.length; i++) if (ARTIFACTS[i].id === id) art = ARTIFACTS[i];
    if (!art || state.artifacts.indexOf(id) !== -1 || state.coins < art.price) return;
    state.coins -= art.price;
    state.artifacts.push(id);
    Audio.ding();
    toast('🎁 ' + art.name, 'gold');
    updateStats();
    renderContent();
}

function buyUpgrade(id) {
    var up = null;
    for (var i = 0; i < UPGRADES.length; i++) if (UPGRADES[i].id === id) up = UPGRADES[i];
    if (!up || state.upgrades[id] || state.coins < up.price) return;
    state.coins -= up.price;
    state.upgrades[id] = true;
    Audio.ding();
    toast('🏙️ ' + up.name + ' куплен!', 'success');
    checkAchievements();
    updateStats();
    renderContent();
}

function collectIncome() {
    var income = getRestaurantIncome();
    if (income === 0) { toast('Нет улучшений', 'warning'); return; }
    var now = Date.now();
    var elapsed = Math.floor((now - state.lastIncomeTime) / 1000);
    if (elapsed < 30) { toast('Подожди ' + (30 - elapsed) + 'с', 'warning'); return; }
    var earned = income * Math.floor(elapsed / 60);
    if (earned <= 0) { toast('Пока нечего собирать', 'warning'); return; }
    state.coins += earned;
    state.lastIncomeTime = now;
    Audio.coin();
    toast('💰 Собрано ' + earned + '🪙!', 'gold');
    updateStats();
    renderContent();
}

function pickCustomerType() {
    var total = CUSTOMER_TYPES.reduce(function(s, t){ return s + t.chance; }, 0);
    var r = Math.random() * total;
    for (var i = 0; i < CUSTOMER_TYPES.length; i++) {
        r -= CUSTOMER_TYPES[i].chance;
        if (r <= 0) return CUSTOMER_TYPES[i];
    }
    return CUSTOMER_TYPES[0];
}

function isDishSuitable(recipe, type) {
    var name = recipe.toLowerCase();
    var ings = getDishIngredients(recipe);
    if (type.id === 'vegan') {
        var animal = ['meat','chicken','pork','beef','lamb','turkey','sausage','bacon','ham','chorizo','duck','rabbit','venison','fish','salmon','tuna','cod','shrimp','lobster','oyster','mussels','squid','octopus','crab','scallop','eel','milk','cheese','butter','egg','cream','yogurt','quail_egg','sour_cream','cottage','mozzarella','parmesan','feta','blue_cheese','brie','honey'];
        return !ings.some(function(i){ return animal.indexOf(i) !== -1; });
    }
    if (type.id === 'child') return (state.discoveredRatings[recipe] || calcRating(ings)) >= 5;
    if (type.id === 'gourmet' || type.id === 'critic') {
        var r = getDishRarity(recipe);
        return r === 'epic' || r === 'legendary';
    }
    if (type.id === 'rich') return getDishRarity(recipe) !== 'common';
    if (type.id === 'elder') return /суп|борщ|каша|пюре|щи|уха/.test(name);
    return true;
}

function spawnCustomer() {
    var available = getAvailableDishes();
    if (available.length === 0) return;
    if (state.customers.length >= 3) return;
    var type = pickCustomerType();
    var suitable = available.filter(function(r){ return isDishSuitable(r, type); });
    var pool = suitable.length > 0 ? suitable : available;
    var recipe = pick(pool);
    var name = pick(CUSTOMER_NAMES);
    var avatar = pick(CUSTOMER_AVATARS);
    var ings = getDishIngredients(recipe);
    var rating = state.discoveredRatings[recipe] || calcRating(ings);
    var dishValue = getDishValue(recipe);
    var baseReward = Math.round(8 + dishValue * 1.8 + rating * 2 + Math.random() * 5);
    var reward = Math.round(baseReward * type.mult);
    var isSpecial = Math.random() < 0.2;
    state.customers.push({
        uid: Date.now() + '_' + Math.random().toString(36).slice(2,7),
        name: name, avatar: avatar, order: recipe, reward: reward, type: type, isSpecial: isSpecial,
        patienceLeft: type.patience,
        maxPatience: type.patience
    });
    Audio.arrive();
    toast(type.badge + ' ' + name + ' пришёл! Хочет: ' + recipe + (isSpecial ? ' 🔥×2' : ''), 'info');
    if (state.activeMain === 'restaurant' && state.activeSub.restaurant === 'customers') renderContent();
}

function tickCustomers() {
    if (state.customers.length === 0) return;
    var before = state.customers.length;
    state.customers.forEach(function(c){ c.patienceLeft -= 1; });
    var leaving = state.customers.filter(function(c){ return c.patienceLeft <= 0; });
    leaving.forEach(function(c) {
        state.reputation = Math.max(0, state.reputation + c.type.repLeave);
        toast('😡 ' + c.name + ' ушёл! ' + c.type.repLeave + ' репы', 'danger');
    });
    state.customers = state.customers.filter(function(c){ return c.patienceLeft > 0; });
    if (state.customers.length !== before) {
        Audio.leave();
        updateStats();
        if (state.activeMain === 'restaurant' && state.activeSub.restaurant === 'customers') renderContent();
    } else {
        if (state.activeMain === 'restaurant' && state.activeSub.restaurant === 'customers') syncCustomerTimers();
    }
}

function serveCustomer(uid) {
    var idx = -1;
    for (var i = 0; i < state.customers.length; i++) if (state.customers[i].uid === uid) idx = i;
    if (idx === -1) return;
    var c = state.customers[idx];
    var hasReady = (state.readyDishes[c.order] || 0) > 0;
    if (!hasReady) return;
    state.readyDishes[c.order]--;
    if (state.readyDishes[c.order] <= 0) delete state.readyDishes[c.order];
    var servedInTime = c.patienceLeft >= c.maxPatience - 10;
    var reward = c.reward;
    if (c.isSpecial && servedInTime) { reward *= 2; toast('🔥 ' + c.name + ': ×2 бонус!', 'gold'); }
    state.coins += reward;
    var repBonus = 1 + (state.skills.rep || 0) * 0.1 + (state.artifacts.indexOf('lucky_hat') !== -1 ? 0.1 : 0);
    var repGain = Math.round(c.type.repServe * repBonus);
    state.reputation = Math.min(100, state.reputation + repGain);
    state.customers.splice(idx, 1);
    state.servedCount++;
    Audio.coin();
    Audio.ding();
    confetti();
    toast('✅ ' + c.name + ' доволен! +' + reward + '🪙 +' + repGain + ' репы', 'success');
    if (!state.achievements.first_customer) { state.achievements.first_customer = true; toast('🏆 Первый клиент!', 'gold'); }
    if (state.servedCount >= 10 && !state.achievements.ten_customers) { state.achievements.ten_customers = true; toast('🏆 Официант!', 'gold'); }
    var typeAch = 'serve_' + c.type.id;
    if (c.type.id !== 'regular' && !state.achievements[typeAch]) {
        state.achievements[typeAch] = true;
        toast('🏆 Обслужен: ' + c.type.name + '!', 'gold');
    }
    updateStats();
    renderContent();
}

function checkAchievements() {
    var add = function(id, msg) { if (!state.achievements[id]) { state.achievements[id] = true; toast(msg, 'gold'); } };
    if (state.cookedCount >= 1) add('first_dish', '🏆 Первое блюдо!');
    if (state.cookedCount >= 10) add('ten_dishes', '🏆 Шеф-повар!');
    if (state.cookedCount >= 100) add('hundred_dishes', '🏆 Мастер!');
    if (state.coins >= 2000) add('rich', '🏆 Богач!');
    if (state.level >= 10) add('level10', '🏆 Опытный!');
    var last = state.discovered[state.discovered.length - 1];
    if (state.discoveredRatings[last] === 10) add('perfect', '🏆 Идеально!');
    var eggDishes = state.discovered.filter(function(r){ return (state.discoveredIngredients[r] || []).indexOf('egg') !== -1; });
    if (eggDishes.length >= 5) add('egg_master', '🏆 Яичный магнат!');
    var meatIds = ['meat','chicken','pork','beef','lamb','turkey','sausage','bacon','ham','chorizo','duck','rabbit','venison','wagyu','kobe'];
    var meatDishes = state.discovered.filter(function(r){ 
        return (state.discoveredIngredients[r] || []).some(function(i){ return meatIds.indexOf(i) !== -1; }); 
    });
    if (meatDishes.length >= 5) add('meat_lover', '🏆 Мясной гурман!');
    var fishIds = ['fish','salmon','tuna','cod','shrimp','lobster','oyster','mussels','squid','octopus','crab','scallop','eel'];
    var fishDishes = state.discovered.filter(function(r){ 
        return (state.discoveredIngredients[r] || []).some(function(i){ return fishIds.indexOf(i) !== -1; }); 
    });
    if (fishDishes.length >= 5) add('fish_master', '🏆 Рыбный эксперт!');
    if (Object.keys(state.upgrades).length >= 5) add('restaurateur', '🏆 Ресторатор!');
}

function generateDailyOrders() {
    var today = new Date().toDateString();
    if (state.dailyOrders.length > 0 && state.dailyOrders[0].date === today) return;
    var types = [
        { type:'meat', desc:'Приготовь 3 блюда с мясом', target:3, reward:200 },
        { type:'egg', desc:'Приготовь 3 блюда с яйцом', target:3, reward:150 },
        { type:'fish', desc:'Приготовь 2 блюда с рыбой', target:2, reward:250 },
        { type:'fruit', desc:'Приготовь 3 фруктовых блюда', target:3, reward:180 },
        { type:'veggie', desc:'Приготовь 5 овощных блюд', target:5, reward:130 },
        { type:'luxury', desc:'Приготовь 1 деликатес', target:1, reward:500 }
    ];
    var shuffled = types.slice().sort(function(){ return Math.random() - 0.5; }).slice(0, 2);
    state.dailyOrders = shuffled.map(function(o) {
        return { type:o.type, desc:o.desc, target:o.target, reward:o.reward, progress:0, date:today, claimed:false };
    });
}

function checkDailyOrders(recipeName, ings) {
    generateDailyOrders();
    var items = ings.map(getIng);
    state.dailyOrders.forEach(function(o) {
        if (o.claimed) return;
        var m = {
            meat: items.some(function(i){ return i && ['meat','chicken','pork','beef','lamb','turkey','sausage','bacon','ham','chorizo','duck','rabbit','venison','wagyu','kobe'].indexOf(i.id) !== -1; }),
            egg: items.some(function(i){ return i && ['egg','quail_egg'].indexOf(i.id) !== -1; }),
            fish: items.some(function(i){ return i && ['fish','salmon','tuna','cod','shrimp','lobster','oyster','mussels','squid','octopus','crab','scallop','eel'].indexOf(i.id) !== -1; }),
            fruit: items.some(function(i){ return i && ['apple','orange','berry','lemon','fig','pomegranate','banana','peach','pear','grape','watermelon','melon','kiwi','mango','pineapple','coconut','cherry','blueberry','raspberry','avocado','lime','apricot','plum'].indexOf(i.id) !== -1; }),
            veggie: items.some(function(i){ return i && ['tomato','onion','carrot','mushroom','garlic','cabbage','potato','cucumber','beet','pumpkin','pepper','basil','broccoli','spinach','zucchini','eggplant','corn','peas','asparagus','artichoke','celery','leek'].indexOf(i.id) !== -1; }),
            luxury: items.some(function(i){ return i && ['caviar','truffle','foie_gras','saffron','gold_leaf','wagyu','kobe','lobster','oyster'].indexOf(i.id) !== -1; })
        };
        if (m[o.type]) o.progress++;
    });
}

function claimDaily(i) {
    var o = state.dailyOrders[i];
    if (!o || o.claimed || o.progress < o.target) return;
    o.claimed = true;
    state.coins += o.reward;
    Audio.coin();
    toast('🎁 +' + o.reward + '🪙', 'gold');
    updateStats();
    renderContent();
}

function generateContest() {
    var week = Math.floor(Date.now() / (7 * 24 * 3600 * 1000));
    if (state.contest && state.contest.week === week) return;
    var contests = [
        { name:'🍕 Пицца недели', type:'pizza', desc:'Приготовь пиццу', target:1, reward:400 },
        { name:'🍜 Лапша недели', type:'noodles', desc:'Лапша или паста', target:1, reward:500 },
        { name:'🍰 Десерт недели', type:'dessert', desc:'3 десерта', target:3, reward:600 },
        { name:'🐟 Рыба недели', type:'fish', desc:'2 рыбных блюда', target:2, reward:550 },
        { name:'🥗 Салат недели', type:'salad', desc:'3 салата', target:3, reward:450 }
    ];
    var c = pick(contests);
    state.contest = { name:c.name, type:c.type, desc:c.desc, target:c.target, reward:c.reward, week:week, progress:0, claimed:false };
}

function checkContest(recipeName) {
    generateContest();
    var c = state.contest;
    if (!c || c.claimed) return;
    var n = recipeName.toLowerCase();
    if (c.type === 'pizza' && n.indexOf('пицца') !== -1) c.progress++;
    if (c.type === 'noodles' && (n.indexOf('лапша') !== -1 || n.indexOf('паста') !== -1)) c.progress++;
    if (c.type === 'dessert' && /десерт|штрудель|мусс|кекс|пирог/.test(n)) c.progress++;
    if (c.type === 'fish' && /рыба|лосось|суши|кревет/.test(n)) c.progress++;
    if (c.type === 'salad' && n.indexOf('салат') !== -1) c.progress++;
}

function claimContest() {
    var c = state.contest;
    if (!c || c.claimed || c.progress < c.target) return;
    c.claimed = true;
    state.coins += c.reward;
    Audio.ding();
    confetti();
    toast('🏆 Конкурс! +' + c.reward + '🪙', 'gold');
    updateStats();
    renderContent();
}

function getSaveData(name) {
    return {
        name: name || 'Сохранение',
        time: new Date().toLocaleString(),
        data: {
            discovered: state.discovered,
            discoveredIngredients: state.discoveredIngredients,
            discoveredRatings: state.discoveredRatings,
            discoveredRarity: state.discoveredRarity,
            cookedCount: state.cookedCount,
            level: state.level,
            xp: state.xp,
            coins: state.coins,
            reputation: state.reputation,
            unlocked: state.unlocked,
            achievements: state.achievements,
            skills: state.skills,
            artifacts: state.artifacts,
            upgrades: state.upgrades,
            readyDishes: state.readyDishes,
            servedCount: state.servedCount,
            dailyOrders: state.dailyOrders,
            contest: state.contest
        }
    };
}

function applySave(save) {
    var d = save.data;
    state.discovered = d.discovered || [];
    state.discoveredIngredients = d.discoveredIngredients || {};
    state.discoveredRatings = d.discoveredRatings || {};
    state.discoveredRarity = d.discoveredRarity || {};
    state.cookedCount = d.cookedCount || 0;
    state.level = d.level || 1;
    state.xp = d.xp || 0;
    state.coins = d.coins || 0;
    state.reputation = d.reputation || 50;
    state.unlocked = d.unlocked || START_INGREDIENTS.slice();
    state.achievements = d.achievements || {};
    state.skills = d.skills || {};
    state.artifacts = d.artifacts || [];
    state.upgrades = d.upgrades || {};
    state.readyDishes = d.readyDishes || {};
    state.servedCount = d.servedCount || 0;
    state.dailyOrders = d.dailyOrders || [];
    state.contest = d.contest || null;
    state.customers = [];
}

function saveGame(slot, name) {
    var data = getSaveData(name);
    state.saveSlots[slot] = data;
    state.currentSlot = slot;
    persistSlots();
    toast('💾 Сохранено в слот ' + (slot === 'slot1' ? '1' : '2'), 'success');
}

function autosave() {
    if (!state.autosaveEnabled) return;
    if (state.cookedCount === 0 && state.discovered.length === 0) return;
    if (!state.currentSlot) {
        state.currentSlot = !state.saveSlots.slot1 ? 'slot1' : !state.saveSlots.slot2 ? 'slot2' : 'slot1';
    }
    var existing = state.saveSlots[state.currentSlot];
    var name = existing ? existing.name : 'Автосохранение';
    state.saveSlots[state.currentSlot] = getSaveData(name);
    persistSlots();
}

function persistSlots() {
    try {
        localStorage.setItem('greatCooking_slots', JSON.stringify(state.saveSlots));
        localStorage.setItem('greatCooking_slot', state.currentSlot || '');
    } catch(e) {}
}

function loadGame(slot) {
    var save = state.saveSlots[slot];
    if (!save) { toast('Слот пуст', 'warning'); return; }
    applySave(save);
    state.currentSlot = slot;
    persistSlots();
    updateStats();
    renderContent();
    renderSaveSlots();
    closeSettings();
    toast('📂 Загружено: ' + save.name, 'success');
}

function deleteSave(slot) {
    if (!state.saveSlots[slot]) return;
    if (!confirm('Удалить это сохранение?')) return;
    state.saveSlots[slot] = null;
    if (state.currentSlot === slot) state.currentSlot = null;
    persistSlots();
    renderSaveSlots();
}

function saveToNewSlot() {
    var name = prompt('Название сохранения:', 'Игра ' + new Date().toLocaleDateString());
    if (!name) return;
    var slot = !state.saveSlots.slot1 ? 'slot1' : !state.saveSlots.slot2 ? 'slot2' : 'slot1';
    saveGame(slot, name);
    renderSaveSlots();
}

function renderSaveSlots() {
    var container = $id('saveSlots');
    if (!container) return;
    container.innerHTML = ['slot1', 'slot2'].map(function(slot, i) {
        var save = state.saveSlots[slot];
        var isCurrent = state.currentSlot === slot;
        if (save) {
            return '<div class="save-slot ' + (isCurrent ? 'current' : '') + '">' +
                '<div class="save-slot-title">' + escapeHtml(save.name) + '</div>' +
                '<div class="save-slot-time">' + save.time + '</div>' +
                '<div class="save-slot-time">🍽️ ' + (save.data.cookedCount || 0) + ' блюд</div>' +
                '<div class="save-actions">' +
                '<button onclick="loadGame(\'' + slot + '\')">📂</button>' +
                '<button onclick="deleteSave(\'' + slot + '\')">🗑️</button>' +
                '</div></div>';
        }
        return '<div class="save-slot">' +
            '<div class="save-slot-title">Слот ' + (i + 1) + '</div>' +
            '<div class="save-slot-time">Пусто</div>' +
            '</div>';
    }).join('');
}

function openSettings() {
    Audio.click();
    $id('settingsModal').classList.add('active');
    renderSaveSlots();
    updateToggles();
}

function closeSettings() {
    Audio.click();
    $id('settingsModal').classList.remove('active');
}

function toggleSetting(which) {
    Audio.click();
    if (which === 'sound') state.soundEnabled = !state.soundEnabled;
    if (which === 'autosave') state.autosaveEnabled = !state.autosaveEnabled;
    updateToggles();
    try {
        localStorage.setItem('gc_sound', state.soundEnabled ? '1' : '0');
        localStorage.setItem('gc_autosave', state.autosaveEnabled ? '1' : '0');
    } catch(e) {}
}

function updateToggles() {
    $id('toggleSound').classList.toggle('on', state.soundEnabled);
    $id('toggleAutosave').classList.toggle('on', state.autosaveEnabled);
}

function loadFromStorage() {
    try {
        var slots = localStorage.getItem('greatCooking_slots');
        if (slots) state.saveSlots = JSON.parse(slots);
        var slot = localStorage.getItem('greatCooking_slot');
        if (slot) state.currentSlot = slot;
        var s = localStorage.getItem('gc_sound');
        if (s !== null) state.soundEnabled = s === '1';
        var a = localStorage.getItem('gc_autosave');
        if (a !== null) state.autosaveEnabled = a === '1';
    } catch(e) {}
}

function start() {
    loadFromStorage();
    if (state.currentSlot && state.saveSlots[state.currentSlot]) {
        applySave(state.saveSlots[state.currentSlot]);
        toast('📂 Загружено: ' + state.saveSlots[state.currentSlot].name, 'success');
    }
    generateDailyOrders();
    generateContest();
    renderSubTabs();
    renderContent();
    updateStats();
    updateToggles();
    setInterval(tickCustomers, 1000);
    setInterval(function() {
        if (state.customers.length >= 3) return;
        var available = getAvailableDishes();
        if (available.length === 0) return;
        var repMult = 0.5 + state.reputation / 100;
        if (Math.random() < 0.30 * repMult) spawnCustomer();
    }, 5000);
    setInterval(autosave, 10000);
    setInterval(function() { if (getRestaurantIncome() > 0) state.lastIncomeTime = Date.now(); }, 60000);
    window.addEventListener('beforeunload', autosave);
    setTimeout(function() {
        if (getAvailableDishes().length > 0 && state.customers.length < 3) spawnCustomer();
    }, 8000);
}

document.addEventListener('DOMContentLoaded', start);
</script>
</body>
</html>
