<body>

      </div>
      <div class="hud-tr">
        <div class="vpnbadge" id="vpnbadge">VPN · БАЗОВЫЙ</div>
        <div class="coinshud" id="coinshud">₿ 0</div>

      </div>

      </div>

      <button id="proxyBtn" class="hidden">
        <span class="pvLabel">ПРОКСИ</span>

<script>
"use strict";

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b=0)=>b+Math.random()*(a-b);
const rndi=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const aabb=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ============================================================
   СОХРАНЕНИЯ
   ============================================================ */
const SAVE_KEY='proyv4_save_v3';
function saveGame(){
  try{
    if(G.lives>0&&G.level>=1&&G.level<=60){
      localStorage.setItem(SAVE_KEY,JSON.stringify({
        level:G.level,lives:G.lives,vpn:G.vpn,crypto:G.crypto,proxy:G.proxy
      }));
    }else{
      localStorage.removeItem(SAVE_KEY);
    }
  }catch(e){}
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const s=JSON.parse(raw);
    if(!s||typeof s.level!=='number'||typeof s.lives!=='number') return null;
    if(s.level<1||s.level>60||s.lives<1||s.lives>3) return null;
    return {
      level:s.level,lives:s.lives,
      vpn:Math.max(1,Math.min(11,s.vpn||1)),
      crypto:Math.max(0,s.crypto||0),
      proxy:Math.max(0,Math.min(8,s.proxy||0))
    };
  }catch(e){return null;}
}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}

/* ============================================================
   CANVAS / DOM
   ============================================================ */
const cvs=document.getElementById('game');
const ctx=cvs.getContext('2d');
const W=1280,H=720;
cvs.width=W;cvs.height=H;

const stage=document.getElementById('stage');

const panel=document.getElementById('panel');
const elHearts=document.getElementById('hearts');

function resize(){stage.style.setProperty('--u',(stage.clientWidth/1280)+'px');}
addEventListener('resize',resize);

/* ============================================================
   ВВОД
   ============================================================ */
const keys={},pressed={};
const mouse={x:W*0.72,y:H*0.42,down:false,clicked:false};

addEventListener('keydown',e=>{
  audioInit();acResume();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.code==='Escape'||e.code==='KeyP'){
    e.preventDefault();
    if(!e.repeat) togglePause();
    return;
  }
  if(e.code==='KeyQ'&&!e.repeat){
    activateProxy();
  }
  if(!e.repeat) pressed[e.code]=true;
  keys[e.code]=true;
});
addEventListener('keyup',e=>{keys[e.code]=false;});

cvs.addEventListener('mousemove',e=>{
  const r=cvs.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)/r.width*W;
  mouse.y=(e.clientY-r.top)/r.height*H;
});
cvs.addEventListener('mousedown',e=>{
  audioInit();acResume();
  if(e.button===0){mouse.down=true;mouse.clicked=true;}
});
addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false;});
cvs.addEventListener('contextmenu',e=>e.preventDefault());

elProxyBtn.addEventListener('click',e=>{
  e.stopPropagation();
  audioInit();acResume();
  activateProxy();
});

/* ============================================================
   КОНСТАНТЫ
   ============================================================ */
const GRAV=0.62,MOVEACC=1.15,MAXSPD=5.6,JUMPV=-13.2,MAXFALL=18;
const GROUND_Y=600;

/* ============================================================
   ЗВУК (WebAudio, процедурный)
   ============================================================ */
const AC={ctx:null,master:null,enabled:true};
function audioInit(){
  if(AC.ctx) return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C) return;
    AC.ctx=new C();
    AC.master=AC.ctx.createGain();
    AC.master.gain.value=AC.enabled?0.35:0;
    AC.master.connect(AC.ctx.destination);
  }catch(e){AC.enabled=false;}
}
function acResume(){
  if(AC.ctx&&AC.ctx.state==='suspended') AC.ctx.resume().catch(()=>{});
}
function tone({freq=440,type='square',dur=0.08,vol=0.3,slide=0,delay=0}){
  if(!AC.enabled||!AC.ctx) return;
  const t0=AC.ctx.currentTime+delay;
  const osc=AC.ctx.createOscillator();
  const g=AC.ctx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,t0);
  if(slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(g);g.connect(AC.master);
  osc.start(t0);osc.stop(t0+dur+0.02);
}
function noiseBurst({dur=0.12,vol=0.25,hp=800,delay=0}){
  if(!AC.enabled||!AC.ctx) return;
  const t0=AC.ctx.currentTime+delay;
  const len=Math.floor(AC.ctx.sampleRate*dur);
  const buf=AC.ctx.createBuffer(1,len,AC.ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=AC.ctx.createBufferSource();
  src.buffer=buf;
  const f=AC.ctx.createBiquadFilter();
  f.type='highpass';f.frequency.value=hp;
  const g=AC.ctx.createGain();
  g.gain.value=vol;
  src.connect(f);f.connect(g);g.connect(AC.master);
  src.start(t0);
}
const SFX={
  shoot(){tone({freq:720,type:'square',dur:0.06,vol:0.18,slide:-420});},
  shoot3(){tone({freq:640,type:'sawtooth',dur:0.07,vol:0.20,slide:-380});},
  beam(){tone({freq:880,type:'sine',dur:0.05,vol:0.10,slide:-300});},
  meteor(){tone({freq:120,type:'sawtooth',dur:0.25,vol:0.22,slide:80});},
  hit(){noiseBurst({dur:0.05,vol:0.18,hp:1500});},
  kill(){tone({freq:180,type:'square',dur:0.18,vol:0.25,slide:-120});
         noiseBurst({dur:0.12,vol:0.15,hp:600});},
  hurt(){tone({freq:220,type:'sawtooth',dur:0.22,vol:0.30,slide:-140});},
  jump(){tone({freq:420,type:'sine',dur:0.10,vol:0.15,slide:220});},
  land(){noiseBurst({dur:0.05,vol:0.10,hp:400});},
  coin(){tone({freq:880,type:'square',dur:0.05,vol:0.14});
         tone({freq:1320,type:'square',dur:0.06,vol:0.12,delay:0.04});},

function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function makeBuildings(rng,count,maxH,minW,maxW){
  const arr=[];let x=-220;
  for(let i=0;i<count;i++){
    const w=minW+rng()*(maxW-minW);
    const h=36+rng()*maxH;
    arr.push({x,w,h});
    x+=w+4+rng()*24;
  }
  return arr;
}
function prerenderLayer(buildings,baseY,color,winColor){
  const c=document.createElement('canvas');
  c.width=2600;c.height=H;
  const g=c.getContext('2d');
  g.fillStyle=color;
  for(const b of buildings) g.fillRect(b.x,baseY-b.h,b.w,b.h);
  g.fillStyle=winColor;
  for(const b of buildings){
    for(let wy=baseY-b.h+16;wy<baseY-16;wy+=19){
      for(let wx=b.x+9;wx<b.x+b.w-12;wx+=17){
        if((((wx*13+wy*7)|0)%7)<2) g.fillRect(wx,wy,5,8);
      }
    }
  }
  return c;
}
function buildBackground(seed){
  const rng=mulberry32(seed);
  const far=makeBuildings(rng,70,150,26,64);
  const mid=makeBuildings(rng,55,210,36,92);
  const near=makeBuildings(rng,42,300,48,126);
  return {
    far:prerenderLayer(far,632,G.palette.far,G.palette.win),
    mid:prerenderLayer(mid,646,G.palette.mid,G.palette.win),
    near:prerenderLayer(near,664,G.palette.near,G.palette.win)
  };
}
function drawBackground(){
  const pal=G.palette;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,pal.sky0);
  g.addColorStop(0.42,pal.sky1);
  g.addColorStop(0.72,pal.sky2);
  g.addColorStop(1,pal.sky3);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  const sx=W*0.74-G.camX*0.04,sy=308;
  const sg=ctx.createRadialGradient(sx,sy,8,sx,sy,300);
  sg.addColorStop(0,'rgba(255,224,170,0.55)');
  sg.addColorStop(0.28,'rgba(255,175,115,0.20)');
  sg.addColorStop(1,'rgba(255,140,90,0)');
  ctx.fillStyle=sg;
  ctx.beginPath();ctx.arc(sx,sy,300,0,7);ctx.fill();
  ctx.fillStyle=pal.sun;
  ctx.globalAlpha=0.92;
  ctx.beginPath();ctx.arc(sx,sy,62,0,7);ctx.fill();
  ctx.globalAlpha=1;

  if(G.layers.far) ctx.drawImage(G.layers.far,-G.camX*0.10,0);
  if(G.layers.mid) ctx.drawImage(G.layers.mid,-G.camX*0.26,0);
  if(G.layers.near)ctx.drawImage(G.layers.near,-G.camX*0.48,0);

  const fg=ctx.createLinearGradient(0,H*0.52,0,H);
  fg.addColorStop(0,'rgba(0,0,0,0)');
  fg.addColorStop(1,pal.fog);
  ctx.fillStyle=fg;ctx.fillRect(0,H*0.52,W,H*0.48);
}
function drawVignette(){
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.34,W/2,H/2,H*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.62)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

function buildLevel(n){
  const isBoss=(n%10===0);
  const width=isBoss?1400:2400;
  const ch=chapterOf(n);
  G.levelWidth=width;
  G.platforms=[];
  G.enemies=[];
  G.bullets=[];
  G.particles=[];
  G.coins=[];
  G.beams=[];
  G.meteors=[];
  G.proxyFx=[];
  G.boss=null;
  G.camX=0;
  G.shake=0;
  G.hitstop=0;
  G.camZoom=1;
  G.camZoomTarget=1;

  let palIdx;
  if(ch===1){
    palIdx=isBoss?4:((Math.floor((n-1)/3))%4);
  }else{
    const n2=n-30;
    palIdx=isBoss?9:(5+((Math.floor((n2-1)/3))%4));
  }
  G.palette=PALETTES[palIdx];
  G.layers=buildBackground(n*7919+13);

  G.platforms.push({x:-200,y:GROUND_Y,w:width+400,h:260,ground:true});

  if(isBoss){
    G.platforms.push({x:110,y:472,w:250,h:24});
    G.platforms.push({x:width-360,y:472,w:250,h:24});
    G.platforms.push({x:width/2-150,y:352,w:300,h:24});
    spawnBoss(n);
  }else{
    const rng=mulberry32(n*104729+7);
    let x=430;
    while(x<width-340){
      const w=150+rng()*170;
      /* под платформой минимум 54 px — игрок проходит */
      const y=430+rng()*70;
      G.platforms.push({x,y,w,h:22});
      x+=w+170+rng()*170;
    }
    let count=3+Math.floor((ch===1?n:(n-30))*0.55);
    if(ch===2) count=Math.floor(count*1.25);
    const types=['grunt','grunt','grunt','heavy'];
    if(n>=6) types.push('runner');
    if(ch===2){
      types.push('drone','drone','shield','splitter');
    }
    for(let i=0;i<count;i++){
      const tp=types[rndi(0,types.length-1)];
      const base=ENEMY_TYPES[tp];
      const ex=280+(i/(count-1||1))*(width-620)+rnd(-70,70);
      let ey=GROUND_Y-base.h;
      if(tp==='drone'){
        ey=240+rnd(140,-40);
        G.enemies.push(makeEnemy(tp,clamp(ex,140,width-260),ey,n));
        continue;
      }
      if(rng()<0.32){
        const plats=G.platforms.filter(p=>!p.ground&&p.x>200&&p.x<width-260);
        if(plats.length){
          const pl=plats[rndi(0,plats.length-1)];
          ey=pl.y-base.h;
          G.enemies.push(makeEnemy(tp,pl.x+pl.w/2-base.w/2,ey,n));
          continue;
        }
      }
      G.enemies.push(makeEnemy(tp,clamp(ex,140,width-260),ey,n));
    }
  }
  G.player=makePlayer(120,GROUND_Y-44);
  /* HP с прошлого уровня */
  if(typeof G.savedHp==='number'){
    G.player.hp=clamp(G.savedHp,1,G.player.maxhp);
  }
  mouse.down=false;
}

function makeEnemy(type,x,y,level){
  const b=ENEMY_TYPES[type];
  const ch=chapterOf(level);
  const scale=(ch===1?1:1.15)*(1+level*0.055);
  return {
    type,x,y,w:b.w,h:b.h,vx:0,vy:0,
    hp:b.hp*scale,maxhp:b.hp*scale,
    speed:b.speed,fireRate:(ch===2?b.fireRate*0.85:b.fireRate),
    bdmg:b.bdmg,bspeed:b.bspeed,
    flying:!!b.flying,armored:!!b.armored,split:!!b.split,
    dir:Math.random()<0.5?-1:1,
    onGround:false,shootCd:rnd(70,150),
    hitFlash:0,dead:false,deathTimer:0,
    anim:Math.random()*10,
    baseY:y,hoverPhase:rnd(Math.PI*2)
  };
}

function moveAndCollide(e,f){
  e.x+=e.vx*f;
  for(const pl of G.platforms){
    if(aabb(e,pl)){
      if(e.vx>0) e.x=pl.x-e.w;
      else if(e.vx<0) e.x=pl.x+pl.w;
      e.vx=0;
    }
  }
  e.y+=e.vy*f;
  e.onGround=false;
  for(const pl of G.platforms){
    if(aabb(e,pl)){
      if(e.vy>0){e.y=pl.y-e.h;e.vy=0;e.onGround=true;}
      else if(e.vy<0){e.y=pl.y+pl.h;e.vy=0;}
    }
  }
}

/* ============================================================
   ЧАСТИЦЫ / ПУЛИ / КРИПТА
   ============================================================ */
function spawnParticles(x,y,n,color,spd,size,grav){
  spd=spd||4;size=size||3;grav=(grav===undefined)?0.22:grav;
  if(G.particles.length>500) return;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const s=Math.random()*spd;
    G.particles.push({
      x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.8,
      life:1,decay:0.018+Math.random()*0.03,
      size:size*(0.5+Math.random()),color,grav
    });
  }
}
function updateParticles(f){
  for(const p of G.particles){
    p.x+=p.vx*f;p.y+=p.vy*f;p.vy+=p.grav*f;
    p.vx*=Math.pow(0.985,f);p.life-=p.decay*f;
  }
  G.particles=G.particles.filter(p=>p.life>0);
}
function drawParticles(){
  for(const p of G.particles){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    const s=p.size*(0.4+p.life*0.9);
    ctx.beginPath();ctx.arc(p.x,p.y,s,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function spawnBullet(x,y,ang,spd,dmg,owner,color,r){
  color=color||'#ffd08a';r=r||5;
  G.bullets.push({
    x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
    dmg,owner,r,life:230,color,age:0
  });
}
function updateBullets(f){
  const p=G.player;
  for(const b of G.bullets){
    b.age+=f;b.x+=b.vx*f;b.y+=b.vy*f;b.life-=f;
    if(b.age>6){
      for(const pl of G.platforms){
        if(b.x>pl.x&&b.x<pl.x+pl.w&&b.y>pl.y&&b.y<pl.y+pl.h){
          b.life=0;spawnParticles(b.x,b.y,4,b.color,3,2,0.12);break;
        }
      }
    }
    if(b.life<=0) continue;
    if(b.owner==='player'){
      for(const e of G.enemies){
        if(e.dead) continue;
        if(b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){
          damageEnemy(e,b.dmg);b.life=0;
          spawnParticles(b.x,b.y,7,'#ffd6a0',4,3,0.15);
          G.shake=Math.min(G.shake+2,10);
          SFX.hit();
          break;
        }
      }
      const bo=G.boss;
      if(b.life>0&&bo&&!bo.defeated&&
         b.x>bo.x&&b.x<bo.x+bo.w&&b.y>bo.y&&b.y<bo.y+bo.h){
        damageBoss(bo,b.dmg);b.life=0;
        spawnParticles(b.x,b.y,7,'#ffd6a0',4.5,3,0.15);
        G.shake=Math.min(G.shake+2.5,12);
        SFX.bossHit();
      }
    }else{
      if(p&&!p.dead&&p.invuln<=0&&
         b.x>p.x&&b.x<p.x+p.w&&b.y>p.y&&b.y<p.y+p.h){
        hurtPlayer(b.dmg);b.life=0;
      }
    }
  }
  G.bullets=G.bullets.filter(b=>b.life>0);
}
function drawBullets(){
  for(const b of G.bullets){
    ctx.globalAlpha=0.28;
    ctx.fillStyle=b.color;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*2.4,0,7);ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle=b.color;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
    ctx.fillStyle='#fff8ea';
    ctx.beginPath();ctx.arc(b.x-b.vx*0.28,b.y-b.vy*0.28,b.r*0.45,0,7);ctx.fill();
  }
}

/* ---- ЛУЧИ ---- */
function addBeam(x1,y1,x2,y2,dmg,color){
  G.beams.push({x1,y1,x2,y2,dmg,life:0.12,color:color||'#9affb0'});
}
function updateBeams(f){
  for(const bm of G.beams){
    bm.life-=f/60;
    if(bm.life<=0) continue;
    for(const e of G.enemies){
      if(e.dead) continue;
      if(segHitsRect(bm.x1,bm.y1,bm.x2,bm.y2,e.x,e.y,e.w,e.h)){
        damageEnemy(e,bm.dmg);
        spawnParticles(e.x+e.w/2,e.y+e.h/2,4,'#c0ffd0',3,2.4,0.1);
      }
    }
    const bo=G.boss;
    if(bo&&!bo.defeated&&segHitsRect(bm.x1,bm.y1,bm.x2,bm.y2,bo.x,bo.y,bo.w,bo.h)){
      damageBoss(bo,bm.dmg);
      spawnParticles(bo.x+bo.w/2,bo.y+bo.h/2,4,'#c0ffd0',3,2.4,0.1);
    }
  }
  G.beams=G.beams.filter(b=>b.life>0);
}
function segHitsRect(x1,y1,x2,y2,rx,ry,rw,rh){
  const steps=Math.max(2,Math.ceil(Math.hypot(x2-x1,y2-y1)/12));
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const px=x1+(x2-x1)*t, py=y1+(y2-y1)*t;
    if(px>rx&&px<rx+rw&&py>ry&&py<ry+rh) return true;
  }
  return false;
}
function drawBeams(){
  for(const bm of G.beams){
    const a=clamp(bm.life/0.12,0,1);
    ctx.save();
    ctx.globalAlpha=a;
    ctx.strokeStyle=bm.color;
    ctx.lineWidth=10;
    ctx.lineCap='round';
    ctx.shadowColor=bm.color;
    ctx.shadowBlur=20;
    ctx.beginPath();ctx.moveTo(bm.x1,bm.y1);ctx.lineTo(bm.x2,bm.y2);ctx.stroke();
    ctx.lineWidth=3;
    ctx.strokeStyle='#ffffff';
    ctx.beginPath();ctx.moveTo(bm.x1,bm.y1);ctx.lineTo(bm.x2,bm.y2);ctx.stroke();
    ctx.restore();
  }
}

/* ---- МЕТЕОРИТЫ ---- */
function spawnMeteor(x,y,dmg,radius){
  G.meteors.push({
    x,y,vx:rnd(2,-2),vy:8,
    dmg,radius,life:2.0,phase:rnd(Math.PI*2)
  });
  SFX.meteor();
}
function updateMeteors(f){
  const p=G.player;
  for(const m of G.meteors){
    m.life-=f/60;
    m.x+=m.vx*f;m.y+=m.vy*f;
    m.vy+=0.5*f;
    let hit=false;
    for(const pl of G.platforms){
      if(m.x>pl.x&&m.x<pl.x+pl.w&&m.y>pl.y-4&&m.y<pl.y+pl.h){
        hit=true;break;
      }
    }
    if(hit||m.y>H+100){
      const R=m.radius;
      spawnParticles(m.x,m.y,18,'#ffb060',7,4,0.15);
      spawnParticles(m.x,m.y,10,'#ffe080',5,3,0.1);
      G.shake=Math.min(G.shake+5,14);
      for(const e of G.enemies){
        if(e.dead) continue;
        const cx=e.x+e.w/2, cy=e.y+e.h/2;
        if(Math.hypot(cx-m.x,cy-m.y)<R) damageEnemy(e,m.dmg);
      }
      const bo=G.boss;
      if(bo&&!bo.defeated){
        const cx=bo.x+bo.w/2, cy=bo.y+bo.h/2;
        if(Math.hypot(cx-m.x,cy-m.y)<R+bo.w/2) damageBoss(bo,m.dmg);
      }
      if(p&&!p.dead){
        const cx=p.x+p.w/2, cy=p.y+p.h/2;
        if(Math.hypot(cx-m.x,cy-m.y)<R*0.6) hurtPlayer(Math.floor(m.dmg*0.25));
      }
      m.life=0;
    }
  }
  G.meteors=G.meteors.filter(m=>m.life>0);
}
function drawMeteors(){
  for(const m of G.meteors){
    ctx.save();
    ctx.globalAlpha=0.9;
    const g=ctx.createLinearGradient(m.x,m.y,m.x-m.vx*8,m.y-m.vy*8);
    g.addColorStop(0,'rgba(255,180,80,0.9)');
    g.addColorStop(1,'rgba(255,80,20,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(m.x,m.y,10,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,180,80,0.5)';
    ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*6,m.y-m.vy*6);ctx.stroke();
    ctx.fillStyle='#ffe0a0';
    ctx.beginPath();ctx.arc(m.x,m.y,6,0,7);ctx.fill();
    ctx.restore();
  }
}

/* ---- крипто-монеты ---- */
function dropCoins(x,y,total,count){
  count=count||3;
  const per=Math.max(1,Math.floor(total/count));
  for(let i=0;i<count;i++){
    const amt=(i===count-1)?total-per*(count-1):per;
    if(amt<=0) continue;
    G.coins.push({
      x:x+rnd(20,-20),y:y+rnd(10,-10),
      vx:rnd(4,-4),vy:rnd(-3,-9),
      amount:amt,life:30,
      phase:rnd(Math.PI*2),collected:false
    });
  }
}
function updateCoins(f){
  const p=G.player;
  for(const c of G.coins){
    if(G.state!=='levelclear') c.life-=f/60;
    if(c.life<=0){c.collected=true;continue;}
    if(p&&!p.dead){
      const dx=(p.x+p.w/2)-c.x;
      const dy=(p.y+p.h/2)-c.y;
      const d=Math.hypot(dx,dy)||1;
      const radius=(G.state==='levelclear')?340:110;
      if(d<radius){
        const pull=(G.state==='levelclear'?26:16)*(1-d/radius);
        c.vx+=(dx/d)*pull*f;
        c.vy+=(dy/d)*pull*f;
      }
      if(d<24){
        G.crypto+=c.amount;
        c.collected=true;
        spawnParticles(c.x,c.y,5,'#ffd966',3,2.2,0.05);
        SFX.coin();
        continue;
      }
    }
    c.vy+=0.45*f;
    c.x+=c.vx*f;
    c.y+=c.vy*f;
    c.vx*=Math.pow(0.94,f);
    for(const pl of G.platforms){
      if(c.x>pl.x&&c.x<pl.x+pl.w&&c.y>pl.y-8&&c.y<pl.y+pl.h){
        c.y=pl.y;c.vy=-c.vy*0.35;
        if(Math.abs(c.vy)<1.2) c.vy=0;
        break;
      }
    }
  }
  G.coins=G.coins.filter(c=>!c.collected);
}
function drawCoins(){
  for(const c of G.coins){
    if(c.life<3&&Math.floor(c.life*8)%2===0) continue;
    const bob=Math.sin(G.time*6+c.phase)*2;
    ctx.save();
    ctx.translate(c.x,c.y+bob);
    ctx.fillStyle='rgba(255,215,100,0.22)';
    ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.fill();
    const g=ctx.createRadialGradient(-2,-2,1,0,0,7);
    g.addColorStop(0,'#ffe58a');
    g.addColorStop(0.7,'#e0aa3a');
    g.addColorStop(1,'#a06a1a');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(0,0,6.5,0,7);ctx.fill();
    ctx.strokeStyle='rgba(120,80,10,0.7)';
    ctx.lineWidth=0.8;
    ctx.stroke();
    ctx.fillStyle='#5a3a08';
    ctx.font='bold 9px "Segoe UI", sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('₿',0,0.5);
    ctx.restore();
  }
}

/* ============================================================
   УРОН
   ============================================================ */
function damageEnemy(e,dmg){
  let finalDmg=dmg;
  if(e.armored) finalDmg=Math.round(dmg*0.6);
  e.hp-=finalDmg;e.hitFlash=8;
  G.hitstop=Math.max(G.hitstop,2.5);
  if(e.hp<=0){
    SFX.kill();
    e.dead=true;e.deathTimer=0.9;
    spawnParticles(e.x+e.w/2,e.y+e.h/2,16,'#e8a86a',6,4,0.25);
    G.shake=Math.min(G.shake+4,14);
    const amt=e.type==='heavy'?rndi(15,28):
              e.type==='shield'?rndi(20,34):
              e.type==='drone'?rndi(10,18):
              e.type==='splitter'?rndi(8,14):
              e.type==='runner'?rndi(3,8):rndi(5,12);
    dropCoins(e.x+e.w/2,e.y+e.h/2,amt,3);
    if(e.split){
      const cx=e.x+e.w/2, cy=e.y+e.h/2;
      for(let i=0;i<2;i++){
        const child=makeEnemy('runner',cx-30+i*30,cy-20,G.level);
        child.speed=2.6;child.hp=child.maxhp=18;
        G.enemies.push(child);
      }
    }
  }
}
function damageBoss(b,dmg){
  if(b.defeated) return;
  b.hp-=dmg;b.hitFlash=6;
  G.hitstop=Math.max(G.hitstop,3);
  if(b.hp<=0){
    SFX.bossDie();
    b.hp=0;b.defeated=true;b.deathT=0;
    G.shake=34;
    spawnParticles(b.x+b.w/2,b.y+b.h/2,90,'#ffcf8a',12,6,0.06);
    spawnParticles(b.x+b.w/2,b.y+b.h/2,50,'#ff8a4a',9,5,0.1);
    for(const e of G.enemies){
      if(!e.dead){
        e.dead=true;e.deathTimer=1;
        spawnParticles(e.x+e.w/2,e.y+e.h/2,10,'#e8a86a',5,3,0.2);
      }
    }
    const amt=b.type===0?rndi(150,300):
              b.type===1?rndi(300,500):
              b.type===2?rndi(500,900):
              b.type===3?rndi(600,1000):
              b.type===4?rndi(1000,1600):rndi(2000,3000);
    dropCoins(b.x+b.w/2,b.y+b.h/2,amt,12);
  }
}
function hurtPlayer(dmg){
  const p=G.player;
  if(!p||p.dead||p.invuln>0) return;
  p.hp-=dmg;p.invuln=62;
  SFX.hurt();
  G.shake=Math.min(G.shake+10,20);
  G.camZoomTarget=1.02;
  spawnParticles(p.x+p.w/2,p.y+p.h/2,12,'#ff9a6a',5,3.5,0.2);
  if(p.hp<=0){p.hp=0;playerDie();}
}
function playerDie(){
  const p=G.player;
  if(!p||p.dead) return;
  p.dead=true;G.lives--;G.state='dying';
  G.deathTimer=1.7;G.shake=26;
  spawnParticles(p.x+p.w/2,p.y+p.h/2,50,'#ff9a6a',9,5,0.18);
  G.bannerText='ВЫ ПОГИБЛИ';
  G.bannerSub=G.lives>0?('ОСТАЛОСЬ ЖИЗНЕЙ: '+G.lives):'ЖИЗНИ ЗАКОНЧИЛИСЬ';
}

/* ============================================================
   ПРОКСИ: активация
   ============================================================ */
function activateProxy(){
  if(G.state!=='playing') return;
  if(G.proxy<=0) return;
  if(G.proxyCd>0) return;
  const p=G.player;
  if(!p||p.dead) return;
  const cfg=PROXY[G.proxy-1];
  G.proxyCd=PROXY_CD;
  SFX.proxy();
  G.shake=Math.min(G.shake+16,26);
  G.camZoomTarget=1.03;
  const cx=p.x+p.w/2, cy=p.y+p.h/2;
  G.proxyFx.push({x:cx,y:cy,r:20,maxR:cfg.radius,life:0.8});
  spawnParticles(cx,cy,50,'#ffe0a0',9,5,0.15);
  spawnParticles(cx,cy,30,'#ffcf70',7,4,0.1);
  /* урон по врагам в радиусе */
  for(const e of G.enemies){
    if(e.dead) continue;
    const ex=e.x+e.w/2, ey=e.y+e.h/2;
    if(Math.hypot(ex-cx,ey-cy)<cfg.radius){
      damageEnemy(e,cfg.dmg);
      spawnParticles(ex,ey,6,'#ffe0a0',4,3,0.1);
    }
  }
  const bo=G.boss;
  if(bo&&!bo.defeated){
    const bx=bo.x+bo.w/2, by=bo.y+bo.h/2;
    if(Math.hypot(bx-cx,by-cy)<cfg.radius+bo.w/2){
      damageBoss(bo,cfg.dmg);
      spawnParticles(bx,by,10,'#ffe0a0',5,3.5,0.1);
    }
  }
  updateProxyHUD();
}

function updateProxyHUD(){
  if(G.proxy<=0){
    elProxyBtn.classList.add('hidden');
    return;
  }
  elProxyBtn.classList.remove('hidden');
  elProxyLvl.textContent=G.proxy;
  if(G.proxyCd>0){
    elProxyBtn.classList.remove('ready');
    elProxyBtn.classList.add('cd');
    const secs=Math.ceil(G.proxyCd/60);
    elProxyCd.textContent=secs+'с';
  }else{
    elProxyBtn.classList.remove('cd');
    elProxyBtn.classList.add('ready');
    elProxyCd.textContent='ГОТОВ';
  }
}

/* ============================================================
   ОБНОВЛЕНИЕ ИГРОКА
   ============================================================ */
function updatePlayer(f){
  const p=G.player;
  if(!p||p.dead) return;

  const left=keys['KeyA']||keys['ArrowLeft'];
  const right=keys['KeyD']||keys['ArrowRight'];
  const jump=keys['KeyW']||keys['ArrowUp']||keys['Space'];

  if(left){p.vx-=MOVEACC*f;p.facing=-1;}
  if(right){p.vx+=MOVEACC*f;p.facing=1;}
  if(!left&&!right){
    p.vx*=Math.pow(0.76,f);
    if(Math.abs(p.vx)<0.06)p.vx=0;
  }
  p.vx=clamp(p.vx,-MAXSPD,MAXSPD);

  if(pressed['KeyW']||pressed['ArrowUp']||pressed['Space']) p.jumpBuf=8;
  else p.jumpBuf=Math.max(0,p.jumpBuf-f);
  if(p.onGround) p.coyote=8; else p.coyote=Math.max(0,p.coyote-f);

  if(p.jumpBuf>0&&p.coyote>0){
    p.vy=JUMPV;p.onGround=false;p.coyote=0;p.jumpBuf=0;
    G.camZoomTarget=0.985;
    SFX.jump();
    spawnParticles(p.x+p.w/2,p.y+p.h,7,'#c9b39a',2.6,2.4,0.18);
  }
  if(!jump&&p.vy<-4) p.vy*=Math.pow(0.86,f);

  p.vy+=GRAV*f;
  if(p.vy>MAXFALL) p.vy=MAXFALL;

  const wasGround=p.onGround;
  moveAndCollide(p,f);
  if(!wasGround&&p.onGround){
    G.camZoomTarget=1.0;
    SFX.land();
    spawnParticles(p.x+p.w/2,p.y+p.h,6,'#c9b39a',2.2,2.2,0.2);
  }

  p.x=clamp(p.x,0,G.levelWidth-p.w);
  if(p.y>H+200){p.y=GROUND_Y-p.h-10;p.vy=0;hurtPlayer(15);}

  const wx=mouse.x+G.camX, wy=mouse.y;
  p.aimAng=Math.atan2(wy-(p.y+p.h*0.70),wx-(p.x+p.w/2));

  p.shootCd-=f;
  if((mouse.down||keys['KeyJ'])&&p.shootCd<=0){
    const cfg=VPN[G.vpn-1];
    p.shootCd=cfg.cd;
    const ang=p.aimAng;
    const ox=p.x+p.w/2+Math.cos(ang)*18;
    const oy=p.y+p.h*0.70+Math.sin(ang)*18;

    if(cfg.type==='bullet'){
      for(let i=0;i<cfg.n;i++){
        let a=ang;
        if(cfg.n>1) a=ang+(i-(cfg.n-1)/2)*cfg.spread*2;
        spawnBullet(ox,oy,a,15,cfg.dmg,'player','#ffe0a8',5);
      }
      const kick=cfg.n>=3?1.6:(cfg.n===2?1.1:0.7);
      p.vx-=Math.cos(ang)*kick;
      if(cfg.n>1) SFX.shoot3(); else SFX.shoot();
      spawnParticles(ox,oy,3,'#ffd9a0',2.5,2,0.05);
      G.shake=Math.min(G.shake+0.6,4);
    }
    else if(cfg.type==='beam'){
      const maxLen=cfg.beamLen||900;
      const ex=ox+Math.cos(ang)*maxLen;
      const ey=oy+Math.sin(ang)*maxLen;
      if(cfg.n===1){
        addBeam(ox,oy,ex,ey,cfg.dmg,'#9affb0');
      }else{
        const spread=cfg.spread||0.16;
        for(let i=0;i<cfg.n;i++){
          const a=ang+(i-(cfg.n-1)/2)*spread*2;
          addBeam(ox,oy,ox+Math.cos(a)*maxLen,oy+Math.sin(a)*maxLen,cfg.dmg,'#b0ffb0');
        }
      }
      p.vx-=Math.cos(ang)*0.4;
      SFX.beam();
      G.shake=Math.min(G.shake+0.4,3);
    }
    else if(cfg.type==='meteor'){
      /* метеоры над курсором */
      const spread=cfg.meteorSpread||0;
      const n=cfg.n;
      const baseY=Math.max(60,wy-380);
      for(let i=0;i<n;i++){
        let mx,my;
        if(spread>0){
          /* истребитель: разброс по всей ширине */
          const t=(i+0.5)/n;
          mx=wx-spread/2+spread*t;
          my=baseY+rnd(40,-40);
        }else{
          /* обычные метеоры: кластер над курсором */
          const off=(i-(n-1)/2)*Math.max(50,cfg.meteorRadius*0.9);
          mx=wx+off;
          my=baseY+rnd(30,-30);
        }
        spawnMeteor(mx,my,cfg.dmg,cfg.meteorRadius);
      }
      p.vx-=Math.cos(ang)*1.0;
      G.shake=Math.min(G.shake+1.2,6);
    }

    spawnParticles(ox,oy,3,'#ffd9a0',2.5,2,0.05);
  }
  if(p.invuln>0) p.invuln-=f;
  p.anim+=Math.abs(p.vx)*0.06*f+0.02*f;
}

/* ============================================================
   ОБНОВЛЕНИЕ ВРАГОВ
   ============================================================ */
function updateEnemies(f){
  const p=G.player;
  for(const e of G.enemies){
    if(e.dead){e.deathTimer-=f*0.9;continue;}
    e.anim+=f*0.1;

    if(e.flying){
      e.hoverPhase+=f*0.03;
      const dx=(p?p.x+e.w/2:e.x)-e.x;
      e.x+=Math.sign(dx)*e.speed*0.7*f;
      e.y=e.baseY+Math.sin(e.hoverPhase)*40;
      e.x=clamp(e.x,40,G.levelWidth-e.w-40);
    }else{
      e.vy+=GRAV*f;
      if(e.vy>MAXFALL) e.vy=MAXFALL;
      const nx=e.x+e.dir*(e.w*0.5+8);
      let supported=false;
      for(const pl of G.platforms){
        if(nx>pl.x&&nx<pl.x+pl.w&&e.y+e.h>=pl.y-4&&e.y+e.h<=pl.y+26){supported=true;break;}
      }
      if(!supported&&e.onGround) e.dir*=-1;
      if(e.x<40) e.dir=1;
      if(e.x>G.levelWidth-e.w-40) e.dir=-1;
      e.vx=e.dir*e.speed;
      moveAndCollide(e,f);
      if(e.vx===0&&e.onGround) e.dir*=-1;
    }

    if(p&&!p.dead){
      const dx=(p.x+p.w/2)-(e.x+e.w/2);
      const dy=(p.y+p.h/2)-(e.y+e.h/2);
      const d=Math.hypot(dx,dy);
      if(d<820){
        e.shootCd-=f;
        if(e.shootCd<=0){
          e.shootCd=e.fireRate*rnd(1.25,0.8);
          const a=Math.atan2(dy,dx)+rnd(0.09,-0.09);
          spawnBullet(e.x+e.w/2+Math.cos(a)*14,e.y+e.h*0.42+Math.sin(a)*14,
            a,e.bspeed,e.bdmg,'enemy','#ff9a6a',5);
        }
      }else{
        e.shootCd=Math.max(e.shootCd-f,0);
      }
    }
    if(e.hitFlash>0) e.hitFlash-=f;
  }
  G.enemies=G.enemies.filter(e=>!e.dead||e.deathTimer>0);
}

function updateBoss(f){
  const b=G.boss;
  if(!b) return;
  const p=G.player;
  b.t+=f;b.anim+=f*0.08;

  if(b.defeated){
    b.deathT+=f;
    if(Math.random()<0.28*f){
      spawnParticles(b.x+rnd(b.w),b.y+rnd(b.h),5,'#ffb070',6,4,0.1);
    }
    return;
  }
  if(b.hitFlash>0) b.hitFlash-=f;

  const px=p?(p.x+p.w/2):b.x;
  const py=p?(p.y+p.h/2):b.y;
  const hpFrac=b.hp/b.maxhp;

  if(b.type===0){
    b.vy+=GRAV*f;
    if(b.vy>MAXFALL)b.vy=MAXFALL;
    const dir=Math.sign(px-(b.x+b.w/2))||1;
    b.vx=dir*1.5;
    moveAndCollide(b,f);
    b.atkCd-=f;
    if(b.atkCd<=0){
      b.atkCd=108;
      const a=Math.atan2(py-(b.y+b.h*0.4),px-(b.x+b.w/2));
      for(let i=-1;i<=1;i++)
        spawnBullet(b.x+b.w/2,b.y+b.h*0.42,a+i*0.20,6.2,14,'enemy','#ff9a5a',6);

    }
    b.atk2-=f;
    if(b.atk2<=0){
      b.atk2=290;

/* ============================================================
   КАМЕРА / КОНЕЦ УРОВНЯ
   ============================================================ */
function updateCamera(f){
  const p=G.player;
  if(!p) return;
  const target=clamp(p.x+p.w/2-W/2,0,Math.max(0,G.levelWidth-W));
  G.camX=lerp(G.camX,target,0.13*f);
  if(G.levelWidth<=W) G.camX=0;
  G.camZoom=lerp(G.camZoom,G.camZoomTarget,0.14*f);
  if(Math.abs(G.camZoom-G.camZoomTarget)<0.0005) G.camZoom=G.camZoomTarget;
}
function checkLevelClear(){
  if(G.state!=='playing') return;
  if(G.boss){
    if(!G.boss.defeated||G.boss.deathT<90) return;
  }
  if(G.enemies.some(e=>!e.dead)) return;
  if(G.coins.length>0) return;

  G.state='levelclear';
  G.clearTimer=2.2;
  G.bannerText='УРОВЕНЬ ПРОЙДЕН';
  G.bannerSub='';
  spawnParticles(G.player.x+G.player.w/2,G.player.y+G.player.h/2,26,'#ffe0a8',7,4,0.05);
}

/* ============================================================
   ОТРИСОВКА МИРА
   ============================================================ */
function drawPlatforms(){
  for(const pl of G.platforms){
    if(pl.x>G.camX+W+60||pl.x+pl.w<G.camX-60) continue;
    const g=ctx.createLinearGradient(0,pl.y,0,pl.y+Math.min(pl.h,180));
    if(pl.ground){
      g.addColorStop(0,'#3b3140');g.addColorStop(0.10,'#2a2231');
      g.addColorStop(0.45,'#1b1522');g.addColorStop(1,'#0c0812');
    }else{
      g.addColorStop(0,'#463a4c');g.addColorStop(0.22,'#2e2436');
      g.addColorStop(1,'#171020');
    }
    ctx.fillStyle=g;
    ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
    const hg=ctx.createLinearGradient(0,pl.y,0,pl.y+6);
    hg.addColorStop(0,'rgba(255,215,160,0.34)');
    hg.addColorStop(1,'rgba(255,215,160,0)');
    ctx.fillStyle=hg;
    ctx.fillRect(pl.x,pl.y,pl.w,6);
    if(!pl.ground){
      ctx.fillStyle='rgba(0,0,0,0.25)';
      ctx.fillRect(pl.x,pl.y+pl.h-3,pl.w,3);
    }else{
      ctx.fillStyle='rgba(0,0,0,0.18)';
      for(let i=0;i<pl.w;i+=118) ctx.fillRect(pl.x+i,pl.y+18,2,pl.h-18);
    }
  }
}

function drawPlayer(){
  const p=G.player;
  if(!p) return;
  const t=G.time;
  const cx=p.x+p.w/2, feet=p.y+p.h;
  ctx.save();
  ctx.translate(cx,feet);
  if(p.invuln>0&&Math.floor(t*26)%2===0) ctx.globalAlpha=0.38;
  if(p.dead) ctx.globalAlpha=0.25;

  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath();ctx.ellipse(0,2,16,5,0,0,7);ctx.fill();

  const moving=Math.abs(p.vx)>0.7&&p.onGround;
  const swing=moving?Math.sin(p.anim*16)*0.75:0;
  const bob=moving?Math.abs(Math.sin(p.anim*16))*1.6:0;
  ctx.translate(0,-bob);

  ctx.strokeStyle='#241b2b';
  ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-4,-15);ctx.lineTo(-4+swing*7,-1);ctx.stroke();
  ctx.beginPath();ctx.moveTo(4,-15);ctx.lineTo(4-swing*7,-1);ctx.stroke();

  const tg=ctx.createLinearGradient(0,-32,0,-13);
  tg.addColorStop(0,'#5a7b84');tg.addColorStop(1,'#2e464d');
  ctx.fillStyle=tg;
  rr(-9,-32,18,20,5);ctx.fill();

  ctx.fillStyle='#c9603f';
  rr(-9.5,-33,19,5,2.5);ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-9,-31);
  ctx.quadraticCurveTo(-17+Math.sin(t*7)*3,-26,-13,-20+Math.sin(t*5)*2);
  ctx.lineTo(-10,-22);
  ctx.quadraticCurveTo(-13,-27,-8,-29);
  ctx.closePath();ctx.fill();

  ctx.fillStyle='#e8b48c';
  ctx.beginPath();ctx.arc(0,-38.5,6.6,0,7);ctx.fill();
  ctx.fillStyle='#2a1e22';
  ctx.beginPath();ctx.arc(0,-39.5,6.8,Math.PI*1.02,Math.PI*1.98);ctx.fill();
  ctx.fillRect(-6.8,-40.5,13.6,2.6);
  ctx.fillStyle='#2a1e22';
  ctx.beginPath();ctx.arc(2.4,-38.2,1.15,0,7);ctx.fill();

  const aa=p.aimAng;
  ctx.save();
  ctx.translate(0,-27);
  ctx.rotate(aa);
  const isBeam=VPN[G.vpn-1].type==='beam';
  const isMeteor=VPN[G.vpn-1].type==='meteor';
  ctx.strokeStyle='#3d5560';
  ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(15,0);ctx.stroke();
  const dg=ctx.createLinearGradient(13,-5,27,5);
  if(isBeam){
    dg.addColorStop(0,'#a0ffb0');dg.addColorStop(1,'#60c080');
  }else if(isMeteor){
    dg.addColorStop(0,'#ffb060');dg.addColorStop(1,'#c06020');
  }else{
    dg.addColorStop(0,'#e2c084');dg.addColorStop(1,'#b3894b');
  }
  ctx.fillStyle=dg;
  rr(13,-5,13,10,3);ctx.fill();
  ctx.fillStyle='#fff3d4';
  rr(15.5,-3,8,6,2);ctx.fill();
  ctx.restore();

  ctx.restore();
}

function drawEnemy(e){

    ctx.fillStyle='#cfcfda';
    rr(-e.w*0.13,-e.h*0.84,e.w*0.26,e.h*0.44,2);ctx.fill();

    ctx.fillStyle='#a83232';
    ctx.beginPath();
    ctx.moveTo(0,-e.h*0.83);
    ctx.lineTo(e.w*0.07,-e.h*0.74);
    ctx.lineTo(0,-e.h*0.50);

    ctx.beginPath();ctx.arc(e.w*0.11,-e.h*0.93,e.w*0.045,0,7);ctx.fill();

    ctx.strokeStyle='#2b2d3c';

function drawBanner(){
  if(G.state!=='levelclear'&&G.state!=='dying') return;
  const a=G.state==='dying'
    ? clamp(1-(G.deathTimer-0.2)/1.5,0,1)
    : clamp(1-(G.clearTimer)/2.2,0,1);
  ctx.save();
  ctx.globalAlpha=clamp(a*1.6,0,1);
  ctx.textAlign='center';
  const grd=ctx.createLinearGradient(0,H*0.36,0,H*0.56);
  grd.addColorStop(0,'rgba(8,4,12,0)');
  grd.addColorStop(0.5,'rgba(8,4,12,0.72)');
  grd.addColorStop(1,'rgba(8,4,12,0)');
  ctx.fillStyle=grd;
  ctx.fillRect(0,H*0.36,W,H*0.20);
  ctx.font='700 46px Georgia, serif';
  ctx.fillStyle=G.state==='dying'?'#e0704a':'#f0d9a8';
  ctx.shadowColor='rgba(0,0,0,0.9)';
  ctx.shadowBlur=24;
  ctx.fillText(G.bannerText,W/2,H*0.47);
  if(G.bannerSub){
    ctx.font='600 18px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle='#c9b8a0';
    ctx.fillText(G.bannerSub,W/2,H*0.51);
  }
  ctx.restore();
}

/* ============================================================
   РЕНДЕР
   ============================================================ */
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G.shake>0.2) ctx.translate(rnd(G.shake,-G.shake),rnd(G.shake,-G.shake));
  if(Math.abs(G.camZoom-1)>0.0005){
    ctx.translate(W/2,H/2);
    ctx.scale(G.camZoom,G.camZoom);
    ctx.translate(-W/2,-H/2);
  }
  drawBackground();
  ctx.save();
  ctx.translate(-Math.round(G.camX),0);
  drawPlatforms();
  for(const e of G.enemies) drawEnemy(e);
  if(G.boss) drawBoss();
  drawCoins();
  drawMeteors();
  drawBeams();
  drawProxyFx();
  drawPlayer();
  drawBullets();
  drawParticles();
  ctx.restore();
  drawVignette();
  ctx.restore();
  drawBanner();
}

/* ============================================================
   HUD
   ============================================================ */
const HEART_SVG='<svg viewBox="0 0 24 24"><path d="M12 21s-8-4.9-8-10.4C4 7.3 6.4 5 9.2 5c1.6 0 3 .8 3.8 2 .8-1.2 2.2-2 3.8-2C19.6 5 22 7.3 22 10.6 22 16.1 14 21 12 21z" fill="#e0563f"/><path d="M12 21s-8-4.9-8-10.4C4 7.3 6.4 5 9.2 5c1.6 0 3 .8 3.8 2 .8-1.2 2.2-2 3.8-2C19.6 5 22 7.3 22 10.6 22 16.1 14 21 12 21z" fill="none" stroke="rgba(255,210,160,.5)" stroke-width="1"/></svg>';

let heartsBuilt=false;
function updateHUD(){
  if(!heartsBuilt){
    elHearts.innerHTML='';
    for(let i=0;i<3;i++){
      const d=document.createElement('div');
      d.className='heart';d.innerHTML=HEART_SVG;
      elHearts.appendChild(d);
    }
    heartsBuilt=true;
  }
  const hs=elHearts.children;
  for(let i=0;i<3;i++) hs[i].className='heart'+(i<G.lives?'':' off');

  const p=G.player;
  const hp=p?Math.max(0,p.hp/p.maxhp):1;
  elHp.style.width=(hp*100)+'%';
  elHp.style.background=hp>0.5
    ?'linear-gradient(90deg,#c9603f,#e59a5b 55%,#f3c98a)'
    :'linear-gradient(90deg,#8c1f26,#c9412f 60%,#e07a4a)';

  elLvl.textContent='УРОВЕНЬ '+G.level+' / 60';
  elChapter.textContent=chapterName(G.level);
  elVpn.textContent=VPN[G.vpn-1].name;
  elCoins.textContent='₿ '+G.crypto;

  let cnt=G.enemies.filter(e=>!e.dead).length;
  if(G.boss&&!G.boss.defeated) cnt++;
  elCnt.textContent=cnt>0?('ЦЕЛЕЙ: '+cnt):'ПУТЬ СВОБОДЕН';

  if(G.boss&&!G.boss.defeated){
    elBossBar.classList.add('on');
    elBossName.textContent=G.boss.name;
    elBossFill.style.width=Math.max(0,(G.boss.hp/G.boss.maxhp)*100)+'%';
  }else{
    elBossBar.classList.remove('on');
  }

  updateProxyHUD();
}

/* ============================================================
   ОВЕРЛЕЙ
   ============================================================ */
function showOverlay(html){
  panel.innerHTML=html;
  overlay.classList.remove('hidden');
}
function hideOverlay(){overlay.classList.add('hidden');}

function togglePause(){
  if(G.state==='playing'){
    G.prevState='playing';G.state='paused';
    showPauseMenu();
  }else if(G.state==='paused'){
    G.state='playing';hideOverlay();
  }
}
function showPauseMenu(){
  G.state='paused';
  showOverlay(`
    <div class="kicker">ПАУЗА</div>
    <h2>ПРОРЫВ 4</h2>
    <div class="sub" style="margin-bottom:8px">
      ${chapterName(G.level)}<br>
      Уровень <b style="color:#e79a5b">${G.level}</b> из 60<br>
      Жизней: <b style="color:#e79a5b">${G.lives}</b> &nbsp;·&nbsp;
      Крипта: <b style="color:#ffd966">₿ ${G.crypto}</b><br>
      ${VPN[G.vpn-1].name}${G.proxy>0?' &nbsp;·&nbsp; Прокси ур. '+G.proxy:''}
    </div>
    <div class="btnrow" style="margin-top:22px">
      <button class="btn" id="btnResume">ПРОДОЛЖИТЬ</button>
      <button class="btn secondary" id="btnShop">МАГАЗИН</button>
      <button class="btn secondary" id="btnSound">ЗВУК: ${AC.enabled?'ВКЛ':'ВЫКЛ'}</button>
      <button class="btn secondary" id="btnToMenu">В ГЛАВНОЕ МЕНЮ</button>
    </div>
    <div class="hint" style="margin-top:22px">ESC / P — ПРОДОЛЖИТЬ</div>
  `);
  document.getElementById('btnResume').addEventListener('click',()=>{
    G.state='playing';hideOverlay();
  });
  document.getElementById('btnShop').addEventListener('click',()=>{
    renderShop(()=>{showPauseMenu();});
  });
  document.getElementById('btnSound').addEventListener('click',()=>{
    AC.enabled=!AC.enabled;
    if(AC.master) AC.master.gain.value=AC.enabled?0.35:0;
    if(AC.enabled){audioInit();acResume();SFX.uiClick();}
    showPauseMenu();
  });
  document.getElementById('btnToMenu').addEventListener('click',()=>{
    saveGame();menuScreen();
  });
}

function renderShop(onClose){
  G.state='shop';
  G.shopOnClose=onClose;

  const items=[];

  /* VPN */
  if(G.vpn<VPN.length){
    const nextLvl=G.vpn+1;
    const cfg=VPN[nextLvl-1];
    const prev=VPN[G.vpn-1];
    const cost=VPN_COST[nextLvl-1]||0;
    const can=G.crypto>=cost;
    const typeDesc=cfg.type==='bullet'?`Урон ${prev.dmg}→${cfg.dmg} · Задержка ${prev.cd}→${cfg.cd} · Пули ${prev.n}→${cfg.n}`
                  :cfg.type==='beam'?`ЛУЧ · Урон/тик ${cfg.dmg} · Задержка ${cfg.cd}`
                  :`МЕТЕОРИТ · Урон ${cfg.dmg} · Радиус ${cfg.meteorRadius} · Метеоров ${cfg.n}`;
    items.push({
      key:'vpn',
      name:cfg.name,
      desc:typeDesc,
      price:cost,can,
      action:()=>{G.crypto-=cost;G.vpn=nextLvl;saveGame();}
    });
  }else{
    items.push({
      key:'vpnmax',
      name:'VPN · МАКСИМУМ',
      desc:'Все 11 уровней достигнуты',
      price:0,can:false,maxed:true
    });
  }

  /* Прокси */
  if(G.proxy<PROXY.length){
    const nextLvl=G.proxy+1;
    const cfg=PROXY[nextLvl-1];
    const cost=cfg.cost;
    const can=G.crypto>=cost;
    items.push({
      key:'proxy',
      name:'ПРОКСИ · УРОВЕНЬ '+nextLvl,
      desc:`Урон ${cfg.dmg} · Радиус ${cfg.radius} · Перезарядка 15с`,
      price:cost,can,
      action:()=>{G.crypto-=cost;G.proxy=nextLvl;saveGame();}
    });
  }else{
    items.push({
      key:'proxymax',
      name:'ПРОКСИ · МАКСИМУМ',
      desc:'Все 8 уровней достигнуты',
      price:0,can:false,maxed:true
    });
  }

  /* Аптечка */
  const p=G.player;
  const hpFull=p&&p.hp>=p.maxhp;
  if(!hpFull){
    const can=G.crypto>=HEAL_COST;
    items.push({
      key:'heal',
      name:'АПТЕЧКА · +40 HP',
      desc:'Восстанавливает здоровье',
      price:HEAL_COST,can,
      action:()=>{
        G.crypto-=HEAL_COST;
        p.hp=Math.min(p.maxhp,p.hp+40);
        G.savedHp=p.hp;
        saveGame();
      }
    });
  }else{
    items.push({
      key:'healfull',
      name:'АПТЕЧКА',
      desc:'Здоровье уже полное',
      price:0,can:false,maxed:true
    });
  }

  /* Жизнь */
  if(G.lives<3){
    const can=G.crypto>=LIFE_COST;
    items.push({
      key:'life',
      name:'ДОП. ЖИЗНЬ',
      desc:`Сейчас ${G.lives} из 3`,
      price:LIFE_COST,can,
      action:()=>{G.crypto-=LIFE_COST;G.lives++;saveGame();}
    });
  }else{
    items.push({
      key:'lifemax',
      name:'ДОП. ЖИЗНЬ',
      desc:'Максимум жизней',
      price:0,can:false,maxed:true
    });
  }

  const buildHtml=()=>`
    <div class="kicker">МАГАЗИН</div>
    <div class="coinsline">В кошельке: <b>₿ ${G.crypto}</b></div>
    <div class="shoplist">
      ${items.map((it,idx)=>{
        const cls=it.maxed?'shopitem maxed':(it.can?'shopitem can':'shopitem cant');
        const priceHtml=it.maxed
          ? '<span class="siprice">MAX</span>'
          : `<span class="siprice">₿ ${it.price}</span>`;
        return `<button class="${cls}" data-idx="${idx}" ${it.can?'':'disabled'}>
          <div class="sibody">
            <div class="siname">${it.name}</div>
            <div class="sidesc">${it.desc}</div>
          </div>
          ${priceHtml}
        </button>`;
      }).join('')}
    </div>
    <button class="btn" id="btnShopDone">ДАЛЬШЕ</button>
  `;

  showOverlay(buildHtml());

  panel.querySelectorAll('.shopitem.can').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx=parseInt(btn.dataset.idx,10);
      const it=items[idx];
      if(it&&it.can&&it.action){
        SFX.buy();
        it.action();
        renderShop(onClose);
      }
    });
  });
  const btnDone=document.getElementById('btnShopDone');
  if(btnDone){
    btnDone.addEventListener('click',()=>{
      SFX.uiClick();
      const cb=G.shopOnClose;
      G.shopOnClose=null;
      if(cb) cb();
    });
  }
}

function menuScreen(){
  G.state='menu';
  const save=loadGame();
  const continueBtn=save
    ? `<button class="btn" id="btnContinue">ПРОДОЛЖИТЬ · УР. ${save.level}</button>`
    : '';
  const startLabel=save?'НОВАЯ ИГРА':'НАЧАТЬ ПРОРЫВ';
  showOverlay(`
    <div class="kicker">ПРОДОЛЖЕНИЕ ЛЕГЕНДЫ</div>
    <h1>ПРОРЫВ <em>4</em></h1>
    <div class="sub" style="margin-top:14px">
      Глава 1 · Финал — 30 уровней · 3 босса.<br>
      Глава 2 · Очистка — 30 уровней · 3 босса.<br>
      <span style="color:#ffd966">Крипта · Магазин · Прокси · 11 уровней VPN</span>
    </div>
    <div class="btnrow" style="margin-top:28px">
      ${continueBtn}
      <button class="btn${save?' secondary':''}" id="btnStart">${startLabel}</button>
    </div>
    <div class="keys">
      <span><b>A / D</b> — движение</span>
      <span><b>W / ПРОБЕЛ</b> — прыжок</span>
      <span><b>ЛКМ / J</b> — огонь</span>
      <span><b>Q / КНОПКА</b> — прокси</span>
      <span><b>ESC / P</b> — пауза</span>
    </div>
  `);
  if(save){
    document.getElementById('btnContinue').addEventListener('click',()=>{
      hideOverlay();

function gameOverScreen(){
  G.state='gameover';
  showOverlay(`
    <div class="kicker">ПРОРЫВ НЕ УДАЛСЯ</div>
    <h2>ВЫ ПОГИБЛИ</h2>
    <div class="sub">
      Жизни закончились на уровне <b style="color:#e79a5b">${G.level}</b>.<br>
      VPN остыл. Клоны снова разошлись по городу.
    </div>
    <button class="btn" id="btnRetry">НАЧАТЬ ЗАНОВО</button>
  `);
  document.getElementById('btnRetry').addEventListener('click',()=>{
    hideOverlay();clearSave();startGame();
  });
}

function victoryScreen(){
  G.state='victory';
  clearSave();
  showOverlay(`
    <div class="kicker">ПРОИЗВОДИТЕЛЬ ПОВЕРЖЕН</div>
    <h1 style="font-size:calc(var(--u)*58)">ПРОРЫВ</h1>
    <div class="sub" style="margin-top:16px;line-height:1.9">
      Конвейер остановлен. Кабели оборваны.<br>
      Клоны больше не рождаются.<br><br>
      Ты вышел на улицу. Снова за хлебом.<br>
      На этот раз — один.<br><br>
      <span style="color:#ffd966">Конец главы 2 · Очистка</span>
    </div>
    <button class="btn" id="btnAgain">ПРОЙТИ СНОВА</button>
  `);
  document.getElementById('btnAgain').addEventListener('click',()=>{
    hideOverlay();startGame();
  });

let storyLines=[],storyIdx=0;
function showStory(lines){
  storyLines=lines;storyIdx=0;
  G.state='story';
  renderStory();
}
function renderStory(){
  showOverlay(`
    <div class="kicker">ИСТОРИЯ</div>
    <div class="story">${storyLines[storyIdx]}</div>
    <div class="hint">ПРОБЕЛ / КЛИК — ДАЛЬШЕ</div>
  `);
}
function advanceStory(){
  storyIdx++;
  if(storyIdx>=storyLines.length){
    hideOverlay();
    G.state='playing';
  }else{
    renderStory();
  }
}
overlay.addEventListener('click',e=>{
  if(G.state==='story') advanceStory();
});
overlay.addEventListener('pointerdown',()=>{audioInit();acResume();});

/* ============================================================
   ПОТОК
   ============================================================ */
function startGame(){
  G.lives=3;
  G.level=1;
  G.vpn=1;
  G.crypto=0;
  G.proxy=0;
  G.proxyCd=0;
  G.savedHp=100;
  startLevel(1);
}
function startLevel(n){
  G.level=n;
  buildLevel(n);
  G.state='playing';
  G.shake=0;
  G.hitstop=0;
  G.bannerText='';G.bannerSub='';
  saveGame();
  if(STORY[n]){
    showStory(STORY[n]);
  }else{
    hideOverlay();
  }
  updateHUD();
}
function nextLevel(){
  if(G.player) G.savedHp=G.player.hp;
  const n=G.level+1;
  if(n>60){victoryScreen();return;}
  renderShop(()=>{startLevel(n);});
}
function afterDeath(){
  if(G.lives>0){
    if(G.player) G.savedHp=Math.max(1,G.player.hp);
    startLevel(G.level);
  }else{
    clearSave();
    gameOverScreen();
  }
}

/* ============================================================
   ЦИКЛ
   ============================================================ */
function update(dt){
  const f=Math.min(dt,1/30)*60;
  G.time+=dt;
  if(G.shake>0) G.shake=Math.max(0,G.shake-f*0.55);

  if(G.hitstop>0){
    G.hitstop-=f;
    if(G.state==='playing'){
      updateParticles(f);
      updateCamera(f);
    }
    for(const k in pressed) delete pressed[k];
    mouse.clicked=false;
    updateHUD();
    return;
  }

  if(G.state==='story'){
    if(pressed['Space']||pressed['Enter']||pressed['KeyE']) advanceStory();
  }
  else if(G.state==='playing'){
    updatePlayer(f);
    updateEnemies(f);
    if(G.boss) updateBoss(f);
    updateBullets(f);
    updateBeams(f);
    updateMeteors(f);
    updateCoins(f);
    updateParticles(f);
    updateProxyFx(f);
    updateCamera(f);
    if(G.proxyCd>0) G.proxyCd=Math.max(0,G.proxyCd-f);
    checkLevelClear();
  }
  else if(G.state==='levelclear'){
    updateCoins(f);
    updateParticles(f);
    updateBullets(f);
    updateBeams(f);
    updateMeteors(f);
    updateProxyFx(f);
    updateCamera(f);
    G.clearTimer-=dt;
    if(G.clearTimer<=0) nextLevel();
  }
  else if(G.state==='dying'){
    updateCoins(f);
    updateParticles(f);
    updateBullets(f);
    updateBeams(f);
    updateMeteors(f);
    updateProxyFx(f);
    if(G.boss) updateBoss(f);
    G.deathTimer-=dt;
    if(G.deathTimer<=0) afterDeath();
  }

  for(const k in pressed) delete pressed[k];
  mouse.clicked=false;
  updateHUD();
}

let lastT=performance.now(),acc=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-lastT)/1000;
  lastT=now;
  if(dt>0.25) dt=0.25;
  acc+=dt;
  let guard=0;
  while(acc>=1/60&&guard<5){
    update(1/60);
    acc-=1/60;
    guard++;
  }
  if(guard>=5) acc=0;
  render();
}

/* ============================================================
   СТАРТ
   ============================================================ */
resize();
G.palette=PALETTES[0];
G.layers=buildBackground(991);
G.levelWidth=W;
G.platforms=[{x:-200,y:GROUND_Y,w:W+400,h:260,ground:true}];
menuScreen();
updateHUD();
requestAnimationFrame(loop);
</script>
