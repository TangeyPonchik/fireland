<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>3D Race — Three.js</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #87ceeb; font-family: Arial, sans-serif; }
    canvas { display: block; }

    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,.6);
      font-size: 20px;
      line-height: 1.4;
      pointer-events: none;
    }

    #gameover {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0,0,0,.65);
      color: #fff;
      text-align: center;
      gap: 16px;
    }
    #gameover h1 { font-size: 48px; }
    #gameover button {
      padding: 12px 28px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #ffcc00;
      cursor: pointer;
    }
    #gameover button:hover { background: #ffdd44; }
  </style>
</head>
<body>

<div id="hud">
  <div>Скорость: <span id="speed">0</span> км/ч</div>
  <div>Счёт: <span id="score">0</span></div>
</div>

<div id="gameover">
  <h1>Игра окончена</h1>
  <div>Ваш счёт: <span id="finalScore">0</span></div>
  <button id="restart">Заново</button>
</div>

<!-- Three.js через CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   1. БАЗОВАЯ СЦЕНА
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 60, 180);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  500
);
camera.position.set(0, 5, 9);
camera.lookAt(0, 1, -10);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

/* ============================================================
   2. СВЕТ
   ============================================================ */
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.0));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(30, 60, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -50;
sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;
sun.shadow.camera.bottom = -50;
scene.add(sun);

/* ============================================================
   3. МАШИНА ИГРОКА
   ============================================================ */
const car = new THREE.Group();

// Корпус
const body = new THREE.Mesh(
  new THREE.BoxGeometry(1.6, 0.6, 3),
  new THREE.MeshStandardMaterial({ color: 0xff2d2d, metalness: 0.4, roughness: 0.4 })
);
body.position.y = 0.5;
body.castShadow = true;
car.add(body);

// Кабина
const cabin = new THREE.Mesh(
  new THREE.BoxGeometry(1.2, 0.5, 1.3),
  new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.6, roughness: 0.2 })
);
cabin.position.set(0, 1.05, 0.1);
cabin.castShadow = true;
car.add(cabin);

// Колёса
const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 16);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
const wheelPositions = [
  [-0.85, 0.35, 1.0],
  [0.85, 0.35, 1.0],
  [-0.85, 0.35, -1.0],
  [0.85, 0.35, -1.0],
];
for (const [x, y, z] of wheelPositions) {
  const w = new THREE.Mesh(wheelGeo, wheelMat);
  w.rotation.z = Math.PI / 2;
  w.position.set(x, y, z);
  w.castShadow = true;
  car.add(w);
}

scene.add(car);

/* ============================================================
   4. ДОРОГА (бесконечная за счёт перестановки полос)
   ============================================================ */
const ROAD_WIDTH = 8;
const SEGMENT_LENGTH = 20;
const SEGMENT_COUNT = 12;      // сколько сегментов вперёд
const RESET_Z = 40;            // за спиной игрока — переносим вперёд

// Дорога — один длинный сегмент, который переставляется
const roadGroup = new THREE.Group();
const roadMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.9 });
const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff });

for (let i = 0; i < SEGMENT_COUNT; i++) {
  const segment = new THREE.Group();

  // Асфальт
  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(ROAD_WIDTH, SEGMENT_LENGTH),
    roadMat
  );
  road.rotation.x = -Math.PI / 2;
  road.receiveShadow = true;
  segment.add(road);

  // Боковые линии
  for (const x of [-ROAD_WIDTH / 2 + 0.2, ROAD_WIDTH / 2 - 0.2]) {
    const line = new THREE.Mesh(
      new THREE.PlaneGeometry(0.25, SEGMENT_LENGTH),
      lineMat
    );
    line.rotation.x = -Math.PI / 2;
    line.position.set(x, 0.01, 0);
    segment.add(line);
  }

  // Центральный пунктир (две полосы)
  for (let z = -SEGMENT_LENGTH / 2; z < SEGMENT_LENGTH / 2; z += 4) {
    const dash = new THREE.Mesh(
      new THREE.PlaneGeometry(0.2, 2),
      lineMat
    );
    dash.rotation.x = -Math.PI / 2;
    dash.position.set(0, 0.01, z);
    segment.add(dash);
  }

  segment.position.z = -i * SEGMENT_LENGTH + RESET_Z;
  segment.userData.initialZ = segment.position.z;
  roadGroup.add(segment);
}
scene.add(roadGroup);

// Земля по бокам
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshStandardMaterial({ color: 0x4caf50 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   5. ПРЕПЯТСТВИЯ
   ============================================================ */
const obstacles = [];
const obstacleGeo = new THREE.BoxGeometry(1.4, 1.4, 1.4);
const obstacleMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.7 });

function spawnObstacle() {
  const mesh = new THREE.Mesh(obstacleGeo, obstacleMat);
  mesh.castShadow = true;

  // Случайная полоса: -1, 0, 1 (не ставим ровно по центру дороги всегда)
  const lane = Math.floor(Math.random() * 3) - 1;
  const laneX = lane * 2.4;

  mesh.position.set(laneX, 0.7, -120 - Math.random() * 60);
  scene.add(mesh);
  obstacles.push(mesh);
}

// Первые препятствия
for (let i = 0; i < 6; i++) spawnObstacle();

/* ============================================================
   6. УПРАВЛЕНИЕ
   ============================================================ */
const keys = { left: false, right: false, up: false, down: false };

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
});

/* ============================================================
   7. ИГРОВОЕ СОСТОЯНИЕ
   ============================================================ */
let speed = 0;              // единиц/сек
const MAX_SPEED = 70;
const ACCEL = 35;
const BRAKE = 60;
const FRICTION = 20;
const STEER_SPEED = 9;
const ROAD_LIMIT = ROAD_WIDTH / 2 - 1.0; // ограничение, чтобы не уехать с трассы

let score = 0;
let gameOver = false;

const speedEl = document.getElementById('speed');
const scoreEl = document.getElementById('score');
const gameoverEl = document.getElementById('gameover');
const finalScoreEl = document.getElementById('finalScore');

/* ============================================================
   8. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
   ============================================================ */
const clock = new THREE.Clock();

function updateRoad(dt) {
  for (const seg of roadGroup.children) {
    seg.position.z += speed * dt;
    if (seg.position.z > RESET_Z) {
      seg.position.z -= SEGMENT_COUNT * SEGMENT_LENGTH;
    }
  }
}

function updateObstacles(dt) {
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const ob = obstacles[i];
    ob.position.z += speed * dt;

    // Столкновение (простая проверка по AABB в плоскости XZ)
    if (
      Math.abs(ob.position.x - car.position.x) < 1.6 &&
      Math.abs(ob.position.z - car.position.z) < 1.8
    ) {
      endGame();
      return;
    }

    // Прошло мимо — убираем и добавляем новое
    if (ob.position.z > 20) {
      scene.remove(ob);
      obstacles.splice(i, 1);
      spawnObstacle();
      score += 10;
    }
  }

  // Поддерживаем количество препятствий
  if (obstacles.length < 6) spawnObstacle();
}

function updateCar(dt) {
  // Разгон / торможение
  if (keys.up) {
    speed = Math.min(speed + ACCEL * dt, MAX_SPEED);
  } else if (keys.down) {
    speed = Math.max(speed - BRAKE * dt, 0);
  } else {
    // Трение
    speed = Math.max(speed - FRICTION * dt, 0);
  }

  // Руль (нельзя поворачивать на месте — только при движении)
  if (speed > 0.5) {
    if (keys.left) {
      car.position.x -= STEER_SPEED * dt * (speed / MAX_SPEED + 0.3);
    }
    if (keys.right) {
      car.position.x += STEER_SPEED * dt * (speed / MAX_SPEED + 0.3);
    }
  }

  // Ограничение по дороге
  car.position.x = THREE.MathUtils.clamp(car.position.x, -ROAD_LIMIT, ROAD_LIMIT);

  // Небольшой наклон при повороте (визуальный эффект)
  const targetRoll = keys.left ? 0.12 : keys.right ? -0.12 : 0;
  car.rotation.z = THREE.MathUtils.lerp(car.rotation.z, targetRoll, 8 * dt);

  // Скорость в HUD (переводим в "км/ч" условно)
  speedEl.textContent = Math.round(speed * 3);
}

function endGame() {
  gameOver = true;
  finalScoreEl.textContent = score;
  gameoverEl.style.display = 'flex';
}

function restart() {
  gameOver = false;
  gameoverEl.style.display = 'none';
  speed = 0;
  score = 0;
  car.position.set(0, 0, 0);
  car.rotation.set(0, 0, 0);

  // Убираем все препятствия
  for (const ob of obstacles) scene.remove(ob);
  obstacles.length = 0;
  for (let i = 0; i < 6; i++) spawnObstacle();

  // Возвращаем дорогу
  for (const seg of roadGroup.children) {
    seg.position.z = seg.userData.initialZ;
  }
}

document.getElementById('restart').addEventListener('click', restart);

/* ============================================================
   9. ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05); // защита от больших скачков

  if (!gameOver) {
    updateCar(dt);
    updateRoad(dt);
    updateObstacles(dt);

    // Счётчик счёта по пройденной дистанции
    score += speed * dt * 0.5;
    scoreEl.textContent = Math.floor(score);
  }

  renderer.render(scene, camera);
}

animate();

/* ============================================================
   10. РЕСАЙЗ
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
